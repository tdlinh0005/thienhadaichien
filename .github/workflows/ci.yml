name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài dependencies (dev only)
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Unit + luật + server tests
        run: npm test
      - name: Kiểm thử tải
        run: npm run test:tai