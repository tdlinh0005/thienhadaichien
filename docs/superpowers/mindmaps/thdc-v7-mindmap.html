<style>

    font-family: 'Chakra Petch', system-ui, sans-serif;
    font-size: 17px; font-weight: 700; letter-spacing: .04em;

  button.ctl {
    font-family: inherit; font-size: 13px; font-weight: 600;

  ]}, children:[

    ['Độc tài (mặc định, LM cũ migrate về đây)',['Giữ nguyên hành vi hiện tại','Chủ duyệt/loại/tuyên chiến/chuyển quyền trực tiếp','Bỏ qua bảng phiếu hoàn toàn']],
    ['Dân chủ',['Đa số đơn giản toàn thành viên — hạn phiếu 24 giờ','Phiếu: tuyên chiến · duyệt/từ chối đơn · loại thành viên','Bầu chủ kỳ 14 ngày — nhiều phiếu hơn chủ đương nhiệm thì đổi']],
    ['Cộng hoà',['Như Dân chủ nhưng chỉ đại biểu được bầu','Đại biểu = top 5 điểm, tái tính mỗi kỳ']],
    ['Cơ chế lm_phieu',['Đủ đa số hoặc hết hạn → server thực thi bằng luồng nội bộ hiện có','Trong unit-of-work SQLite chuẩn như PvP','Phiếu tuyên chiến đạt mới được đặt lệnh chien']],
  ]}, children:[
    { label:"lm.chinhThe ∈ docTai|danChu|congHoa", tag:'' },
    { label:'bảng lm_phieu + chi tiết phiếu', tag:'' },

  ]},
  { label:'KỸ THUẬT', sub:'State v7 & kiểm thử', kind:'branch', accent:'var(--nl)', detail:{ pills:[['Migration additive',''],['Test mở rộng khuôn cũ','']], secs:[
    ['Migration v6→v7',['Additive: chỉ gắn default, không đụng dữ liệu cũ','LM cũ → chinhThe docTai','State mới hơn engine → từ chối khởi động (giữ nguyên hành vi)','Solo đọc key v7 rồi fallback v6→v3, giữ key cũ dự phòng']],
    ['Kiểm thử',['tools/smoke.js: lãi đúng dải · đơn chợ trừ đúng · hệ số nhân đúng lớp · phiếu thực thi đúng · phản bội đúng ngưỡng','tools/test-server.js: chợ chéo 2 đế quốc · phiếu LM 2 tài khoản thật · migration giữ save · NPC hồi hàng','Sau mỗi phase: npm test xanh + npm run build']],
    ['Error handling',['Validation chuẩn soDuong/chuoi/tdParse','Mutation chéo đế quốc bọc unit-of-work SQLite','Client cũ thiếu trường mới → default, không crash']],
  ]}, children:[
    { label:'st.v = 7 (additive)', tag:'' },

/* ── Layout: cây ngang, lá xếp dọc phải ── */
const IW=258, IH=30, GAP=9, BR_GAP=26, RX=40;
const nodes=[], edges=[];
let leafY=0;
function measure(n){
  if(!n.children){ n.h=IH; return n.h; }
  let h=0;
  for(const c of n.children) h+=measure(c)+GAP;
  n.h=h-GAP;
  return n.h;
}
function place(n,depth,x,y){
  const w=n.kind==='root'?300:(depth===1?IW:IW-28);
  n.x=x; n.w=w;
  if(!n.children){
    n.y=y+n.h/2-IH/2; leafY=Math.max(leafY,n.y+IH);
    nodes.push(n); return;
  }
  let cy=y;
  const cx=x+w+RX*(depth===0?1.4:1);
  for(const c of n.children){ place(c,depth+1,cx,cy); cy+=c.h+GAP; }
  const first=n.children[0], last=n.children[n.children.length-1];
  n.y=(first.y+first.h/2+last.y+last.h/2)/2-IH/2;
  nodes.push(n);
}
measure(DATA);
place(DATA,0,RX,0);
const TOTAL_H=leafY+40;

/* depth: root=0 branch=1 leaf=2 */
nodes.forEach(n=>{ n.depth = n.kind==='root'?0 : (n.kind==='branch'?1:2); });

const svg=document.getElementById('map');
const NS='http://www.w3.org/2000/svg';
function el(t,at,parent){ const e=document.createElementNS(NS,t); for(const k in at)e.setAttribute(k,at[k]); (parent||svg).appendChild(e); return e; }

let gViewport=null;
function build(){
  svg.innerHTML='';
  gViewport=el('g',{});
  /* gán id theo thứ tự mảng TRƯỚC khi vẽ cạnh để data-to khớp */
  nodes.forEach((n,i)=>{ n._id=i; });
  /* edges */
  function drawEdges(n){
    if(!n.children)return;
    for(const c of n.children){
      const x1=n.x+n.w, y1=n.y+IH/2, x2=c.x, y2=c.y+IH/2, mx=(x1+x2)/2;
      el('path',{class:'edge',d:`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`,'data-to':c._id},gViewport);
      drawEdges(c);
    }
  }
  drawEdges(DATA);
  /* node groups */
  nodes.forEach((n)=>{
    const g=el('g',{class:'node'+(n.kind==='root'?' root':''),tabindex:n.depth<2?'0':null,role:'button','aria-label':n.kind==='root'?n.label.join(' '):String(n.label)},gViewport);
    const r=el('rect',{class:'card',x:n.x,y:n.y,width:n.w,height:IH,rx:6,
      fill:n.kind==='root'?'var(--bg3)':(n.kind==='branch'?'var(--bg2)':'var(--bg1)'),
      stroke:n.accent||'var(--line)','stroke-width':n.kind==='root'?2:1},g);
    if(n.kind!=='root') r.setAttribute('stroke-opacity','.55');
    let tx=n.x+12;
    if(n.kind==='root'){
      el('text',{class:'t-root',x:tx,y:n.y+19},g).textContent=n.label[0];
      el('text',{class:'badge-ok',x:tx+205,y:n.y+19},g).textContent='v7';
    } else if(n.kind==='branch'){
      el('text',{class:'t-branch',x:tx,y:n.y+14,fill:n.accent},g).textContent=n.label;
      el('text',{class:'t-item',x:tx,y:n.y+26,opacity:.75},g).textContent=n.sub;
      el('text',{class:'t-badge',x:n.x+n.w-10,y:n.y+14,'text-anchor':'end'},g).textContent=countLeaves(n)+' mục';
    } else {
      el('text',{class:'t-item',x:tx,y:n.y+20},g).textContent=n.label;
      if(n.tag&&TAG[n.tag]){
        const tw=n.tag==='xn'?24:26;
        el('text',{class:'t-tag '+(n.tag==='xn'?'tag-xn':'tag-td'),x:n.x+n.w-10-tw,y:n.y+20},g).textContent=TAG[n.tag];
      }
    }
    g.addEventListener('click',ev=>{ev.stopPropagation();openDrawer(n);highlightPath(n);});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDrawer(n);highlightPath(n);}});
  });
}
function countLeaves(n){ let k=0;(function w(x){if(!x.children){k++;return;}x.children.forEach(w);})(n);return k; }
function pathTo(n){ const p=[n];let cur=n;while(cur._parent){cur=cur._parent;p.push(cur);}return p.reverse(); }
function assignParents(n){(n.children||[]).forEach(c=>{c._parent=n;assignParents(c);});}
assignParents(DATA);

function highlightPath(n){
  document.querySelectorAll('.edge').forEach(e=>e.classList.remove('hot'));
  let cur=n;
  while(cur){
    document.querySelectorAll(`[data-to="${cur._id}"]`).forEach(e=>e.classList.add('hot'));
    cur=cur._parent;
  }
}

/* ── Viewport pan/zoom ── */
const view={x:0,y:0,k:1};
function apply(){gViewport.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
function fit(){
  const W=svg.clientWidth,H=svg.clientHeight;
  const kw=W/(TOTAL_W+80), kh=H/TOTAL_H;
  view.k=Math.min(kw,kh,1.15);
  view.x=(W-TOTAL_W*view.k)/2;
  view.y=(H-TOTAL_H*view.k)/2;
  apply();
}
const stage=document.getElementById('stage');
let drag=null;
stage.addEventListener('pointerdown',e=>{
  drag={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
  stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  view.x=drag.vx+(e.clientX-drag.sx);view.y=drag.vy+(e.clientY-drag.sy);apply();
});
stage.addEventListener('pointerup',()=>{drag=null;stage.classList.remove('dragging');});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12;
  const nx=(view.x-e.offsetX)*f+e.offsetX, ny=(view.y-e.offsetY)*f+e.offsetY;
  view.k*=f;view.x=nx;view.y=ny;apply();
},{passive:false});

/* ── Collapse/expand: ẩn subtree bằng display none trên group ── */
function wrapGroups(){
  nodes.forEach(n=>{ n._el=document.querySelectorAll(`g.node`)[n._id]; });
}
function isOpen(n){ return !n._closed; }
function refreshVisibility(){
  nodes.forEach(n=>{
    let hide=false,cur=n._parent;
    while(cur){ if(cur._closed){hide=true;break;} cur=cur._parent; }
    n._el.style.display=hide?'none':'';
  });
  document.querySelectorAll('.edge').forEach(e=>{
    const to=+e.getAttribute('data-to'), tn=nodes.find(x=>x._id===to);
    let hide=false,cur=tn._parent;
    while(cur){ if(cur._closed){hide=true;break;} cur=cur._parent; }
    e.style.display=hide?'none':'';
  });
  updateSum();
}
function setAll(v){ nodes.forEach(n=>{if(n.kind==='branch')n._closed=v;});refreshVisibility();fit(); }

/* ── Drawer ── */
const drawer=document.getElementById('drawer');
function openDrawer(n){
  document.getElementById('dTitle').textContent=n.kind==='root'?n.label[0]:(n.label+(n.sub?' — '+n.sub:''));
  const body=document.getElementById('dBody');body.innerHTML='';
  if(n.detail){
    if(n.detail.pills.length){
      const pr=document.createElement('div');pr.className='pill-row';
      n.detail.pills.forEach(([txt,cls])=>{const s=document.createElement('span');s.className='pill '+cls;s.textContent=(cls==='xn'?'XÁC NHẬN — ':'TÁI DỰNG — ')+txt;pr.appendChild(s);});
      body.appendChild(pr);
    }
    n.detail.secs.forEach(([h,items])=>{
      const sec=document.createElement('section');
      const h3=document.createElement('h3');h3.textContent=h;sec.appendChild(h3);
      const ul=document.createElement('ul');
      items.forEach(t=>{const li=document.createElement('li');li.innerHTML=t.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');ul.appendChild(li);});
      sec.appendChild(ul);body.appendChild(sec);
    });
  } else {
    const sec=document.createElement('section');
    sec.innerHTML='<h3>Vị trí</h3><ul>'+pathTo(n).map(p=>'<li>'+(p.kind==='root'?p.label[0]:p.label)+'</li>').join('')+'</ul>';
    body.appendChild(sec);
  }
  drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');
}
document.getElementById('dClose').onclick=()=>{drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer.classList.remove('open');}});

/* ── Review footer ── */
let approved=false;
function updateSum(){
  const openBranches=nodes.filter(n=>n.kind==='branch'&&isOpen(n)).length;
  document.getElementById('sum').innerHTML=
    `<b>${nodes.filter(n=>n.depth===2).length}</b> hạng mục trong <b>${openBranches}</b> nhóm đang mở · `+
    `${DATA.children.reduce((a,b)=>a+countLeaves(b),0)} tổng cộng · nhấp node để xem chi tiết & nguồn`;
}
document.getElementById('btnExpand').onclick=()=>setAll(false);
document.getElementById('btnCollapse').onclick=()=>setAll(true);
document.getElementById('btnFit').onclick=fit;
document.getElementById('btnOk').onclick=function(){
  approved=true;
  this.style.display='none';
  document.getElementById('okNote').classList.add('show');
};

/* legend */
function addLegend(){
  const lx=RX, ly=TOTAL_H-18;
  const g=el('g',{},gViewport);
  el('rect',{class:'legend-box',x:lx-8,y:ly-14,width:330,height:22,rx:5},g);
  el('circle',{cx:lx+2,cy:ly-3,r:3.5,fill:'var(--ok)'},g);
  el('text',{class:'legend-t',x:lx+12,y:ly},g).textContent='XN = XÁC NHẬN (tư liệu nói trực tiếp)';
  el('circle',{cx:lx+230,cy:ly-3,r:3.5,fill:'var(--warn)'},g);
  el('text',{class:'legend-d',x:lx+240,y:ly},g).textContent='TĐ = TÁI DỰNG';
}

build();wrapGroups();addLegend();updateSum();
const TOTAL_W=340+4*(IW+RX)+40;
fit();
</script>
