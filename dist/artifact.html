      '<span class="r sz" data-live="rate.' + id + '">' + (s.r[id] >= 0 ? '+' : '') + G.soNgan(s.r[id]) +
        '/g</span></div>';
  }
  h += '<div class="o"><span class="n">Galana</span><span class="v sz" style="color:' + G.byId(G.RES, 'galana').mau +
    '" data-live="galana">' + G.soNgan(st.galana) + '</span><span class="r sz" data-live="rate.galana">+' +
      G.soNgan(s.r.galana) + '/g</span></div>';
  h += '<div class="o"><span class="n">Kỹ Thuật</span><span class="v sz" style="color:' + G.byId(G.RES, 'tech').mau +
    '" data-live="tech">' + G.soNgan(st.techPts) + '</span><span class="r sz" data-live="rate.tech">+' +
      G.soNgan(s.r.tech) + '/g</span></div>';
  h += '<div class="o"><span class="n">Điện</span><span class="v sz" style="color:' + (s.hs < 1 ? 'var(--do)' :
    'var(--luc)') + '">' +
    G.so(s.dienCo) + ' / ' + G.so(s.dienDung) + '</span><span class="r">hiệu suất ' + Math.round(s.hs * 100) +
      '%</span></div>';
  var bt = U.bt(st);
  h += '<div class="o"><span class="n">Bảo trì sau</span><span class="v sz">' + U.dem(bt.nextAt) +
    '</span><span class="r">chu kỳ #' + (bt.cycle + 1) + '</span></div>';
  return h;
};

U.MAN = [
  { id: 'tongquan', ten: 'Tổng Quan' },
  { id: 'tainguyen', ten: 'Tài Nguyên' },
  { id: 'congtrinh', ten: 'Công Trình' },
  { id: 'nghiencuu', ten: 'Nghiên Cứu' },
  { id: 'xuong', ten: 'Xưởng Đóng Tàu' },
  { id: 'phongthu', ten: 'Phòng Thủ' },
  { id: 'hamdoi', ten: 'Hạm Đội' },
  { id: 'thienha', ten: 'Thiên Hà' },
  { id: 'lienminh', ten: 'Liên Minh' },
  { id: 'xephang', ten: 'Bảng Xếp Hạng' },
  { id: 'mophong', ten: 'Máy Tính Trận' },
  { id: 'tinnhan', ten: 'Tin Nhắn' },
  { id: 'huongdan', ten: 'Hướng Dẫn' },
  { id: 'nhatky', ten: 'Nhật Ký & Lưu' }
];

U.veMenu = function () {
  var st = U.st(), h = '';
  var moi = 0;
  for (var i = 0; i < st.msgs.length; i++) if (!st.msgs[i].doc) moi++;
  for (var j = 0; j < U.MAN.length; j++) {
    var m = U.MAN[j], d = '';
    if (m.id === 'tinnhan' && moi) d = '<span class="dem-nho">' + moi + '</span>';
    if (m.id === 'hamdoi' && st.fleets.length) d = '<span class="dem-nho">' + st.fleets.length + '</span>';
    h += '<a class="' + (U.man === m.id ? 'on' : '') + '" data-act="man" data-man="' + m.id + '">' +
      '<span>' + m.ten + '</span>' + d + '</a>';
  }
  document.getElementById('menu').innerHTML = h;
};

U.veCanh = function () {
  var st = U.st(), h = '', i, bt = U.bt(st);
  if (bt.arrearsGalana > 0) h += '<div class="canh">NỢ BẢO TRÌ ' + G.so(bt.arrearsGalana) +
    ' GALANA — đã lỡ ' + G.so(bt.missStreak) + ' kỳ liên tiếp. Cần đủ toàn bộ khoản đến hạn ở nhịp 6 giờ kế tiếp; ' +
    'nghiên cứu có thể trễ, dân có thể rời đi và công trình có thể xuống cấp.</div>';
  if (st.ncQueue && st.ncQueue.status === 'retry') h += '<div class="canh bt">Nghiên cứu "' +
    U.esc(G.R(st.ncQueue.id).ten) +
    '" đã lỡ một kỳ cấp vốn; chỉ thử lại ở nhịp bảo trì kế tiếp. Mốc hoàn thành đã cộng thêm 6 giờ.</div>';
  for (i = 0; i < st.planets.length; i++) {
    var ds = U.ds(st.planets[i]);
    if (ds.foodShortfallCycle > 0)
      h += '<div class="canh bt">' + U.esc(st.planets[i].ten) + ' ' + G.tdStr(st.planets[i].c) +
        ' đang thiếu ' + G.so(ds.foodShortfallCycle) +
          ' Thực Phẩm trong chu kỳ — dân số và ủng hộ sẽ chịu ảnh hưởng ở nhịp kế tiếp.</div>';
  }
  for (i = 0; i < st.toi.length; i++) {
    var w = st.toi[i], p = st.planets[w.pi] || st.planets[0];
    h += '<div class="canh">BÁO ĐỘNG — ' + U.esc(w.ten) + ' ' + U.esc(w.lm || '') + ' từ ' + G.tdStr(w.tu) +
      ' đánh vào ' + U.esc(p.ten) + ' ' + G.tdStr(p.c) + ' trong ' + U.dem(w.den_t) + '.</div>';
  }
  /* hạm đội của người chơi thật đang bay tới (bản nhiều người) */
  var pv = st.pvpToi || [];
  for (i = 0; i < pv.length; i++) {
    var q = pv[i], pt = U.htTheoKey(q.den);
    var tenHT = pt ? pt.ten + ' [' + q.den + ']' : '[' + q.den + ']';
    if (q.nv === 'attack')
      h += '<div class="canh">BÁO ĐỘNG ĐỎ — <b>' + U.esc(q.ten) + '</b> ' + U.esc(q.lm || '') + ' từ [' + U.esc(q.tu) +
        '] đang tấn công ' + U.esc(tenHT) + ', tới trong ' + U.dem(q.den_t) +
        '. Dựng thêm phòng thủ, hoặc cho hạm đội bay đi để khỏi bị bắn hạ.</div>';
    else if (q.nv === 'hold')
      h += '<div class="canh ok">ĐỒNG MINH — <b>' + U.esc(q.ten) + '</b> ' + U.esc(q.lm || '') +
        ' đang điều hạm đội Giữ Chỗ từ [' + U.esc(q.tu) + '] tới ' + U.esc(tenHT) +
        ', tới trong ' + U.dem(q.den_t) + ' để đóng quân quỹ đạo.</div>';
    else
      h += '<div class="canh ok">' + U.esc(q.ten) + ' ' + U.esc(q.lm || '') + ' đang chở hàng tới ' +
        U.esc(tenHT) + ', tới trong ' + U.dem(q.den_t) + '.</div>';
  }
  document.getElementById('thanh-canh').innerHTML = h;
};

U.veChonHT = function () {
  var st = U.st(), h = '';
  for (var i = 0; i < st.planets.length; i++) {
    var p = st.planets[i];
    h += '<option value="' + i + '"' + (i === U.pi ? ' selected' : '') + '>' +
      U.esc(p.ten) + ' ' + G.tdStr(p.c) + '</option>';
  }
  document.getElementById('chon-ht').innerHTML = h;
};

/* ======================================================================
 * MÀN: TỔNG QUAN
 * ==================================================================== */
U.m_tongquan = function () {
  var st = U.st(), p = U.ht(), s = G.sanLuong(st, p), d = G.diem(st);
  var bt = U.bt(st), ds = U.ds(p);
  var sucChua = G.sucChuaDan ? G.sucChuaDan(p) : 250000 + (p.b.city || 0) * 250000;
  var h = '';

  h += '<div class="panel"><h3>' + U.esc(p.ten) + ' ' + G.tdStr(p.c) + (p.thuDo ? ' — thủ phủ' : '') +
    '</h3><div class="noi luoi">';
  h += '<div><b>Chỉ huy</b><br>' + U.esc(st.ten) + (st.lm ? ' <span class="tag-lm">' + U.esc(st.lm.ten) +
    '</span>' : '') + '</div>';
  h += '<div><b>Điểm</b><br><span class="sz">' + G.so(d.tong) + '</span> <span class="mo">(CT ' + G.so(d.ct) +
    ' · NC ' + G.so(d.nc) + ' · Hạm ' + G.so(d.ham) + ' · Thủ ' + G.so(d.thu) + ')</span></div>';
  h += '<div><b>Hành tinh</b><br>' + U.esc(p.ten) + ' <button class="nut nho" data-act="doi-ten">đổi tên</button>' +
    (p.thuDo || U.pi === 0 ? '' : ' <button class="nut nho xoa" data-act="bo-hoang">bỏ hoang</button>') + '</div>';
  var Lp = G.loaiHT(st, p);
  h += '<div><b>Loại hành tinh</b><br><b style="color:' + Lp.mau + '">' + U.esc(Lp.ten) + '</b></div>';
  h += '<div><b>Nhiệt độ</b><br>' + p.temp + '°C</div>';
  h += '<div><b>Ô đất</b><br>' + G.oDaDung(p) + ' / ' + G.oToiDa(p) + '</div>';
  h += '<div><b>Khe hạm đội</b><br>' + st.fleets.length + ' / ' + G.khe(st) +
    ' <span class="mo">(thám hiểm ' + G.dangThamHiem(st) + '/' + G.kheThamHiem(st) + ')</span></div>';
  h += '<div><b>Số hành tinh</b><br>' + st.planets.length + ' / ' + G.maxThuocDia(st) + '</div>';
  h += '<div><b>Chu kỳ bảo trì</b><br>' + U.dem(bt.nextAt) + ' <span class="mo">(#' + (bt.cycle + 1) +
    ', mỗi 6 giờ)</span></div>';
  h += '<div><b>Dân số</b><br><span class="sz">' + G.so(ds.population) + '</span> / ' + G.so(sucChua) + '</div>';
  h += '<div><b>Ủng hộ</b><br><span class="sz">' + U.bp(ds.supportBp) + '</span></div>';
  h += '<div><b>Thuế</b><br><input id="thue-pct" type="number" min="0" max="100" step="1" value="' +
    (ds.taxBp / 100) + '" style="width:70px">% <button class="nut nho" data-act="doithue">Đổi</button></div>';
  h += '<div><b>Thực phẩm chu kỳ</b><br>' + (ds.foodDemandCycle > 0 ?
    ('đã cần ' + G.so(ds.foodDemandCycle) + ', thiếu <span class="' + (ds.foodShortfallCycle > 0 ? 'do' :
      'luc') + '">' +
      G.so(ds.foodShortfallCycle) + '</span>') : '<span class="mo">chưa phát sinh</span>') + '</div>';
  h += '<div><b>Trận đánh</b><br><span class="luc">' + st.stats.thang + ' thắng</span> / <span class="do">' +
    st.stats.thua + ' thua</span></div>';
  h += '<div><b>Quân đổ bộ giữ nhà</b><br>' + U.dsTau(p.linh || {}) + '</div>';
  h += '</div></div>';

  /* hàng đợi */
  h += '<div class="luoi2">';
  h += '<div class="panel"><h3>Đang xây trên hành tinh</h3><div class="noi">';
  if (!p.qB.length) h += '<span class="mo">Không có công trình nào đang xây.</span>';
  else {
    h += '<table><tr><th>Công trình</th><th class="r">Số lượng</th><th>Xong sau</th><th></th></tr>';
    for (var i = 0; i < p.qB.length; i++) {
      var q = p.qB[i];
      h += '<tr><td>' + U.esc(G.B(q.id).ten) + '</td><td class="r sz">+' + G.so(q.n || 0) + '</td><td class="sz">' +
        (q.xong ? U.dem(q.xong) : '<span class="mo">chờ</span>') + '</td>' +
        '<td class="r"><button class="nut nho xoa" data-act="huyxay" data-i="' + i + '">Huỷ</button></td></tr>';
    }
    h += '</table>';
  }
  h += '</div></div>';

  h += '<div class="panel"><h3>Xưởng đóng tàu</h3><div class="noi">';
  if (!p.qS.length) h += '<span class="mo">Xưởng đang rảnh.</span>';
  else {
    h += '<table><tr><th>Đơn vị</th><th class="r">Còn lại</th><th>Chiếc tới</th><th></th></tr>';
    for (var j = 0; j < p.qS.length; j++) {
      var q2 = p.qS[j], u = G.UNIT(q2.id) || G.M(q2.id);
      h += '<tr><td>' + U.esc(u.ten) + '</td><td class="r sz">' + G.so(q2.n) + '</td><td class="sz">' +
        (j === 0 ? U.dem(st.now + q2.tLeft) : '<span class="mo">chờ</span>') + '</td>' +
        '<td class="r"><button class="nut nho xoa" data-act="huydong" data-i="' + j + '">Huỷ</button></td></tr>';
    }
    h += '</table>';
  }
  h += '</div></div>';

  h += '<div class="panel"><h3>Phòng nghiên cứu</h3><div class="noi">';
  if (!st.ncQueue) h += '<span class="mo">Không có đề tài nào đang chạy.</span>';
  else {
    var q3 = st.ncQueue;
    var tienDo = Math.max(0, Math.min(1, 1 - (q3.installmentsLeft || 0) / Math.max(1, q3.installmentsTotal || 1)));
    h += '<b>' + U.esc(G.R(q3.id).ten) + '</b> → cấp ' + q3.lv + '<div class="thanh"><i style="width:' +
      (tienDo * 100).toFixed(1) + '%"></i></div>';
    h += q3.status === 'retry' ? '<span class="do">CHỜ THỬ LẠI ở nhịp 6 giờ kế tiếp.</span>'
      : 'Dự kiến xong sau ' + U.dem(q3.finishAt);
    h += '<br><span class="mo">Kỳ tới: ' + U.dsRes(U.ncKyTiep(q3)) +
      ' · còn ' + G.so(q3.installmentsLeft || 0) + '/' + G.so(q3.installmentsTotal || 0) + ' kỳ cấp vốn' +

/* ======================================================================
 * MÀN: CÔNG TRÌNH / NGHIÊN CỨU / XƯỞNG / PHÒNG THỦ
 * ==================================================================== */
U.theCT = function (st, p, b) {
  var co = p.b[b.id] || 0, dangXay = G.soDangXay(p, b.id);
  var n = G.loMacDinhXay(p, b.id);
  var cost = G.giaCongTrinh(b, n);
  var thieuDK = G.thieuDK(st, p, b);
  var du = G.duTien(st, p, cost);
  var tg = G.tgXay(st, p, cost);
  var s = G.sanLuong(st, p);

  var h = '<div class="the' + (thieuDK.length ? ' tat' : '') + '">';
  h += '<span class="cap">có ' + G.so(co) + (dangXay ? ' (+' + G.so(dangXay) + ')' : '') + '</span>';
  h += '<h4>' + U.esc(b.ten) + '</h4>';
  h += '<div class="mt">' + U.esc(b.mota) + '</div>';

  /* hiệu quả của cả lô đang nhập mặc định */
  var ctx = { temp: p.temp, tech: st.tech };
  if (b.prod) {
    var a = b.prod(co, ctx), c = b.prod(co + n, ctx), lines = [];
    for (var k in c) {
      var mo = (a[k] || 0), mo2 = c[k];
      var sp = (k === 'energy') ? 1 : G.C.TOC_DO_SERVER;
      lines.push((k === 'energy' ? 'Điện' : G.byId(G.RES, k).ten) + ': ' + G.so(mo * sp) + ' → <b>' +
        G.so(mo2 * sp) + '</b>');
    }
    h += '<div style="font-size:11.5px;margin-bottom:6px">' + lines.join('<br>') + '</div>';
  }
  if (b.cap) h += '<div style="font-size:11.5px;margin-bottom:6px">Dung tích: ' + G.so(b.cap(co)) + ' → <b>' +
    G.so(b.cap(co + n)) + '</b></div>';
  if (b.id === 'robot' || b.id === 'nanite' || b.id === 'shipyard' || b.id === 'lab')
    h += '<div style="font-size:11.5px;margin-bottom:6px" class="mo">Nhiều cơ sở hơn = công suất lớn hơn.</div>';
  if (b.id === 'fleetHQ') h += '<div style="font-size:11.5px;margin-bottom:6px">Khe hạm đội: ' + G.khe(st) +
    ' → <b>' + (G.khe(st) + n) + '</b></div>';
  if (b.id === 'maintDepot') h += '<div style="font-size:11.5px;margin-bottom:6px">Giảm phí bảo trì: ' +
    Math.min(60, 6 * G.tongB(st, 'maintDepot')) + '% → <b>' + Math.min(60, 6 * (G.tongB(st, 'maintDepot') +
      n)) + '%</b></div>';
  if (b.id === 'terraform') h += '<div style="font-size:11.5px;margin-bottom:6px">Khu đất tối đa: ' +
    G.oToiDa(p) + ' → <b>' + (G.oToiDa(p) + 6 * n) + '</b></div>';

  if (thieuDK.length) h += '<div class="dk">Cần: ' + U.esc(thieuDK.join(', ')) + '</div>';
  h += '<div class="gia" id="ct-gia-' + b.id + '">' + U.gia(cost, p, st) + '</div>';
  h += '<div class="ct"><label class="mo sz">Lô <input id="ct-sl-' + b.id +
    '" type="number" min="1" max="10000000" value="' +
    n + '" style="width:92px"></label><button class="nut nho ' + (du && !thieuDK.length ? 'oke' : '') +
    '" data-act="xay" data-id="' + b.id + '"' + (thieuDK.length ? ' disabled' : '') + '>Xây ×' + G.so(n) + '</button>' +
    '<span class="mo sz" id="ct-tg-' + b.id + '">' + G.tg(tg) + '</span></div>';
  h += '</div>';
  return h;
};

U.formMoi = function () {
  var p = U.ht();

U.capNhatForm = function () {
  var f = U.form; if (!f) return;
  var g = document.getElementById('f-g'), h = document.getElementById('f-h'), pp = document.getElementById('f-p');
  if (g) f.den = { g: +g.value || 1, h: +h.value || 1, p: +pp.value || 1 };
  var ms = document.getElementById('f-mission'); if (ms) f.mission = ms.value;
  var pc = document.getElementById('f-pct'); if (pc) f.pct = +pc.value || 100;
  var gi = document.getElementById('f-giu'); if (gi) f.giu = Math.max(1, +gi.value || 1);
  var i, el;
  for (i = 0; i < G.SHIPS.length; i++) {
    el = document.getElementById('ft-' + G.SHIPS[i].id);
    if (el) { var n = Math.max(0, Math.floor(+el.value || 0)); if (n) f.ships[G.SHIPS[i].id] = n;
      else delete f.ships[G.SHIPS[i].id]; }
  }
  if (!f.linh) f.linh = {};
  for (i = 0; i < G.BOBINH.length; i++) {
    el = document.getElementById('fl-' + G.BOBINH[i].id);
    if (el) { var nb = Math.max(0, Math.floor(+el.value || 0)); if (nb) f.linh[G.BOBINH[i].id] = nb;
      else delete f.linh[G.BOBINH[i].id]; }
  }
  for (i = 0; i < G.RES_HANH_TINH.length; i++) {
    el = document.getElementById('fc-' + G.RES_HANH_TINH[i]);
    if (el) { var v = Math.max(0, Math.floor(+el.value || 0)); if (v) f.cargo[G.RES_HANH_TINH[i]] = v;
      else delete f.cargo[G.RES_HANH_TINH[i]]; }
  }
};
U.ttBay = function () {
  var st = U.st(), p = U.ht(), f = U.form;
  if (G.trong(f.ships)) return '<span class="mo">Chọn ít nhất một tàu để xem thông số chuyến bay.</span>';
  var kc = G.khoangCach(p.c, f.den);
  var tg = G.tgBay(st, f.ships, kc, f.pct);
  var nl = G.nhienLieu(st, f.ships, kc, f.pct);
  var suc = G.khoangHang(f.ships);
  var hang = 0; for (var k in f.cargo) hang += f.cargo[k];
  var ttGiu = '';
  if (f.mission === 'hold' && G.QUY_DAO_V1 && G.nhienLieuGiu) {
    var giuGiay = Math.max(1, Math.min(24, Math.floor(+f.giu || 1))) * 3600;
    var doan = Math.max(1, G.QUY_DAO_V1.segmentSeconds);
    var dau = G.nhienLieuGiu(st, f.ships, Math.min(giuGiay, doan));
    var tong;
    if (G.nhienLieuGiuTong) tong = G.nhienLieuGiuTong(st, f.ships, giuGiay);
    else {
      tong = 0;
      for (var con = giuGiay; con > 0; con -= doan)
        tong += G.nhienLieuGiu(st, f.ships, Math.min(con, doan));
    }
    var mang = Math.max(0, Math.floor((f.cargo && f.cargo.deut) || 0));
    var lop = mang < dau ? 'do' : (mang < tong ? 'vang' : 'luc');
    ttGiu = '<tr><td>NL kỳ quỹ đạo đầu</td><td class="r sz ' + lop + '">' + G.so(dau) + '</td>' +
      '<td>NL giữ đủ ' + Math.round(giuGiay / 3600) + ' giờ</td><td class="r sz ' + lop + '">' +
      G.so(tong) + ' <span class="mo">(đang chở ' + G.so(mang) + ')</span></td></tr>' +
      '<tr><td colspan="4" class="' + lop + '">Nhiên liệu giữ quỹ đạo phải nằm trong khoang hàng. ' +
      (mang < dau
        ? 'Chưa đủ kỳ đầu nên máy chủ sẽ không cho xuất kích.'
        : (mang < tong
          ? 'Đủ vào quỹ đạo, nhưng nếu không đủ một kỳ trả trước kế ' +
            'tiếp thì toàn bộ tàu còn lại sẽ bị phá huỷ thành phế liệu.'
          : 'Đủ theo kế hoạch hiện tại; gọi về sớm không hoàn lại phần đã trả.')) + '</td></tr>';
  }
  return '<table style="font-size:12px"><tr>' +
    '<td>Khoảng cách</td><td class="r sz">' + G.so(kc) + '</td>' +
    '<td>Tốc độ hạm đội</td><td class="r sz">' + G.so(G.tocDoHam(st, f.ships)) + '</td></tr>' +
    '<tr><td>Thời gian bay</td><td class="r sz cam">' + G.tg(tg) + '</td>' +
    '<td>Cả đi lẫn về</td><td class="r sz">' + G.tg(tg * 2) + '</td></tr>' +
    '<tr><td>Nhiên liệu</td><td class="r sz ' + ((p.res.deut || 0) < nl ? 'do' : 'luc') + '">' + G.so(nl) + ' NL</td>' +
    '<td>Khoang hàng</td><td class="r sz ' + (hang > suc ? 'do' : '') + '">' + G.so(hang) + ' / ' + G.so(suc) +
      '</td></tr>' +
    '<tr><td>Thủy thủ đoàn</td><td class="r sz">' + G.so(G.thuyThu(f.ships)) + '</td>' +
    '<td>Khe hạm đội</td><td class="r sz">' + st.fleets.length + ' / ' + G.khe(st) + '</td></tr>' +
    ttGiu +
    (G.trong(f.linh || {}) ? '' :
      '<tr><td>Quân đổ bộ</td><td class="r sz">' + G.so(G.choLinhCan(f.linh)) + ' chỗ</td>' +
      '<td>Hạm đội chở được</td><td class="r sz ' + (G.choLinhCan(f.linh) > G.sucChoLinh(f.ships) ? 'do' :
        'luc') + '">' +
      G.so(G.sucChoLinh(f.ships)) + '</td></tr>') +
    '</table>';
};

    } else if (o.loai === 'nguoi') {
      h += '<td>' + U.esc(o.htTen) + '</td><td class="cam"><b>' + U.esc(o.ten) + '</b>' +

      else if (o.chien && o.chien.trang === 'dongminh')

        h += '<span class="mo sz">Chủ liên minh mới được tuyên chiến</span> ';

        '">Tin tình báo</button> ';

      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="thamhiem">Thám hiểm</button> ';
    } else if (o.loai === 'trong') {

    } else {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="transport">Vận chuyển</button> ';

        '') + '</p>';

      'class="r">Thành viên</th><th class="r">Tổng điểm</th><th></th></tr>';

    }

    '(chu kỳ bảo trì 6 giờ, nghiên cứu trả góp, phòng thủ hai lớp, đổi mục tiêu giữa đường, 6 loại tài nguyên) ' +

U.sig = function () {
  var st = U.st(), bt = U.bt(st), s = [st.planets.length, st.msgs.length, st.fleets.length, st.toi.length, bt.cycle,
    bt.missStreak, U.man, U.pi, st.nk.length, st.lm ? st.lm.ten : '-',
    (st.pvpToi || []).map(function (x) { return x.id + ':' + x.nv + ':' + x.den_t; }).join(','),
    (st.pvpGiu || []).map(function (x) { return x.id + ':' + x.giuDen_t + ':' + x.tiepNL_t; }).join(',')];
  for (var i = 0; i < st.planets.length; i++) {
    var p = st.planets[i], ds = U.ds(p);
    s.push(p.qB.length, p.qS.length, p.qS.length ? p.qS[0].n : 0,
      Math.floor(ds.population), ds.supportBp, ds.taxBp, ds.foodShortfallCycle > 0 ? 1 : 0);
  }
  s.push(st.ncQueue ? st.ncQueue.id + ':' + st.ncQueue.status + ':' + st.ncQueue.installmentsLeft + ':' +
    st.ncQueue.finishAt : '-');
  for (var j = 0; j < st.fleets.length; j++) {
    var f = st.fleets[j];
    s.push([f.id, f.mission, f.pha, f.den_t || 0, f.ve_t || 0,
      f.giuDen_t || 0, f.tiepNL_t || 0, JSON.stringify(f.ships || {}),
      JSON.stringify(f.cargo || {})].join(':'));
  }
  return s.join('|');
};

U.ve = function () {
  var st = U.st();
  if (!st) return;
  document.getElementById('tt-res').innerHTML = U.thanhRes();
  U.veMenu(); U.veCanh(); U.veChonHT();
  var f = U['m_' + U.man] || U.m_tongquan;
  document.getElementById('noidung').innerHTML = f();
  document.getElementById('chan-tt').innerHTML =
    'Thiên Hà Đại Chiến — nhãn lịch sử ' + G.PHIEN_BAN_LICH_SU +
      ' · nguyên tác: Trần Châu Quốc Bình &amp; nhóm 3 người (phát triển từ 2004) · ' +
    'máy chủ tốc độ x' + G.C.TOC_DO_SERVER + ' · chu kỳ bảo trì 6 giờ';
  U.sigCu = U.sig();
};

U.live = function () {
  var st = U.st();
  if (!st) return;
  if (U.sig() !== U.sigCu) { U.ve(); return; }
  var p = U.ht(), s = G.sanLuong(st, p), i;
  var els = document.querySelectorAll('[data-live]');
  for (i = 0; i < els.length; i++) {
    var k = els[i].getAttribute('data-live'), v;
    if (k.indexOf('res.') === 0) v = G.soNgan(p.res[k.slice(4)] || 0);
    else if (k.indexOf('rate.') === 0) { var rk = k.slice(5); v = (s.r[rk] >= 0 ? '+' : '') +
      G.soNgan(s.r[rk]) + '/g'; }
    else if (k === 'galana') v = G.soNgan(st.galana);
    else if (k === 'tech') v = G.soNgan(st.techPts);
    if (v !== undefined && els[i].textContent !== v) els[i].textContent = v;
  }
  var ds = document.querySelectorAll('.dem');
  for (i = 0; i < ds.length; i++) {
    var t = +ds[i].getAttribute('data-t');
    ds[i].textContent = G.tg(t - st.now);
  }
};

/* ======================================================================
 * MÀN: MÁY TÍNH TRẬN ĐÁNH (mô phỏng trước khi xuất kích)
 * ==================================================================== */
U.MP_LAN = 60;                 // số lần mô phỏng cho mỗi lượt tính

U.mpMoi = function () {
  var st = U.st(), p = U.ht();
  return {
    A: { ships: G.clone(p.ships || {}), tech: { weapon: st.tech.weapon || 0, shield: st.tech.shield || 0, armor:
      st.tech.armor || 0 } },
    D: { ships: {}, def: {}, tech: { weapon: 0, shield: 0, armor: 0 }, res: null },
    nguon: '', kq: null
  };
};

U.mpNapDoTham = function (key) {
  var st = U.st();
  var bc = st.spy && st.spy[key];
  if (!bc) return;
  U.mp.D.ships = G.clone(bc.ships || {});
  U.mp.D.def = G.clone(bc.def || {});
  U.mp.D.res = bc.res ? G.clone(bc.res) : null;
  var t = bc.tech || {};
  U.mp.D.tech = { weapon: t.weapon || 0, shield: t.shield || 0, armor: t.armor || 0 };
  U.mp.nguon = (bc.ten || '') + ' ' + G.tdStr(bc.td);
};

U.mpDoc = function () {
  var m = U.mp, i, el, id;
  for (i = 0; i < G.SHIPS.length; i++) {
    id = G.SHIPS[i].id;
    el = document.getElementById('mpa-' + id);
    if (el) { var n = Math.max(0, Math.floor(+el.value || 0)); if (n) m.A.ships[id] = n; else delete m.A.ships[id]; }
    el = document.getElementById('mpd-' + id);
    if (el) { var n2 = Math.max(0, Math.floor(+el.value || 0)); if (n2) m.D.ships[id] = n2; else delete m.D.ships[id]; }
  }
  for (i = 0; i < G.DEFENSES.length; i++) {
    id = G.DEFENSES[i].id;
    el = document.getElementById('mpf-' + id);
    if (el) { var n3 = Math.max(0, Math.floor(+el.value || 0)); if (n3) m.D.def[id] = n3; else delete m.D.def[id]; }
  }
  ['weapon', 'shield', 'armor'].forEach(function (k) {
    var a = document.getElementById('mpta-' + k), d = document.getElementById('mptd-' + k);
    if (a) m.A.tech[k] = Math.max(0, Math.min(50, Math.floor(+a.value || 0)));
    if (d) m.D.tech[k] = Math.max(0, Math.min(50, Math.floor(+d.value || 0)));
  });
};

U.mpChay = function () {
  var m = U.mp, i, k;
  if (G.trong(m.A.ships)) { U.toast('Nhập hạm đội bên tấn công đã.', 'loi'); return; }
  var thang = 0, hoa = 0, thua = 0;
  var matA = {}, matD = {}, pl = { metal: 0, crystal: 0 }, vongTB = 0;
  var sucChua = G.khoangHang(m.A.ships);
  for (i = 0; i < U.MP_LAN; i++) {
    var kq = G.danhTran(
      { ten: 'Ta', tech: m.A.tech, ships: G.clone(m.A.ships) },
      { ten: 'Đối phương', tech: m.D.tech, ships: G.clone(m.D.ships), def: G.clone(m.D.def) },
      G.hash('mp' + i + ':' + G.giay()));
    if (kq.kq === 'thang') thang++;
    else if (kq.kq === 'hoa') hoa++;
    else thua++;
    for (k in kq.matA) matA[k] = (matA[k] || 0) + kq.matA[k];
    for (k in kq.matD) matD[k] = (matD[k] || 0) + kq.matD[k];
    pl.metal += kq.pheLieu.metal; pl.crystal += kq.pheLieu.crystal;
    vongTB += kq.vongDanh.length;
  }
  var chia = function (o) { var r = {}; for (var k2 in o) { var v = Math.round(o[k2] / U.MP_LAN);
    if (v) r[k2] = v; } return r; };
  var giaTri = function (o) { var t = 0; for (var k3 in o) { var u = G.UNIT(k3);
    if (u) t += G.giaTriDiem(u.cost, o[k3]) * 1000; } return t; };
  var tbMatA = chia(matA), tbMatD = chia(matD);
  var cuop = m.D.res ? G.chiaHang(m.D.res, sucChua, G.C.CUOP_TOI_DA) : null;
  m.kq = {
    thang: thang, hoa: hoa, thua: thua, lan: U.MP_LAN,
    matA: tbMatA, matD: tbMatD,
    giaA: giaTri(tbMatA), giaD: giaTri(tbMatD),
    pl: { metal: Math.round(pl.metal / U.MP_LAN), crystal: Math.round(pl.crystal / U.MP_LAN) },
    vong: Math.round(vongTB / U.MP_LAN * 10) / 10,
    cuop: cuop, sucChua: sucChua
  };
};

function mpO(tienTo, u, giaTri, coSan) {
  return '<div class="hd-tau"><span>' + U.esc(u.ten) +

    '</span><input id="' + tienTo + '-' + u.id + '" type="number" min="0" value="' + (giaTri || 0) + '"></div>';
}

      ' &nbsp;·&nbsp; trung bình ' + k.vong + ' vòng</div>';
    h += '<div class="luoi2"><div><table>' +
      '<tr><th colspan="2">Bên ta (trung bình mỗi trận)</th></tr>' +
      '<tr><td>Tàu mất</td><td class="r">' + U.dsTau(k.matA) + '</td></tr>' +

    if (k.cuop) {

/* source: js/app.js sha256:200fd096a52a225db544039df64938a5b44bce3da323f4d4f535ca5e083fb2a7 */
/* THIÊN HÀ ĐẠI CHIẾN — tầng thao tác giao diện (dùng chung cho 1 người & nhiều người)
 * Mọi thao tác của người chơi đi qua APP.lam(ten, dl, xong):
 *   - bản một người  (js/main.js): chạy G.chay() ngay trên state trong máy
 *   - bản nhiều người (web/js/mp.js): gửi lên server, server mới là bên quyết định
 * File này chỉ lo thu dữ liệu từ DOM, hiện hộp thoại và vẽ lại.            */
'use strict';
var G = window.G, U = window.U, APP = window.APP = window.APP || {};

APP.mp = false;                 // true khi đang chơi ở chế độ nhiều người

/* Nguồn dữ liệu vũ trụ: bản một người tính tại chỗ, bản nhiều người lấy từ server */
U.nguon = {
  xemHe: function (g, h) { return G.xemHe(U.st(), g, h); },
  xepHang: function (loai) { return G.xepHang(U.st(), loai); },
  dsLM: function () {
    var out = [];
    for (var i = 0; i < G.LIEN_MINH.length; i++) if (G.LIEN_MINH[i]) out.push({ ten: G.LIEN_MINH[i] });
    return out;
  }
};

function soO(id) { var e = document.getElementById(id); return e ? Math.max(0, Math.floor(+e.value || 0)) : 0; }
function veLai(err, okMsg) {
  if (err) U.toast(err, 'loi');
  else if (okMsg) U.toast(okMsg, 'ok');
  U.ve();
}
/* gửi một hành động lên "máy" (local hoặc server) */
function lam(ten, dl, okMsg) {
  APP.lam(ten, dl || {}, function (err) { veLai(err, err ? null : okMsg); });
}
APP.gui = lam;

var ACT = {
  /* ---------- điều hướng & hộp thoại ---------- */
  man: function (el) {
    U.man = el.getAttribute('data-man');
    var m = document.getElementById('menu'); if (m) m.classList.remove('mo-ra');
    U.ve(); window.scrollTo(0, 0);
  },
  'dong-ht': function () { U.dongHop(); },
  luu: function () { if (APP.luu) APP.luu(false); },

  /* ---------- công trình / nghiên cứu / xưởng ---------- */
  xay: function (el) {
    var id = el.getAttribute('data-id');
    lam('xay', { pi: U.pi, id: id, n: soO('ct-sl-' + id) });
  },
  huyxay: function (el) { lam('huyxay', { pi: U.pi, i: +el.getAttribute('data-i') }); },
  nc: function (el) { lam('nc', { pi: U.pi, id: el.getAttribute('data-id') }); },
  huync: function () { lam('huync', {}, 'Đã huỷ đề tài, hoàn lại chi phí.'); },
  dong: function (el) {
    var id = el.getAttribute('data-id');
    lam('dong', { pi: U.pi, id: id, n: soO('sl-' + id) || 1 });
  },
  huydong: function (el) { lam('huydong', { pi: U.pi, i: +el.getAttribute('data-i') }); },
  doithue: function () {
    var e = document.getElementById('thue-pct');
    lam('doithue', { pi: U.pi, thue: e ? Number(e.value) : NaN }, 'Đã đổi mức thuế từ chu kỳ hiện tại.');
  },

  /* ---------- chợ ---------- */
  ban: function (el) {
    var r = el.getAttribute('data-res');
    U.cho[r] = soO('cho-' + r);
    lam('ban', { pi: U.pi, res: r, n: U.cho[r] });
  },
  mua: function (el) {
    var r = el.getAttribute('data-res');
    U.cho[r] = soO('cho-' + r);
    lam('mua', { pi: U.pi, res: r, n: U.cho[r] });
  },

  /* ---------- bản đồ thiên hà ---------- */
  gal: function (el) {
    if (!U.gal) U.gal = { g: U.ht().c.g, h: U.ht().c.h };
    U.gal.g = Math.min(G.C.SO_THIEN_HA, Math.max(1, U.gal.g + (+el.getAttribute('data-dg') || 0)));
    U.gal.h = Math.min(G.C.SO_HE, Math.max(1, U.gal.h + (+el.getAttribute('data-dh') || 0)));
    APP.taiHe ? APP.taiHe(U.gal.g, U.gal.h) : U.ve();
  },
  'gal-di': function () {
    U.gal = {
      g: Math.min(G.C.SO_THIEN_HA, Math.max(1, soO('g-g') || 1)),
      h: Math.min(G.C.SO_HE, Math.max(1, soO('g-h') || 1))
    };
    APP.taiHe ? APP.taiHe(U.gal.g, U.gal.h) : U.ve();
  },
  'gal-nha': function () {
    var c = U.st().planets[0].c;
    U.gal = { g: c.g, h: c.h }; U.man = 'thienha';

  },
  'gal-tu-form': function () {

  },

  /* ---------- hạm đội ---------- */
  nv: function (el) {
    var t = el.getAttribute('data-td').split(',');
    if (!U.form) U.form = U.formMoi();
    U.form.den = { g: +t[0], h: +t[1], p: +t[2] };
    U.form.mission = el.getAttribute('data-m');

    U.toast('Đã nạp mục tiêu ' + G.tdStr(U.form.den) + ' — chọn tàu rồi xuất kích.');
  },
  'max-linh': function (el) {
    U.capNhatForm();
    var id = el.getAttribute('data-id');
    if (!U.form.linh) U.form.linh = {};
    U.form.linh[id] = (U.ht().linh || {})[id] || 0;
    U.ve();
  },
  'max-tau': function (el) {
    U.capNhatForm();
    var id = el.getAttribute('data-id');
    U.form.ships[id] = U.ht().ships[id] || 0;
    U.ve();
  },
  'max-hang': function () {
    U.capNhatForm();
    var p = U.ht(), f = U.form, st = U.st();
    var suc = G.khoangHang(f.ships);
    var nl = G.nhienLieu(st, f.ships, G.khoangCach(p.c, f.den), f.pct);
    f.cargo = {};
    var con = suc, ds = ['metal', 'crystal', 'deut', 'food'];
    /* Với Giữ Chỗ, ưu tiên nạp đủ nhiên liệu quỹ đạo đã lên kế hoạch. Đây chỉ
       là tiện ích điền form; engine/server vẫn tự kiểm tra authoritative. */
    if (f.mission === 'hold' && G.QUY_DAO_V1 && G.nhienLieuGiu) {
      var giuGiay = Math.max(1, Math.min(24, Math.floor(+f.giu || 1))) * 3600;
      var canGiu = 0, doan = Math.max(1, G.QUY_DAO_V1.segmentSeconds);
      if (G.nhienLieuGiuTong) canGiu = G.nhienLieuGiuTong(st, f.ships, giuGiay);
      else for (var giuCon = giuGiay; giuCon > 0; giuCon -= doan)
        canGiu += G.nhienLieuGiu(st, f.ships, Math.min(giuCon, doan));
      var deutCo = Math.max(0, Math.floor((p.res.deut || 0) - nl));
      var napGiu = Math.min(con, deutCo, canGiu);
      if (napGiu > 0) { f.cargo.deut = napGiu; con -= napGiu; }
      ds = ['metal', 'crystal', 'food'];
    }
    for (var i = 0; i < ds.length && con > 0; i++) {
      var co = Math.max(0, Math.floor((p.res[ds[i]] || 0) - (ds[i] === 'deut' ? nl : 0)));
      var lay = (i === ds.length - 1) ? Math.min(co, con) : Math.min(co, Math.floor(con / (ds.length - i)));
      if (lay > 0) { f.cargo[ds[i]] = lay; con -= lay; }
    }
    U.ve();
  },
  gui: function () {
    U.capNhatForm();
    var f = U.form;
    APP.lam('gui', {
      pi: U.pi, ships: G.clone(f.ships), linh: G.clone(f.linh || {}), den: f.den, mission: f.mission,
      cargo: G.clone(f.cargo), pct: f.pct, giu: f.giu
    }, function (err) {
      if (err) return U.toast(err, 'loi');
      U.form = U.formMoi();
      veLai(null, 'Hạm đội đã xuất kích.');

  goive: function (el) { lam('goive', { fid: +el.getAttribute('data-fid') }, 'Đã phát lệnh gọi về.'); },
  'ban-ten-lua': function () {

    }, 'Tên lửa đã rời bệ phóng.');
  },
  doihuong: function (el) {

    for (var i = 0; i < st.fleets.length; i++) if (st.fleets[i].id === fid) f = st.fleets[i];
    if (!f) return;
    U.hop('Đổi mục tiêu hạm đội #' + fid,
      '<p>Hạm đội đang bay tới <b>' + G.tdStr(f.den) + '</b>. Nhập toạ độ mới — thời gian bay được tính lại từ ' +
      'vị trí hiện tại của hạm đội. Phí: <b>' + G.C.DOI_MUC_TIEU_GALANA + ' Galana</b> cộng nhiên liệu phụ trội.</p>' +
      '<div class="hd-td"><input id="dh-g" type="number" min="1" max="' +
      G.C.SO_THIEN_HA + '" value="' + f.den.g + '">:' +
      '<input id="dh-h" type="number" min="1" max="' + G.C.SO_HE + '" value="' + f.den.h + '">:' +
      '<input id="dh-p" type="number" min="1" max="' + G.C.SO_HANH_TINH + '" value="' + f.den.p + '">' +
      '<button class="nut oke" data-act="doihuong-ok" data-fid="' + fid + '">Phát lệnh đổi hướng</button></div>');
  },
  'doihuong-ok': function (el) {
    APP.lam('doihuong', {
      fid: +el.getAttribute('data-fid'),
      den: { g: soO('dh-g'), h: soO('dh-h'), p: soO('dh-p') }
    }, function (err) { U.dongHop(); veLai(err, err ? null : 'Hạm đội đã đổi hướng.'); });
  },

  'xh-loai': function (el) {
    U.xhLoai = el.getAttribute('data-loai');
    if (APP.taiXepHang) APP.taiXepHang(U.xhLoai); else U.ve();
  },

  /* ---------- máy tính trận đánh ---------- */
  'mp-chay': function () { U.mpDoc(); U.mpChay(); U.ve(); window.scrollTo(0, 0); },
  'mp-nap-ham': function () { U.mpDoc(); U.mp.A.ships = G.clone(U.ht().ships || {}); U.ve(); },
  'mp-xoa': function () { U.mp = U.mpMoi(); U.mp.A.ships = {}; U.ve(); },
  'mp-nap-bc': function () {

    var s = document.getElementById('mp-bc');

  /* ---------- liên minh ---------- */

  /* ---------- bỏ hoang thuộc địa ---------- */
  'bo-hoang': function () {

      '<p>Gõ chữ <b>BO</b> để xác nhận:</p>' +

/* Driver có thể bổ sung/ghi đè hành động riêng (lưu file, đăng xuất...) */
APP.themACT = function (o) { for (var k in o) ACT[k] = o[k]; };

/* cập nhật form hạm đội mà không vẽ lại (giữ con trỏ trong ô nhập) */
document.addEventListener('input', function (e) {
  if (!window.ST) return;
  var id = e.target.id || '';
  if (id === 'f-pct') { var v = document.getElementById('f-pct-v'); if (v) v.textContent = e.target.value + '%'; }
  if (/^cho-/.test(id)) U.cho[id.slice(4)] = Math.max(0, Math.floor(+e.target.value || 0));
  if (/^ct-sl-/.test(id)) {
    var bid = id.slice(6), b = G.B(bid), n = Math.max(1, Math.min(10000000, Math.floor(+e.target.value || 1)));
    var gia = document.getElementById('ct-gia-' + bid), tg = document.getElementById('ct-tg-' + bid);
    var nut = document.querySelector('[data-act="xay"][data-id="' + bid + '"]');
    var cost = b ? G.giaCongTrinh(b, n) : null;
    if (b && gia) gia.innerHTML = U.gia(cost, U.ht(), U.st());
    if (b && tg) tg.textContent = G.tg(G.tgXay(U.st(), U.ht(), cost));
    if (nut) {
      nut.textContent = 'Xây ×' + G.so(n);
      nut.classList.toggle('oke', !!b && G.duTien(U.st(), U.ht(), cost) && !G.thieuDK(U.st(), U.ht(), b).length);
    }
  }
  if (/^(f-|ft-|fc-|fl-)/.test(id)) {
    U.capNhatForm();
    var tt = document.getElementById('hd-tt');
    if (tt) tt.innerHTML = U.ttBay();
    if (id === 'f-mission') U.ve();
  }
});
document.addEventListener('change', function (e) {

/* ---------- nhịp đập chung: 1 giây một lần ---------- */
APP.batDauNhip = function () {
  var dangTiepTucTick = false;
  function xuLyTick(redraw) {
    if (!window.ST || dangTiepTucTick) return;
    var out = G.tick(window.ST, G.giay());
    if (G.laTickPartial(out)) throw new Error('TICK_SENTINEL_FROM_TICK_INVALID');
    if (G.tickOutcomeNeedsDeferral(out)) {
      dangTiepTucTick = true;
      setTimeout(function tiepTuc() {
        var next = G.tick(window.ST, G.giay());
        if (G.laTickPartial(next)) throw new Error('TICK_SENTINEL_FROM_TICK_INVALID');
        if (G.tickOutcomeNeedsDeferral(next)) {
          setTimeout(tiepTuc, 0);
          return;
        }
        dangTiepTucTick = false;
        if (redraw) redraw();
      }, 0);
      return;
    }
    if (redraw) redraw();
  }
  setInterval(function () {
    if (!window.ST) return;
    xuLyTick(null);
    U.live();
    if (APP.moiGiay) APP.moiGiay();
  }, 1000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && window.ST) {
      xuLyTick(function () { U.ve(); if (APP.hienLai) APP.hienLai(); });
    }
  });
};

/* source: js/main.js sha256:db284a1d10df0fa4e6d56353b98265329c0360a323378a225c9488170d460433 */
/* THIÊN HÀ ĐẠI CHIẾN — driver bản MỘT NGƯỜI
 * State nằm trong localStorage, mọi hành động chạy thẳng trên máy.
 * (Bản nhiều người dùng web/js/mp.js thay cho file này.)                  */
'use strict';
(function () {
  var G = window.G, U = window.U, APP = window.APP;
  var KEY = 'thdc_save_v6', KEY_CU = ['thdc_save_v5', 'thdc_save_v4', 'thdc_save_v3'];
  var ST = null;
  var LOI_NAP = '';
  var COFILE = !window.THDC_ARTIFACT;   // trong Artifact không tải file được

  /* ---------------- lưu / nạp ---------------- */
  function luu(im) {
    if (!ST) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(ST));
      if (!im) U.toast('Đã lưu bàn chơi.', 'ok');
    } catch (e) { U.toast('Không lưu được: ' + e.message, 'loi'); }
  }
  function chuanHoa(o) {
    if (!o || !Array.isArray(o.planets) || !o.planets.length)
      throw new Error('không phải bàn chơi hợp lệ');
    var v = Math.max(0, Math.floor(Number(o.v) || 0));
    if (v > G.STATE_VERSION)
      throw new Error('bàn chơi dùng state v' + v + ', mới hơn engine v' + G.STATE_VERSION);
    G.nangCapState(o, G.giay());
    if (o.v !== G.STATE_VERSION || o.moHinhCT !== 'so-luong-v1' ||
        o.moHinhNhip !== 'bao-tri-dan-su-v1' || o.moHinhQuyDao !== 'giu-quy-dao-v1')
      throw new Error('marker mô hình state không hợp lệ cho state v' + o.v);
    o.toi = Array.isArray(o.toi) ? o.toi : [];
    o.tenLua = Array.isArray(o.tenLua) ? o.tenLua : [];
    o.fleets = Array.isArray(o.fleets) ? o.fleets : [];
    o.npc = o.npc || {}; o.debris = o.debris || {}; o.msgs = Array.isArray(o.msgs) ? o.msgs : [];
    o.nk = Array.isArray(o.nk) ? o.nk : [];
    o.stats = o.stats || { thang: 0, thua: 0, cuop: 0, tauMat: 0, tauDietDich: 0, chuyenBay: 0 };
    o.fleetIdSeq = o.fleetIdSeq || 1;
    return o;
  }
  function nap() {
    var nguon = null;
    try {
      var s = localStorage.getItem(KEY);
      for (var i = 0; !s && i < KEY_CU.length; i++) {
        s = localStorage.getItem(KEY_CU[i]);
        if (s) nguon = KEY_CU[i];
      }
      if (!s) return null;
      var o = chuanHoa(JSON.parse(s));
      /* Chỉ ghi key mới sau khi parse + migration + validation đã thành công.
         Các key v5/v4/v3 được giữ nguyên làm bản raw dự phòng cho tới khi người
         chơi tự xoá bàn; bản v6 luôn được ưu tiên nên save cũ không sống lại. */
      if (nguon) localStorage.setItem(KEY, JSON.stringify(o));
      return o;
    } catch (e) { LOI_NAP = e && e.message || String(e); return null; }
  }

  /* ---------------- APP: chạy hành động tại chỗ ---------------- */
  APP.mp = false;
  APP.luu = luu;
  function laPlainObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value) &&
      Object.getPrototypeOf(value) === Object.prototype;
  }
  function tenHanhDongHopLe(value) {
    return typeof value === 'string' && /^[A-Za-z][A-Za-z0-9_-]{0,23}$/.test(value);
  }
  function goiLai(cb, err) {
    if (typeof cb === 'function') cb(err || null);
  }
  function damBaoStateChoPartial() {
    if (!ST && window.ST) ST = window.ST;
    if (!ST && G.moiGame) window.ST = ST = G.moiGame('Chỉ Huy');
  }
  function luuPartial() {
    damBaoStateChoPartial();
    luu(true);
  }
  function tickDenHienTai(xong) {
    var out = G.tick(ST, G.giay());
    if (G.laTickPartial(out)) throw new Error('TICK_SENTINEL_FROM_TICK_INVALID');
    if (G.tickOutcomeNeedsDeferral(out)) {
      luu(true);
      setTimeout(function () { tickDenHienTai(xong); }, 0);
      return true;
    }
    if (xong) xong();
    return false;
  }
  var hangLam = [];
  var dangLam = false;
  function chayHangLam() {
    if (dangLam || !hangLam.length) return;
    dangLam = true;
    chayMotLan(hangLam[0]);
  }
  function xongMotLam(item, err) {
    hangLam.shift();
    goiLai(item.xong, err);
    dangLam = false;
    chayHangLam();
  }
  function henTiepLam(item) {
    luuPartial();
    setTimeout(function () {
      item.continuations += 1;
      chayMotLan(item);
    }, 0);
  }
  function chayMotLan(item) {
    var err = G.chay(ST, item.ten, item.dl);
    if (G.laTickPartial(err)) {
      if (item.continuations >= 1000) {
        luuPartial();
        xongMotLam(item, 'Tua thời gian quá dài, hãy thử lại.');
        return;
      }
      henTiepLam(item);
      return;
    }
    if (!err) luu(true);
    xongMotLam(item, err || null);
  }
  APP.lam = function (ten, dl, xong) {
    if (!tenHanhDongHopLe(ten)) return goiLai(xong, 'Hành động không hợp lệ.');
    if (dl === undefined || dl === null) dl = {};
    else if (!laPlainObject(dl)) return goiLai(xong, 'Dữ liệu hành động không hợp lệ.');
    hangLam.push({ten: ten, dl: dl, xong: xong, continuations: 0});
    chayHangLam();
  };
  APP.moiGiay = (function () {
    var dem = 0;
    return function () { if (++dem >= 15) { dem = 0; luu(true); } };
  })();

  function batDau(st) {
    window.ST = ST = chuanHoa(st);
    document.getElementById('man-khoidong').style.display = 'none';
    document.getElementById('game').style.display = '';
    if (!tickDenHienTai(function () { U.ve(); })) U.ve();
  }
  window.addEventListener('beforeunload', function () { luu(true); });

  /* ---------------- hành động riêng của bản một người ---------------- */
  APP.themACT({
    xuat: function () {
      var js = JSON.stringify(ST);
      U.hop('Xuất bàn chơi',
        '<p class="mo">Sao chép toàn bộ đoạn dưới đây và lưu lại. ' +
        'Dán vào ô "Nạp bàn chơi" ở bất kỳ máy nào để chơi tiếp. ' +
        (COFILE ? 'Nút "Tải về file" cũng dùng được.' : '') + '</p>' +
        '<textarea id="xuat-js" style="width:100%;height:180px" readonly></textarea>' +
        '<div style="margin-top:8px"><button class="nut oke" data-act="xuat-copy">Sao chép</button>' +
        (COFILE ? ' <button class="nut" data-act="xuat-file">Tải về file</button>' : '') + '</div>');
      document.getElementById('xuat-js').value = js;
    },
    'xuat-copy': function () {
      var t = document.getElementById('xuat-js');
      t.select();
      var xong = false;
      try { xong = document.execCommand('copy'); } catch (e) { xong = false; }
      if (!xong && navigator.clipboard) {
        navigator.clipboard.writeText(t.value).then(function () { U.toast('Đã sao chép.', 'ok'); },
          function () { U.toast('Không sao chép được, hãy chọn tay rồi Ctrl+C.', 'loi'); });
        return;
      }
      U.toast(xong ? 'Đã sao chép.' : 'Không sao chép được, hãy chọn tay rồi Ctrl+C.', xong ? 'ok' : 'loi');
    },
/*[TAI-FILE-BAT-DAU]*/
    'xuat-file': function () {
      try {
        var b = new Blob([JSON.stringify(ST)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'thdc-' + ST.ten.replace(/\s+/g, '') + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        U.toast('Nếu trình duyệt không tải về được, hãy dùng nút Sao chép.');
      } catch (e) { U.toast('Không tải file được ở môi trường này — hãy dùng nút Sao chép.', 'loi'); }
    },
/*[TAI-FILE-KET-THUC]*/
    nhap: function () {
      U.hop('Nạp bàn chơi',
        '<p class="mo">Dán nội dung bàn chơi đã xuất vào đây rồi bấm Nạp. Bàn hiện tại sẽ bị ghi đè.</p>' +
        '<textarea id="nhap-js" style="width:100%;height:180px" placeholder=\'{"v":6,...}\'></textarea>' +
        '<div style="margin-top:8px"><button class="nut oke" data-act="nhap-ok">Nạp</button>' +
        (COFILE ? ' <button class="nut" data-act="nhap-file">Chọn file...</button>' : '') + '</div>');
    },
    'nhap-ok': function () {
      var v = (document.getElementById('nhap-js') || {}).value || '';
      try {
        var o = JSON.parse(v);
        o = chuanHoa(o);
        window.ST = ST = o;
        if (!tickDenHienTai(function () {
          luu(true); U.dongHop(); U.ve(); U.toast('Đã nạp bàn chơi.', 'ok');
        })) {
          luu(true); U.dongHop(); U.ve(); U.toast('Đã nạp bàn chơi.', 'ok');
        }
      } catch (e) { U.toast('Nạp thất bại: ' + e.message, 'loi'); }
    },
    'nhap-file': function () { document.getElementById('file-nhap').click(); },
    'xoa-game': function () {
      U.hop('Xoá bàn chơi?', '<p>Toàn bộ tiến trình sẽ mất. Chắc chưa?</p>' +
        '<button class="nut xoa" data-act="xoa-that">Xoá và chơi lại</button> ' +
        '<button class="nut" data-act="dong-ht">Thôi</button>');
    },
    'xoa-that': function () {
      /* Ngăn beforeunload ghi lại đúng bàn vừa xoá trong lúc reload. */
      ST = null; window.ST = null;
      localStorage.removeItem(KEY);
      for (var i = 0; i < KEY_CU.length; i++) localStorage.removeItem(KEY_CU[i]);
      location.reload();
    }
  });

  APP.doiFile = function (e) {
    if (e.target.id === 'file-nhap' && e.target.files && e.target.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(fr.result);
          o = chuanHoa(o);
          window.ST = ST = o;
          if (!tickDenHienTai(function () {
            luu(true); U.ve(); U.toast('Đã nạp bàn chơi từ file.', 'ok');
          })) {
            luu(true); U.ve(); U.toast('Đã nạp bàn chơi từ file.', 'ok');
          }
        } catch (err) { U.toast('Nạp thất bại: ' + err.message, 'loi'); }
      };
      fr.readAsText(e.target.files[0]);
    }
  };

  /* ---------------- màn khởi động ---------------- */
  document.getElementById('kd-ver').textContent = G.PHIEN_BAN_LICH_SU;
  var cu = nap();
  if (LOI_NAP) {
    var kd = document.querySelector('.kd-form');
    if (kd) kd.insertAdjacentHTML('beforeend', '<div class="canh" style="margin-top:10px">Không nạp được bàn cũ: ' +
      U.esc(LOI_NAP) + '. Dữ liệu gốc vẫn được giữ nguyên.</div>');
  }
  if (cu) {
    var b = document.getElementById('kd-tieptuc');
    b.style.display = '';
    b.textContent = 'TIẾP TỤC: ' + cu.ten + ' — ' + G.so(G.diem(cu).tong) + ' điểm';
    b.onclick = function () { batDau(cu); };
  }
  document.getElementById('kd-batdau').onclick = function () {
    var ten = (document.getElementById('kd-ten').value || '').trim() || 'Chỉ Huy';
    var seed = (document.getElementById('kd-seed').value || '').trim() || null;
    if (cu && !confirm('Bàn chơi cũ sẽ bị ghi đè. Tiếp tục tạo bàn mới?')) return;
    batDau(G.moiGame(ten, seed));
    luu(true);
  };
  document.getElementById('nut-menu').onclick = function () {
    document.getElementById('menu').classList.toggle('mo-ra');
  };
  document.getElementById('kd-ten').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('kd-batdau').click();
  });
  APP.batDauNhip();
})();
</script>
