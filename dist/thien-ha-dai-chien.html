    var t = Math.min(ke, now);
    var dt = t - st.lastTick;
    if (dt > 0) {
      for (var i = 0; i < st.planets.length; i++) {
        G.sanXuat(st, st.planets[i], dt);
        G.chayXuong(st, st.planets[i], dt);
      }
      if (st.ncQueue && !st.ncQueue.treo) st.ncQueue.conLai -= dt;
      st.lastTick = t; st.now = t;
    }
    if (ke <= t) {
      var truoc = G.sukienKe(st);
      G.xuLySuKien(st, t);
      if (dt <= 0 && G.sukienKe(st) <= truoc && G.sukienKe(st) <= st.lastTick) break;  // chống lặp vô hạn
    } else break;
  }
  st.lastTick = now; st.now = now;

  /* Có Galana thì tự trả nợ bảo trì ngay, không cần chờ hết chu kỳ */
  if (st.noBaoTri > 0 && st.galana >= st.noBaoTri) {
    var tra = st.noBaoTri;
    st.galana -= tra; st.noBaoTri = 0;
    G.tin(st, 'bt', 'Đã trả xong nợ bảo trì',
      'Nợ ' + G.so(tra) + ' Galana đã thanh toán. Sản lượng và hạm đội trở lại bình thường.');
  }
  if (st.ncQueue && st.ncQueue.treo && st.galana >= Math.min(st.ncQueue.vonConLai, st.ncQueue.vonMoiKy)) {
    var v = Math.min(st.ncQueue.vonConLai, st.ncQueue.vonMoiKy);
    st.galana -= v; st.ncQueue.vonConLai -= v; st.ncQueue.treo = false;
    G.tin(st, 'bt', 'Nghiên cứu chạy lại', 'Đã rót đủ vốn, đề tài "' + G.R(st.ncQueue.id).ten + '" tiếp tục.');
  }
};

/* Chia lượng cướp/giao vào khoang hàng: chia đều rồi dồn phần dư */
G.chiaHang = function (nguon, cho, tyLe) {
  var ds = ['metal', 'crystal', 'deut', 'food'];
  var toiDa = {}, lay = {}, i;
  for (i = 0; i < ds.length; i++) {
    toiDa[ds[i]] = Math.max(0, Math.floor((nguon[ds[i]] || 0) * tyLe));
    lay[ds[i]] = 0;
  }
  cho = Math.max(0, Math.floor(cho));
  var guard = 0;
  while (cho > 0 && guard++ < 8) {
    var conDs = [];
    for (i = 0; i < ds.length; i++) if (toiDa[ds[i]] - lay[ds[i]] > 0) conDs.push(ds[i]);
    if (!conDs.length) break;
    var phan = Math.max(1, Math.floor(cho / conDs.length));
    for (i = 0; i < conDs.length && cho > 0; i++) {
      var k = conDs[i];
      var v = Math.min(phan, toiDa[k] - lay[k], cho);
      lay[k] += v; cho -= v;
    }
  }
  return lay;
};

G.xuLySuKien = function (st, t) {
  var i, p;
  /* công trình */
  for (i = 0; i < st.planets.length; i++) {
    p = st.planets[i];
    while (p.qB.length && p.qB[0].xong && p.qB[0].xong <= t) {
      var m = p.qB.shift();
      p.b[m.id] = m.lv;
      G.ghi(st, p.ten + ': ' + G.B(m.id).ten + ' hoàn thành cấp ' + m.lv + '.');
      if (p.qB.length) p.qB[0].xong = t + p.qB[0].tg;
    }
  }
  /* nghiên cứu */
  if (st.ncQueue && !st.ncQueue.treo && st.ncQueue.conLai <= 0) {
    var q2 = st.ncQueue;
    st.tech[q2.id] = q2.lv;
    var thuong = Math.round(G.giaTriDiem(q2.cost) * 12);
    st.techPts += thuong;
    G.tin(st, 'nc', 'Nghiên cứu hoàn thành', G.R(q2.id).ten + ' đã đạt cấp ' + q2.lv +
      '.\nThu được ' + G.so(thuong) + ' điểm Công Nghệ.' +
      (q2.vonConLai > 0 ? '\nVốn đầu tư còn lại ' + G.so(q2.vonConLai) + ' Galana được hoàn về ngân khố.' : ''));
    if (q2.vonConLai > 0) st.galana += q2.vonConLai;
    st.ncQueue = null;
  }
  /* hạm đội */
  for (i = st.fleets.length - 1; i >= 0; i--) {
    var f = st.fleets[i];
    if (f.pha === 'di' && f.den_t <= t) G.hamToiDich(st, f);
    else if (f.pha === 've' && f.ve_t <= t) G.hamVeNha(st, f);
  }
  /* tên lửa tới đích */
  if (st.tenLua) for (i = st.tenLua.length - 1; i >= 0; i--) {
    if (st.tenLua[i].khi <= t) { var tl = st.tenLua.splice(i, 1)[0]; G.tenLuaToiDich(st, tl); }
  }
  /* địch tới */
  for (i = st.toi.length - 1; i >= 0; i--) if (st.toi[i].den_t <= t) G.dichToi(st, st.toi[i]);
  /* bảo trì & đợt đánh */
  if (st.nextMaint <= t) G.baoTri(st);
  if (st.nextRaid <= t) G.hepRaid(st);
};

/* =======================================================================
 * TÊN LỬA LIÊN HÀNH TINH
 * Không phải hạm đội: bắn thẳng, không quay về, chỉ phá phòng thủ MẶT ĐẤT.
 * Bên bị bắn dùng Tên Lửa Đánh Chặn để hạ 1 đổi 1.
 * ===================================================================== */
G.tamTenLua = function (st) {
  var c = (st.tech.impulse || 0) * 5 - 1;
  return c > 0 ? c : 0;
};
G.tgTenLua = function (soHe) {
  return Math.max(20, Math.round(Math.max(1, soHe) * G.C.TOC_TEN_LUA / G.C.TOC_DO_BAY));
};

G.banTenLua = function (st, pi, den, n) {
  var p = st.planets[pi];
  if (!p) return 'Hành tinh không tồn tại.';
  n = Math.max(0, Math.floor(n || 0));
  if (!n) return 'Chưa chọn số tên lửa.';
  if ((p.mis.icbm || 0) < n) return 'Chỉ có ' + G.so(p.mis.icbm || 0) + ' Tên Lửa Liên Hành Tinh.';
  if (den.g !== p.c.g) return 'Tên lửa chỉ bay được trong cùng thiên hà.';
  if (G.bang(den, p.c)) return 'Không bắn vào chính hành tinh của mình.';
  var tam = G.tamTenLua(st);
  if (!tam) return 'Cần Động Cơ Xung cấp 1 trở lên mới có tầm bắn.';
  var soHe = Math.abs(den.h - p.c.h);
  if (soHe > tam) return 'Ngoài tầm: xa ' + soHe + ' hệ, tầm bắn hiện tại ' + tam + ' hệ (nâng Động Cơ Xung).';
  if (st.noBaoTri > 0) return 'Đang nợ phí bảo trì: hầm tên lửa bị niêm phong.';

  p.mis.icbm -= n;
  if (!p.mis.icbm) delete p.mis.icbm;
  if (!st.tenLua) st.tenLua = [];
  var tl = {
    id: st.fleetIdSeq++, pi: pi, tu: { g: p.c.g, h: p.c.h, p: p.c.p },
    den: { g: den.g, h: den.h, p: den.p }, n: n, khi: st.now + G.tgTenLua(soHe)
  };
  st.tenLua.push(tl);
  G.ghi(st, 'Phóng ' + n + ' Tên Lửa Liên Hành Tinh từ ' + G.tdStr(p.c) + ' → ' + G.tdStr(den) +
    ', tới sau ' + G.tg(tl.khi - st.now) + '.');
  return null;
};

/* Tính kết quả một loạt tên lửa lên phòng thủ mặt đất */
G.noTenLua = function (soBan, def, soChan, techBan, techThu, seed) {
  var rnd = G.rng(seed || 1);
  var chan = Math.min(soBan, Math.max(0, Math.floor(soChan || 0)));
  var con = soBan - chan;
  var dmg = con * G.C.SAT_THUONG_ICBM * (1 + 0.1 * ((techBan || {}).weapon || 0));
  var giapThu = 1 + 0.1 * ((techThu || {}).armor || 0);
  var ds = [], k;
  for (k in def) {
    var u = G.D(k);
    if (!u || u.lop !== 'dat' || !def[k]) continue;
    ds.push({ id: k, vo: u.hull * giapThu, n: def[k] });
  }
  ds.sort(function (a, b) { return a.vo - b.vo; });          /* phá cái yếu trước */
  var pha = {};
  for (var i = 0; i < ds.length && dmg > 0; i++) {
    var so = Math.min(ds[i].n, Math.floor(dmg / ds[i].vo));
    if (so > 0) { pha[ds[i].id] = so; dmg -= so * ds[i].vo; def[ds[i].id] -= so; if (!def[ds[i].id]) delete def[ds[i].id]; }
  }
  void rnd;
  return { chan: chan, no: con, pha: pha, duSatThuong: Math.round(dmg) };
};

G.moTaPha = function (o) {
  var ra = [];
  for (var k in o) if (o[k]) { var u = G.UNIT(k); ra.push((u ? u.ten : k) + ' ×' + G.so(o[k])); }
  return ra.length ? ra.join(', ') : 'không phá được gì';
};

G.tenLuaToiDich = function (st, tl) {
  var o = G.oHanhTinh(st, tl.den);

  if (o.loai === 'nguoi' && G.HOOK && G.HOOK.tenLuaNguoi) { G.HOOK.tenLuaNguoi(st, tl, o); return; }

  if (o.loai === 'trong') {
    G.tin(st, 'he', 'Tên lửa bắn trượt', G.tdStr(tl.den) + ' là ô trống — ' + tl.n + ' quả tên lửa nổ trong chân không.');
    return;
  }
  if (o.loai === 'toi') return;

  var n = o.npc;
  /* NPC cũng có tên lửa đánh chặn, tỷ lệ theo quy mô [SUY LUẬN] */
  var soChan = n.bo ? 0 : Math.floor(n.diem / 2500);
  var kq = G.noTenLua(tl.n, n.def, soChan, st.tech, n.tech, G.hash('tl' + tl.id + st.now));
  G.tin(st, 'tran', 'Kết quả bắn tên lửa ' + G.tdStr(tl.den), null, { tl: kq, soBan: tl.n, td: tl.den, ten: n.ten, ben: 'ta' });
  if (!st.hanThu) st.hanThu = [];
  if (st.hanThu.indexOf(o.key) < 0) st.hanThu.push(o.key);
};

/* =======================================================================
 * THÁM HIỂM VÙNG KHÔNG GIAN SÂU (ô 16)
 * Bay ra rìa hệ tìm vận may: tài nguyên, tàu trôi dạt, Galana — hoặc gặp
 * sinh vật ngoài hành tinh, lạc trong không gian, mất tàu vì thiên thạch.
 * [SUY LUẬN] — thể loại này game nào cũng có, bản gốc không còn tư liệu.
 * ===================================================================== */
G.kheThamHiem = function (st) { return 1 + Math.floor((st.tech.astro || 0) / 4); };
G.dangThamHiem = function (st) {
  var n = 0;
  for (var i = 0; i < st.fleets.length; i++) if (st.fleets[i].mission === 'thamhiem') n++;
  return n;
};

G.thamHiem = function (st, f) {
  var r = G.rng(G.hash('th' + f.id + ':' + st.now + ':' + G.tdKey(f.den)));
  var diem = G.diem(st).tong;
  var suc = G.khoangHang(f.ships);
  var tran = Math.min(suc, 3000 + Math.round(diem * 8));
  var lan = r();
  var noi = '', loai = 'trong';

  var veNha = function (heSo) {
    f.pha = 've';
    var tg = G.tgBay(st, f.ships, G.khoangCach(f.den, f.tu), f.pct);
    f.ve_t = st.now + Math.round(tg * (heSo || 1));
  };

  if (lan < 0.30) {                                   /* tài nguyên trôi nổi */
    loai = 'res';
    var lay = Math.round(tran * (0.35 + r() * 0.65));
    var chia = { metal: Math.round(lay * 0.5), crystal: Math.round(lay * 0.33), deut: Math.round(lay * 0.17) };
    var k;
    for (k in chia) if (chia[k] > 0) f.cargo[k] = (f.cargo[k] || 0) + chia[k];
    noi = 'Tìm thấy một đám mây vật chất chưa ai khai thác:\n' +
      '  Kim Loại: ' + G.so(chia.metal) + '\n  Tinh Thể: ' + G.so(chia.crystal) + '\n  Deuterium: ' + G.so(chia.deut);
    veNha(); 
  } else if (lan < 0.42) {                            /* tàu trôi dạt */
    loai = 'tau';
    var duocPhep = [];
    for (var i = 0; i < G.SHIPS.length; i++) {
      var s = G.SHIPS[i];
      if (s.id === 'fortress' || s.id === 'colony') continue;
      if (G.thoaDK(st, st.planets[f.pi] || st.planets[0], s)) duocPhep.push(s);
    }
    if (!duocPhep.length) { noi = 'Gặp một xác tàu cổ nhưng công nghệ của ta chưa đủ để phục hồi thứ gì.'; veNha(); }
    else {
      var chon = duocPhep[Math.floor(r() * duocPhep.length)];
      var giaTri = (chon.cost.metal || 0) + (chon.cost.crystal || 0) + (chon.cost.deut || 0);
      var soTau = Math.max(1, Math.floor(tran * (0.3 + r() * 0.5) / Math.max(1, giaTri)));
      f.ships[chon.id] = (f.ships[chon.id] || 0) + soTau;
      noi = 'Tìm thấy một hạm đội bỏ hoang còn dùng được. Đội sửa chữa kéo về ' +
        G.so(soTau) + ' ' + chon.ten + '.';
      veNha();
    }
  } else if (lan < 0.52) {                            /* Galana */
    loai = 'galana';
    var gl = Math.round((200 + diem * 0.6) * (0.5 + r()));
    st.galana += gl;
    noi = 'Bắt được tín hiệu của một trạm giao dịch bỏ hoang. Bán lại số hàng còn trong kho được ' +
      G.so(gl) + ' Galana.';
    veNha();
  } else if (lan < 0.66) {                            /* sinh vật ngoài hành tinh */
    loai = 'quai';
    var lucTa = 0, kk;
    for (kk in f.ships) lucTa += G.giaTriDiem(G.S(kk).cost, f.ships[kk]);
    var rq = G.rng(G.hash('quai' + f.id + st.now));
    var quai = G.npcHam(Math.max(60, lucTa * (0.35 + rq() * 0.75)), Math.min(1, diem / 40000), rq);
    var kq = G.danhTran(
      { ten: st.ten, tech: st.tech, ships: f.ships },
      { ten: 'Sinh vật ngoài hành tinh', tech: { weapon: 4, shield: 4, armor: 4 }, ships: quai, def: {} },
      G.hash('thq' + f.id + st.now));
    f.ships = kq.conShipsA;
    var matT = 0, matQ = 0;
    for (kk in kq.matA) matT += kq.matA[kk];
    for (kk in kq.matD) matQ += kq.matD[kk];
    st.stats.tauMat += matT; st.stats.tauDietDich += matQ;
    G.tin(st, 'tran', 'Chạm trán ở vùng không gian sâu ' + G.tdStr(f.den), null,
      { kq: kq, cuop: { metal: 0, crystal: 0, deut: 0, food: 0 }, pl: { metal: 0, crystal: 0 }, td: f.den, ben: 'ta' });
    if (G.trong(f.ships)) {
      G.tin(st, 'he', 'Mất trắng đoàn thám hiểm',
        'Hạm đội thám hiểm ở ' + G.tdStr(f.den) + ' bị sinh vật ngoài hành tinh xoá sổ hoàn toàn.');
      G.xoaHam(st, f);
      return;
    }
    noi = 'Đụng độ một bầy sinh vật ngoài hành tinh. Ta mất ' + G.so(matT) + ' tàu, diệt ' + G.so(matQ) +
      ' con. Xem chiến báo để biết chi tiết.';
    veNha();
  } else if (lan < 0.76) {                            /* lạc trong không gian */
    loai = 'lac';
    var he = 2 + Math.round(r() * 2);
    noi = 'Máy tính dẫn đường tính sai một hằng số hấp dẫn. Hạm đội lạc ra ngoài rìa hệ và mất gấp ' +
      he + ' lần thời gian để mò đường về.';
    veNha(he);
  } else if (lan < 0.84) {                            /* thiên thạch */
    loai = 'mat';
    var kkk, matTh = {};
    for (kkk in f.ships) {
      var mat = Math.floor(f.ships[kkk] * (0.05 + r() * 0.2));
      if (mat > 0) { matTh[kkk] = mat; f.ships[kkk] -= mat; if (!f.ships[kkk]) delete f.ships[kkk]; }
    }
    if (G.trong(f.ships)) {
      G.tin(st, 'he', 'Mất trắng đoàn thám hiểm', 'Cả hạm đội thám hiểm tan trong một trận mưa thiên thạch tại ' + G.tdStr(f.den) + '.');
      G.xoaHam(st, f);
      return;
    }
    noi = G.trong(matTh) ? 'Bay xuyên một vành đai thiên thạch, may là không mất tàu nào.'
      : 'Bay xuyên một vành đai thiên thạch, mất: ' + G.moTaPha(matTh) + '.';
    veNha();
  } else {                                            /* không thấy gì */
    loai = 'trong';
    var cau = [
      'Quét sạch cả vùng, không có gì ngoài bụi và bức xạ nền.',
      'Bắt được một tín hiệu lạ, đuổi theo ba tiếng đồng hồ thì nó tắt.',
      'Vùng này đã có người tới trước — chỉ còn lại vết đốt động cơ đã nguội.'
    ];
    noi = cau[Math.floor(r() * cau.length)];
    veNha();
  }

  st.stats.thamHiem = (st.stats.thamHiem || 0) + 1;
  if (loai !== 'quai' || noi) {
    G.tin(st, 'ham', 'Nhật ký thám hiểm ' + G.tdStr(f.den), noi);
  }
};

/* =======================================================================
 * ĐỔ BỘ — cơ chế đặc trưng nhất của bản gốc
 * Quỹ đạo vỡ rồi thì Đại Chiến Hạm mới thả Robot/Tank xuống. Thắng trận
 * dưới mặt đất thì PHÁ CÔNG TRÌNH của đối phương (trận Start War III:
 * "phá hủy toàn bộ những công trình… chỉ chừa lại đúng 1.000 Nhà Máy Tàu Bay").
 * ===================================================================== */
G.sucChoLinh = function (ships) {
  var t = 0;
  for (var id in ships) { var s = G.S(id); if (s && s.choLinh) t += s.choLinh * ships[id]; }
  return t;
};
G.choLinhCan = function (linh) {
  var t = 0;
  for (var id in linh) { var b = G.BB(id); if (b) t += b.cho * linh[id]; }
  return t;
};
G.sucPhaCT = function (linh) {
  var t = 0;
  for (var id in linh) { var b = G.BB(id); if (b) t += (b.atk + b.hull * 0.05) * linh[id]; }
  return t;
};

/* Phá công trình bằng sức đổ bộ còn lại. Phá từ công trình ĐẮT nhất xuống,
 * và không bao giờ phá quá G.C.PHA_CT_TOI_DA phần tổng số cấp trong một trận. */
G.phaCongTrinh = function (st, p, suc) {
  var tongCap = G.tongCapCT(p);
  var conPha = Math.max(1, Math.floor(tongCap * G.C.PHA_CT_TOI_DA));
  var pha = {}, soPha = 0;
  var guard = 0;
  while (suc > 0 && soPha < conPha && guard++ < 500) {
    /* tìm cấp đắt nhất còn đứng */
    var chon = null, giaChon = -1;
    for (var k in p.b) {
      if (!p.b[k]) continue;
      var gia = G.giaTriDiem(G.giaXay(G.B(k), p.b[k])) * 1000;
      if (gia > giaChon) { giaChon = gia; chon = k; }
    }
    if (!chon) break;
    var canSuc = giaChon * G.C.SUC_PHA_MOI_TAI_NGUYEN;
    if (suc < canSuc) break;
    suc -= canSuc;
    p.b[chon]--;
    if (!p.b[chon]) delete p.b[chon];
    pha[chon] = (pha[chon] || 0) + 1;
    soPha++;
  }
  return { pha: pha, soCap: soPha, chamTran: soPha >= conPha };
};

G.moTaPhaCT = function (o) {
  var ra = [];
  for (var k in o) if (o[k]) ra.push(G.B(k).ten + ' −' + o[k] + ' cấp');
  return ra.length ? ra.join(', ') : 'không phá được cấp công trình nào';
};

/* Chạy pha đổ bộ. Trả về mô tả kết quả (hoặc null nếu không có quân đổ bộ). */
/* tách phần phòng thủ MẶT ĐẤT ra khỏi bảng phòng thủ chung */
G.thuMatDat = function (def) {
  var ra = {};
  for (var k in def) { var d = G.D(k); if (d && d.lop === 'dat' && def[k] > 0) ra[k] = def[k]; }
  return ra;
};
G.gopThuMatDat = function (def, con) {
  for (var k in def) { var d = G.D(k); if (d && d.lop === 'dat') delete def[k]; }
  G.cong(def, con);
};

G.doBoXuong = function (st, f, ben) {
  if (!f.linh || G.trong(f.linh)) return null;
  var kq = G.danhTran(
    { ten: st.ten + ' (quân đổ bộ)', tech: st.tech, bo: f.linh, doBo: true },
    { ten: ben.ten, tech: ben.tech || {}, bo: ben.linh || {}, def: ben.def || {}, thuDat: ben.thuDat || 1 },
    G.hash('dobo' + f.id + ':' + st.now));
  f.linh = kq.conBoA;
  if (ben.linh) { for (var k in ben.linh) delete ben.linh[k]; G.cong(ben.linh, kq.conBoD); }
  if (ben.def) { for (var k2 in ben.def) delete ben.def[k2]; G.cong(ben.def, kq.conDefD); }
  var thang = kq.kq === 'thang';
  var phaCT = null;
  if (thang && ben.p) phaCT = G.phaCongTrinh(st, ben.p, G.sucPhaCT(f.linh));
  return { kq: kq, thang: thang, phaCT: phaCT };
};

/* ===== js/actions.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — bảng hành động dùng chung
 * Đây là NƠI DUY NHẤT các hành động của người chơi được thực thi.
 *   - Chế độ một người: client gọi trực tiếp trên state trong máy.
 *   - Chế độ nhiều người: server gọi trên state trong database (client chỉ gửi
 *     yêu cầu). Vì vậy mọi kiểm tra ở đây phải coi dữ liệu vào là KHÔNG TIN ĐƯỢC.
 * Mỗi hành động trả về null nếu xong, hoặc chuỗi mô tả lỗi.               */
'use strict';
var G = window.G = window.G || {};

function ht(st, pi) {
  pi = Math.floor(+pi || 0);
  if (pi < 0 || pi >= st.planets.length) return null;
  return st.planets[pi];
}
function soDuong(v, toiDa) {
  v = Math.floor(+v || 0);
  if (!isFinite(v) || v <= 0) return 0;
  return toiDa !== undefined ? Math.min(v, toiDa) : v;
}
function chuoi(v, dai) { return String(v === undefined || v === null ? '' : v).slice(0, dai || 40); }

G.HANHDONG = {
  /* --- xây dựng --- */
  xay: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    if (!G.B(chuoi(d.id, 30))) return 'Không có công trình này.';
    return G.xepXay(st, p, d.id);
  },
  huyxay: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var i = Math.floor(+d.i);
    if (!(i >= 0 && i < p.qB.length)) return 'Mục hàng đợi không tồn tại.';
    G.huyXay(st, p, i); return null;
  },

  /* --- nghiên cứu --- */
  nc: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    if (!G.R(chuoi(d.id, 30))) return 'Không có đề tài này.';
    return G.xepNC(st, p, d.id);
  },
  huync: function (st) {
    if (!st.ncQueue) return 'Không có đề tài nào đang chạy.';
    G.huyNC(st); return null;
  },

  /* --- đóng tàu / phòng thủ / tên lửa --- */
  dong: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var id = chuoi(d.id, 30);
    if (!(G.S(id) || G.D(id) || G.M(id) || G.BB(id))) return 'Không có đơn vị này.';
    var n = soDuong(d.n, 100000);
    if (!n) return 'Số lượng không hợp lệ.';
    return G.xepTau(st, p, id, n);
  },
  huydong: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var i = Math.floor(+d.i);
    if (!(i >= 0 && i < p.qS.length)) return 'Mục hàng đợi không tồn tại.';
    G.huyDong(st, p, i); return null;
  },

  /* --- chợ Thiên Hà --- */
  ban: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var r = chuoi(d.res, 10);
    if (!G.C.TY_GIA[r]) return 'Không bán được loại này.';
    var n = soDuong(d.n);
    if (!n) return 'Nhập số lượng cần bán.';
    if ((p.res[r] || 0) < n) return 'Không đủ ' + G.byId(G.RES, r).ten + '.';
    var g = Math.floor(n / G.C.TY_GIA[r]);
    if (g <= 0) return 'Lượng quá nhỏ, không đủ 1 Galana.';
    p.res[r] -= n; st.galana += g;
    G.ghi(st, 'Bán ' + G.so(n) + ' ' + G.byId(G.RES, r).ten + ' lấy ' + G.so(g) + ' Galana.');
    return null;
  },
  mua: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var r = chuoi(d.res, 10);
    if (!G.C.TY_GIA[r]) return 'Không mua được loại này.';
    var n = soDuong(d.n);
    if (!n) return 'Nhập số lượng cần mua.';
    var g = Math.ceil(n / G.C.TY_GIA[r] * G.C.HE_SO_MUA);
    if (st.galana < g) return 'Cần ' + G.so(g) + ' Galana.';
    st.galana -= g; p.res[r] = (p.res[r] || 0) + n;
    G.ghi(st, 'Mua ' + G.so(n) + ' ' + G.byId(G.RES, r).ten + ' hết ' + G.so(g) + ' Galana.');
    return null;
  },

  /* --- hạm đội --- */
  gui: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var den = G.tdParse((d.den || {}).g + ':' + (d.den || {}).h + ':' + (d.den || {}).p);
    if (!den) return 'Toạ độ mục tiêu không hợp lệ.';
    if (!G.byId(G.MISSIONS, chuoi(d.mission, 20))) return 'Nhiệm vụ không hợp lệ.';
    var ships = {}, cargo = {}, linh = {}, k;
    for (k in (d.ships || {})) if (G.S(k)) { var n = soDuong(d.ships[k]); if (n) ships[k] = n; }
    for (k in (d.linh || {})) if (G.BB(k)) { var nb = soDuong(d.linh[k]); if (nb) linh[k] = nb; }
    for (k in (d.cargo || {})) if (G.RES_HANH_TINH.indexOf(k) >= 0) { var v = soDuong(d.cargo[k]); if (v) cargo[k] = v; }
    var pct = Math.max(10, Math.min(100, Math.round((+d.pct || 100) / 10) * 10));
    var giu = Math.max(1, Math.min(24, Math.floor(+d.giu || 1)));
    return G.guiHam(st, st.planets.indexOf(p), ships, den, d.mission, cargo, pct, giu, linh);
  },
  goive: function (st, d) { return G.goiVe(st, Math.floor(+d.fid)); },
  banTenLua: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var den = G.tdParse((d.den || {}).g + ':' + (d.den || {}).h + ':' + (d.den || {}).p);
    if (!den) return 'Toạ độ mục tiêu không hợp lệ.';
    return G.banTenLua(st, st.planets.indexOf(p), den, soDuong(d.n, 100000));
  },
  doihuong: function (st, d) {
    var den = G.tdParse((d.den || {}).g + ':' + (d.den || {}).h + ':' + (d.den || {}).p);
    if (!den) return 'Toạ độ không hợp lệ.';
    return G.doiMucTieu(st, Math.floor(+d.fid), den);
  },

  /* --- liên minh --- */
  lmvao: function (st, d) {
    var ten = chuoi(d.ten, 40);
    if (!ten) return 'Thiếu tên liên minh.';
    if (st.lm) return 'Đang ở trong một liên minh khác.';
    if (!G.HOOK && G.LIEN_MINH.indexOf(ten) < 0) return 'Không có liên minh này.';
    st.lm = { ten: ten, t: st.now };
    G.tin(st, 'he', 'Đã gia nhập liên minh', 'Ta chính thức là thành viên của ' + ten + '. Sản lượng toàn đế quốc +5%.');
    return null;
  },
  lmra: function (st) {
    if (!st.lm) return 'Chưa ở trong liên minh nào.';
    G.ghi(st, 'Rời liên minh ' + st.lm.ten + '.');
    st.lm = null; return null;
  },

  /* --- tin nhắn & khác --- */
  doctin: function (st, d) {
    var i = Math.floor(+d.i);
    if (st.msgs[i]) st.msgs[i].doc = true;
    return null;
  },
  docHet: function (st) { for (var i = 0; i < st.msgs.length; i++) st.msgs[i].doc = true; return null; },
  xoatin: function (st) { st.msgs = []; return null; },
  boHoang: function (st, d) {
    if (chuoi(d.xacnhan, 10) !== 'BO') return 'Cần xác nhận trước khi bỏ hoang.';
    return G.boHoang(st, Math.floor(+d.pi));
  },
  doiTenHT: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var ten = chuoi(d.ten, 24).replace(/[<>&"]/g, '').trim();
    if (!ten) return 'Tên không hợp lệ.';
    p.ten = ten; return null;
  }
};

/* Chạy một hành động: tua thời gian trước, rồi thực thi. */
G.chay = function (st, ten, dl) {
  var f = G.HANHDONG[ten];
  if (!f) return 'Hành động không tồn tại.';
  G.tick(st, G.giay());
  return f(st, dl || {}) || null;
};

/* ===== js/ui.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — giao diện */
'use strict';
var G = window.G, U = window.U = {}, APP = window.APP = window.APP || {};

U.man = 'tongquan';
U.pi = 0;
U.gal = null;
U.form = null;
U.moTin = {};
U.cho = {};        // số lượng đang gõ ở Chợ Thiên Hà, giữ qua các lần vẽ lại
U.sigCu = '';

U.esc = function (s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
U.st = function () { return window.ST; };
U.ht = function () { var st = U.st(); if (U.pi >= st.planets.length) U.pi = 0; return st.planets[U.pi]; };

U.toast = function (s, loai) {
  var d = document.createElement('div');
  d.className = 't' + (loai ? ' ' + loai : '');
  d.innerHTML = U.esc(s);
  document.getElementById('toast').appendChild(d);
  setTimeout(function () { d.style.opacity = 0; setTimeout(function () { d.remove(); }, 250); }, 3600);
};
U.hop = function (td, html) {
  document.getElementById('ht-td').textContent = td;
  document.getElementById('ht-noi').innerHTML = html;
  document.getElementById('hop-thoai').style.display = 'flex';
};
U.dongHop = function () { document.getElementById('hop-thoai').style.display = 'none'; };

/* ======================================================================
 * TIỆN ÍCH HIỂN THỊ
 * ==================================================================== */
U.dem = function (ts, hau) {
  return '<span class="dem sz" data-t="' + Math.round(ts) + '">' + G.tg(ts - U.st().now) + '</span>' + (hau || '');
};
U.gia = function (cost, p, st) {
  var out = [], k;
  for (k in cost) {
    if (!cost[k]) continue;
    var r = G.byId(G.RES, k);
    var co = (k === 'galana') ? st.galana : (k === 'tech' ? st.techPts : (p.res[k] || 0));
    var thieu = co < cost[k];
    out.push('<span class="' + (thieu ? 'thieu' : '') + '" style="color:' + (thieu ? '' : r.mau) + '">' +
      r.ten + ': ' + G.so(cost[k]) + '</span>');
  }
  return out.join(' &middot; ');
};
U.dsRes = function (o, chiSo) {
  var out = [], k;
  for (k in o) {
    if (!o[k]) continue;
    var r = G.byId(G.RES, k);
    if (!r) continue;
    out.push('<span style="color:' + r.mau + '">' + (chiSo ? '' : r.ten + ' ') + G.so(o[k]) + '</span>');
  }
  return out.length ? out.join(' &middot; ') : '<span class="mo">—</span>';
};
U.htTheoKey = function (key) {
  var st = U.st();
  for (var i = 0; i < st.planets.length; i++) if (G.tdKey(st.planets[i].c) === key) return st.planets[i];
  return null;
};
U.dsTau = function (o) {
  var out = [], k;
  for (k in o) if (o[k]) { var u = G.UNIT(k); out.push(U.esc(u ? u.ten : k) + ' <b>×' + G.so(o[k]) + '</b>'); }
  return out.length ? out.join(', ') : '<span class="mo">không có</span>';
};

/* ======================================================================
 * KHUNG: thanh trên, menu, cảnh báo

U.thanhRes = function () {
  var st = U.st(), p = U.ht(), s = G.sanLuong(st, p), cap = G.dungTich(p);

  for (var i = 0; i < G.RES_HANH_TINH.length; i++) {
    var id = G.RES_HANH_TINH[i], r = G.byId(G.RES, id);

    h += '<div class="o"><span class="n">' + r.ten + '</span>' +
      '<span class="v sz" style="color:' + mau + '" data-live="res.' + id + '">' + G.soNgan(v) + '</span>' +
      '<span class="r sz" data-live="rate.' + id + '">' + (s.r[id] >= 0 ? '+' : '') + G.soNgan(s.r[id]) + '/g</span></div>';
  }
  h += '<div class="o"><span class="n">Galana</span><span class="v sz" style="color:' + G.byId(G.RES, 'galana').mau +
    '" data-live="galana">' + G.soNgan(st.galana) + '</span><span class="r sz" data-live="rate.galana">+' + G.soNgan(s.r.galana) + '/g</span></div>';
  h += '<div class="o"><span class="n">Công Nghệ</span><span class="v sz" style="color:' + G.byId(G.RES, 'tech').mau +
    '" data-live="tech">' + G.soNgan(st.techPts) + '</span><span class="r sz" data-live="rate.tech">+' + G.soNgan(s.r.tech) + '/g</span></div>';
  h += '<div class="o"><span class="n">Điện</span><span class="v sz" style="color:' + (s.hs < 1 ? 'var(--do)' : 'var(--luc)') + '">' +
    G.so(s.dienCo) + ' / ' + G.so(s.dienDung) + '</span><span class="r">hiệu suất ' + Math.round(s.hs * 100) + '%</span></div>';
  h += '<div class="o"><span class="n">Bảo trì sau</span><span class="v sz">' + U.dem(st.nextMaint) +
    '</span><span class="r">chu kỳ #' + (st.soChuKy + 1) + '</span></div>';
  return h;
};

    ' <span class="mo">(thám hiểm ' + G.dangThamHiem(st) + '/' + G.kheThamHiem(st) + ')</span></div>';

  h += '<div class="luoi2">';
  h += '<div class="panel"><h3>Đang xây trên hành tinh</h3><div class="noi">';

  else {
    h += '<table><tr><th>Công trình</th><th>Cấp</th><th>Xong sau</th><th></th></tr>';
    for (var i = 0; i < p.qB.length; i++) {
      var q = p.qB[i];
      h += '<tr><td>' + U.esc(G.B(q.id).ten) + '</td><td class="c">' + q.lv + '</td><td class="sz">' +
        (q.xong ? U.dem(q.xong) : '<span class="mo">chờ</span>') + '</td>' +
        '<td class="r"><button class="nut nho xoa" data-act="huyxay" data-i="' + i + '">Huỷ</button></td></tr>';

  else {
    h += '<table><tr><th>Đơn vị</th><th class="r">Còn lại</th><th>Chiếc tới</th><th></th></tr>';
    for (var j = 0; j < p.qS.length; j++) {
      var q2 = p.qS[j], u = G.UNIT(q2.id) || G.M(q2.id);
      h += '<tr><td>' + U.esc(u.ten) + '</td><td class="r sz">' + G.so(q2.n) + '</td><td class="sz">' +
        (j === 0 ? U.dem(st.now + q2.tLeft) : '<span class="mo">chờ</span>') + '</td>' +
        '<td class="r"><button class="nut nho xoa" data-act="huydong" data-i="' + j + '">Huỷ</button></td></tr>';

    h += '</table>';

  h += '<div class="panel"><h3>Phòng nghiên cứu</h3><div class="noi">';
  if (!st.ncQueue) h += '<span class="mo">Không có đề tài nào đang chạy.</span>';

      G.so(q3.vonMoiKy) + '/chu kỳ)</span>';

  else {

        G.tdStr(f.pha === 've' ? f.tu : f.den) + '</td><td class="sz">' +
        U.dem(f.pha === 've' ? f.ve_t : f.den_t) + '</td></tr>';
    }
    h += '</table></div>';
  }
  h += '</div></div>';
  h += '</div>';

  /* tin mới nhất */
  h += '<div class="panel"><h3>Tin mới nhất</h3><div class="noi">';
  if (!st.msgs.length) h += '<span class="mo">Chưa có tin.</span>';
  else for (var m = 0; m < Math.min(4, st.msgs.length); m++)
    h += '<div><span class="hu">' + G.gio(st.msgs[m].t * 1000) + '</span> ' + U.esc(st.msgs[m].td) + '</div>';
  h += '</div></div>';
  return h;
};

    G.so(st.galana) + '</td><td class="r mo">không giới hạn</td><td class="r sz">+' + G.so(s.r.galana) +
    '</td><td class="r sz">+' + G.so(s.r.galana * 6) + '</td><td class="mo">—</td></tr>';

    ['oDat', 'kl', 'tt', 'dt', 'lt', 'dien', 'thuDat'].map(function (k) {

  h += '<div class="luoi2">';

  var soThu = 0; for (var kk in p.def) soThu += p.def[kk];

/* ======================================================================
 * MÀN: CÔNG TRÌNH / NGHIÊN CỨU / XƯỞNG / PHÒNG THỦ
 * ==================================================================== */
U.theCT = function (st, p, b) {
  var lv = p.b[b.id] || 0, dangXay = G.capDangXay(p, b.id);
  var lvTiep = lv + dangXay + 1;
  var cost = G.giaXay(b, lvTiep);
  var thieuDK = G.thieuDK(st, p, b);
  var du = G.duTien(st, p, cost);
  var tg = G.tgXay(st, p, cost);
  var s = G.sanLuong(st, p);

  var h = '<div class="the' + (thieuDK.length ? ' tat' : '') + '">';
  h += '<span class="cap">cấp ' + lv + (dangXay ? ' (+' + dangXay + ')' : '') + '</span>';
  h += '<h4>' + U.esc(b.ten) + '</h4>';
  h += '<div class="mt">' + U.esc(b.mota) + '</div>';

  /* hiệu quả cấp tiếp theo */
  var ctx = { temp: p.temp, tech: st.tech };

/* ======================================================================

U.m_thienha = function () {
  var st = U.st(), p = U.ht();
  if (!U.gal) U.gal = { g: p.c.g, h: p.c.h };
  var g = U.gal.g, hh = U.gal.h;
  var ds = U.nguon.xemHe(g, hh);
  var d = G.diem(st);

  var h = '<div class="panel"><h3>Bản đồ thiên hà</h3><div class="noi">';
  h += '<div class="gal-dh">' +
    '<button class="nut nho" data-act="gal" data-dg="-1">◀ Thiên hà</button>' +
    'Thiên hà <input id="g-g" type="number" min="1" max="' + G.C.SO_THIEN_HA + '" value="' + g + '" style="width:60px">' +
    '<button class="nut nho" data-act="gal" data-dg="1">▶</button>' +
    '<button class="nut nho" data-act="gal" data-dh="-1">◀ Hệ</button>' +
    'Hệ <input id="g-h" type="number" min="1" max="' + G.C.SO_HE + '" value="' + hh + '" style="width:76px">' +
    '<button class="nut nho" data-act="gal" data-dh="1">▶</button>' +
    '<button class="nut nho oke" data-act="gal-di">Đi</button>' +
    '<button class="nut nho" data-act="gal-nha">Về hành tinh mẹ</button>' +
    '</div>';
  h += '<div class="bang-cuon"><table><tr><th>Ô</th><th>Hành tinh</th><th>Chỉ huy</th><th>Liên minh</th>' +
    '<th class="r">Điểm</th><th>Phế liệu</th><th>Hành động</th></tr>';
  for (var i = 0; i < ds.length; i++) {
    var o = ds[i], c = o.c;
    var cls = '';
    if (o.loai === 'trong' || o.loai === 'sau') cls = 'trong';
    else if (o.loai === 'toi') cls = 'toi';
    else if (o.loai === 'nguoi') cls = 'nguoi';
    else if (o.npc && o.npc.bo) cls = 'npc-bo';
    h += '<tr class="' + cls + '"><td class="sz">' + (o.loai === 'sau' ? '<span class="tim">' + c.p + '</span>' : c.p) + '</td>';
    if (o.loai === 'sau') {
      h += '<td class="tim">— vùng không gian sâu —</td><td class="mo">chỉ nhận nhiệm vụ Thám Hiểm</td><td></td><td class="r"></td>';
    } else if (o.loai === 'trong') {
      var Lt = G.LHT(G.loaiTheoViTri(st.seed, c));
      h += '<td class="mo">— trống — <span style="color:' + Lt.mau + '">' + U.esc(Lt.ten) + '</span></td><td></td><td></td><td class="r"></td>';
    } else if (o.loai === 'toi') {
      h += '<td><b>' + U.esc(o.p.ten) + '</b></td><td class="luc">' + U.esc(st.ten) + ' (ta)</td><td class="tag-lm">' +
        U.esc(st.lm ? st.lm.ten : '') + '</td><td class="r sz">' + G.so(d.tong) + '</td>';
    } else if (o.loai === 'nguoi') {
      h += '<td>' + U.esc(o.htTen) + '</td><td class="cam"><b>' + U.esc(o.ten) + '</b>' +
        (o.online ? ' <span class="luc" title="đang chơi">●</span>' : '') +
        (o.bo ? ' <span class="vang">(lâu không vào)</span>' : '') +
        '</td><td class="tag-lm">' + U.esc(o.lm || '') + '</td><td class="r sz">' + G.so(o.diem) + '</td>';
    } else {
      var n = o.npc;
      var Ln = G.LHT(G.loaiTheoViTri(st.seed, c));
      h += '<td>' + U.esc(n.htTen) + ' <span class="mo" style="color:' + Ln.mau + '">' + U.esc(Ln.ten) + '</span></td><td>' +
        U.esc(n.ten) + (n.bo ? ' <span class="vang">(bỏ hoang)</span>' : '') +
        '</td><td class="tag-lm">' + U.esc(n.lm) + '</td><td class="r sz">' + G.so(n.diem) + '</td>';
    }
    h += '<td class="pl">' + (o.debris ? G.soNgan(o.debris.metal) + ' KL / ' + G.soNgan(o.debris.crystal) + ' TT' : '') + '</td>';
    h += '<td style="white-space:nowrap">';
    var td = c.g + ',' + c.h + ',' + c.p;
    if (o.loai === 'npc' || o.loai === 'nguoi') {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="spy">Do thám</button> ' +
        '<button class="nut nho xoa" data-act="nv" data-td="' + td + '" data-m="attack">Tấn công</button> ';
      if (st.spy && st.spy[o.key]) h += '<button class="nut nho" data-act="xem-tt" data-key="' + o.key + '">Tin tình báo</button> ';
    } else if (o.loai === 'sau') {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="thamhiem">Thám hiểm</button> ';
    } else if (o.loai === 'trong') {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="colonize">Thực dân</button> ';
    } else {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="transport">Vận chuyển</button> ';
    }
    if (o.loai === 'nguoi') {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="transport">Tiếp tế</button> ';
      if (APP.mp) h += '<button class="nut nho" data-act="gui-thu" data-ten="' + U.esc(o.ten) + '">Gửi thư</button> ';
    }
    if (o.debris) h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="recycle">Thu hồi</button>';
    h += '</td></tr>';
  }
  h += '</table></div>';
  h += '<p class="mo">Vũ trụ có ' + G.C.SO_THIEN_HA + ' thiên hà × ' + G.C.SO_HE + ' hệ × ' + G.C.SO_HANH_TINH +
    ' hành tinh, sinh tất định từ hạt giống <b>' + U.esc(st.seed) + '</b>. ' +
    (APP.mp ? 'Ô màu <span class="cam">cam</span> là hành tinh của người chơi khác — đánh nhau với họ là thật, và họ đánh lại được. '
            : 'Hành tinh <span class="vang">bỏ hoang</span> ít phòng thủ nhưng nhiều tài nguyên.') + '</p>';
  h += '</div></div>';
  return h;
};

/* ======================================================================
 * MÀN: LIÊN MINH / XẾP HẠNG

U.m_lienminh = function () {
  var st = U.st();
  var h = '<div class="panel"><h3>Liên minh</h3><div class="noi">';
  if (st.lm) {
    h += '<h2>' + U.esc(st.lm.ten) + '</h2>';
    h += '<p>Gia nhập ngày ' + G.gio(st.lm.t * 1000) + '. Quyền lợi: <b>+5% sản lượng</b> toàn đế quốc, ' +
      'chia sẻ tin tình báo, và được đứng tên liên minh trên bảng xếp hạng.</p>';
    if (U.nguon.thanhVien) {
      var tv = U.nguon.thanhVien(st.lm.ten);
      if (tv && tv.length) {
        h += '<div class="bang-cuon"><table><tr><th>Thành viên</th><th class="r">Điểm</th><th class="r">Hành tinh</th></tr>';
        for (var t = 0; t < tv.length; t++)
          h += '<tr' + (tv[t].ta ? ' class="toi"' : '') + '><td>' + U.esc(tv[t].ten) + (tv[t].ta ? ' <b class="luc">(ta)</b>' : '') +
            '</td><td class="r sz">' + G.so(tv[t].diem) + '</td><td class="r sz">' + tv[t].ht + '</td></tr>';
        h += '</table></div>';
      }
    }
    h += '<button class="nut xoa" data-act="lm-ra" style="margin-top:8px">Rời liên minh</button>';
  } else {
    h += '<p class="mo">Bản gốc có hệ thống liên minh với bộ máy điều hành. Bản phục dựng giữ lại phần cốt: ' +
      'gia nhập một liên minh để nhận <b>+5% sản lượng</b> và danh nghĩa trên bảng xếp hạng.</p>';
    var ds = U.nguon.dsLM();
    h += '<div class="bang-cuon"><table><tr><th>Liên minh</th><th class="r">Thành viên</th><th class="r">Tổng điểm</th><th></th></tr>';
    for (var i = 0; i < ds.length; i++) {
      var e = ds[i];
      var sl = e.sl, dm = e.diem;
      if (sl === undefined) {
        sl = 0; dm = 0;
        var xh = U.nguon.xepHang();
        for (var j = 0; j < xh.length; j++) if (xh[j].lm === e.ten) { sl++; dm += xh[j].diem; }
      }
      h += '<tr><td class="tag-lm">' + U.esc(e.ten) + '</td><td class="r sz">' + G.so(sl) + '</td><td class="r sz">' + G.so(dm) +
        '</td><td class="r"><button class="nut nho oke" data-act="lm-vao" data-ten="' + U.esc(e.ten) + '">Xin vào</button></td></tr>';
    }
    h += '</table></div>';
  }
  h += '</div></div>';
  return h;
};

    '<i>Đài Chỉ Huy Hạm Đội</i>). Bảy nhiệm vụ: Tấn Công, Vận Chuyển, Triển Khai, Do Thám, Thực Dân, ' +
    'Thu Hồi, Giữ Chỗ.</p>' +
    '<p><b>Hạm đội đang bay thì không bao giờ bị bắn hạ.</b> Thấy báo động mà không đỡ nổi thì cho hạm đội ' +
    'bay đi — về sau quay lại vẫn còn nguyên.</p>' +

  h += '<div class="panel"><h3>' + (APP.mp ? 'Chơi với người thật' : 'Mở rộng đế quốc') + '</h3><div class="noi">';
  if (APP.mp) {
    h += '<p>Hành tinh <b class="cam">màu cam</b> trên bản đồ là người chơi thật. Đánh nhau với họ là thật: ' +

      '<p><b>Bảo vệ người chơi mới:</b> dưới ' + G.so(G.C.BAO_VE_MOI_DIEM) + ' điểm thì hai bên lệch nhau quá ' +
      G.C.BAO_VE_MOI_TY_LE + ' lần là không đánh được nhau.</p>' +
      '<p>Khi có người thật cho hạm đội tấn công tới, ta <b>được báo động trước</b> kèm đồng hồ đếm ngược — ' +
      'nhưng không thấy họ mang gì, muốn biết thì phải do thám ngược lại. Nhiệm vụ do thám của đối phương ' +
      'thì đi lén, không báo trước.</p>' +
      '<p>Vào <b>liên minh</b> để được +5% sản lượng, và dùng nhiệm vụ <b>Vận Chuyển</b> chở tài nguyên tiếp tế ' +

      '<p class="mo">Đế quốc của ta chạy trên máy chủ 24/7: thoát ra thì mỏ vẫn đào, bảo trì vẫn trừ tiền, ' +
      'và người khác vẫn đánh vào được.</p>';

    h += '<p>Nghiên cứu <b>Công Nghệ Liên Hành Tinh</b>: cứ 2 cấp cho phép giữ thêm một hành tinh. ' +

      'Hành tinh ở vị trí 4–12 thường nhiều ô đất và mát hơn; hành tinh xa mặt trời cho nhiều deuterium hơn.</p>' +
      '<p>Hành tinh <span class="vang">bỏ hoang</span> của NPC ít phòng thủ nhưng nhiều tài nguyên — đó là chỗ ' +
      'kiếm vốn tốt nhất lúc đầu.</p>' +
      '<p class="mo">Thời gian vẫn chạy khi ta đóng game: mở lại là toàn bộ sản xuất, chuyến bay và các chu kỳ ' +
      'bảo trì đã diễn ra được tua lại đúng thứ tự.</p>';
  }
  h += '</div></div></div>';

  h += '<div class="panel"><h3>Về bản phục dựng này</h3><div class="noi mo">' +
    '<p>Nguyên tác <b>Thiên Hà Đại Chiến</b> là webgame chiến thuật vũ trụ thuần text của <b>Trần Châu Quốc Bình</b> ' +
    'cùng nhóm 3 người, phát triển từ khoảng 2004, đoạt giải VietGames 2006 (VINASA), vận hành tại ' +
    'thienhadaichien.com tới đầu thập niên 2010.</p>' +
    '<p>Server gốc đã mất, nên bản này dựng lại từ tư liệu báo game và diễn đàn còn sót: các cơ chế đặc trưng ' +
    '(chu kỳ bảo trì 6 giờ, nghiên cứu trả góp, phòng thủ hai lớp, đổi mục tiêu giữa đường, 6 loại tài nguyên) ' +
    'là thật; mọi con số cân bằng là suy luận theo khung OGame.</p>' +
    '<p>Hành tinh hiện tại: <b>' + U.esc(p.ten) + '</b> ' + G.tdStr(p.c) + ' · nhiệt độ ' + p.temp + '°C · ' +
    G.oDaDung(p) + '/' + G.oToiDa(p) + ' ô đất.</p>' +
    '</div></div>';
  return h;
};

/* ======================================================================
 * VẼ & CẬP NHẬT
 * ==================================================================== */
U.sig = function () {
  var st = U.st(), s = [st.planets.length, st.msgs.length, st.fleets.length, st.toi.length, st.soChuKy,
    st.noBaoTri > 0 ? 1 : 0, U.man, U.pi, st.nk.length];
  for (var i = 0; i < st.planets.length; i++) {
    var p = st.planets[i];
    s.push(p.qB.length, p.qS.length, p.qS.length ? p.qS[0].n : 0, p.doi > 0 ? 1 : 0);
  }
  s.push(st.ncQueue ? st.ncQueue.id + (st.ncQueue.treo ? 'T' : '') : '-');
  for (var j = 0; j < st.fleets.length; j++) s.push(st.fleets[j].id + st.fleets[j].pha);
  return s.join('|');
};

U.ve = function () {
  var st = U.st();
  if (!st) return;
  document.getElementById('tt-res').innerHTML = U.thanhRes();
  U.veMenu(); U.veCanh(); U.veChonHT();
  var f = U['m_' + U.man] || U.m_tongquan;
  document.getElementById('noidung').innerHTML = f();
  document.getElementById('chan-tt').innerHTML =
    'Thiên Hà Đại Chiến — bản phục dựng ' + G.VERSION + ' · nguyên tác: Trần Châu Quốc Bình &amp; nhóm 3 người (2004–2013) · ' +
    'máy chủ tốc độ x' + G.C.TOC_DO_SERVER + ' · chu kỳ bảo trì 6 giờ';
  U.sigCu = U.sig();
};

U.live = function () {
  var st = U.st();
  if (!st) return;
  if (U.sig() !== U.sigCu) { U.ve(); return; }
  var p = U.ht(), s = G.sanLuong(st, p), i;
  var els = document.querySelectorAll('[data-live]');
  for (i = 0; i < els.length; i++) {
    var k = els[i].getAttribute('data-live'), v;
    if (k.indexOf('res.') === 0) v = G.soNgan(p.res[k.slice(4)] || 0);
    else if (k.indexOf('rate.') === 0) { var rk = k.slice(5); v = (s.r[rk] >= 0 ? '+' : '') + G.soNgan(s.r[rk]) + '/g'; }
    else if (k === 'galana') v = G.soNgan(st.galana);
    else if (k === 'tech') v = G.soNgan(st.techPts);
    if (v !== undefined && els[i].textContent !== v) els[i].textContent = v;
  }
  var ds = document.querySelectorAll('.dem');
  for (i = 0; i < ds.length; i++) {
    var t = +ds[i].getAttribute('data-t');
    ds[i].textContent = G.tg(t - st.now);
  }
};

/* ======================================================================
 * MÀN: MÁY TÍNH TRẬN ĐÁNH (mô phỏng trước khi xuất kích)
 * ==================================================================== */
U.MP_LAN = 60;                 // số lần mô phỏng cho mỗi lượt tính

U.mpMoi = function () {
  var st = U.st(), p = U.ht();
  return {
    A: { ships: G.clone(p.ships || {}), tech: { weapon: st.tech.weapon || 0, shield: st.tech.shield || 0, armor: st.tech.armor || 0 } },
    D: { ships: {}, def: {}, tech: { weapon: 0, shield: 0, armor: 0 }, res: null },
    nguon: '', kq: null
  };
};

U.mpNapDoTham = function (key) {
  var st = U.st();
  var bc = st.spy && st.spy[key];
  if (!bc) return;
  U.mp.D.ships = G.clone(bc.ships || {});
  U.mp.D.def = G.clone(bc.def || {});
  U.mp.D.res = bc.res ? G.clone(bc.res) : null;
  var t = bc.tech || {};
  U.mp.D.tech = { weapon: t.weapon || 0, shield: t.shield || 0, armor: t.armor || 0 };
  U.mp.nguon = (bc.ten || '') + ' ' + G.tdStr(bc.td);
};

U.mpDoc = function () {
  var m = U.mp, i, el, id;
  for (i = 0; i < G.SHIPS.length; i++) {
    id = G.SHIPS[i].id;
    el = document.getElementById('mpa-' + id);
    if (el) { var n = Math.max(0, Math.floor(+el.value || 0)); if (n) m.A.ships[id] = n; else delete m.A.ships[id]; }
    el = document.getElementById('mpd-' + id);
    if (el) { var n2 = Math.max(0, Math.floor(+el.value || 0)); if (n2) m.D.ships[id] = n2; else delete m.D.ships[id]; }
  }
  for (i = 0; i < G.DEFENSES.length; i++) {
    id = G.DEFENSES[i].id;
    el = document.getElementById('mpf-' + id);
    if (el) { var n3 = Math.max(0, Math.floor(+el.value || 0)); if (n3) m.D.def[id] = n3; else delete m.D.def[id]; }
  }
  ['weapon', 'shield', 'armor'].forEach(function (k) {
    var a = document.getElementById('mpta-' + k), d = document.getElementById('mptd-' + k);
    if (a) m.A.tech[k] = Math.max(0, Math.min(50, Math.floor(+a.value || 0)));
    if (d) m.D.tech[k] = Math.max(0, Math.min(50, Math.floor(+d.value || 0)));
  });
};

U.mpChay = function () {
  var m = U.mp, i, k;
  if (G.trong(m.A.ships)) { U.toast('Nhập hạm đội bên tấn công đã.', 'loi'); return; }
  var thang = 0, hoa = 0, thua = 0;
  var matA = {}, matD = {}, pl = { metal: 0, crystal: 0 }, vongTB = 0;
  var sucChua = G.khoangHang(m.A.ships);
  for (i = 0; i < U.MP_LAN; i++) {
    var kq = G.danhTran(
      { ten: 'Ta', tech: m.A.tech, ships: G.clone(m.A.ships) },
      { ten: 'Đối phương', tech: m.D.tech, ships: G.clone(m.D.ships), def: G.clone(m.D.def) },
      G.hash('mp' + i + ':' + G.giay()));
    if (kq.kq === 'thang') thang++;
    else if (kq.kq === 'hoa') hoa++;
    else thua++;
    for (k in kq.matA) matA[k] = (matA[k] || 0) + kq.matA[k];
    for (k in kq.matD) matD[k] = (matD[k] || 0) + kq.matD[k];
    pl.metal += kq.pheLieu.metal; pl.crystal += kq.pheLieu.crystal;
    vongTB += kq.vongDanh.length;
  }
  var chia = function (o) { var r = {}; for (var k2 in o) { var v = Math.round(o[k2] / U.MP_LAN); if (v) r[k2] = v; } return r; };
  var giaTri = function (o) { var t = 0; for (var k3 in o) { var u = G.UNIT(k3); if (u) t += G.giaTriDiem(u.cost, o[k3]) * 1000; } return t; };
  var tbMatA = chia(matA), tbMatD = chia(matD);
  var cuop = m.D.res ? G.chiaHang(m.D.res, sucChua, G.C.CUOP_TOI_DA) : null;
  m.kq = {
    thang: thang, hoa: hoa, thua: thua, lan: U.MP_LAN,
    matA: tbMatA, matD: tbMatD,
    giaA: giaTri(tbMatA), giaD: giaTri(tbMatD),
    pl: { metal: Math.round(pl.metal / U.MP_LAN), crystal: Math.round(pl.crystal / U.MP_LAN) },
    vong: Math.round(vongTB / U.MP_LAN * 10) / 10,
    cuop: cuop, sucChua: sucChua
  };
};

function mpO(tienTo, u, giaTri, coSan) {
  return '<div class="hd-tau"><span>' + U.esc(u.ten) +
    (coSan ? '<br><span class="mo sz">có ' + G.so(coSan) + '</span>' : '') +
    '</span><input id="' + tienTo + '-' + u.id + '" type="number" min="0" value="' + (giaTri || 0) + '"></div>';
}

U.m_mophong = function () {
  var st = U.st(), p = U.ht();
  if (!U.mp) U.mp = U.mpMoi();
  var m = U.mp, i, h = '';

  h += '<div class="panel"><h3>Máy tính trận đánh</h3><div class="noi">';

    'đánh có lãi không. Dùng đúng bộ luật của game: ' + G.C.VONG_DANH + ' vòng, bắn nhanh, dội khiên, ' +
    'phòng thủ mặt đất chỉ tham chiến từ vòng ' + G.VONG_XUONG_DAT + ', công sự tự sửa ' +
    Math.round(G.C.SUA_CONG_SU * 100) + '%.</p>';
  h += '<div class="gal-dh">' +
    '<button class="nut oke" data-act="mp-chay">TÍNH THỬ</button>' +
    '<button class="nut nho" data-act="mp-nap-ham">Lấy hạm đội của ta</button>' +
    '<button class="nut nho" data-act="mp-xoa">Xoá hết</button>';
  var ds = [];
  if (st.spy) for (var kk in st.spy) ds.push(kk);
  if (ds.length) {
    h += '<select id="mp-bc"><option value="">— nạp từ báo cáo do thám —</option>';
    for (i = 0; i < ds.length; i++) {
      var bc = st.spy[ds[i]];
      h += '<option value="' + U.esc(ds[i]) + '">' + U.esc(bc.ten) + ' ' + G.tdStr(bc.td) + '</option>';
    }
    h += '</select><button class="nut nho" data-act="mp-nap-bc">Nạp</button>';
  }
  h += '</div>';
  if (m.nguon) h += '<div class="mo" style="margin-top:6px">Bên phòng thủ lấy từ báo cáo do thám: <b>' + U.esc(m.nguon) + '</b></div>';
  h += '</div></div>';

  /* kết quả */
  if (m.kq) {
    var k = m.kq;

    /* kỳ vọng: chỉ thắng mới cướp và mới yên tâm vét phế liệu */
    var lai = Math.round(pThang * (tongCuop + k.pl.metal + k.pl.crystal) - k.giaA);
    h += '<div class="panel"><h3>Kết quả mô phỏng (' + k.lan + ' lần)</h3><div class="noi">';
    h += '<div class="kq ' + (tyLe >= 80 ? 'thang' : (tyLe >= 30 ? 'hoa' : 'thua')) + '" style="margin:0 0 10px">' +
      '<b>Thắng ' + tyLe + '%</b> — thắng ' + k.thang + ' · cầm cự ' + k.hoa + ' · thua ' + k.thua +
      ' &nbsp;·&nbsp; trung bình ' + k.vong + ' vòng</div>';
    h += '<div class="luoi2"><div><table>' +
      '<tr><th colspan="2">Bên ta (trung bình mỗi trận)</th></tr>' +
      '<tr><td>Tàu mất</td><td class="r">' + U.dsTau(k.matA) + '</td></tr>' +
      '<tr><td>Quy ra tài nguyên</td><td class="r sz do">' + G.so(k.giaA) + '</td></tr>' +
      '<tr><td>Khoang hàng mang theo</td><td class="r sz">' + G.so(k.sucChua) + '</td></tr>' +
      '</table></div><div><table>' +
      '<tr><th colspan="2">Đối phương</th></tr>' +
      '<tr><td>Mất</td><td class="r">' + U.dsTau(k.matD) + '</td></tr>' +
      '<tr><td>Quy ra tài nguyên</td><td class="r sz">' + G.so(k.giaD) + '</td></tr>' +
      '<tr><td>Bãi phế liệu tạo ra</td><td class="r sz vang">' + G.so(k.pl.metal) + ' KL · ' + G.so(k.pl.crystal) + ' TT</td></tr>' +
      '</table></div></div>';
    if (k.cuop) {
      h += '<p><b>Nếu thắng thì cướp được:</b> ' + U.dsRes(k.cuop) +
        ' <span class="mo">(giới hạn bởi khoang hàng ' + G.so(k.sucChua) + ')</span></p>';
      if (tyLe === 0) {
        h += '<div class="kq thua"><b>Không lần nào thắng — đừng đánh.</b> ' +
          '<span class="mo">Hạm đội hiện tại không phá nổi bên kia, đánh vào chỉ mất tàu mà không cướp được gì.</span></div>';
      } else {

          '. Chưa trừ nhiên liệu, và phế liệu chỉ về tay ta nếu mang Tàu Thu Hồi tới.</span></div>';

    }

  h += '<div class="hd-luoi">';

  h += '</div><div class="hd-luoi" style="margin-top:8px">' +
    '<div class="hd-tau"><span>Công Nghệ Vũ Khí</span><input id="mpta-weapon" type="number" min="0" max="50" value="' + m.A.tech.weapon + '"></div>' +
    '<div class="hd-tau"><span>Công Nghệ Khiên</span><input id="mpta-shield" type="number" min="0" max="50" value="' + m.A.tech.shield + '"></div>' +
    '<div class="hd-tau"><span>Công Nghệ Giáp</span><input id="mpta-armor" type="number" min="0" max="50" value="' + m.A.tech.armor + '"></div>' +
    '</div></div></div>';

  h += '<div class="panel"><h3>Bên phòng thủ</h3><div class="noi">';
  h += '<b>Hạm đội</b><div class="hd-luoi" style="margin-top:6px">';
  for (i = 0; i < G.SHIPS.length; i++) h += mpO('mpd', G.SHIPS[i], m.D.ships[G.SHIPS[i].id], 0);
  h += '</div><b style="display:block;margin-top:10px">Phòng thủ</b><div class="hd-luoi" style="margin-top:6px">';
  for (i = 0; i < G.DEFENSES.length; i++) h += mpO('mpf', G.DEFENSES[i], m.D.def[G.DEFENSES[i].id], 0);
  h += '</div><div class="hd-luoi" style="margin-top:8px">' +
    '<div class="hd-tau"><span>Công Nghệ Vũ Khí</span><input id="mptd-weapon" type="number" min="0" max="50" value="' + m.D.tech.weapon + '"></div>' +
    '<div class="hd-tau"><span>Công Nghệ Khiên</span><input id="mptd-shield" type="number" min="0" max="50" value="' + m.D.tech.shield + '"></div>' +
    '<div class="hd-tau"><span>Công Nghệ Giáp</span><input id="mptd-armor" type="number" min="0" max="50" value="' + m.D.tech.armor + '"></div>' +
    '</div></div></div>';
  h += '</div>';
  return h;
};

/* ===== js/main.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — driver bản MỘT NGƯỜI
 * State nằm trong localStorage, mọi hành động chạy thẳng trên máy.
 * (Bản nhiều người dùng web/js/mp.js thay cho file này.)                  */
'use strict';
(function () {
  var G = window.G, U = window.U, APP = window.APP;
  var KEY = 'thdc_save_v3';
  var ST = null;
  var COFILE = !window.THDC_ARTIFACT;   // trong Artifact không tải file được

  /* ---------------- lưu / nạp ---------------- */
  function luu(im) {
    if (!ST) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(ST));
      if (!im) U.toast('Đã lưu bàn chơi.', 'ok');
    } catch (e) { U.toast('Không lưu được: ' + e.message, 'loi'); }
  }
  function nap() {
    try {
      var s = localStorage.getItem(KEY);
      if (!s) return null;
      var o = JSON.parse(s);
      if (!o || !o.planets || !o.planets.length) return null;
      o.toi = o.toi || []; o.npc = o.npc || {}; o.debris = o.debris || {}; o.msgs = o.msgs || [];
      o.nk = o.nk || []; o.stats = o.stats || { thang: 0, thua: 0, cuop: 0, tauMat: 0, tauDietDich: 0, chuyenBay: 0 };
      o.noBaoTri = o.noBaoTri || 0; o.soChuKy = o.soChuKy || 0; o.fleetIdSeq = o.fleetIdSeq || 1;
      return o;
    } catch (e) { return null; }
  }

  /* ---------------- APP: chạy hành động tại chỗ ---------------- */
  APP.mp = false;
  APP.luu = luu;
  APP.lam = function (ten, dl, xong) {
    var err = G.chay(ST, ten, dl);
    if (!err) luu(true);
    if (xong) xong(err);
  };
  APP.moiGiay = (function () {
    var dem = 0;
    return function () { if (++dem >= 15) { dem = 0; luu(true); } };
  })();

  function batDau(st) {
    window.ST = ST = st;
    document.getElementById('man-khoidong').style.display = 'none';
    document.getElementById('game').style.display = '';
    G.tick(ST, G.giay());
    U.ve();
  }
  window.addEventListener('beforeunload', function () { luu(true); });

  /* ---------------- hành động riêng của bản một người ---------------- */
  APP.themACT({
    xuat: function () {
      var js = JSON.stringify(ST);
      U.hop('Xuất bàn chơi',
        '<p class="mo">Sao chép toàn bộ đoạn dưới đây và lưu lại. Dán vào ô "Nạp bàn chơi" ở bất kỳ máy nào để chơi tiếp. ' +
        (COFILE ? 'Nút "Tải về file" cũng dùng được.' : '') + '</p>' +
        '<textarea id="xuat-js" style="width:100%;height:180px" readonly></textarea>' +
        '<div style="margin-top:8px"><button class="nut oke" data-act="xuat-copy">Sao chép</button>' +
        (COFILE ? ' <button class="nut" data-act="xuat-file">Tải về file</button>' : '') + '</div>');
      document.getElementById('xuat-js').value = js;
    },
    'xuat-copy': function () {
      var t = document.getElementById('xuat-js');
      t.select();
      var xong = false;
      try { xong = document.execCommand('copy'); } catch (e) { xong = false; }
      if (!xong && navigator.clipboard) {
        navigator.clipboard.writeText(t.value).then(function () { U.toast('Đã sao chép.', 'ok'); },
          function () { U.toast('Không sao chép được, hãy chọn tay rồi Ctrl+C.', 'loi'); });
        return;
      }
      U.toast(xong ? 'Đã sao chép.' : 'Không sao chép được, hãy chọn tay rồi Ctrl+C.', xong ? 'ok' : 'loi');
    },
/*[TAI-FILE-BAT-DAU]*/
    'xuat-file': function () {
      try {
        var b = new Blob([JSON.stringify(ST)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'thdc-' + ST.ten.replace(/\s+/g, '') + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        U.toast('Nếu trình duyệt không tải về được, hãy dùng nút Sao chép.');
      } catch (e) { U.toast('Không tải file được ở môi trường này — hãy dùng nút Sao chép.', 'loi'); }
    },
/*[TAI-FILE-KET-THUC]*/
    nhap: function () {
      U.hop('Nạp bàn chơi',
        '<p class="mo">Dán nội dung bàn chơi đã xuất vào đây rồi bấm Nạp. Bàn hiện tại sẽ bị ghi đè.</p>' +

        U.toast('Đã nạp bàn chơi.', 'ok');
      } catch (e) { U.toast('Nạp thất bại: ' + e.message, 'loi'); }

    'nhap-file': function () { document.getElementById('file-nhap').click(); },
    'xoa-game': function () {

        '<button class="nut xoa" data-act="xoa-that">Xoá và chơi lại</button> ' +
        '<button class="nut" data-act="dong-ht">Thôi</button>');

  });

  APP.doiFile = function (e) {
    if (e.target.id === 'file-nhap' && e.target.files && e.target.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(fr.result);
          if (!o.planets) throw new Error('file không đúng định dạng');
          window.ST = ST = o; G.tick(ST, G.giay()); luu(true); U.ve();
          U.toast('Đã nạp bàn chơi từ file.', 'ok');
        } catch (err) { U.toast('Nạp thất bại: ' + err.message, 'loi'); }
      };
      fr.readAsText(e.target.files[0]);
    }
  };

  /* ---------------- màn khởi động ---------------- */
  document.getElementById('kd-ver').textContent = G.VERSION;
  var cu = nap();
  if (cu) {
    var b = document.getElementById('kd-tieptuc');
    b.style.display = '';
    b.textContent = 'TIẾP TỤC: ' + cu.ten + ' — ' + G.so(G.diem(cu).tong) + ' điểm';
    b.onclick = function () { batDau(cu); };
  }
  document.getElementById('kd-batdau').onclick = function () {
    var ten = (document.getElementById('kd-ten').value || '').trim() || 'Chỉ Huy';
    var seed = (document.getElementById('kd-seed').value || '').trim() || null;
    if (cu && !confirm('Bàn chơi cũ sẽ bị ghi đè. Tiếp tục tạo bàn mới?')) return;
    batDau(G.moiGame(ten, seed));
    luu(true);
  };
  document.getElementById('nut-menu').onclick = function () {
    document.getElementById('menu').classList.toggle('mo-ra');
  };
  document.getElementById('kd-ten').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('kd-batdau').click();
  });
  APP.batDauNhip();
})();

</script>
</body>
</html>
