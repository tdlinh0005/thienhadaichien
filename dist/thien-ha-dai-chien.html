 * Bay ra rìa hệ tìm vận may: tài nguyên, tàu trôi dạt, Galana — hoặc gặp
 * sinh vật ngoài hành tinh, lạc trong không gian, mất tàu vì thiên thạch.
 * [SUY LUẬN] — thể loại này game nào cũng có, bản gốc không còn tư liệu.
 * ===================================================================== */
G.kheThamHiem = function (st) { return 1 + Math.floor((st.tech.astro || 0) / 4); };
G.dangThamHiem = function (st) {
  var n = 0;
  for (var i = 0; i < st.fleets.length; i++) if (st.fleets[i].mission === 'thamhiem') n++;
  return n;
};

G.thamHiem = function (st, f) {
  var r = G.rng(G.hash('th' + f.id + ':' + st.now + ':' + G.tdKey(f.den)));
  var diem = G.diem(st).tong;
  var suc = G.khoangHang(f.ships);
  var tran = Math.min(suc, 3000 + Math.round(diem * 8));
  var lan = r();
  var noi = '', loai = 'trong';

  var veNha = function (heSo) {
    f.pha = 've';
    f.veLuc = st.now;
    var tg = G.tgBay(st, f.ships, G.khoangCach(f.den, f.tu), f.pct);
    f.ve_t = st.now + Math.round(tg * (heSo || 1));
  };

  if (lan < 0.30) {                                   /* tài nguyên trôi nổi */
    loai = 'res';
    var lay = Math.round(tran * (0.35 + r() * 0.65));
    var chia = { metal: Math.round(lay * 0.5), crystal: Math.round(lay * 0.33), deut: Math.round(lay * 0.17) };
    var k;
    for (k in chia) if (chia[k] > 0) f.cargo[k] = (f.cargo[k] || 0) + chia[k];
    noi = 'Tìm thấy một đám mây vật chất chưa ai khai thác:\n' +
      '  Kim Loại: ' + G.so(chia.metal) + '\n  Thạch Anh: ' + G.so(chia.crystal) + '\n  Nhiên Liệu: ' + G.so(chia.deut);
    veNha(); 
  } else if (lan < 0.42) {                            /* tàu trôi dạt */
    loai = 'tau';
    var duocPhep = [];
    for (var i = 0; i < G.SHIPS.length; i++) {
      var s = G.SHIPS[i];
      if (s.id === 'fortress' || s.id === 'colony') continue;
      if (G.thoaDK(st, st.planets[f.pi] || st.planets[0], s)) duocPhep.push(s);
    }
    if (!duocPhep.length) { noi = 'Gặp một xác tàu cổ nhưng công nghệ của ta chưa đủ để phục hồi thứ gì.'; veNha(); }
    else {
      var chon = duocPhep[Math.floor(r() * duocPhep.length)];
      var giaTri = (chon.cost.metal || 0) + (chon.cost.crystal || 0) + (chon.cost.deut || 0);
      var soTau = Math.max(1, Math.floor(tran * (0.3 + r() * 0.5) / Math.max(1, giaTri)));
      f.ships[chon.id] = (f.ships[chon.id] || 0) + soTau;
      noi = 'Tìm thấy một hạm đội bỏ hoang còn dùng được. Đội sửa chữa kéo về ' +
        G.so(soTau) + ' ' + chon.ten + '.';
      veNha();
    }
  } else if (lan < 0.52) {                            /* Galana */
    loai = 'galana';
    var gl = Math.round((200 + diem * 0.6) * (0.5 + r()));
    st.galana += gl;
    noi = 'Bắt được tín hiệu của một trạm giao dịch bỏ hoang. Bán lại số hàng còn trong kho được ' +
      G.so(gl) + ' Galana.';
    veNha();
  } else if (lan < 0.66) {                            /* sinh vật ngoài hành tinh */
    loai = 'quai';
    var lucTa = 0, kk;
    for (kk in f.ships) lucTa += G.giaTriDiem(G.S(kk).cost, f.ships[kk]);
    var rq = G.rng(G.hash('quai' + f.id + st.now));
    var quai = G.npcHam(Math.max(60, lucTa * (0.35 + rq() * 0.75)), Math.min(1, diem / 40000), rq);
    var kq = G.danhTran(
      { ten: st.ten, tech: st.tech, ships: f.ships },
      { ten: 'Sinh vật ngoài hành tinh', tech: { weapon: 4, shield: 4, armor: 4 }, ships: quai, def: {} },
      G.hash('thq' + f.id + st.now));
    f.ships = kq.conShipsA;
    var matT = 0, matQ = 0;
    for (kk in kq.matA) matT += kq.matA[kk];
    for (kk in kq.matD) matQ += kq.matD[kk];
    st.stats.tauMat += matT; st.stats.tauDietDich += matQ;
    G.tin(st, 'tran', 'Chạm trán ở vùng không gian sâu ' + G.tdStr(f.den), null,
      { kq: kq, cuop: { metal: 0, crystal: 0, deut: 0, food: 0 }, pl: { metal: 0, crystal: 0 }, td: f.den, ben: 'ta' });
    if (G.trong(f.ships)) {
      G.tin(st, 'he', 'Mất trắng đoàn thám hiểm',
        'Hạm đội thám hiểm ở ' + G.tdStr(f.den) + ' bị sinh vật ngoài hành tinh xoá sổ hoàn toàn.');
      G.xoaHam(st, f);
      return;
    }
    noi = 'Đụng độ một bầy sinh vật ngoài hành tinh. Ta mất ' + G.so(matT) + ' tàu, diệt ' + G.so(matQ) +
      ' con. Xem chiến báo để biết chi tiết.';
    veNha();
  } else if (lan < 0.76) {                            /* lạc trong không gian */
    loai = 'lac';
    var he = 2 + Math.round(r() * 2);
    noi = 'Máy tính dẫn đường tính sai một hằng số hấp dẫn. Hạm đội lạc ra ngoài rìa hệ và mất gấp ' +
      he + ' lần thời gian để mò đường về.';
    veNha(he);
  } else if (lan < 0.84) {                            /* thiên thạch */
    loai = 'mat';
    var kkk, matTh = {};
    for (kkk in f.ships) {
      var mat = Math.floor(f.ships[kkk] * (0.05 + r() * 0.2));
      if (mat > 0) { matTh[kkk] = mat; f.ships[kkk] -= mat; if (!f.ships[kkk]) delete f.ships[kkk]; }
    }
    if (G.trong(f.ships)) {
      G.tin(st, 'he', 'Mất trắng đoàn thám hiểm', 'Cả hạm đội thám hiểm tan trong một trận mưa thiên thạch tại ' + G.tdStr(f.den) + '.');
      G.xoaHam(st, f);
      return;
    }
    noi = G.trong(matTh) ? 'Bay xuyên một vành đai thiên thạch, may là không mất tàu nào.'
      : 'Bay xuyên một vành đai thiên thạch, mất: ' + G.moTaPha(matTh) + '.';
    veNha();
  } else {                                            /* không thấy gì */
    loai = 'trong';
    var cau = [
      'Quét sạch cả vùng, không có gì ngoài bụi và bức xạ nền.',
      'Bắt được một tín hiệu lạ, đuổi theo ba tiếng đồng hồ thì nó tắt.',
      'Vùng này đã có người tới trước — chỉ còn lại vết đốt động cơ đã nguội.'
    ];
    noi = cau[Math.floor(r() * cau.length)];
    veNha();
  }

  st.stats.thamHiem = (st.stats.thamHiem || 0) + 1;
  if (loai !== 'quai' || noi) {
    G.tin(st, 'ham', 'Nhật ký thám hiểm ' + G.tdStr(f.den), noi);
  }
};

/* =======================================================================
 * ĐỔ BỘ — cơ chế đặc trưng nhất của bản gốc
 * Quỹ đạo vỡ rồi thì Đại Chiến Hạm mới thả Robot/Tank xuống. Thắng trận
 * dưới mặt đất thì PHÁ CÔNG TRÌNH của đối phương (trận Start War III:
 * "phá hủy toàn bộ những công trình… chỉ chừa lại đúng 1.000 Nhà Máy Tàu Bay").
 * ===================================================================== */
G.sucChoLinh = function (ships) {
  var t = 0;
  for (var id in ships) { var s = G.S(id); if (s && s.choLinh) t += s.choLinh * ships[id]; }
  return t;
};
G.choLinhCan = function (linh) {
  var t = 0;
  for (var id in linh) { var b = G.BB(id); if (b) t += b.cho * linh[id]; }
  return t;
};
G.sucPhaCT = function (linh) {
  var t = 0;
  for (var id in linh) { var b = G.BB(id); if (b) t += (b.atk + b.hull * 0.05) * linh[id]; }
  return t;
};

/* Phá công trình bằng sức đổ bộ còn lại. Mỗi loại được xử lý
 * theo lô, nên thời gian là O(số loại), không phụ thuộc hàng triệu nhà máy. */
G.phaCongTrinh = function (st, p, suc) {
  var tong = G.tongSoCT(p);
  var conPha = tong > 0 ? Math.max(1, Math.floor(tong * G.C.PHA_CT_TOI_DA)) : 0;
  var pha = {}, soPha = 0, ds = [], k;
  for (k in p.b) {
    var d = G.B(k);
    if (d && p.b[k] > 0) ds.push({ id: k, gia: G.giaTriDiem(d.cost) * 1000 });
  }
  ds.sort(function (a, b) { return b.gia - a.gia || (a.id < b.id ? -1 : 1); });
  for (var i = 0; i < ds.length && suc > 0 && soPha < conPha; i++) {
    var x = ds[i];
    var canSuc = Math.max(1, x.gia * G.C.SUC_PHA_MOI_TAI_NGUYEN);
    var n = Math.min(p.b[x.id] || 0, conPha - soPha, Math.floor(suc / canSuc));
    if (n < 1) continue;
    suc -= n * canSuc;
    var mat = G.giamCongTrinh(p, x.id, n);
    pha[x.id] = mat;
    soPha += mat;
  }
  /* soCap giữ tạm cho server/báo cáo v3; giá trị nay là số lượng. */
  return { pha: pha, soLuong: soPha, soCap: soPha, chamTran: soPha >= conPha && conPha > 0 };
};

G.moTaPhaCT = function (o) {
  var ra = [];
  for (var k in o) if (o[k]) ra.push(G.B(k).ten + ' −' + G.so(o[k]));
  return ra.length ? ra.join(', ') : 'không phá được công trình nào';
};

/* Chạy pha đổ bộ. Trả về mô tả kết quả (hoặc null nếu không có quân đổ bộ). */
/* tách phần phòng thủ MẶT ĐẤT ra khỏi bảng phòng thủ chung */
G.thuMatDat = function (def) {
  var ra = {};
  for (var k in def) { var d = G.D(k); if (d && d.lop === 'dat' && def[k] > 0) ra[k] = def[k]; }
  return ra;
};
G.gopThuMatDat = function (def, con) {
  for (var k in def) { var d = G.D(k); if (d && d.lop === 'dat') delete def[k]; }
  G.cong(def, con);
};

G.doBoXuong = function (st, f, ben) {
  if (!f.linh || G.trong(f.linh)) return null;
  /* LƯU Ý: chỉ BO BINH của hạm tham gia trận đất; tàu ở lại quỹ đạo không đánh.
   * loaiHT forward để máy bay/hỏa tiễn trong `linh`... thực tế linh là bộ binh,
   * còn hệ số địa hình áp qua D (công sự + bộ binh phòng thủ). */
  var kq = G.danhTran(
    { ten: st.ten + ' (quân đổ bộ)', tech: st.tech, bo: f.linh, doBo: true },
    { ten: ben.ten, tech: ben.tech || {}, bo: ben.linh || {}, def: ben.def || {}, thuDat: ben.thuDat || 1, loaiHT: ben.loaiHT },
    G.hash('dobo' + f.id + ':' + st.now));
  f.linh = kq.conBoA;
  if (ben.linh) { for (var k in ben.linh) delete ben.linh[k]; G.cong(ben.linh, kq.conBoD); }
  if (ben.def) { for (var k2 in ben.def) delete ben.def[k2]; G.cong(ben.def, kq.conDefD); }
  var thang = kq.kq === 'thang';
  var phaCT = null;
  if (thang && ben.p) phaCT = G.phaCongTrinh(st, ben.p, G.sucPhaCT(f.linh));
  return { kq: kq, thang: thang, phaCT: phaCT };
};

/* ===== js/actions.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — bảng hành động luật game cốt lõi dùng chung
 * Đây là nơi thực thi xây dựng, nghiên cứu, hạm đội và các mutation state mô phỏng.
 * Chat, quản trị liên minh, tuyên chiến và chuyển Galana multiplayer đi qua
 * các phương thức server chuyên biệt vì chúng tác động dữ liệu dùng chung.
 *   - Chế độ một người: client gọi trực tiếp trên state trong máy.
 *   - Chế độ nhiều người: server gọi trên state trong database (client chỉ gửi
 *     yêu cầu). Vì vậy mọi kiểm tra ở đây phải coi dữ liệu vào là KHÔNG TIN ĐƯỢC.
 * Mỗi hành động trả về null nếu xong, hoặc chuỗi mô tả lỗi.               */
'use strict';
var G = window.G = window.G || {};

function ht(st, pi) {
  pi = Math.floor(+pi || 0);
  if (pi < 0 || pi >= st.planets.length) return null;
  return st.planets[pi];
}
function soDuong(v, toiDa) {
  v = Math.floor(+v || 0);
  if (!isFinite(v) || v <= 0) return 0;
  return toiDa !== undefined ? Math.min(v, toiDa) : v;
}
function chuoi(v, dai) { return String(v === undefined || v === null ? '' : v).slice(0, dai || 40); }

G.HANHDONG = {
  /* --- xây dựng --- */
  xay: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    if (!G.B(chuoi(d.id, 30))) return 'Không có công trình này.';
    var n;
    if (d.n !== undefined && d.n !== null) {
      n = Number(d.n);
      if (!Number.isSafeInteger(n) || n < 1 || n > 10000000)
        return 'Số lượng xây phải là số nguyên từ 1 tới 10.000.000.';
    }
    return G.xepXay(st, p, d.id, n);
  },
  huyxay: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var i = Math.floor(+d.i);
    if (!(i >= 0 && i < p.qB.length)) return 'Mục hàng đợi không tồn tại.';
    G.huyXay(st, p, i); return null;
  },

  /* --- nghiên cứu --- */
  nc: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    if (!G.R(chuoi(d.id, 30))) return 'Không có đề tài này.';
    return G.xepNC(st, p, d.id);
  },
  huync: function (st) {
    if (!st.ncQueue) return 'Không có đề tài nào đang chạy.';
    G.huyNC(st); return null;
  },

  /* --- dân sự -------------------------------------------------------- */
  doithue: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var taxBp;
    if (d.thue !== undefined) {
      if (d.thue === null || (typeof d.thue === 'string' && !d.thue.trim()))
        return 'Thuế phải nằm trong khoảng 0% tới 100%.';
      var thue = Number(d.thue);
      if (!isFinite(thue) || thue < 0 || thue > 100) return 'Thuế phải nằm trong khoảng 0% tới 100%.';
      taxBp = Math.round(thue * 100);
    } else {
      var rawBp = d.taxBp !== undefined ? d.taxBp : d.bp;
      if (rawBp === null || rawBp === undefined || (typeof rawBp === 'string' && !rawBp.trim()))
        return 'Thuế phải là số nguyên từ 0 tới 10.000 bp.';
      taxBp = Number(rawBp);
      if (!Number.isSafeInteger(taxBp) || taxBp < G.NHIP_V1.minTaxBp || taxBp > G.NHIP_V1.maxTaxBp)
        return 'Thuế phải là số nguyên từ 0 tới 10.000 bp.';
    }
    if (!p.danSu) p.danSu = G.danSuMacDinh();
    p.danSu.taxBp = taxBp;
    G.ghi(st, 'Đổi thuế tại ' + p.ten + ' ' + G.tdStr(p.c) + ' thành ' + (taxBp / 100).toFixed(2) + '%.');
    return null;
  },

  /* --- đóng tàu / phòng thủ / tên lửa --- */
  dong: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var id = chuoi(d.id, 30);
    if (!(G.S(id) || G.D(id) || G.M(id) || G.BB(id))) return 'Không có đơn vị này.';
    var n = soDuong(d.n, 100000);
    if (!n) return 'Số lượng không hợp lệ.';
    return G.xepTau(st, p, id, n);
  },
  huydong: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var i = Math.floor(+d.i);
    if (!(i >= 0 && i < p.qS.length)) return 'Mục hàng đợi không tồn tại.';
    G.huyDong(st, p, i); return null;
  },

  /* --- chợ Thiên Hà --- */
  /* [v7] Bộ đổi vô hạn đã đóng: tư liệu gốc xác nhận siêu thị chỉ có hàng khi
   * có người bán vào. Hai tên này giữ lại chỉ để client cũ nhận thông báo rõ. */
  ban: function () {
    return 'Chợ cũ đã đóng. Dùng màn Ngân Hàng & Thị Trường để đăng bán hoặc mua.';
  },
  mua: function () {
    return 'Chợ cũ đã đóng. Dùng màn Ngân Hàng & Thị Trường để đăng bán hoặc mua.';
  },

  /* --- tài chính v7: ngân hàng / đầu tư siêu thị / uranium --------------- */
  guiNH: function (st, d) {
    var so = soDuong(d.so);
    if (!so) return 'Nhập số Galana cần gửi.';
    if (st.galana < so) return 'Chỉ có ' + G.so(Math.floor(st.galana)) + ' Galana.';
    st.galana -= so;
    st.nganHang.soDu += so;
    G.ghi(st, 'Gửi Ngân Hàng Vũ Trụ ' + G.so(so) + ' Galana (số dư ' + G.so(Math.floor(st.nganHang.soDu)) + ').');
    return null;
  },
  rutNH: function (st, d) {
    var so = soDuong(d.so);
    if (!so) return 'Nhập số Galana cần rút.';
    if (st.nganHang.soDu < so) return 'Trong ngân hàng chỉ có ' + G.so(Math.floor(st.nganHang.soDu)) + ' Galana.';
    st.nganHang.soDu -= so;
    st.galana += so;
    /* lãi lũy đang treo thuộc kỳ trước — giữ nguyên, checkpoint sau kết toán */
    G.ghi(st, 'Rút ' + G.so(so) + ' Galana từ Ngân Hàng Vũ Trụ.');
    return null;
  },
  dauTuST: function (st, d) {
    var so = soDuong(d.so);
    if (!so) return 'Nhập số Galana cần đầu tư.';
    if ((Number(st.dauTuST.ketThucAt) || 0) > st.now)
      return 'Đang có ' + G.so(st.dauTuST.von) + ' Galana trong kỳ đầu tư tới ' +
        G.gio(st.dauTuST.ketThucAt * 1000) + ' — không rút giữa kỳ được [XÁC NHẬN].';
    if (st.galana < so) return 'Chỉ có ' + G.so(Math.floor(st.galana)) + ' Galana.';
    st.galana -= so;
    st.dauTuST = { von: so, ketThucAt: st.now + G.KINH_TE_V1.kyDauTuGiay };
    G.ghi(st, 'Đầu tư Siêu Thị Thiên Hà ' + G.so(so) + ' Galana, đáo hạn sau 7 ngày.');
    return null;
  },
  tangTocXay: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    if (!p.qB.length || !p.qB[0].xong) return 'Không có lô xây dựng nào đang chạy.';
    var gia = G.KINH_TE_V1.uraniumTangToc;
    if ((Number(st.uranium) || 0) < gia) return 'Cần ' + gia + ' Uranium để tăng tốc.';
    st.uranium -= gia;
    var m = p.qB.shift();
    G.themCongTrinh(p, m.id, Math.max(1, Math.floor(Number(m.n) || 1)));
    if (p.qB.length && p.qB[0].tg) p.qB[0].xong = st.now + p.qB[0].tg;
    G.ghi(st, p.ten + ': tăng tốc hoàn thành ' + G.B(m.id).ten + ' bằng ' + gia + ' Uranium.');
    return null;
  },
  muaDiemNC: function (st, d) {
    var diem = soDuong(d.diem, 100000);
    if (!diem) return 'Nhập số điểm Kỹ Thuật cần mua.';
    var gia = diem * G.KINH_TE_V1.uraniumMotDiem;
    if ((Number(st.uranium) || 0) < gia) return 'Cần ' + gia + ' Uranium (' + G.KINH_TE_V1.uraniumMotDiem + '/điểm).';
    st.uranium -= gia;
    st.techPts += diem;
    G.ghi(st, 'Mua ' + G.so(diem) + ' điểm Kỹ Thuật bằng ' + gia + ' Uranium.');
    return null;
  },
  traLuongGD: function (st) {
    /* Trả ngay toàn bộ lương gián điệp treo bằng Nhiên Liệu kho đế quốc. */
    var can = Math.ceil(Number(st.luongGD.traLuc) || 0);
    if (can <= 0) return 'Không có lương nào treo.';
    var co = 0, i;
    for (i = 0; i < st.planets.length; i++) co += Math.max(0, st.planets[i].res.deut || 0);
    if (co < can) return 'Thiếu Nhiên Liệu: cần ' + G.so(can) + ', kho có ' + G.so(co) + '.';
    for (i = 0; i < st.planets.length && can > 0; i++) {
      var p = st.planets[i], tru = Math.min(p.res.deut || 0, can);
      p.res.deut -= tru; can -= tru;
    }
    st.luongGD.traLuc = 0;
    G.ghi(st, 'Đã trả lương gián điệp.');
    return null;
  },

  /* --- thị trường v7 ------------------------------------------------------ */
  dangBan: function (st, d) {
    return G.dangBan(st, Math.floor(+d.pi), d.loai === 'tudo' ? 'tudo' : chuoi(d.loai, 10),
      chuoi(d.res, 10), d.so, d.gia);
  },
  huyDon: function (st, d) {
    var id = Math.floor(+d.donId);
    if (!id) return 'Đơn không hợp lệ.';
    return G.huyDon(st, id);
  },
  muaDon: function (st, d) {
    var don = null, i, id = String(d.donId === undefined ? '' : d.donId);
    for (i = 0; i < st.choDon.length; i++) {
      if (String(st.choDon[i].id) === id ||
          st.choDon[i].id === 'npc-' + id.replace(/^npc-/, '')) { don = st.choDon[i]; break; }
    }
    /* solo: đơn NPC sinh lười khi cần — bộ luật chạy cả server nên chỉ tra khi có npcCho */
    if (!don && st.npcCho) {
      var dsNpc = G.npcCho(st);
      for (i = 0; i < dsNpc.length; i++) if (String(dsNpc[i].id) === id) { don = dsNpc[i]; break; }
    }
    if (!don) return 'Không có đơn này trên thị trường của ta (đơn đối tác đi qua server).';
    return G.muaDon(st, Math.floor(+d.pi), don, d.so);
  },

  /* --- hạm đội --- */
  gui: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var den = G.tdParse((d.den || {}).g + ':' + (d.den || {}).h + ':' + (d.den || {}).p);
    if (!den) return 'Toạ độ mục tiêu không hợp lệ.';
    if (!G.byId(G.MISSIONS, chuoi(d.mission, 20))) return 'Nhiệm vụ không hợp lệ.';
    var ships = {}, cargo = {}, linh = {}, k;
    for (k in (d.ships || {})) if (G.S(k)) { var n = soDuong(d.ships[k]); if (n) ships[k] = n; }
    for (k in (d.linh || {})) if (G.BB(k)) { var nb = soDuong(d.linh[k]); if (nb) linh[k] = nb; }
    for (k in (d.cargo || {})) if (G.RES_HANH_TINH.indexOf(k) >= 0) { var v = soDuong(d.cargo[k]); if (v) cargo[k] = v; }
    var pct = Math.max(10, Math.min(100, Math.round((+d.pct || 100) / 10) * 10));
    var giu = Math.max(1, Math.min(24, Math.floor(+d.giu || 1)));
    return G.guiHam(st, st.planets.indexOf(p), ships, den, d.mission, cargo, pct, giu, linh);
  },
  goive: function (st, d) { return G.goiVe(st, Math.floor(+d.fid)); },
  banTenLua: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var den = G.tdParse((d.den || {}).g + ':' + (d.den || {}).h + ':' + (d.den || {}).p);
    if (!den) return 'Toạ độ mục tiêu không hợp lệ.';
    return G.banTenLua(st, st.planets.indexOf(p), den, soDuong(d.n, 100000));
  },
  doihuong: function (st, d) {
    var den = G.tdParse((d.den || {}).g + ':' + (d.den || {}).h + ':' + (d.den || {}).p);
    if (!den) return 'Toạ độ không hợp lệ.';
    return G.doiMucTieu(st, Math.floor(+d.fid), den);
  },

  /* --- liên minh --- */
  lmvao: function (st, d) {
    /* [THẺ 6 KÝ TỰ] + dấu cách + tên 32 ký tự có thể dài 41 ký tự. */
    var ten = chuoi(d.ten, 48);
    if (!ten) return 'Thiếu tên liên minh.';
    if (st.lm) return 'Đang ở trong một liên minh khác.';
    if (!G.HOOK && G.LIEN_MINH.indexOf(ten) < 0) return 'Không có liên minh này.';
    st.lm = { ten: ten, t: st.now };
    G.tin(st, 'he', 'Đã gia nhập liên minh', 'Ta chính thức là thành viên của ' + ten + '. Sản lượng toàn đế quốc +5%.');
    return null;
  },
  lmra: function (st) {
    if (!st.lm) return 'Chưa ở trong liên minh nào.';
    G.ghi(st, 'Rời liên minh ' + st.lm.ten + '.');
    st.lm = null; return null;
  },

  /* --- tin nhắn & khác --- */
  doctin: function (st, d) {
    var id = Math.floor(+d.i);
    for (var i = 0; i < st.msgs.length; i++) { if (st.msgs[i].id === id) { st.msgs[i].doc = true; break; } }
    return null;
  },
  docHet: function (st) { for (var i = 0; i < st.msgs.length; i++) st.msgs[i].doc = true; return null; },
  xoatin: function (st) { st.msgs = []; return null; },
  boHoang: function (st, d) {
    if (chuoi(d.xacnhan, 10) !== 'BO') return 'Cần xác nhận trước khi bỏ hoang.';
    return G.boHoang(st, Math.floor(+d.pi));
  },
  doiTenHT: function (st, d) {
    var p = ht(st, d.pi); if (!p) return 'Hành tinh không tồn tại.';
    var ten = chuoi(d.ten, 24).replace(/[<>&"]/g, '').trim();
    if (!ten) return 'Tên không hợp lệ.';
    p.ten = ten; return null;
  }
};

/* Chạy một hành động: tua thời gian trước, rồi thực thi. */
G.chay = function (st, ten, dl) {
  var f = G.HANHDONG[ten];
  if (!f) return 'Hành động không tồn tại.';
  G.tick(st, G.giay());
  return f(st, dl || {}) || null;
};

/* ===== js/ui/core.js ===== */
/* UI — lõi + tiện ích hiển thị (tách từ ui.js) */
'use strict';
var G = window.G, U = window.U = {}, APP = window.APP = window.APP || {};

U.man = 'tongquan';
U.pi = 0;
U.gal = null;
U.form = null;
U.moTin = {};
U.cho = {};        // số lượng đang gõ ở Chợ Thiên Hà, giữ qua các lần vẽ lại
U.sigCu = '';

U.esc = function (s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
};
U.st = function () { return window.ST; };
U.datPi = function (pi, st) {
  st = st || U.st();
  if (!st || !Array.isArray(st.planets) || !st.planets.length) return false;
  pi = Number(pi);
  if (!Number.isInteger(pi) || pi < 0 || pi >= st.planets.length) return false;
  if (pi !== U.pi) { U.pi = pi; U.form = null; }
  return true;
};
U.ht = function () {
  var st = U.st();
  if (!st || !Array.isArray(st.planets) || !st.planets.length) return null;
  if (!Number.isInteger(U.pi) || U.pi < 0 || U.pi >= st.planets.length) U.datPi(0, st);
  return st.planets[U.pi] || null;
};

U.toast = function (s, loai) {
  var d = document.createElement('div');
  d.className = 't' + (loai ? ' ' + loai : '');
  d.innerHTML = U.esc(s);
  document.getElementById('toast').appendChild(d);
  setTimeout(function () { d.style.opacity = 0; setTimeout(function () { d.remove(); }, 250); }, 3600);
};
var _hopEsc, _hopTrigger;
U.hop = function (td, html) {
  _hopTrigger = document.activeElement || null;

    if (a.priority !== b.priority) return a.priority - b.priority;
    if (a.priority === 0 && a.etaAt !== b.etaAt) {
      var etaA = Number.isFinite(a.etaAt) ? a.etaAt : Infinity;
      var etaB = Number.isFinite(b.etaAt) ? b.etaAt : Infinity;
      if (etaA !== etaB) return etaA - etaB;
    }
    var sa = thuTu[a.source] === undefined ? 999 : thuTu[a.source];
    var sb = thuTu[b.source] === undefined ? 999 : thuTu[b.source];
    if (sa !== sb) return sa - sb;
    if (a.scope !== b.scope) return a.scope < b.scope ? -1 : 1;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  });
  return out;
};

U.tomTatHanhTinh = function (st, p, pi, alerts) {

  function thieu() { return { state: 'missing', label: chua }; }
  if (!st || !p) return {
    pi: Number.isInteger(pi) ? pi : null, key: '', name: chua, coords: '', capital: false,
    power: thieu(), storage: thieu(),
    population: thieu(), support: thieu(),
    build: { state: 'missing', label: chua, count: 0, etaAt: null },
    ships: { state: 'missing', label: chua, stationed: 0, queued: 0 },
    research: { state: 'missing', label: chua, etaAt: null },
    alert: { state: 'missing', label: chua, count: 0, priority: null }
  };
  var key = 'pi-' + pi, coords = '';
  var keyToaDo = U.keyHanhTinh(p);
  if (keyToaDo) { key = keyToaDo; coords = U.toaDoStr(p.c); }
  else coords = chua + ' tọa độ';

  var power = thieu(), storage = thieu(), san = null, cap = null, maxRatio = 0, maxRes = null;
  if (p.res && p.b) {
    try { san = G.sanLuong(st, p); } catch (eSan) { san = null; }
    if (san && Number.isFinite(Number(san.hs))) {
      var powerState = Number(san.hs) < 1 ? 'deficit' : 'ok';
      power = {
        state: powerState,
        label: (powerState === 'deficit' ? 'Thiếu điện · ' : 'Đủ điện · ') + Math.max(0, Math.round(Number(san.hs) * 100)) + '%'
      };
    }
    try { cap = G.dungTich(p); } catch (eCap) { cap = null; }
    if (cap) {
      for (var i = 0; i < G.RES_HANH_TINH.length; i++) {
        var rid = G.RES_HANH_TINH[i], muc = Number(cap[rid]);
        var ratio = muc > 0 ? Number(p.res[rid] || 0) / muc : 0;
        if (ratio > maxRatio) { maxRatio = ratio; maxRes = G.byId(G.RES, rid); }
      }
      var storageState = maxRatio >= 1 ? 'danger' : (maxRatio >= 0.9 ? 'warning' : 'ok');
      var storageLabel = storageState === 'danger' ? 'Đã đầy' : (storageState === 'warning' ? 'Sắp đầy' : 'Ổn định');
      if (maxRes && storageState !== 'ok') storageLabel += ' · ' + maxRes.ten;
      storage = { state: storageState, label: storageLabel, id: maxRes ? maxRes.id : null };
    }
  }

  var population = thieu(), support = thieu(), dan = p.danSu;
  if (dan && typeof dan === 'object') {
    var sucChua = 0;
    try { sucChua = G.sucChuaDan ? Number(G.sucChuaDan(p)) : 0; } catch (eDan) { sucChua = 0; }
    if (sucChua > 0 && Number.isFinite(Number(dan.population))) {
      var popRatio = Number(dan.population) / sucChua;
      var popState = popRatio >= 1 ? 'capacity' : (popRatio >= 0.9 ? 'warning' : 'ok');
      population = { state: popState, label: G.soNgan(dan.population) + ' / ' + G.soNgan(sucChua) };
    }
    if (Number.isFinite(Number(dan.supportBp))) {
      var supportState = Number(dan.supportBp) < 5000 ? 'danger' : (Number(dan.supportBp) < 8000 ? 'warning' : 'ok');
      support = { state: supportState, label: U.bp(dan.supportBp) + ' ủng hộ' };
    }
  }

  var qBHopLe = Array.isArray(p.qB), qB = qBHopLe ? p.qB : [], firstB = qB[0] || null;
  var tenB = firstB && G.B(firstB.id), build = qBHopLe ? {
    state: firstB ? 'active' : 'idle',
    label: firstB ? ((tenB ? tenB.ten : firstB.id) + ' ×' + G.so(firstB.n || 0)) : 'Rảnh',
    count: qB.length, etaAt: firstB ? U.mocThoiGian(firstB.xong) : null
  } : { state: 'missing', label: chua, count: 0, etaAt: null };

  var qSHopLe = Array.isArray(p.qS), shipsHopLe = p.ships && typeof p.ships === 'object';
  var qS = qSHopLe ? p.qS : [], queued = 0, stationed = shipsHopLe ? U.tongDonVi(p.ships) : 0;
  for (i = 0; i < qS.length; i++) queued += Math.max(0, Number(qS[i].n) || 0);
  var ships = qSHopLe && shipsHopLe ? {
    state: qS.length ? 'building' : (stationed ? 'ready' : 'idle'),
    label: G.so(stationed) + ' đậu · ' + G.so(queued) + ' đang đóng', stationed: stationed, queued: queued
  } : { state: 'missing', label: chua, stationed: 0, queued: 0 };

  var nc = st.ncQueue || null, ncPi = nc ? U.piTheoKey(st, nc.planetKey) : -1;
  var ncTaiDay = !!nc && ncPi >= 0 && ncPi === pi, defNc = ncTaiDay ? G.R(nc.id) : null;
  var research;
  if (!nc) research = { state: 'idle', label: 'Không chủ trì', etaAt: null };
  else if (ncPi < 0) research = { state: 'missing', label: 'Chưa xác định hành tinh chủ trì', etaAt: null };
  else if (!ncTaiDay) research = { state: 'idle', label: 'Không chủ trì', etaAt: null };
  else research = {
    state: String(nc.status || 'active'),
    label: (defNc ? defNc.ten : nc.id) + ' → cấp ' + G.so(nc.lv || 0),
    etaAt: U.mocThoiGian(nc.finishAt)

  var dsAlert = alerts || U.tinhViecCanXuLy(st), taiDay = [];
  for (i = 0; i < dsAlert.length; i++) if (dsAlert[i].pi === pi) taiDay.push(dsAlert[i]);
  return {
    pi: pi, key: key, name: String(p.ten || 'Hành tinh chưa đặt tên'), coords: coords, capital: !!p.thuDo,
    power: power, storage: storage, population: population, support: support,
    build: build, ships: ships, research: research,
    alert: {
      state: taiDay.length ? taiDay[0].severity : 'ok',
      label: taiDay.length ? ('P' + taiDay[0].priority + ' · ' + G.so(taiDay.length) + ' việc') : 'Bình thường',
      count: taiDay.length, priority: taiDay.length ? taiDay[0].priority : null

};

U.sigTrangThaiUI = function (st) {

  var tongQuanLive = U.man === 'tongquan';
  var sig = {
    nav: [U.man, U.workspace, U.pi, APP.mp ? 'mp' : 'solo'],
    empire: [ps.length, (st.msgs || []).length, (st.fleets || []).length, (st.toi || []).length,
      bt.cycle || 0, bt.missStreak || 0, bt.arrearsGalana > 0, (st.nk || []).length,
      (st.nk && st.nk[0]) ? [st.nk[0].t || 0, st.nk[0].s || ''] : null, st.lm ? st.lm.ten : ''],
    alerts: alerts.map(function (a) {
      return [a.dedupeKey, a.priority, a.severity, a.scope, a.pi, a.title, a.consequence,
        Number.isFinite(a.etaAt), a.action.man, a.action.label];
    }),
    planets: [], fleets: [], inbound: [], garrisons: [], messages: [],

      st.ncQueue.installmentsLeft || 0, U.khoaNghienCuu(st.ncQueue)] : null,
    stats: st.stats ? [st.stats.thang || 0, st.stats.thua || 0, st.stats.chuyenBay || 0] : []

  for (var i = 0; i < ps.length; i++) {
    var p = ps[i] || {}, t = U.tomTatHanhTinh(st, p, i, alerts), qb = [], qs = [];
    for (var j = 0; j < (Array.isArray(p.qB) ? p.qB : []).length; j++) qb.push([(p.qB[j] || {}).id, (p.qB[j] || {}).n || 0]);
    for (j = 0; j < (Array.isArray(p.qS) ? p.qS : []).length; j++) qs.push([
      (p.qS[j] || {}).id, tongQuanLive ? null : ((p.qS[j] || {}).n || 0)
    ]);
    var resDay = [];
    if (p.res && p.b) try {
      var capSig = G.dungTich(p);
      for (j = 0; j < G.RES_HANH_TINH.length; j++) {
        var ridSig = G.RES_HANH_TINH[j], mucSig = Number(capSig && capSig[ridSig]);
        resDay.push([ridSig, mucSig > 0 ? Number(p.res[ridSig] || 0) >= mucSig : null]);
      }
    } catch (eCapSig) { resDay = []; }
    function loaiCoSan(o) {
      var ds = [];
      for (var idDv in (o || {})) if (Number(o[idDv]) > 0) ds.push(idDv);
      return ds.sort();
    }
    function loaiSoLuong(o) {
      if (tongQuanLive) return [];
      var ds = [];
      for (var idDv in (o || {})) if (Number(o[idDv]) > 0) ds.push([idDv, Number(o[idDv])]);
      return ds.sort(function (a, b) { return a[0] < b[0] ? -1 : (a[0] > b[0] ? 1 : 0); });
    }
    sig.planets.push([
      t.key, t.name, t.capital, t.power.state, t.storage.state, t.population.state, t.support.state,
      t.build.state, t.ships.state, t.research.state, t.storage.id || '', resDay,
      t.alert.priority, t.alert.count, qb, qs,
      loaiCoSan(p.ships), loaiCoSan(p.def), loaiCoSan(p.mis), loaiCoSan(p.linh),
      loaiSoLuong(p.ships), loaiSoLuong(p.def), loaiSoLuong(p.mis), loaiSoLuong(p.linh)
    ]);
  }
  for (i = 0; i < (st.fleets || []).length; i++) {
    var f = st.fleets[i];
    sig.fleets.push([f.id, f.mission, f.pha, f.doiHuong || 0,
      f.tu ? U.toaDoStr(f.tu) : '', f.den ? U.toaDoStr(f.den) : '', U.tongDonVi(f.ships || {}),
      !!(f.pha === 'giu' && f.tiepNL_t && f.giuDen_t && f.tiepNL_t < f.giuDen_t)]);
  }
  for (i = 0; i < (st.pvpToi || []).length; i++) {
    var q = st.pvpToi[i]; sig.inbound.push([q.id, q.nv, q.tu, q.den]);
  }
  for (i = 0; i < (st.pvpGiu || []).length; i++) {
    var g = st.pvpGiu[i]; sig.garrisons.push([g.id, g.den || g.planetKey || '', U.tongDonVi(g.ships || {}),
      !!(g.tiepNL_t && g.giuDen_t && g.tiepNL_t < g.giuDen_t)]);
  }
  for (i = 0; i < Math.min(8, (st.msgs || []).length); i++) sig.messages.push([st.msgs[i].id, !!st.msgs[i].doc]);
  return JSON.stringify(sig);
};

U.theCT = function (st, p, b) {
  var co = p.b[b.id] || 0, dangXay = G.soDangXay(p, b.id);
  var n = G.loMacDinhXay(p, b.id);
  var cost = G.giaCongTrinh(b, n);
  var thieuDK = G.thieuDK(st, p, b);
  var du = G.duTien(st, p, cost);
  var tg = G.tgXay(st, p, cost);
  var s = G.sanLuong(st, p);

  var h = '<div class="the' + (thieuDK.length ? ' tat' : '') + '">';
  h += '<span class="cap">có ' + G.so(co) + (dangXay ? ' (+' + G.so(dangXay) + ')' : '') + '</span>';
  h += '<h4>' + U.esc(b.ten) + '</h4>';
  h += '<div class="mt">' + U.esc(b.mota) + '</div>';

  /* hiệu quả của cả lô đang nhập mặc định */
  var ctx = { temp: p.temp, tech: st.tech };
  if (b.prod) {
    var a = b.prod(co, ctx), c = b.prod(co + n, ctx), lines = [];
    for (var k in c) {
      var mo = (a[k] || 0), mo2 = c[k];
      var sp = (k === 'energy') ? 1 : G.C.TOC_DO_SERVER;
      lines.push((k === 'energy' ? 'Điện' : G.byId(G.RES, k).ten) + ': ' + G.so(mo * sp) + ' → <b>' + G.so(mo2 * sp) + '</b>');
    }
    h += '<div class="chi-tiet">' + lines.join('<br>') + '</div>';
  }
  if (b.cap) h += '<div class="chi-tiet">Dung tích: ' + G.so(b.cap(co)) + ' → <b>' + G.so(b.cap(co + n)) + '</b></div>';
  if (b.id === 'robot' || b.id === 'nanite' || b.id === 'shipyard' || b.id === 'lab')
    h += '<div class="mo chi-tiet">Nhiều cơ sở hơn = công suất lớn hơn.</div>';
  if (b.id === 'fleetHQ') h += '<div class="chi-tiet">Khe hạm đội: ' + G.khe(st) + ' → <b>' + (G.khe(st) + n) + '</b></div>';
  if (b.id === 'maintDepot') h += '<div class="chi-tiet">Giảm phí bảo trì: ' +
    Math.min(60, 6 * G.tongB(st, 'maintDepot')) + '% → <b>' + Math.min(60, 6 * (G.tongB(st, 'maintDepot') + n)) + '%</b></div>';
  if (b.id === 'terraform') h += '<div class="chi-tiet">Khu đất tối đa: ' +
    G.oToiDa(p) + ' → <b>' + (G.oToiDa(p) + 6 * n) + '</b></div>';

  if (thieuDK.length) h += '<div class="dk">Cần: ' + U.esc(thieuDK.join(', ')) + '</div>';
  h += '<div class="gia" id="ct-gia-' + b.id + '">' + U.gia(cost, p, st) + '</div>';
  h += '<div class="ct"><label class="mo sz">Lô <input id="ct-sl-' + b.id + '" type="number" min="1" max="10000000" value="' +
    n + '" style="width:92px"></label><button class="nut nho ' + (du && !thieuDK.length ? 'oke' : '') +
    '" data-act="xay" data-id="' + b.id + '"' + (thieuDK.length ? ' disabled' : '') + '>Xây ×' + G.so(n) + '</button>' +
    '<span class="mo sz" id="ct-tg-' + b.id + '">' + G.tg(tg) + '</span></div>';
  h += '</div>';
  return h;
};

    '<tr><td>Đánh chặn của ta</td><td class="r sz">' + G.so(p.mis.interceptor || 0) + ' quả</td></tr></table>';
  if (p.mis.icbm) {
    h += '<div class="hd-td cach-tren-xs">Mục tiêu ' +
      '<input id="tl-g" aria-label="Thiên hà mục tiêu tên lửa" type="number" min="1" max="' + G.C.SO_THIEN_HA + '" value="' + p.c.g + '" readonly title="chỉ bắn được trong cùng thiên hà">:' +
      '<input id="tl-h" aria-label="Hệ mục tiêu tên lửa" type="number" min="1" max="' + G.C.SO_HE + '" value="' + p.c.h + '">:' +
      '<input id="tl-p" aria-label="Ô mục tiêu tên lửa" type="number" min="1" max="' + G.C.SO_HANH_TINH + '" value="1">' +
      ' Số quả <input id="tl-n" aria-label="Số tên lửa" type="number" min="1" max="' + (p.mis.icbm || 1) + '" value="' + (p.mis.icbm || 1) + '" style="width:70px">' +
      ' <button class="nut xoa" data-act="ban-ten-lua">PHÓNG</button></div>';
  } else {
    h += '<p class="do">Chưa có quả nào — đóng Tên Lửa Liên Hành Tinh ở trên (cần ' +
      G.so(G.slYeuCau('missileSilo', 4)) + ' Hầm Tên Lửa).</p>';
  }
  if (st.tenLua && st.tenLua.length) {
    h += '<div class="bang-cuon cach-tren-sm"><table><tr><th>Loạt</th><th>Từ</th><th>Tới</th><th class="r">Số quả</th><th>Nổ sau</th></tr>';
    for (var z = 0; z < st.tenLua.length; z++) {
      var q3 = st.tenLua[z];
      h += '<tr><td class="sz">#' + q3.id + '</td><td class="sz">' + G.tdStr(q3.tu) + '</td><td class="sz">' +
        G.tdStr(q3.den) + '</td><td class="r sz">' + G.so(q3.n) + '</td><td class="sz cam">' + U.dem(q3.khi) + '</td></tr>';
    }
    h += '</table></div>';
  }
  h += '</div></div>';
  return h;
};

U.formMoi = function () {
  var p = U.ht();
  return { den: { g: p.c.g, h: p.c.h, p: p.c.p }, mission: 'attack', pct: 100, ships: {}, linh: {}, cargo: {}, giu: 1 };
};
U.capNhatForm = function () {
  var f = U.form; if (!f) return;
  var g = document.getElementById('f-g'), h = document.getElementById('f-h'), pp = document.getElementById('f-p');
  if (g) f.den = { g: +g.value || 1, h: +h.value || 1, p: +pp.value || 1 };
  var ms = document.getElementById('f-mission'); if (ms) f.mission = ms.value;
  var pc = document.getElementById('f-pct'); if (pc) f.pct = +pc.value || 100;
  var gi = document.getElementById('f-giu'); if (gi) f.giu = Math.max(1, +gi.value || 1);
  var i, el;
  for (i = 0; i < G.SHIPS.length; i++) {
    el = document.getElementById('ft-' + G.SHIPS[i].id);
    if (el) { var n = Math.max(0, Math.floor(+el.value || 0)); if (n) f.ships[G.SHIPS[i].id] = n; else delete f.ships[G.SHIPS[i].id]; }
  }
  if (!f.linh) f.linh = {};
  for (i = 0; i < G.BOBINH.length; i++) {
    el = document.getElementById('fl-' + G.BOBINH[i].id);
    if (el) { var nb = Math.max(0, Math.floor(+el.value || 0)); if (nb) f.linh[G.BOBINH[i].id] = nb; else delete f.linh[G.BOBINH[i].id]; }
  }
  for (i = 0; i < G.RES_HANH_TINH.length; i++) {
    el = document.getElementById('fc-' + G.RES_HANH_TINH[i]);
    if (el) { var v = Math.max(0, Math.floor(+el.value || 0)); if (v) f.cargo[G.RES_HANH_TINH[i]] = v; else delete f.cargo[G.RES_HANH_TINH[i]]; }
  }
};
U.ttBay = function () {
  var st = U.st(), p = U.ht(), f = U.form;
  if (G.trong(f.ships)) return '<span class="mo">Chọn ít nhất một tàu để xem thông số chuyến bay.</span>';
  var kc = G.khoangCach(p.c, f.den);
  var tg = G.tgBay(st, f.ships, kc, f.pct);
  var nl = G.nhienLieu(st, f.ships, kc, f.pct);
  var suc = G.khoangHang(f.ships);
  var hang = 0; for (var k in f.cargo) hang += f.cargo[k];
  var ttGiu = '';
  if (f.mission === 'hold' && G.QUY_DAO_V1 && G.nhienLieuGiu) {
    var giuGiay = Math.max(1, Math.min(24, Math.floor(+f.giu || 1))) * 3600;
    var doan = Math.max(1, G.QUY_DAO_V1.segmentSeconds);
    var dau = G.nhienLieuGiu(st, f.ships, Math.min(giuGiay, doan));
    var tong;
    if (G.nhienLieuGiuTong) tong = G.nhienLieuGiuTong(st, f.ships, giuGiay);
    else {
      tong = 0;
      for (var con = giuGiay; con > 0; con -= doan)
        tong += G.nhienLieuGiu(st, f.ships, Math.min(con, doan));
    }
    var mang = Math.max(0, Math.floor((f.cargo && f.cargo.deut) || 0));
    var lop = mang < dau ? 'do' : (mang < tong ? 'vang' : 'luc');
    ttGiu = '<tr><td>NL kỳ quỹ đạo đầu</td><td class="r sz ' + lop + '">' + G.so(dau) + '</td>' +
      '<td>NL giữ đủ ' + Math.round(giuGiay / 3600) + ' giờ</td><td class="r sz ' + lop + '">' +
      G.so(tong) + ' <span class="mo">(đang chở ' + G.so(mang) + ')</span></td></tr>' +
      '<tr><td colspan="4" class="' + lop + '">Nhiên liệu giữ quỹ đạo phải nằm trong khoang hàng. ' +
      (mang < dau
        ? 'Chưa đủ kỳ đầu nên máy chủ sẽ không cho xuất kích.'
        : (mang < tong
          ? 'Đủ vào quỹ đạo, nhưng nếu không đủ một kỳ trả trước kế tiếp thì toàn bộ tàu còn lại sẽ bị phá huỷ thành phế liệu.'
          : 'Đủ theo kế hoạch hiện tại; gọi về sớm không hoàn lại phần đã trả.')) + '</td></tr>';
  }
  return '<table><tr>' +
    '<td>Khoảng cách</td><td class="r sz">' + G.so(kc) + '</td>' +
    '<td>Tốc độ hạm đội</td><td class="r sz">' + G.so(G.tocDoHam(st, f.ships)) + '</td></tr>' +
    '<tr><td>Thời gian bay</td><td class="r sz cam">' + G.tg(tg) + '</td>' +
    '<td>Cả đi lẫn về</td><td class="r sz">' + G.tg(tg * 2) + '</td></tr>' +
    '<tr><td>Nhiên liệu</td><td class="r sz ' + ((p.res.deut || 0) < nl ? 'do' : 'luc') + '">' + G.so(nl) + ' NL</td>' +
    '<td>Khoang hàng</td><td class="r sz ' + (hang > suc ? 'do' : '') + '">' + G.so(hang) + ' / ' + G.so(suc) + '</td></tr>' +
    '<tr><td>Thủy thủ đoàn</td><td class="r sz">' + G.so(G.thuyThu(f.ships)) + '</td>' +
    '<td>Khe hạm đội</td><td class="r sz">' + st.fleets.length + ' / ' + G.khe(st) + '</td></tr>' +
    ttGiu +
    (G.trong(f.linh || {}) ? '' :
      '<tr><td>Quân đổ bộ</td><td class="r sz">' + G.so(G.choLinhCan(f.linh)) + ' chỗ</td>' +
      '<td>Hạm đội chở được</td><td class="r sz ' + (G.choLinhCan(f.linh) > G.sucChoLinh(f.ships) ? 'do' : 'luc') + '">' +
      G.so(G.sucChoLinh(f.ships)) + '</td></tr>') +
    '</table>';
};

    for (i = 0; i < pvGiu.length; i++) {
      var qg = pvGiu[i], keyGiu = qg.den || qg.planetKey || '', pGiu = U.htTheoKey(keyGiu);

      'Mỗi đội dùng công nghệ của chính chủ sở hữu; thiệt hại được ghi lại đúng vào đội đó.</p></div></div>';
  }

  if (st.toi.length || pvToi.length) {
    h += '<div class="panel"><h2>Hạm đội đang bay tới hành tinh của ta</h2><div class="noi bang-cuon"><table>' +

      '</div></div>';
  }

  h += '<div class="luoi2"><div>';
  h += '<div class="nhom-truong"><b>Mục tiêu</b><div class="hd-td cach-tren-2xs">' +
    '<input id="f-g" aria-label="Thiên hà mục tiêu" type="number" min="1" max="' + G.C.SO_THIEN_HA + '" value="' + f.den.g + '">:' +
    '<input id="f-h" aria-label="Hệ mục tiêu" type="number" min="1" max="' + G.C.SO_HE + '" value="' + f.den.h + '">:' +

  h += '<div id="hd-tt">' + U.ttBay() + '</div>';

  h += '</div><button class="nut nho cach-tren-xs" data-act="max-hang">Xếp đầy khoang</button>';

    else if (o.npc && o.npc.bo) cls = 'npc-bo';
    h += '<tr class="' + cls + '"><td class="sz">' + (o.loai === 'sau' ? '<span class="tim">' + c.p + '</span>' : c.p) + '</td>';
    if (o.loai === 'sau') {
      h += '<td class="tim">— vùng không gian sâu —</td><td class="mo">chỉ nhận nhiệm vụ Thám Hiểm</td><td></td><td class="r"></td>';
    } else if (o.loai === 'trong') {
      var Lt = G.LHT(G.loaiTheoViTri(st.seed, c));
      h += '<td class="mo">— trống — <span style="color:' + Lt.mau + '">' + U.esc(Lt.ten) + '</span></td><td></td><td></td><td class="r"></td>';
    } else if (o.loai === 'toi') {
      h += '<td><b>' + U.esc(o.p.ten) + '</b></td><td class="luc">' + U.esc(st.ten) + ' (ta)</td><td class="tag-lm">' +
        U.esc(st.lm ? st.lm.ten : '') + '</td><td class="r sz">' + G.so(d.tong) + '</td>';
    } else if (o.loai === 'nguoi') {
      h += '<td>' + U.esc(o.htTen) + '</td><td class="cam"><b>' + U.esc(o.ten) + '</b>' +
        (o.online ? ' <span class="luc" title="đang chơi">●</span>' : '') +
        (o.bo ? ' <span class="vang">(lâu không vào)</span>' : '') +
        '</td><td class="tag-lm">' + U.esc(o.lm || '') + '</td><td class="r sz">' + G.so(o.diem) + '</td>';
    } else {
      var n = o.npc;
      var Ln = G.LHT(G.loaiTheoViTri(st.seed, c));
      h += '<td>' + U.esc(n.htTen) + ' <span class="mo" style="color:' + Ln.mau + '">' + U.esc(Ln.ten) + '</span></td><td>' +
        U.esc(n.ten) + (n.bo ? ' <span class="vang">(bỏ hoang)</span>' : '') +
        '</td><td class="tag-lm">' + U.esc(n.lm) + '</td><td class="r sz">' + G.so(n.diem) + '</td>';
    }
    h += '<td class="pl">' + (o.debris ? G.soNgan(o.debris.metal) + ' KL / ' + G.soNgan(o.debris.crystal) + ' TA' : '') + '</td>';
    h += '<td class="khong-xuong-dong">';

        h += '<span class="luc sz">Đồng minh</span> ';

        h += '<span class="vang sz">Được đánh sau ' + U.dem(o.chien.hieuLuc) + '</span> ';
      else if (!o.chien || o.chien.coQuyenTuyen !== false)
        h += '<button class="nut nho xoa" data-act="tuyen-chien" data-tk="' + o.tk + '" data-ten="' +
          U.esc(o.ten) + '">Tuyên chiến</button> ';
      else
        h += '<span class="mo sz">Chủ liên minh mới được tuyên chiến</span> ';
      if (st.spy && st.spy[o.key]) h += '<button class="nut nho" data-act="xem-tt" data-key="' + o.key + '">Tin tình báo</button> ';
    } else if (o.loai === 'sau') {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="thamhiem">Thám hiểm</button> ';
    } else if (o.loai === 'trong') {
      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="colonize">Thực dân</button> ';
    } else {

      h += '<button class="nut nho" data-act="nv" data-td="' + td + '" data-m="hold">Đóng quân</button> ';

    h += '</td></tr>';
  }

    (APP.mp ? 'Ô màu <span class="cam">cam</span> là hành tinh của người chơi khác. Phải tuyên chiến và chờ Hội Đồng Bảo An 24 giờ trước khi đánh; chỉ đồng minh mới tiếp tế được cho nhau. '
            : 'Hành tinh <span class="vang">bỏ hoang</span> ít phòng thủ nhưng nhiều tài nguyên.') + '</p>';
  h += '</div></div>';
  return h;
};

/* ======================================================================
 * MÀN: LIÊN MINH / XẾP HẠNG
 * ==================================================================== */
U.m_lienminh = function () {
  var st = U.st();

  if (st.lm) {
    h += '<h3>' + U.esc(st.lm.ten) + '</h3>';
    h += '<p>Gia nhập ngày ' + G.gio(st.lm.t * 1000) + '. Quyền lợi: <b>+5% sản lượng</b> toàn đế quốc, ' +
      'được đứng tên liên minh trên bảng xếp hạng' + (APP.mp ? ' và dùng kênh chat riêng' : '') + '.</p>';
    /* [v7] chính thể & phiếu — chỉ bản nhiều người có bảng phiếu thật */
    if (APP.mp && U.nguon.chinhThe) {
      var ctTen = { docTai: 'Độc Tài', danChu: 'Dân Chủ', congHoa: 'Cộng Hoà' };
      h += '<p>Chính thể: <b class="vang">' + (ctTen[U.nguon.chinhThe()] || 'Độc Tài') + '</b>' +

      if (phieu.length) {
        h += '<div class="bang-cuon"><table><tr><th>Phiếu</th><th class="r">Tán thành / Chống</th>' +
          '<th class="r">Hạn</th><th class="r">Kết quả</th><th></th></tr>';
        for (var pv = 0; pv < phieu.length; pv++) {
          var P = phieu[pv];
          var mo = P.dangMo;
          h += '<tr><td>' + P.loai + ' #' + P.id + (P.doiTuong ? ' → #' + P.doiTuong : '') + '</td>' +
            '<td class="r sz luc">' + P.ung + '</td><td class="r sz do">' + P.chong + '</td>' +
            '<td class="r sz">' + (mo ? G.tg(P.hetHan - U.st().now) : (P.ketQua === 'dat' ? 'ĐẠT' : 'Không đạt')) + '</td>' +
            '<td class="r">' + (mo && U.nguon.duocBau ?
              '<button class="nut nho oke" data-act="bau-phieu" data-id="' + P.id + '" data-giatri="1">Tán thành</button> ' +
              '<button class="nut nho xoa" data-act="bau-phieu" data-id="' + P.id + '" data-giatri="0">Chống</button>' : '') +
            '</td></tr>';
        }
        h += '</table></div>';
      }
    }
    if (U.nguon.thanhVien) {
      var tv = U.nguon.thanhVien(st.lm.ten);
      if (tv && tv.length) {
        h += '<div class="bang-cuon"><table><tr><th>Thành viên</th><th class="r">Điểm</th><th class="r">Hành tinh</th>' +
          (APP.mp ? '<th></th>' : '') + '</tr>';
        for (var t = 0; t < tv.length; t++)
          h += '<tr' + (tv[t].ta ? ' class="toi"' : '') + '><td>' + U.esc(tv[t].ten) +
            (tv[t].chu ? ' <b class="vang">[Chủ]</b>' : '') + (tv[t].ta ? ' <b class="luc">(ta)</b>' : '') +
            '</td><td class="r sz">' + G.so(tv[t].diem) + '</td><td class="r sz">' + tv[t].ht + '</td>' +
            (APP.mp ? '<td class="r">' + (tv[t].ta ? '' : '<button class="nut nho" data-act="chuyen-galana" data-tk="' +
              tv[t].tk + '" data-ten="' + U.esc(tv[t].ten) + '">Chuyển Galana</button>') + '</td>' : '') + '</tr>';
        h += '</table></div>';
      }
    }
    h += '<button class="nut xoa cach-tren-xs" data-act="lm-ra">Rời liên minh</button>';
  } else {
    h += '<p class="mo">Gia nhập liên minh để nhận <b>+5% sản lượng</b> và danh nghĩa trên bảng xếp hạng. ' +
      (APP.mp ? 'Bản nhiều người còn có kênh chat riêng; chủ liên minh phải duyệt đơn trước khi thành viên được vào.' : '') + '</p>';
    var ds = U.nguon.dsLM();
    h += '<div class="bang-cuon"><table><tr><th>Liên minh</th><th class="r">Thành viên</th><th class="r">Tổng điểm</th><th></th></tr>';
    for (var i = 0; i < ds.length; i++) {
      var e = ds[i];
      var daXin = U.nguon.daXin && U.nguon.daXin(e.ten);
      var sl = e.sl, dm = e.diem;
      if (sl === undefined) {
        sl = 0; dm = 0;
        var xh = U.nguon.xepHang();
        for (var j = 0; j < xh.length; j++) if (xh[j].lm === e.ten) { sl++; dm += xh[j].diem; }
      }
      h += '<tr><td class="tag-lm">' + U.esc(e.ten) + '</td><td class="r sz">' + G.so(sl) + '</td><td class="r sz">' + G.so(dm) +
        '</td><td class="r"><button class="nut nho oke" data-act="lm-vao" data-ten="' + U.esc(e.ten) + '"' +
        (daXin ? ' disabled' : '') + '>' + (daXin ? 'Đã gửi đơn' : 'Xin vào') + '</button></td></tr>';
    }
    h += '</table></div>';
  }
  h += '</div></div>';
  return h;
};

U._nguCanhDaVe = '';
U.nguCanhVe = function () {
  var phu = '';
  if (U.man === 'taichinh') phu = 'tab:' + (U.tabTC || '');
  else if (U.man === 'xephang') phu = 'loai:' + (U.xhLoai || '');
  else if (U.man === 'thienha' && U.gal) phu = 'he:' + U.gal.g + ':' + U.gal.h;
  return [U.man, U.pi, phu].join('|');
};
U.nhoTruongDangNhap = function (root) {
  var el = document.activeElement;
  if (!root || !el || !el.id) return null;
  if (typeof root.contains === 'function' && !root.contains(el)) return null;
  var tag = String(el.tagName || '').toLowerCase();
  if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return null;
  var type = String(el.type || '').toLowerCase();
  if (el.hidden || (tag === 'input' && (type === 'hidden' || type === 'file'))) return null;
  var o = { id: el.id, tag: tag, type: type };
  if ('value' in el) o.value = el.value;
  if ('checked' in el) o.checked = !!el.checked;
  try {
    if (typeof el.selectionStart === 'number') {
      o.selectionStart = el.selectionStart;
      o.selectionEnd = el.selectionEnd;
      o.selectionDirection = el.selectionDirection || 'none';
    }
  } catch (e) { /* input number/range không hỗ trợ selection */ }
  return o;
};
U.traTruongDangNhap = function (root, o) {
  if (!root || !o) return;
  var el = document.getElementById(o.id);
  if (!el || (typeof root.contains === 'function' && !root.contains(el))) return;
  if (String(el.tagName || '').toLowerCase() !== o.tag || String(el.type || '').toLowerCase() !== o.type) return;
  if (el.disabled || el.hidden || (el.closest && el.closest('[hidden],[inert],[aria-hidden="true"]'))) return;
  if (typeof el.getClientRects === 'function' && !el.getClientRects().length) return;
  if (typeof window.getComputedStyle === 'function') {
    var cs = window.getComputedStyle(el);
    if (cs && (cs.display === 'none' || cs.visibility === 'hidden')) return;
  }
  if (o.tag === 'select' && o.value !== undefined && el.options) {
    var coLuaChon = false;
    for (var i = 0; i < el.options.length; i++) if (el.options[i].value === o.value) { coLuaChon = true; break; }
    if (!coLuaChon) return;
  }
  var daDoi = false;
  if (o.value !== undefined && el.value !== o.value) { el.value = o.value; daDoi = true; }
  if (o.checked !== undefined && el.checked !== o.checked) { el.checked = o.checked; daDoi = true; }
  /* Một số trường có phần xem trước phụ thuộc value; đồng bộ lại nó sau khi

  if (daDoi && o.id !== 'f-mission' && typeof el.dispatchEvent === 'function' && typeof window.Event === 'function')
    el.dispatchEvent(new window.Event('input', { bubbles: true }));
  el = document.getElementById(o.id);
  if (!el || (typeof root.contains === 'function' && !root.contains(el))) return;
  if (String(el.tagName || '').toLowerCase() !== o.tag || String(el.type || '').toLowerCase() !== o.type) return;
  if (el.disabled || el.hidden || (el.closest && el.closest('[hidden],[inert],[aria-hidden="true"]'))) return;

U.nhoDieuKhienFocus = function () {
  var el = document.activeElement;
  if (!el || el === document.body) return null;
  var tag = String(el.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return null;
  if (el.id) {
    var theoId = { id: el.id, tag: tag };
    if (el.id === 'nut-tinh-hinh-chinh' && typeof el.getAttribute === 'function')
      theoId.attrs = {
        'data-act': el.getAttribute('data-act'),
        'data-alert-key': el.getAttribute('data-alert-key'),
        'data-man': el.getAttribute('data-man'),
        'data-pi': el.getAttribute('data-pi')
      };
    return theoId;
  }
  if (typeof el.getAttribute !== 'function') return null;
  var act = el.getAttribute('data-act');
  if (!act) return null;
  var attrs = {};
  if (el.attributes && typeof el.attributes.length === 'number') {
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      if (a && a.name && a.name.indexOf('data-') === 0) attrs[a.name] = a.value;
    }
  }
  if (!Object.keys(attrs).length) {
    var ds = ['data-act', 'data-man', 'data-workspace', 'data-id', 'data-tab', 'data-loai', 'data-fid', 'data-i',
      'data-dg', 'data-dh', 'data-td', 'data-m', 'data-tk', 'data-kenh', 'data-pi', 'data-alert-key',
      'data-queue-key', 'data-planet-key'];
    for (var j = 0; j < ds.length; j++) {
      var v = el.getAttribute(ds[j]);
      if (v !== null && v !== '') attrs[ds[j]] = v;
    }
  }
  return { tag: tag, attrs: attrs };
};
U.coTheFocus = function (el, tag) {
  if (!el || String(el.tagName || '').toLowerCase() !== tag || el.disabled || el.hidden) return false;
  if (el.closest && el.closest('[hidden],[inert],[aria-hidden="true"]')) return false;
  if (typeof el.getClientRects === 'function' && !el.getClientRects().length) return false;
  if (typeof window.getComputedStyle === 'function') {
    var cs = window.getComputedStyle(el);
    if (cs && (cs.display === 'none' || cs.visibility === 'hidden')) return false;
  }

};
U.traDieuKhienFocus = function (o) {
  if (!o) return;
  var el = o.id ? document.getElementById(o.id) : null;
  if (el && o.attrs && typeof el.getAttribute === 'function')
    for (var ak in o.attrs) if (el.getAttribute(ak) !== o.attrs[ak]) { el = null; break; }
  if (el && !U.coTheFocus(el, o.tag)) el = null;
  if (!el && o.attrs && typeof document.querySelectorAll === 'function') {
    var ds = document.querySelectorAll('[data-act]');
    for (var i = 0; i < ds.length; i++) {
      var dung = String(ds[i].tagName || '').toLowerCase() === o.tag;
      for (var k in o.attrs) if (ds[i].getAttribute(k) !== o.attrs[k]) { dung = false; break; }
      if (dung && U.coTheFocus(ds[i], o.tag)) { el = ds[i]; break; }
    }
  }
  if (!el && o.id === 'nut-tinh-hinh-chinh') {
    el = document.getElementById('thanh-canh');
    if (!el || typeof el.focus !== 'function') return;
  }
  if (!el || (el.id !== 'thanh-canh' && !U.coTheFocus(el, o.tag))) return;
  try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) { } }
};
U.nhoChiTietMo = function (root) {

U.traChiTietMo = function (root, ids) {

U.giaTriLive = function (st, key, cache) {
  cache = cache || {};
  var m, p, q, i, t;
  function ketQua(kind, value) { return value === undefined || value === null ? null : { kind: kind, value: value }; }
  function hanhTinh(pi) { return Number.isInteger(pi) && pi >= 0 && pi < (st.planets || []).length ? st.planets[pi] : null; }
  function ham(id) {
    if (!cache.fleets) {
      cache.fleets = {};
      for (var fi = 0; fi < (st.fleets || []).length; fi++) cache.fleets[String(st.fleets[fi].id)] = st.fleets[fi];
    }
    return cache.fleets[String(id)] || null;
  }
  function giu(id) {
    if (!cache.garrisons) {
      cache.garrisons = {};
      for (var gi = 0; gi < (st.pvpGiu || []).length; gi++) cache.garrisons[String(st.pvpGiu[gi].id)] = st.pvpGiu[gi];
    }
    return cache.garrisons[String(id)] || null;
  }
  function summary(pi) {
    cache.alerts = cache.alerts || U.tinhViecCanXuLy(st);
    cache.summaries = cache.summaries || {};
    if (!cache.summaries[pi]) cache.summaries[pi] = U.tomTatHanhTinh(st, hanhTinh(pi), pi, cache.alerts);
    return cache.summaries[pi];
  }
  if ((m = /^alert\.(.+)\.eta$/.exec(key))) {
    cache.alerts = cache.alerts || U.tinhViecCanXuLy(st);
    cache.alertsById = cache.alertsById || {};
    if (!cache.alertsByIdDaTao) {
      for (i = 0; i < cache.alerts.length; i++) cache.alertsById[String(cache.alerts[i].id)] = cache.alerts[i];
      cache.alertsByIdDaTao = true;
    }
    return ketQua('time', cache.alertsById[m[1]] && cache.alertsById[m[1]].etaAt);
  }
  if ((m = /^matrix\.(build|research)\.(\d+)$/.exec(key))) {
    p = hanhTinh(+m[2]); if (!p) return null;
    t = summary(+m[2]);
    return ketQua('time', m[1] === 'build' ? t.build.etaAt : t.research.etaAt);
  }
  if ((m = /^operation\.(build|ship|research)\.(-?\d+|null)\.(\d+)(?:\.(count))?$/.exec(key))) {
    var piOp = m[2] === 'null' ? -1 : +m[2], idx = +m[3];
    if (m[1] === 'research') return ketQua('time', st.ncQueue && st.ncQueue.status !== 'retry' ? U.mocThoiGian(st.ncQueue.finishAt) : null);
    p = hanhTinh(piOp); if (!p) return null;
    q = m[1] === 'build' ? (p.qB || [])[idx] : (p.qS || [])[idx];
    if (!q) return null;
    if (m[4] === 'count') return ketQua('text', G.so(Math.max(0, Number(q.n) || 0)));
    return ketQua('time', m[1] === 'build' ? U.mocThoiGian(q.xong) : U.mocThoiGian(st.now + Math.max(0, Number(q.tLeft) || 0)));
  }
  if ((m = /^planet\.(\d+)\.(power|population|support|ships)$/.exec(key))) {
    p = hanhTinh(+m[1]); if (!p) return null;
    t = summary(+m[1]);
    return ketQua('text', t[m[2]].label);
  }
  if ((m = /^planet\.(\d+)\.ground\.html$/.exec(key))) {
    p = hanhTinh(+m[1]);
    return p && p.linh && typeof p.linh === 'object' ? ketQua('html', U.dsTau(p.linh)) : null;
  }
  if ((m = /^unit\.(\d+)\.(ship|mis|bo|def)\.(.+)\.summary$/.exec(key))) {
    p = hanhTinh(+m[1]); if (!p) return null;
    var loai = m[2], idDv = m[3], co = loai === 'ship' ? ((p.ships || {})[idDv] || 0) :
      (loai === 'mis' ? ((p.mis || {})[idDv] || 0) : (loai === 'bo' ? ((p.linh || {})[idDv] || 0) : ((p.def || {})[idDv] || 0)));
    var dang = G.dangDong ? G.dangDong(p, idDv) : 0;
    return ketQua('text', 'có ' + G.so(co) + (dang ? ' (+' + G.so(dang) + ')' : ''));
  }
  if ((m = /^planet\.(\d+)\.ship\.(.+)\.available$/.exec(key))) {
    p = hanhTinh(+m[1]);
    return p ? ketQua('number', Math.max(0, Number((p.ships || {})[m[2]]) || 0)) : null;
  }
  if (key === 'empire.points') {
    try { return ketQua('text', G.so(G.diem(st).tong)); } catch (eDiem) { return ketQua('text', 'Chưa có dữ liệu'); }
  }
  if (key === 'empire.population' || key === 'empire.support') {
    var tong = 0, dem = 0;
    for (i = 0; i < (st.planets || []).length; i++) if (st.planets[i] && st.planets[i].danSu) {
      var raw = key === 'empire.population' ? st.planets[i].danSu.population : st.planets[i].danSu.supportBp;
      if (raw !== null && raw !== undefined && raw !== '' && Number.isFinite(Number(raw))) { tong += Number(raw); dem++; }
    }
    return ketQua('text', dem ? (key === 'empire.population' ? G.soNgan(tong) : U.bp(tong / dem)) : 'Chưa có dữ liệu');
  }
  if ((m = /^fleet\.(.+)\.(eta|refuel|cargo)$/.exec(key))) {
    var fl = ham(m[1]); if (!fl) return null;
    if (m[2] === 'cargo') return ketQua('html', U.dsRes(fl.cargo || {}));
    if (m[2] === 'refuel') return ketQua('time', U.mocThoiGian(fl.tiepNL_t));
    return ketQua('time', fl.pha === 've' ? U.mocThoiGian(fl.ve_t) : (fl.pha === 'giu' ? U.mocThoiGian(fl.giuDen_t) : U.mocThoiGian(fl.den_t)));
  }
  if ((m = /^garrison\.(.+)\.(leave|refuel)$/.exec(key))) {
    var qg = giu(m[1]); if (!qg) return null;
    return ketQua('time', U.mocThoiGian(m[2] === 'leave' ? qg.giuDen_t : qg.tiepNL_t));
  }
  return null;
};

U.live = function () {
  var st = U.st();
  if (!st) return;
  if (U.sig() !== U.sigCu) { U.ve(); return; }
  var p = U.ht(), s = null, i;
  if (p && p.res && p.b) try { s = G.sanLuong(st, p); } catch (eSan) { s = null; }
  var liveCache = {};
  var els = document.querySelectorAll('[data-live]');
  for (i = 0; i < els.length; i++) {
    var k = els[i].getAttribute('data-live'), v;
    if (k.indexOf('res.') === 0 && p && p.res) v = G.soNgan(p.res[k.slice(4)] || 0);
    else if (k.indexOf('rate.') === 0 && s && s.r) { var rk = k.slice(5); v = (s.r[rk] >= 0 ? '+' : '') + G.soNgan(s.r[rk]) + '/g'; }
    else if (k === 'galana') v = G.soNgan(st.galana);
    else if (k === 'tech') v = G.soNgan(st.techPts);
    else {
      var live = U.giaTriLive(st, k, liveCache);
      if (live && live.kind === 'time') {
        if (typeof els[i].setAttribute === 'function') els[i].setAttribute('data-t', Math.round(live.value));
      } else if (live && live.kind === 'html') {
        if (els[i].innerHTML !== live.value) els[i].innerHTML = live.value;
      } else if (live && live.kind === 'number') {
        var maxMoi = String(live.value);
        if (typeof els[i].setAttribute === 'function' && els[i].getAttribute('max') !== maxMoi) els[i].setAttribute('max', maxMoi);
      } else if (live) v = String(live.value);
    }
    if (v !== undefined && els[i].textContent !== v) els[i].textContent = v;
  }
  var ds = document.querySelectorAll('.dem');
  for (i = 0; i < ds.length; i++) {
    var t = +ds[i].getAttribute('data-t');
    if (Number.isFinite(t)) ds[i].textContent = G.tg(t - st.now);
  }
};

/* THIÊN HÀ ĐẠI CHIẾN — tầng thao tác giao diện (dùng chung cho 1 người & nhiều người)
 * Mọi thao tác của người chơi đi qua APP.lam(ten, dl, xong):
 *   - bản một người  (js/main.js): chạy G.chay() ngay trên state trong máy
 *   - bản nhiều người (web/js/mp.js): gửi lên server, server mới là bên quyết định
 * File này chỉ lo thu dữ liệu từ DOM, hiện hộp thoại và vẽ lại.            */
'use strict';

  xepHang: function (loai) { return G.xepHang(U.st(), loai); },
  dsLM: function () {
    var out = [];
    for (var i = 0; i < G.LIEN_MINH.length; i++) if (G.LIEN_MINH[i]) out.push({ ten: G.LIEN_MINH[i] });
    return out;
  }
};

function soO(id) { var e = document.getElementById(id); return e ? Math.max(0, Math.floor(+e.value || 0)) : 0; }
function soO2(e) { return e ? Math.max(0, Math.floor(+e.value || 0)) : 0; }
function piTuEl(el) {
  var raw = el && typeof el.getAttribute === 'function' ? el.getAttribute('data-pi') : null;
  var pi = raw === null || raw === '' ? NaN : Number(raw), st = U.st();
  return Number.isInteger(pi) && pi >= 0 && st && pi < st.planets.length ? pi : U.pi;
}
function queueConKhop(el, loai) {
  var expected = el && el.getAttribute ? (el.getAttribute('data-queue-key') || '') : '';
  if (!expected) return true;
  var st = U.st(), actual = '';
  if (loai === 'research') actual = U.khoaNghienCuu(st && st.ncQueue);
  else {
    var pi = piTuEl(el), p = st && st.planets && st.planets[pi];
    actual = U.khoaHangDoi(loai, p ? (loai === 'build' ? p.qB : p.qS) : []);
  }
  if (actual === expected) return true;
  U.toast('Hàng đợi đã thay đổi. Hãy kiểm tra lại trước khi huỷ.', 'loi');
  U.ve();
  return false;
}
function veLai(err, okMsg) {
  if (err) U.toast(err, 'loi');
  else if (okMsg) U.toast(okMsg, 'ok');
  U.ve();
}
/* gửi một hành động lên "máy" (local hoặc server) */

    var suc = G.khoangHang(f.ships);
    var nl = G.nhienLieu(st, f.ships, G.khoangCach(p.c, f.den), f.pct);
    f.cargo = {};
    var con = suc, ds = ['metal', 'crystal', 'deut', 'food'];
    /* Với Giữ Chỗ, ưu tiên nạp đủ nhiên liệu quỹ đạo đã lên kế hoạch. Đây chỉ

    if (f.mission === 'hold' && G.QUY_DAO_V1 && G.nhienLieuGiu) {

      if (G.nhienLieuGiuTong) canGiu = G.nhienLieuGiuTong(st, f.ships, giuGiay);
      else for (var giuCon = giuGiay; giuCon > 0; giuCon -= doan)
        canGiu += G.nhienLieuGiu(st, f.ships, Math.min(giuCon, doan));
      var deutCo = Math.max(0, Math.floor((p.res.deut || 0) - nl));
      var napGiu = Math.min(con, deutCo, canGiu);
      if (napGiu > 0) { f.cargo.deut = napGiu; con -= napGiu; }
      ds = ['metal', 'crystal', 'food'];

    for (var i = 0; i < ds.length && con > 0; i++) {
      var co = Math.max(0, Math.floor((p.res[ds[i]] || 0) - (ds[i] === 'deut' ? nl : 0)));

    }
    U.ve();
  },

  'mp-nap-ham': function () { U.mpDoc(); U.mp.A.ships = G.clone(U.ht().ships || {}); U.ve(); },
  'mp-xoa': function () { U.mp = U.mpMoi(); U.mp.A.ships = {}; U.ve(); },
  'mp-nap-bc': function () {
    U.mpDoc();
    var s = document.getElementById('mp-bc');
    if (s && s.value) { U.mpNapDoTham(s.value); U.ve(); }
    else U.toast('Chọn một báo cáo do thám đã.', 'loi');
  },

  /* ---------- tin nhắn ---------- */
  'doc-tin': function (el) {
    var id = +el.getAttribute('data-id');
    var st = U.st();
    var msg = null;
    for (var k = 0; k < st.msgs.length; k++) { if (st.msgs[k].id === id) { msg = st.msgs[k]; break; } }
    if (!msg) { U.ve(); return; }
    U.moTin[id] = !U.moTin[id];
    if (!msg.doc) { msg.doc = true; lam('doctin', { i: id }); }
    else U.ve();
  },
  'doc-het': function () {
    var st = U.st();
    st.msgs.forEach(function (m) { if (m.id) { m.doc = true; delete U.moTin[m.id]; } });
    lam('docHet');
  },
  'xoa-tin': function () { U.moTin = {}; lam('xoatin'); },
  'xem-tt': function (el) {
    var st = U.st();
    var bc = st.spy && st.spy[el.getAttribute('data-key')];
    if (bc) U.hop('Tin tình báo ' + G.tdStr(bc.td), U.veDoTham(bc));
  },

  /* ---------- liên minh ---------- */
  'lm-vao': function (el) { lam('lmvao', { ten: el.getAttribute('data-ten') }, 'Đã gửi đơn và được nhận.'); },
  'lm-ra': function () { lam('lmra', {}, 'Đã rời liên minh.'); },

  /* ---------- bỏ hoang thuộc địa ---------- */
  'bo-hoang': function () {
    var p = U.ht();
    var planetKey = U.keyHanhTinh(p);
    if (!p || !planetKey) { U.toast('Chưa có đủ dữ liệu hành tinh để xác nhận.', 'loi'); return; }
    U.hop('Bỏ hoang ' + p.ten + '?',
      '<p>Toàn bộ công trình, tàu và tài nguyên trên <b>' + U.esc(p.ten) + '</b> ' + G.tdStr(p.c) +
      ' sẽ mất. Ô toạ độ trở về trạng thái trống, ai cũng có thể tới chiếm. <b>Không lấy lại được.</b></p>' +
      '<label for="bh-xn">Gõ chữ <b>BO</b> để xác nhận:</label><br>' +
      '<input id="bh-xn" maxlength="10" style="width:120px"> ' +
      '<button class="nut xoa" data-act="bo-hoang-ok" data-pi="' + U.pi + '" data-planet-key="' + U.esc(planetKey) + '">Bỏ hoang</button>');
  },
  'bo-hoang-ok': function (el) {
    var e2 = document.getElementById('bh-xn'), st = U.st();
    var planetKey = el.getAttribute('data-planet-key') || '', pi = +el.getAttribute('data-pi');
    if (planetKey) {
      pi = U.piTheoKey(st, planetKey);
      if (pi < 0) {
        U.dongHop(); U.toast('Hành tinh xác nhận đã thay đổi hoặc không còn tồn tại.', 'loi'); U.ve(); return;
      }
    }
    APP.lam('boHoang', { pi: pi, xacnhan: e2 && typeof e2.value === 'string' ? e2.value.trim().toUpperCase() : '' },
      function (err) {
        U.dongHop();
        if (!err) U.datPi(0);
        veLai(err, err ? null : 'Đã bỏ hoang thuộc địa.');
      });
  },

  /* ---------- đổi tên hành tinh ---------- */
  'doi-ten': function () {
    var p = U.ht();
    U.hop('Đổi tên hành tinh',
      '<label for="ten-ht">Tên mới cho hành tinh ' + G.tdStr(p.c) + ':</label><br>' +
      '<input id="ten-ht" maxlength="24" value="' + U.esc(p.ten) + '" style="width:260px">' +
      ' <button class="nut oke" data-act="doi-ten-ok">Đổi</button>');
  },
  'doi-ten-ok': function () {
    var e = document.getElementById('ten-ht');
    APP.lam('doiTenHT', { pi: U.pi, ten: e ? e.value : '' }, function (err) { U.dongHop(); veLai(err); });
  }
};

/* Driver có thể bổ sung/ghi đè hành động riêng (lưu file, đăng xuất...) */
APP.themACT = function (o) { for (var k in o) ACT[k] = o[k]; };
APP.ACT = ACT;

document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'hop-thoai') { U.dongHop(); return; }
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var a = el.getAttribute('data-act');
  if (ACT[a]) { e.preventDefault(); ACT[a](el); }
});

document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && String(e.key || '').toLowerCase() === 'k') {
    e.preventDefault(); U.moMenuNhanh(); return;
  }
  if (e.key === 'Escape') {
    var res = document.getElementById('tt-res'), menu = document.getElementById('menu');
    var resDangMo = !!(res && res.classList && res.classList.contains('mo-ra') &&
      (!U.resLaDisclosure || U.resLaDisclosure()));
    var menuDangMo = !!(menu && menu.classList && menu.classList.contains('mo-ra') &&
      (!U.menuLaDisclosure || U.menuLaDisclosure()));
    if (resDangMo || menuDangMo) e.preventDefault();
    U.datMenuMo(false); U.datResMo(false);
    if (resDangMo && U.traFocusRes) U.traFocusRes();
    else if (menuDangMo && U.traFocusMenu) U.traFocusMenu();
  }
  if (e.key === 'Enter' && e.target && e.target.id === 'menu-nhanh-tim') {
    var dau = document.querySelector('#menu-nhanh-ds [data-act="menu-nhanh-di"]');
    if (dau) { e.preventDefault(); dau.click(); }
  }
});

/* cập nhật form hạm đội mà không vẽ lại (giữ con trỏ trong ô nhập) */
document.addEventListener('input', function (e) {
  if (!window.ST) return;
  var id = e.target.id || '';
  if (id === 'menu-nhanh-tim') U.veMenuNhanh(e.target.value);
  if (id === 'f-pct') { var v = document.getElementById('f-pct-v'); if (v) v.textContent = e.target.value + '%'; }
  if (/^cho-/.test(id)) U.cho[id.slice(4)] = Math.max(0, Math.floor(+e.target.value || 0));
  if (/^ct-sl-/.test(id)) {
    var bid = id.slice(6), b = G.B(bid), n = Math.max(1, Math.min(10000000, Math.floor(+e.target.value || 1)));
    var gia = document.getElementById('ct-gia-' + bid), tg = document.getElementById('ct-tg-' + bid);
    var nut = document.querySelector('[data-act="xay"][data-id="' + bid + '"]');
    var cost = b ? G.giaCongTrinh(b, n) : null;
    if (b && gia) gia.innerHTML = U.gia(cost, U.ht(), U.st());
    if (b && tg) tg.textContent = G.tg(G.tgXay(U.st(), U.ht(), cost));
    if (nut) {
      nut.textContent = 'Xây ×' + G.so(n);
      nut.classList.toggle('oke', !!b && G.duTien(U.st(), U.ht(), cost) && !G.thieuDK(U.st(), U.ht(), b).length);
    }
  }
  if (/^(f-|ft-|fc-|fl-)/.test(id)) {
    U.capNhatForm();
    var tt = document.getElementById('hd-tt');
    if (tt) tt.innerHTML = U.ttBay();
    if (id === 'f-mission') U.ve();
  }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'chon-ht') { U.datPi(+e.target.value); U.ve(); }
  if (APP.doiFile) APP.doiFile(e);
});

/* ---------- nhịp đập chung: 1 giây một lần ---------- */
APP.batDauNhip = function () {
  setInterval(function () {
    if (!window.ST) return;
    try {
      G.tick(window.ST, G.giay());
      U.live();
    } catch (e) { console.error('[nhip]', e); U.toast('Lỗi tick: ' + (e && e.message || e), 'loi'); }
    try { if (APP.moiGiay) APP.moiGiay(); } catch (e) { console.error('[moiGiay]', e); }
  }, 1000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && window.ST) {
      try {
        G.tick(window.ST, G.giay());
        U.ve();
      } catch (e) { console.error('[nhip-visible]', e); }
      if (APP.hienLai) try { APP.hienLai(); } catch (e) { console.error('[hienLai]', e); }
    }
  });
};

/* ===== js/main.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — driver bản MỘT NGƯỜI
 * State nằm trong localStorage, mọi hành động chạy thẳng trên máy.
 * (Bản nhiều người dùng web/js/mp.js thay cho file này.)                  */
'use strict';
(function () {
  var G = window.G, U = window.U, APP = window.APP;
  var KEY = 'thdc_save_v6', KEY_CU = ['thdc_save_v5', 'thdc_save_v4', 'thdc_save_v3'];
  var ST = null;
  var LOI_NAP = '';
  var COFILE = !window.THDC_ARTIFACT;   // trong Artifact không tải file được

  /* ---------------- lưu / nạp ---------------- */
  function luu(im) {
    if (!ST) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(ST));
      if (!im) U.toast('Đã lưu bàn chơi.', 'ok');
    } catch (e) { U.toast('Không lưu được: ' + e.message, 'loi'); }
  }
  function chuanHoa(o) {
    if (!o || !Array.isArray(o.planets) || !o.planets.length)
      throw new Error('không phải bàn chơi hợp lệ');
    var v = Math.max(0, Math.floor(Number(o.v) || 0));
    if (v > G.STATE_VERSION)
      throw new Error('bàn chơi dùng state v' + v + ', mới hơn engine v' + G.STATE_VERSION);
    G.nangCapState(o, G.giay());
    if (o.v !== G.STATE_VERSION || o.moHinhCT !== 'so-luong-v1' ||
        o.moHinhNhip !== 'bao-tri-dan-su-v1' || o.moHinhQuyDao !== 'giu-quy-dao-v1')
      throw new Error('marker mô hình state không hợp lệ cho state v' + o.v);
    o.toi = Array.isArray(o.toi) ? o.toi : [];
    o.tenLua = Array.isArray(o.tenLua) ? o.tenLua : [];
    o.fleets = Array.isArray(o.fleets) ? o.fleets : [];
    o.npc = o.npc || {}; o.debris = o.debris || {}; o.msgs = Array.isArray(o.msgs) ? o.msgs : [];
    o.nk = Array.isArray(o.nk) ? o.nk : [];
    o.stats = o.stats || { thang: 0, thua: 0, cuop: 0, tauMat: 0, tauDietDich: 0, chuyenBay: 0 };
    o.fleetIdSeq = o.fleetIdSeq || 1;
    return o;
  }
  function nap() {
    var nguon = null;
    try {
      var s = localStorage.getItem(KEY);
      for (var i = 0; !s && i < KEY_CU.length; i++) {
        s = localStorage.getItem(KEY_CU[i]);
        if (s) nguon = KEY_CU[i];
      }
      if (!s) return null;
      var o = chuanHoa(JSON.parse(s));
      /* Chỉ ghi key mới sau khi parse + migration + validation đã thành công.
         Các key v5/v4/v3 được giữ nguyên làm bản raw dự phòng cho tới khi người
         chơi tự xoá bàn; bản v6 luôn được ưu tiên nên save cũ không sống lại. */
      if (nguon) localStorage.setItem(KEY, JSON.stringify(o));
      return o;
    } catch (e) { LOI_NAP = e && e.message || String(e); return null; }
  }

  /* ---------------- APP: chạy hành động tại chỗ ---------------- */
  APP.mp = false;
  APP.luu = luu;
  APP.lam = function (ten, dl, xong) {
    var err = G.chay(ST, ten, dl);
    if (!err) luu(true);
    if (xong) xong(err);
  };
  APP.moiGiay = (function () {
    var dem = 0;
    return function () { if (++dem >= 15) { dem = 0; luu(true); } };
  })();

  function batDau(st) {
    window.ST = ST = chuanHoa(st);
    document.getElementById('man-khoidong').style.display = 'none';
    document.getElementById('game').style.display = '';
    G.tick(ST, G.giay());
    U.ve();
  }
  window.addEventListener('beforeunload', function () { luu(true); });

  /* ---------------- hành động riêng của bản một người ---------------- */
  APP.themACT({
    xuat: function () {
      var js = JSON.stringify(ST);
      U.hop('Xuất bàn chơi',
        '<p class="mo">Sao chép toàn bộ đoạn dưới đây và lưu lại. Dán vào ô "Nạp bàn chơi" ở bất kỳ máy nào để chơi tiếp. ' +
        (COFILE ? 'Nút "Tải về file" cũng dùng được.' : '') + '</p>' +
        '<label for="xuat-js">Nội dung bàn chơi</label><textarea id="xuat-js" style="width:100%;height:180px" readonly></textarea>' +
        '<div class="cach-tren-xs"><button class="nut oke" data-act="xuat-copy">Sao chép</button>' +
        (COFILE ? ' <button class="nut" data-act="xuat-file">Tải về file</button>' : '') + '</div>');
      document.getElementById('xuat-js').value = js;
    },
    'xuat-copy': function () {
      var t = document.getElementById('xuat-js');
      t.select();
      var xong = false;
      try { xong = document.execCommand('copy'); } catch (e) { xong = false; }
      if (!xong && navigator.clipboard) {
        navigator.clipboard.writeText(t.value).then(function () { U.toast('Đã sao chép.', 'ok'); },
          function () { U.toast('Không sao chép được, hãy chọn tay rồi Ctrl+C.', 'loi'); });
        return;
      }
      U.toast(xong ? 'Đã sao chép.' : 'Không sao chép được, hãy chọn tay rồi Ctrl+C.', xong ? 'ok' : 'loi');
    },
/*[TAI-FILE-BAT-DAU]*/
    'xuat-file': function () {
      try {
        var b = new Blob([JSON.stringify(ST)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'thdc-' + ST.ten.replace(/\s+/g, '') + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        U.toast('Nếu trình duyệt không tải về được, hãy dùng nút Sao chép.');
      } catch (e) { U.toast('Không tải file được ở môi trường này — hãy dùng nút Sao chép.', 'loi'); }
    },
/*[TAI-FILE-KET-THUC]*/
    nhap: function () {
      U.hop('Nạp bàn chơi',
        '<p class="mo">Dán nội dung bàn chơi đã xuất vào đây rồi bấm Nạp. Bàn hiện tại sẽ bị ghi đè.</p>' +
        '<label for="nhap-js">Nội dung bàn chơi</label><textarea id="nhap-js" style="width:100%;height:180px" placeholder=\'{"v":6,...}\'></textarea>' +
        '<div class="cach-tren-xs"><button class="nut oke" data-act="nhap-ok">Nạp</button>' +
        (COFILE ? ' <button class="nut" data-act="nhap-file">Chọn file...</button>' : '') + '</div>');
    },
    'nhap-ok': function () {
      var v = (document.getElementById('nhap-js') || {}).value || '';
      try {
        var o = JSON.parse(v);
        o = chuanHoa(o);
        window.ST = ST = o; G.tick(ST, G.giay()); luu(true); U.dongHop(); U.ve();
        U.toast('Đã nạp bàn chơi.', 'ok');
      } catch (e) { U.toast('Nạp thất bại: ' + e.message, 'loi'); }
    },
    'nhap-file': function () { document.getElementById('file-nhap').click(); },
    'xoa-game': function () {
      U.hop('Xoá bàn chơi?', '<p>Toàn bộ tiến trình sẽ mất. Chắc chưa?</p>' +
        '<button class="nut xoa" data-act="xoa-that">Xoá và chơi lại</button> ' +
        '<button class="nut" data-act="dong-ht">Thôi</button>');
    },
    'xoa-that': function () {
      /* Ngăn beforeunload ghi lại đúng bàn vừa xoá trong lúc reload. */
      ST = null; window.ST = null;
      localStorage.removeItem(KEY);
      for (var i = 0; i < KEY_CU.length; i++) localStorage.removeItem(KEY_CU[i]);
      location.reload();
    }
  });

  APP.doiFile = function (e) {
    if (e.target.id === 'file-nhap' && e.target.files && e.target.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var o = JSON.parse(fr.result);
          o = chuanHoa(o);
          window.ST = ST = o; G.tick(ST, G.giay()); luu(true); U.ve();
          U.toast('Đã nạp bàn chơi từ file.', 'ok');
        } catch (err) { U.toast('Nạp thất bại: ' + err.message, 'loi'); }
      };
      fr.readAsText(e.target.files[0]);
    }
  };

  /* ---------------- màn khởi động ---------------- */
  document.getElementById('kd-ver').textContent = G.VERSION;
  var cu = nap();
  if (LOI_NAP) {
    var kd = document.querySelector('.kd-form');
    if (kd) kd.insertAdjacentHTML('beforeend', '<div class="canh">Không nạp được bàn cũ: ' +
      U.esc(LOI_NAP) + '. Dữ liệu gốc vẫn được giữ nguyên.</div>');
  }
  if (cu) {
    var b = document.getElementById('kd-tieptuc');
    b.style.display = '';
    b.textContent = 'TIẾP TỤC: ' + cu.ten + ' — ' + G.so(G.diem(cu).tong) + ' điểm';
    b.onclick = function () { batDau(cu); };
  }
  document.getElementById('kd-batdau').onclick = function () {
    var ten = (document.getElementById('kd-ten').value || '').trim() || 'Chỉ Huy';
    var seed = (document.getElementById('kd-seed').value || '').trim() || null;
    if (cu && !confirm('Bàn chơi cũ sẽ bị ghi đè. Tiếp tục tạo bàn mới?')) return;
    batDau(G.moiGame(ten, seed));
    luu(true);
  };
  document.getElementById('kd-ten').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('kd-batdau').click();
  });
  APP.batDauNhip();
})();

</script>
