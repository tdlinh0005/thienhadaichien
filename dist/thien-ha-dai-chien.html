/* ===== tokens.css ===== */
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Thiên Hà Đại Chiến — semantic tokens from design.md (2026-08-25). */
:root {
  color-scheme: dark;

  /* Theme: deep-space command, restrained amber signal. */
  --color-paper: oklch(13% 0.018 255);
  --color-paper-2: oklch(17% 0.020 255);
  --color-paper-3: oklch(21% 0.022 255);
  --color-surface-active: oklch(25% 0.026 255);
  --color-ink: oklch(94% 0.012 255);
  --color-ink-2: oklch(79% 0.018 255);
  --color-muted: oklch(66% 0.020 255);
  --color-rule: oklch(32% 0.025 255);
  --color-rule-strong: oklch(43% 0.032 255);
  --color-control-rule: oklch(49% 0.032 255);

  --color-accent: oklch(75% 0.170 55);
  --color-accent-ink: oklch(16% 0.025 55);
  --color-focus-ring: oklch(75% 0.170 55);
  --color-focus-gap: oklch(13% 0.018 255);

  --color-info: oklch(76% 0.120 230);
  --color-success: oklch(75% 0.140 150);
  --color-warning: oklch(82% 0.150 85);
  --color-danger: oklch(70% 0.190 28);
  --color-info-surface: oklch(20% 0.040 230);
  --color-success-surface: oklch(20% 0.040 150);
  --color-warning-surface: oklch(21% 0.045 85);
  --color-danger-surface: oklch(20% 0.050 28);

  /* Typography. */
  --font-display: "Chakra Petch", "Segoe UI", sans-serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", Tahoma, Arial, sans-serif;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-md: 1.125rem;
  --text-lg: 1.5rem;
  --text-xl: 2rem;
  --text-display: clamp(2rem, 4vw, 3.5rem);

  /* Spacing, radius, shell sizing and stacking. */
  --space-3xs: 0.125rem;
  --space-2xs: 0.25rem;
  --space-xs: 0.5rem;
  --space-sm: 0.75rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;
  --space-3xl: 4rem;

  --radius-control: 0.375rem;
  --radius-panel: 0.5rem;
  --radius-pill: 999px;
  --rule-thin: 1px;

  --size-control: 2.75rem;
  --size-header: 3.5rem;
  --size-situation: 3rem;
  --size-workspace-rail: 4.5rem;
  --size-secondary-nav: 13.5rem;
  --size-context-panel: 20rem;
  --size-content-max: 100rem;

  --z-base: 1;
  --z-raised: 10;
  --z-dropdown: 100;
  --z-sticky: 200;
  --z-modal: 400;
  --z-toast: 500;
  --z-tooltip: 600;

  /* Motion. */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long: 360ms;

  /* Legacy compatibility aliases. New component CSS uses semantic names. */
  --den: var(--color-paper);
  --den2: var(--color-paper-2);
  --panel: var(--color-paper-2);
  --panel2: var(--color-paper-3);
  --vien: var(--color-rule-strong);
  --vien2: var(--color-control-rule);
  --chu: var(--color-ink);
  --mo: var(--color-muted);
  --sang: var(--color-ink);
  --cam: var(--color-accent);
  --cam2: var(--color-accent);
  --lam: var(--color-info);
  --luc: var(--color-success);
  --do: var(--color-danger);
  --tim: var(--color-ink-2);
  --vang: var(--color-warning);
  --font-chu: var(--font-body);
  --font-so: var(--font-display);
}

/* ===== css/style.css ===== */
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 */
/* Hallmark · macrostructure: Command Workbench · genre: atmospheric · tone: technical, commanding, cinematic-restrained · anchor: amber 55° · nav: N3 rail + N13 command palette · footer: Ft2 · contrast: computed core text/key-control pass · chrome/tokens/icons/honesty: pass · slop: static-pass, viewport-pending */
/* =========================================================================
 * THIÊN HÀ ĐẠI CHIẾN — Command Workbench foundation
 * Semantic source: tokens.css. Legacy selectors remain stable for ui.js.
 * ======================================================================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{
  color:var(--color-ink-2);
  font:var(--text-base)/1.6 var(--font-body);
  min-height:100vh;
  min-height:100dvh;
  background:var(--color-paper);
}
.khoidong::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(52rem 30rem at 100% 0%,color-mix(in oklch,var(--color-accent) 7%,transparent),transparent 64%),
    radial-gradient(58rem 34rem at 0% 8%,color-mix(in oklch,var(--color-ink) 3%,transparent),transparent 66%);
}
a{color:var(--color-ink);text-decoration-color:var(--color-accent);text-underline-offset:.18em;outline:2px solid transparent;outline-offset:2px}
a:hover{color:var(--color-accent)}
a:active{color:var(--color-ink-2)}
h1,h2,h3,h4{min-width:0;margin:0 0 var(--space-xs);font-family:var(--font-display);font-weight:600;letter-spacing:-.02em;color:var(--color-ink);overflow-wrap:anywhere}
b{color:var(--color-ink)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.mo{color:var(--mo)}
.sang{color:var(--sang)}
.cam{color:var(--cam)} .lam{color:var(--lam)} .luc{color:var(--luc)} .do{color:var(--do)} .vang{color:var(--vang)} .tim{color:var(--tim)}
.sz{font-variant-numeric:tabular-nums;font-family:var(--font-display)}

/* ---------- màn khởi động ---------- */
.khoidong{
  position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
  padding:var(--space-lg);overflow-x:clip;overflow-y:auto
}
.kd-hop{
  position:relative;z-index:var(--z-base);width:min(580px,100%);padding:var(--space-xl);border-radius:var(--radius-panel);
  background:var(--color-paper-2);border:var(--rule-thin) solid var(--color-control-rule);margin-block:auto
}
.kd-logo{
  font-family:var(--font-display);font-size:var(--text-display);font-weight:700;letter-spacing:.04em;line-height:1.05;
  color:var(--color-ink);
}
.kd-logo span{display:block;font-size:inherit;color:var(--color-accent);letter-spacing:.08em}
.kd-sub{margin-top:var(--space-xs);color:var(--color-muted)}
.kd-nam{margin:var(--space-md) 0 var(--space-lg);padding:var(--space-sm);border-top:var(--rule-thin) solid var(--color-rule-strong);background:var(--color-paper-3);color:var(--color-ink-2)}
.kd-form label{display:block;margin:var(--space-sm) 0 var(--space-2xs);color:var(--color-muted);font-size:var(--text-xs);letter-spacing:.04em;font-weight:600}
.kd-form input{width:100%}
.kd-ghi{margin-top:var(--space-lg);padding-top:var(--space-sm);border-top:var(--rule-thin) solid var(--color-rule);color:var(--color-muted);font-size:var(--text-sm)}

input,select,textarea{
  min-height:var(--size-control);background:var(--color-paper);border:var(--rule-thin) solid var(--color-control-rule);
  color:var(--color-ink);padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-control);font:inherit;max-width:100%;
  outline:2px solid transparent;outline-offset:2px
}
input:hover:not(:disabled),select:hover:not(:disabled),textarea:hover:not(:disabled){border-color:var(--color-accent)}
input:focus,select:focus,textarea:focus{border-color:var(--color-focus-ring)}
input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed;background:var(--color-paper-2);color:var(--color-muted)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--color-danger)}
input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.nut:focus-visible,.tt-logo:focus-visible,
.workspace-nut:focus-visible,.nav-dich:focus-visible,.lenh-dich:focus-visible,.link-nut:focus-visible,.tn>.d:focus-visible{
  outline:2px solid var(--color-focus-ring);outline-offset:2px;box-shadow:0 0 0 2px var(--color-focus-gap)
}
input[type=number]{width:96px}
input[type=range]{padding:0}

.nut{
  min-height:var(--size-control);background:var(--color-paper-3);border:var(--rule-thin) solid var(--color-muted);color:var(--color-ink);
  padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-control);cursor:pointer;font:inherit;white-space:nowrap;
  outline:2px solid transparent;outline-offset:2px;
  transition:border-color var(--dur-micro) var(--ease-out),background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out)
}
.nut:hover{border-color:var(--color-accent);background:var(--color-surface-active)}
.nav-dich:focus-visible{color:var(--color-ink)}
.nut:active{transform:translateY(1px)}
.nut.lon{
  display:block;width:100%;margin-top:var(--space-lg);padding:var(--space-sm);font-weight:700;
  font-family:var(--font-display);font-size:var(--text-base);
  background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)
}
.nut.lon:hover{background:color-mix(in oklch,var(--color-accent) 88%,var(--color-ink));border-color:var(--color-accent);color:var(--color-accent-ink)}
.nut.phu{display:block;width:100%;margin-top:var(--space-xs)}
.nut.nho{min-height:var(--size-control);padding:var(--space-2xs) var(--space-xs);font-size:var(--text-xs)}
.nut.oke{background:var(--color-surface-active);border-color:var(--color-accent)}
.nut.xoa{background:var(--color-danger-surface);border-color:var(--color-danger);color:var(--color-ink)}
.nut:disabled{opacity:.55;cursor:not-allowed;background:var(--color-paper-2);color:var(--color-muted)}

/* ---------- khung game ---------- */
#game{position:relative;z-index:var(--z-base)}
#thanh-tren{
  position:relative;z-index:var(--z-raised);display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;
  min-height:var(--size-header);padding:var(--space-xs) var(--space-md);
  background:var(--color-paper-2);border-bottom:var(--rule-thin) solid var(--color-rule-strong)
}
.tt-logo{
  min-height:var(--size-control);padding:0;background:none;border:0;border-radius:var(--radius-control);
  font-family:var(--font-display);font-size:var(--text-base);font-weight:700;letter-spacing:.04em;color:var(--color-accent);cursor:pointer;white-space:nowrap;
  outline:2px solid transparent;outline-offset:2px
}
.tt-logo:hover{color:var(--color-ink)}
.tt-logo:active{color:var(--color-accent);transform:translateY(1px)}
.tt-logo:disabled{opacity:.55;cursor:not-allowed;color:var(--color-muted)}
.tt-res{display:flex;gap:var(--space-xs);flex-wrap:wrap;flex:1;min-width:0}
.chip{
  display:flex;align-items:center;gap:var(--space-xs);padding:var(--space-2xs) var(--space-xs);border-radius:var(--radius-pill);
  background:var(--color-paper);border:var(--rule-thin) solid var(--color-control-rule);min-width:7rem;max-width:100%;
}
.chip .dot{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.chip .n{font-size:var(--text-xs);letter-spacing:.04em;color:var(--color-muted);font-weight:600}
.chip .v{font-size:var(--text-sm);font-weight:600;color:var(--color-ink);min-width:0;overflow-wrap:anywhere}
.chip .r{font-size:var(--text-xs);color:var(--color-muted);margin-left:auto}
.chip-state{font-size:var(--text-xs);font-weight:700;color:var(--color-danger)}
.chip.day{background:var(--color-danger-surface);border-color:var(--color-danger)}
.chip.thieu-dien{background:var(--color-danger-surface);border-color:var(--color-danger)}
.tt-phu{display:flex;gap:var(--space-xs);align-items:center;flex-wrap:wrap}
#nut-menu{display:none}
.nut-res{display:none}

#thanh-canh{
  padding:0 var(--space-md);background:var(--color-paper-2);border-bottom:var(--rule-thin) solid var(--color-rule)
}
#thanh-canh:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:-2px}
#tinh-hinh-noi-dung{max-width:var(--size-content-max);margin:0 auto}
.tinh-hinh{
  display:grid;grid-template-columns:minmax(8rem,.75fr) minmax(16rem,2.2fr) minmax(8rem,.85fr) minmax(12rem,1fr) auto;
  align-items:stretch;min-width:0;min-height:var(--size-situation);font-size:var(--text-xs)
}
.tinh-hinh-khoi{
  min-width:0;padding:var(--space-xs) var(--space-sm);border-right:var(--rule-thin) solid var(--color-rule)
}
.tinh-hinh-nhan{
  display:block;margin-bottom:var(--space-3xs);color:var(--color-muted);font-size:var(--text-xs);font-weight:600;letter-spacing:.04em
}
.muc-dau{display:inline-block;width:.45rem;height:.45rem;margin-right:var(--space-2xs);border-radius:50%;background:var(--color-info);vertical-align:.05em}
.muc-danger .muc-dau{background:var(--color-danger)}
.muc-warning .muc-dau{background:var(--color-warning)}

.tinh-hinh-scope b,.tinh-hinh-scope>span:last-child,.tinh-hinh-dang-chay b,.tinh-hinh-dang-chay>span:last-child{
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.tinh-hinh-hanh-tinh{display:none;color:var(--color-ink);font-weight:600}
.tinh-hinh-canh{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-xs)
}
.tinh-hinh-canh.muc-danger{background:var(--color-danger-surface)}
.tinh-hinh-canh.muc-warning{background:var(--color-warning-surface)}
.tinh-hinh-canh.muc-info{background:var(--color-info-surface)}
.tinh-hinh-canh.muc-ok{background:var(--color-success-surface)}
.tinh-hinh-canh-chu{min-width:0}
.tinh-hinh-canh-chu>b,.tinh-hinh-hau-qua{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tinh-hinh-canh-chu>b{font-size:var(--text-sm)}
.tinh-hinh-hau-qua{color:var(--color-ink-2)}
.tinh-hinh-meta{display:flex;gap:var(--space-xs);color:var(--color-muted);font-variant-numeric:tabular-nums}
.tinh-hinh-cta{align-self:center}
.tinh-hinh-res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-xs)}
.tinh-hinh-res>span{display:flex;min-width:0;align-items:baseline;justify-content:space-between;gap:var(--space-2xs)}
.tinh-hinh-res small{color:var(--color-muted)}
.tinh-hinh-res b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-sm)}
.tinh-hinh-nang-luc b,.tinh-hinh-nang-luc>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tinh-hinh-nang-luc b{font-size:var(--text-sm)}
.tinh-hinh-mo-res{display:none;align-self:center;margin:var(--space-xs)}
.canh{margin:var(--space-xs) 0 0;padding:var(--space-xs) var(--space-sm);border:var(--rule-thin) solid var(--color-danger);border-radius:var(--radius-control);
  background:var(--color-danger-surface);color:var(--color-ink)}
.canh.bt{border-color:var(--color-warning);background:var(--color-warning-surface)}
.canh.ok{border-color:var(--color-success);background:var(--color-success-surface)}

.khung{
  display:grid;grid-template-columns:var(--size-workspace-rail) var(--size-secondary-nav) minmax(0,1fr);
  gap:var(--space-md);max-width:var(--size-content-max);margin:0 auto;
  padding:var(--space-sm) var(--space-md) var(--space-2xl);align-items:start
}

  position:sticky;top:var(--space-sm);display:flex;flex-direction:column;gap:var(--space-2xs);
  max-height:calc(100dvh - var(--space-md));z-index:var(--z-raised)
}

  gap:var(--space-3xs);padding:var(--space-2xs);background:transparent;border:var(--rule-thin) solid transparent;
  border-radius:var(--radius-control);color:var(--color-muted);font:600 var(--text-xs)/1.15 var(--font-body);cursor:pointer;
  outline:2px solid transparent;outline-offset:2px;white-space:nowrap
}

  border-radius:var(--radius-pill);background:var(--color-accent);color:var(--color-accent-ink);font-size:var(--text-xs);line-height:1rem
}

  width:100%;position:sticky;top:var(--space-sm);
  max-height:calc(100dvh - var(--space-md));overflow-y:auto;overscroll-behavior:contain
}

  display:flex;width:100%;align-items:center;gap:var(--space-xs);min-height:var(--size-control);padding:var(--space-xs) var(--space-sm);margin-bottom:var(--space-3xs);text-align:left;

  border-radius:var(--radius-control);cursor:pointer;font-size:var(--text-sm);white-space:nowrap;
  outline:2px solid transparent;outline-offset:2px;
  transition:background-color var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out)
}
.nav-dich:hover{background:var(--color-paper-3);border-left-color:var(--color-accent);color:var(--color-ink)}

.page-frame{grid-column:3;min-width:0;max-width:100%}
#dau-man{padding:var(--space-xs) 0 var(--space-md);border-bottom:var(--rule-thin) solid var(--color-rule);margin-bottom:var(--space-md)}
.dau-man-tren{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xs);margin-bottom:var(--space-2xs)}
.dau-man-nhom{font-size:var(--text-xs);font-weight:600;color:var(--color-accent);letter-spacing:.04em}

.menu-nhanh-ds{display:grid;gap:var(--space-2xs);margin-top:var(--space-sm)}

  border:var(--rule-thin) solid transparent;border-radius:var(--radius-control);background:transparent;color:var(--color-ink);font:inherit;text-align:left;cursor:pointer;
  outline:2px solid transparent;outline-offset:2px
}
.lenh-dich:hover{background:var(--color-surface-active);border-color:var(--color-muted)}
.lenh-dich:active{background:var(--color-paper-3);transform:translateY(1px)}
.lenh-dich:disabled{opacity:.55;cursor:not-allowed;color:var(--color-muted)}
.lenh-dich span{display:flex;min-width:0;flex:1;align-items:baseline;justify-content:space-between;gap:var(--space-sm)}
.lenh-dich small{color:var(--color-muted);font-size:var(--text-xs)}
.lenh-dich b,.lenh-dich small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#chan{padding:var(--space-sm) var(--space-md) var(--space-xl);color:var(--color-muted);font-size:var(--text-xs);border-top:var(--rule-thin) solid var(--color-rule);margin-top:var(--space-lg)}

/* ---------- section surfaces & data tables ---------- */
.panel{
  background:var(--color-paper-2);border:var(--rule-thin) solid var(--color-control-rule);
  border-radius:var(--radius-panel);margin-bottom:var(--space-sm);overflow:hidden
}
.panel>h2{
  margin:0;padding:var(--space-xs) var(--space-sm);background:var(--color-paper-3);
  border-bottom:var(--rule-thin) solid var(--color-rule);font-size:var(--text-sm);color:var(--color-ink);
  display:flex;align-items:center;gap:var(--space-xs);min-width:0;overflow-wrap:anywhere;line-height:1.3
}
.panel>.noi{padding:var(--space-sm);overflow-x:auto;overflow-wrap:anywhere}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:var(--space-xs)}
.luoi2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:var(--space-xs)}
.luoi-tongquan{grid-template-columns:repeat(auto-fit,minmax(min(12.5rem,100%),1fr))}
.luoi-chi-so{grid-template-columns:repeat(auto-fill,minmax(min(10.5rem,100%),1fr))}
.luoi>*,.luoi2>*{min-width:0}
.cach-tren-2xs{margin-top:var(--space-2xs)}
.cach-tren-xs{margin-top:var(--space-xs)}
.cach-tren-sm{margin-top:var(--space-sm)}
.cach-tren-md{margin-top:var(--space-md)}
.cach-duoi-xs{margin-bottom:var(--space-xs)}
.nhom-truong{margin-bottom:var(--space-xs)}
.khoi-cach-tren-sm{display:block;margin-top:var(--space-sm)}
.khong-xuong-dong{white-space:nowrap}
.panel>.noi.luoi>.the{
  background:transparent;border:0;border-bottom:var(--rule-thin) solid var(--color-rule);border-radius:0
}
.panel .hd-luoi>.hd-tau,.panel>.noi>.tn{
  background:transparent;border:0;border-bottom:var(--rule-thin) solid var(--color-rule);border-radius:0
}

table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
th,td{padding:var(--space-xs) var(--space-sm);border-bottom:var(--rule-thin) solid color-mix(in oklch,var(--color-muted) 75%,var(--color-paper-3));text-align:left;vertical-align:top}
th{color:var(--color-muted);font-weight:600;font-size:var(--text-xs);letter-spacing:.04em;background:var(--color-paper-3)}
tr:hover>td{background:var(--color-paper-3)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.bang-cuon{overflow-x:auto}
.bang-cuon>table{min-width:42rem}
.bang-phu{margin-bottom:var(--space-xs)}
.bang-kho-quan{max-width:32.5rem}
.bang-ten-lua{max-width:26.25rem}
.chi-tiet{font-size:var(--text-sm);margin-bottom:var(--space-xs)}
.ghi-chu{min-height:1lh;font-size:var(--text-sm);margin-top:var(--space-2xs)}
.res-nhan{display:inline-flex;align-items:center;gap:var(--space-2xs);color:inherit}
.res-dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;flex:none}

/* ---------- thẻ đơn vị ---------- */
.the{
  background:var(--color-paper-2);border:var(--rule-thin) solid var(--color-control-rule);
  border-radius:var(--radius-panel);padding:var(--space-sm);transition:border-color var(--dur-micro) var(--ease-out);
  display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--space-xs);align-content:start
}
.the:hover{border-color:var(--color-control-rule)}
.the.tat{opacity:.55}
.the h4{grid-area:1/1;margin:0 0 var(--space-3xs);font-size:var(--text-base);color:var(--color-ink);min-width:0;overflow-wrap:anywhere}
.the .cap{
  grid-area:1/2;align-self:start;font-size:var(--text-xs);color:var(--color-accent);border:var(--rule-thin) solid var(--color-control-rule);
  border-radius:var(--radius-pill);padding:0 var(--space-xs);font-family:var(--font-display)
}
.the>*:not(.cap):not(h4){grid-column:1/-1}
.the .mt{color:var(--color-muted);font-size:var(--text-base);margin:var(--space-2xs) 0 var(--space-xs);min-height:2rem}
.the .gia{display:flex;flex-wrap:wrap;gap:var(--space-xs);font-size:var(--text-sm);margin-bottom:var(--space-xs)}
.the .gia span.thieu{color:var(--color-danger)}
.the .ct{display:flex;gap:var(--space-xs);align-items:center;flex-wrap:wrap}
.the .dk{color:var(--color-danger);font-size:var(--text-xs);margin-bottom:var(--space-xs)}
.thanh{height:.375rem;background:var(--color-paper);border:var(--rule-thin) solid var(--color-control-rule);border-radius:var(--radius-control);overflow:hidden;margin:var(--space-xs) 0}
.thanh>i{display:block;height:100%;background:var(--color-accent)}

/* ---------- dashboard Tổng Quan (class cũ còn dùng ngoài workbench) ---------- */
.dash-the-lon{
  background:var(--color-paper-2);border:var(--rule-thin) solid var(--color-control-rule);
  border-radius:var(--radius-panel);padding:var(--space-sm)
}
.dash-the-lon .n{font-size:var(--text-xs);letter-spacing:.04em;color:var(--color-muted);font-weight:600}
.dash-the-lon .so{display:block;font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;color:var(--color-ink);line-height:1.2;margin-top:var(--space-3xs)}
.dash-the-lon .phu{font-size:var(--text-xs);color:var(--color-muted)}
.dash-the-lon.sang-glow .so{color:var(--color-accent)}
.pill-chiso{
  display:flex;flex-direction:column;gap:var(--space-3xs);padding:var(--space-xs) var(--space-sm);
  border-radius:var(--radius-panel);background:var(--color-paper-2);border:var(--rule-thin) solid var(--color-control-rule);font-size:var(--text-sm)
}
.pill-chiso .n{font-size:var(--text-xs);letter-spacing:.04em;color:var(--color-muted);font-weight:600}
.pill-chiso .bar{display:block;height:.25rem;border-radius:var(--radius-control);background:var(--color-paper);overflow:hidden;margin-top:var(--space-3xs)}
.pill-chiso .bar>i{display:block;height:100%;border-radius:inherit;background:var(--color-accent)}
.hanhnhanh{display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)}
.hanhnhanh .nut{flex:1;min-width:130px;text-align:center;padding:var(--space-xs)}
/* fix review: progress bar trong .dash-the-lon (Tổng Quan) */
.dash-the-lon .bar{display:block;height:.25rem;border-radius:var(--radius-control);background:var(--color-paper);overflow:hidden;margin-top:var(--space-3xs)}
.dash-the-lon .bar>i{display:block;height:100%;border-radius:inherit;background:var(--color-accent)}
/* ---------- Tổng Quan task-first ---------- */
.tongquan-workbench,.tongquan-tren,.tongquan-duoi,.tq-theo-doi{min-width:0}
.tongquan-tren,.tongquan-duoi{display:grid;grid-template-columns:minmax(0,2fr) minmax(18rem,1fr);gap:var(--space-sm)}
.tq-dem{
  margin-left:auto;padding:0 var(--space-xs);border:var(--rule-thin) solid var(--color-control-rule);border-radius:var(--radius-pill);
  color:var(--color-accent);font:600 var(--text-xs)/1.5 var(--font-display);white-space:nowrap
}
.tq-viec-ds{display:grid;gap:var(--space-sm);max-height:30rem;overflow:auto;overscroll-behavior:contain}
.tq-viec-nhom-tieu{
  margin:0;padding:0 0 var(--space-2xs);border-bottom:var(--rule-thin) solid var(--color-rule);color:var(--color-muted);
  font:600 var(--text-xs)/1.4 var(--font-body);letter-spacing:.04em
}
.tq-viec{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-sm);align-items:center;
  padding:var(--space-xs);border-bottom:var(--rule-thin) solid var(--color-rule)
}
.tq-viec:last-child{border-bottom:0}
.tq-viec-noi{min-width:0}
.tq-viec-scope{
  display:block;color:var(--color-muted);font-size:var(--text-xs);font-weight:600;letter-spacing:.03em;overflow-wrap:anywhere
}
.tq-viec h3,.tq-hang-van-hanh h3{margin:var(--space-3xs) 0;font-size:var(--text-sm);line-height:1.35}
.tq-viec p{max-width:72ch;margin:0;color:var(--color-ink-2);font-size:var(--text-sm)}
.tq-viec-meta,.tq-op-state{color:var(--color-muted);font-size:var(--text-xs);font-variant-numeric:tabular-nums}
.tq-empty{display:grid;gap:var(--space-2xs);min-height:5rem;align-content:center;color:var(--color-muted)}
.tq-empty b{font-size:var(--text-sm)}
.tq-so-luoi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:var(--rule-thin) solid var(--color-rule);border-left:var(--rule-thin) solid var(--color-rule)}
.tq-so-luoi>div{min-width:0;padding:var(--space-sm);border-right:var(--rule-thin) solid var(--color-rule);border-bottom:var(--rule-thin) solid var(--color-rule)}
.tq-so-luoi span,.tq-so-luoi small{display:block;color:var(--color-muted);font-size:var(--text-xs)}
.tq-so-luoi b{display:block;margin:var(--space-3xs) 0;font-size:var(--text-md);overflow-wrap:anywhere}
.tq-snapshot-phu{display:flex;justify-content:space-between;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm);color:var(--color-muted);font-size:var(--text-xs)}
.tq-lenh-nhanh{display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)}
.tq-lenh-nhanh .nut{flex:1 1 7rem}
.ma-tran-wrap{overflow:auto;overscroll-behavior:contain}
.tq-ma-tran table{min-width:68rem}
.tq-ma-tran th,.tq-ma-tran td{padding:var(--space-xs);font-size:var(--text-xs)}
.tq-ma-tran td>span,.tq-ma-tran td>small,.tq-ma-tran td>b{display:block}
.tq-ma-tran td>small{margin-top:var(--space-3xs);color:var(--color-muted)}
.tq-ma-tran-mobile{display:none}
.tq-ma-tran-item{border-bottom:var(--rule-thin) solid var(--color-rule)}
.tq-ma-tran-item:last-child{border-bottom:0}
.tq-ma-tran-item summary{
  min-height:var(--size-control);display:grid;grid-template-columns:minmax(0,1fr) minmax(8rem,.9fr);align-items:center;
  gap:var(--space-sm);padding:var(--space-xs) 0;cursor:pointer;outline:2px solid transparent;outline-offset:2px
}
.tq-ma-tran-item summary:hover{background:var(--color-paper-3)}
.tq-ma-tran-item summary:active{background:var(--color-surface-active)}
.tq-ma-tran-item summary:focus-visible{outline-color:var(--color-focus-ring)}
.tq-ma-tran-item summary>span{min-width:0}
.tq-ma-tran-item summary>span:last-child{text-align:right}
.tq-ma-tran-item summary b,.tq-ma-tran-item summary small{display:block;overflow-wrap:anywhere}
.tq-ma-tran-item summary small{color:var(--color-muted);font-size:var(--text-xs)}
.tq-ma-tran-item dl{margin:0 0 var(--space-xs);border-top:var(--rule-thin) solid var(--color-rule)}
.tq-ma-tran-item dl>div{display:grid;grid-template-columns:minmax(7rem,.7fr) minmax(0,1fr);gap:var(--space-xs);padding:var(--space-xs) 0}
.tq-ma-tran-item dt{color:var(--color-muted);font-size:var(--text-xs);font-weight:600}
.tq-ma-tran-item dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tq-ma-tran-item dd small{display:block;color:var(--color-muted);font-size:var(--text-xs)}
.tq-status{color:var(--color-ink-2)}
.tq-status.can-chu-y{color:var(--color-warning)}
.tq-status.on-dinh{color:var(--color-success)}
.tq-status.thieu-du-lieu{color:var(--color-muted);font-style:italic}
.tq-van-hanh-ds{max-height:30rem;overflow:auto;overscroll-behavior:contain}
.tq-hang-van-hanh{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-sm);align-items:center;
  padding:var(--space-xs) 0;border-bottom:var(--rule-thin) solid var(--color-rule)
}
.tq-hang-van-hanh:first-child{padding-top:0}
.tq-hang-van-hanh:last-child{padding-bottom:0;border-bottom:0}
.tq-op-actions{display:flex;gap:var(--space-xs);align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tq-theo-doi{display:grid;grid-template-columns:1fr;gap:var(--space-sm);align-content:start}
.tq-theo-doi-hang{
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-sm);padding:var(--space-xs) 0;border-bottom:var(--rule-thin) solid var(--color-rule)
}
.tq-theo-doi-hang:first-child{padding-top:0}
.tq-theo-doi-hang>span:first-child{min-width:0}
.tq-theo-doi-hang b,.tq-theo-doi-hang small{display:block;overflow-wrap:anywhere}
.tq-theo-doi-hang small{color:var(--color-muted);font-size:var(--text-xs)}
.tq-theo-doi-hang>.dem{flex:none}
.tq-ghi-chu{color:var(--color-muted);font-size:var(--text-xs)}
.tq-mo-module{width:100%;margin-top:var(--space-sm)}
.tq-quan-ly-luoi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--rule-thin) solid var(--color-rule);border-left:var(--rule-thin) solid var(--color-rule)}
.tq-quan-ly-luoi>div{display:grid;gap:var(--space-2xs);padding:var(--space-sm);border-right:var(--rule-thin) solid var(--color-rule);border-bottom:var(--rule-thin) solid var(--color-rule);min-width:0}
.tq-quan-ly-luoi span{color:var(--color-muted);font-size:var(--text-xs)}
.tq-quan-ly-luoi b{overflow-wrap:anywhere}
.tq-quan-ly-actions{display:flex;align-items:end;justify-content:flex-end;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)}
.tq-thue{display:flex;align-items:center;gap:var(--space-xs);margin-right:auto;flex-wrap:wrap}
.tq-thue label{color:var(--color-muted);font-size:var(--text-xs)}
.tq-thue-input{width:5rem}
/* fix review: .kq cho máy tính trận độc lập (không cần .bc bao ngoài) */
.kq{padding:var(--space-xs) var(--space-sm);margin:var(--space-xs) 0;border:var(--rule-thin) solid var(--color-control-rule);border-radius:var(--radius-control)}
.kq.kq-tomtat{margin:0 0 var(--space-sm)}
.kq.thang{border-color:var(--color-success);background:var(--color-success-surface)}
.kq.thua{border-color:var(--color-danger);background:var(--color-danger-surface)}
.kq.hoa{border-color:var(--color-warning);background:var(--color-warning-surface)}
/* fix review: .chat-nhap cho phòng chat */
.chat-nhap{border-color:var(--color-control-rule);border-radius:var(--radius-control);padding:var(--space-xs);background:var(--color-paper);color:inherit;font-size:var(--text-base)}

/* ---------- thiên hà ---------- */
.gal-dh{display:flex;gap:var(--space-xs);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-xs)}
tr.trong td{color:var(--color-muted)}
/* dự phòng: mọi svg trong menu không kịp có class thì vẫn đúng kích thước */
.nav-dich svg{width:1.125rem;height:1.125rem;flex:none}
tr.toi td{background:var(--color-surface-active)}
tr.nguoi td{background:var(--color-warning-surface)}
tr.nguoi:hover>td{background:var(--color-surface-active)}
tr.npc-bo td{background:var(--color-paper-3)}
.tag-lm{color:var(--color-info);font-size:var(--text-xs)}
.pl{color:var(--color-warning);font-size:var(--text-xs)}

/* ---------- báo cáo ---------- */
.bc{font-size:var(--text-base)}
.bc table{margin:var(--space-xs) 0 var(--space-sm)}
.bc .kq{padding:var(--space-xs) var(--space-sm);margin:var(--space-xs) 0;border:var(--rule-thin) solid var(--color-control-rule);border-radius:var(--radius-control)}
.bc .kq.thang{border-color:var(--color-success);background:var(--color-success-surface)}
.bc .kq.thua{border-color:var(--color-danger);background:var(--color-danger-surface)}
.bc .kq.hoa{border-color:var(--color-warning);background:var(--color-warning-surface)}
pre.nd{white-space:pre-wrap;font:inherit;margin:0;overflow-wrap:anywhere}

/* ---------- tin nhắn ---------- */
.tn{border:var(--rule-thin) solid var(--color-control-rule);border-radius:var(--radius-panel);margin-bottom:var(--space-xs);background:var(--color-paper-2);overflow:hidden}
.tn>.d{display:flex;width:100%;min-height:var(--size-control);justify-content:space-between;gap:var(--space-xs);padding:var(--space-xs) var(--space-sm);cursor:pointer;background:var(--color-paper-3);color:var(--color-ink);border:0;font:inherit;text-align:left;overflow-wrap:anywhere;outline:2px solid transparent;outline-offset:-2px}
.tn>.d>*{min-width:0}
.tn>.d:hover{color:var(--color-ink);background:var(--color-surface-active)}
.tn>.d:active{background:var(--color-paper)}
.tn>.d:disabled{opacity:.55;cursor:not-allowed;color:var(--color-muted)}
.tn>.n{padding:var(--space-sm);border-top:var(--rule-thin) solid var(--color-rule)}
.tn.moi>.d{background:var(--color-surface-active);box-shadow:inset 0 0 0 var(--rule-thin) var(--color-accent)}
.hu{display:inline-block;min-width:3.5rem;font-size:var(--text-xs);letter-spacing:.04em;color:var(--color-muted)}

/* ---------- phòng chat ---------- */
.chat-ds{height:310px;overflow-y:auto;overscroll-behavior:contain;padding:var(--space-xs);background:var(--color-paper);
  border:var(--rule-thin) solid var(--color-control-rule);border-radius:var(--radius-panel);scrollbar-color:var(--color-control-rule) var(--color-paper)}
.chat-dong{padding:var(--space-2xs) var(--space-3xs);border-bottom:var(--rule-thin) solid var(--color-rule);overflow-wrap:anywhere}
.chat-dong:last-child{border-bottom:0}
.chat-dong .hu{min-width:3rem;margin-right:var(--space-3xs)}
.chat-noi{display:block;margin-left:3.5rem;color:var(--color-ink-2)}
.chat-gui{display:flex;gap:var(--space-xs);margin-top:var(--space-xs)}
.chat-gui input{flex:1;min-width:0}
.chat-ghi{font-size:var(--text-xs);margin:var(--space-2xs) 0 0}

/* ---------- hộp thoại ---------- */
.hop-thoai{position:fixed;inset:0;z-index:var(--z-modal);background:color-mix(in oklch,var(--color-paper) 82%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;padding:var(--space-lg);overflow:auto}
.ht-trong{width:min(760px,100%);background:var(--color-paper-2);border:var(--rule-thin) solid var(--color-control-rule);
  border-radius:var(--radius-panel);box-shadow:0 1.5rem 3rem color-mix(in oklch,var(--color-paper) 72%,transparent)}
.ht-dau{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-xs);align-items:center;padding:var(--space-xs) var(--space-sm);background:var(--color-paper-3);
  border-bottom:var(--rule-thin) solid var(--color-rule);font-weight:700;color:var(--color-ink);font-family:var(--font-display);overflow-wrap:anywhere}
#ht-noi{padding:var(--space-md);max-height:calc(100vh - var(--space-3xl) - var(--size-header));max-height:calc(100dvh - var(--space-3xl) - var(--size-header));overflow:auto}

/* ---------- toast ---------- */
#toast{position:fixed;left:var(--space-sm);right:var(--space-sm);bottom:var(--space-sm);z-index:var(--z-toast);display:flex;flex-direction:column;gap:var(--space-xs);align-items:flex-end;pointer-events:none}
#toast .t{
  background:var(--color-paper-3);border:var(--rule-thin) solid var(--color-accent);
  padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-panel);overflow-wrap:anywhere;pointer-events:auto;
  max-width:min(20rem,100%);animation:vao var(--dur-short) var(--ease-out)
}
#toast .t.loi{border-color:var(--color-danger)}
#toast .t.ok{border-color:var(--color-success)}
@keyframes vao{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  .nut:active,.tt-logo:active,.workspace-nut:active,.nav-dich:active,.lenh-dich:active{transform:none}
  #toast .t{animation:none}
}

/* ---------- form hạm đội ---------- */
.hd-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:var(--space-xs)}
.hd-tau{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-xs);background:var(--color-paper-2);

/* THIÊN HÀ ĐẠI CHIẾN — tiện ích chung */
'use strict';
var G = window.G = window.G || {};

/* --- Số ---------------------------------------------------------------- */
G.so = function (n) {
  n = Math.trunc(n || 0);
  var am = n < 0; n = Math.abs(n);
  var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (am ? '-' : '') + s;
};
G.soNgan = function (n) {
  n = Math.floor(n || 0);
  var a = Math.abs(n), s;
  if (a >= 1e12) s = (n / 1e12).toFixed(2) + ' NTy';     // nghìn tỷ
  else if (a >= 1e9) s = (n / 1e9).toFixed(2) + ' Ty';   // tỷ
  else if (a >= 1e6) s = (n / 1e6).toFixed(2) + ' Tr';   // triệu
  else if (a >= 1e4) s = (n / 1e3).toFixed(1) + ' N';    // nghìn
  else s = G.so(n);
  return s;
};
G.tocDoText = function (n) { return G.so(Math.round(n)); };

/* --- Thời gian --------------------------------------------------------- */
G.tg = function (giay) {
  if (!isFinite(giay)) return '—';
  giay = Math.max(0, Math.round(giay));
  var ng = Math.floor(giay / 86400); giay -= ng * 86400;
  var h = Math.floor(giay / 3600); giay -= h * 3600;
  var p = Math.floor(giay / 60); var s = giay - p * 60;
  var out = [];
  if (ng) out.push(ng + 'n');
  if (ng || h) out.push(h + 'h');
  if (ng || h || p) out.push(p + 'p');
  out.push(s + 's');
  return out.join(' ');
};
G.gio = function (ts) {
  var d = new Date(ts);
  var p = function (x) { return (x < 10 ? '0' : '') + x; };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
};

/* --- Đối tượng --------------------------------------------------------- */
G.clone = function (o) { return JSON.parse(JSON.stringify(o)); };
G.cong = function (a, b, k) {
  k = (k === undefined) ? 1 : k;
  for (var p in b) if (b[p]) a[p] = (a[p] || 0) + b[p] * k;
  return a;
};
G.tongRes = function (r) {
  var t = 0;
  for (var i = 0; i < G.RES_HANH_TINH.length; i++) t += (r[G.RES_HANH_TINH[i]] || 0);
  return t;
};
G.trong = function (o) { for (var k in o) if (o[k] > 0) return false; return true; };

/* --- PRNG tất định (mulberry32) --------------------------------------- */
G.rng = function (seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
G.hash = function (str) {
  var h = 2166136261 >>> 0;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
};

/* --- Toạ độ ------------------------------------------------------------ */
G.toaDo = function (g, h, p) { return { g: g, h: h, p: p }; };
G.tdStr = function (c) { return '[' + c.g + ':' + c.h + ':' + c.p + ']'; };
G.tdKey = function (c) { return c.g + ':' + c.h + ':' + c.p; };
G.tdParse = function (s) {
  var m = String(s).replace(/[\[\]]/g, '').split(':');
  if (m.length !== 3) return null;
  var c = G.toaDo(parseInt(m[0], 10), parseInt(m[1], 10), parseInt(m[2], 10));
  if (!(c.g >= 1 && c.g <= G.C.SO_THIEN_HA)) return null;
  if (!(c.h >= 1 && c.h <= G.C.SO_HE)) return null;
  /* ô 16 là vùng không gian sâu — hợp lệ để thám hiểm, không phải hành tinh */
  if (!(c.p >= 1 && c.p <= G.C.O_THAM_HIEM)) return null;
  return c;
};
G.bang = function (a, b) { return a && b && a.g === b.g && a.h === b.h && a.p === b.p; };

/* Khoảng cách kiểu OGame [SUY LUẬN] */
G.khoangCach = function (a, b) {
  if (a.g !== b.g) return 20000 * Math.abs(a.g - b.g);
  if (a.h !== b.h) return 2700 + 95 * Math.abs(a.h - b.h);
  if (a.p !== b.p) return 1000 + 5 * Math.abs(a.p - b.p);
  return 5;
};

    if (ng) return ng;                    // hành tinh của người chơi khác

  if (!G.coNPC(st.seed, c)) return { loai: 'trong', key: key, c: c };

  return r() <= mat;
};

/* --- Sinh & lưu trạng thái một NPC ------------------------------------ */
G.npc = function (st, c) {
  var key = G.tdKey(c);
  if (G.HOOK && G.HOOK.npc) { var chung = G.HOOK.npc(st, c, key); if (chung) { G.npcHoiPhuc(st, chung); return chung; } }
  if (st.npc[key]) { G.npcHoiPhuc(st, st.npc[key]); return st.npc[key]; }

  var r = G.rng(G.hash(st.seed + '@' + key));
  r(); // bỏ số đầu (đã dùng cho mật độ)
  var xa = G.khoangCach(c, st.home) / 20000;                    // càng xa càng mạnh
  var manh = Math.min(1, 0.25 + r() * 0.55 + xa * 0.25);
  var diem = Math.round(140 * Math.pow(420, manh));
  var bo = r() < 0.16;                                           // "nông trại": bỏ hoang
  var hang = bo ? 0 : (manh < 0.45 ? 1 : (manh < 0.78 ? 2 : 3));

  var n = {
    key: key, c: { g: c.g, h: c.h, p: c.p },
    ten: G.HO[Math.floor(r() * G.HO.length)] + ' ' + G.TEN[Math.floor(r() * G.TEN.length)],
    htTen: G.TEN_HT[Math.floor(r() * G.TEN_HT.length)],
    lm: G.LIEN_MINH[Math.floor(r() * G.LIEN_MINH.length)],
    bo: bo, hang: hang, diem: diem,
    tech: {}, ships: {}, def: {}, res: {},
    t: st.now, cuopLuc: 0
  };

  var tl = Math.max(1, Math.round(Math.log(diem / 100) / Math.log(3)));
  n.tech = { weapon: tl, shield: tl, armor: tl, spy: Math.max(1, tl - 2), energy: tl };

  /* Hạm đội & phòng thủ quy từ điểm [SUY LUẬN] */
  var dFleet = bo ? 0 : diem * (0.28 + r() * 0.2);
  var dDef = diem * (bo ? 0.06 : 0.3 + r() * 0.2);
  n.ships = G.npcHam(dFleet, manh, r);
  n.def = G.npcThu(dDef, manh, r);
  n.res = { metal: Math.round(diem * 220), crystal: Math.round(diem * 110), deut: Math.round(diem * 45), food: Math.round(diem * 60) };
  if (bo) { n.res.metal *= 3; n.res.crystal *= 3; n.res.deut *= 2; }

  if (G.HOOK && G.HOOK.npcMoi) G.HOOK.npcMoi(n); else st.npc[key] = n;
  return n;
};

/* điểm = tổng tài nguyên đầu tư / 1000 */
G.giaTriDiem = function (cost, n) {
  return ((cost.metal || 0) + (cost.crystal || 0) + (cost.deut || 0)) * (n || 1) / 1000;
};

G.npcHam = function (diem, manh, r) {
  if (diem <= 0) return {};
  var bang;
  if (manh < 0.4) bang = [['fighterL', 0.5], ['cargoS', 0.3], ['fighterH', 0.2]];
  else if (manh < 0.7) bang = [['fighterL', 0.3], ['fighterH', 0.3], ['cruiser', 0.25], ['cargoL', 0.15]];
  else bang = [['fighterH', 0.2], ['cruiser', 0.2], ['battleship', 0.25], ['battlecruiser', 0.2], ['destroyer', 0.15]];
  var out = {};
  for (var i = 0; i < bang.length; i++) {
    var s = G.S(bang[i][0]);
    var v = G.giaTriDiem(s.cost);
    var n = Math.floor(diem * bang[i][1] * (0.7 + r() * 0.6) / v);
    if (n > 0) out[bang[i][0]] = n;
  }
  return out;
};

G.npcThu = function (diem, manh, r) {
  if (diem <= 0) return {};
  var bang;
  if (manh < 0.4) bang = [['missileLauncher', 0.6], ['laserS', 0.4]];
  else if (manh < 0.7) bang = [['missileLauncher', 0.3], ['laserS', 0.25], ['laserL', 0.2], ['ion', 0.15], ['satellite', 0.1]];
  else bang = [['laserL', 0.2], ['gauss', 0.25], ['ion', 0.12], ['plasma', 0.23], ['satellite', 0.1], ['orbitalStation', 0.1]];
  var out = {};
  for (var i = 0; i < bang.length; i++) {
    var d = G.D(bang[i][0]);
    var v = G.giaTriDiem(d.cost);
    var n = Math.floor(diem * bang[i][1] * (0.7 + r() * 0.6) / v);
    if (n > 0) out[bang[i][0]] = n;
  }
  if (manh > 0.55) out.shieldS = 1;
  if (manh > 0.85) out.shieldL = 1;
  return out;
};

/* Tài nguyên NPC tự mọc lại theo thời gian; hạm đội/phòng thủ xây lại chậm */
G.npcHoiPhuc = function (st, n) {
  var dt = st.now - (n.t || st.now);
  if (dt <= 0) { n.t = st.now; return; }
  n.t = st.now;
  var h = dt / 3600;
  var toc = n.diem * (n.bo ? 1.4 : 1) * 0.02;
  n.res.metal = Math.min(n.diem * (n.bo ? 900 : 300), (n.res.metal || 0) + toc * 22 * h);
  n.res.crystal = Math.min(n.diem * (n.bo ? 450 : 150), (n.res.crystal || 0) + toc * 11 * h);
  n.res.deut = Math.min(n.diem * (n.bo ? 180 : 60), (n.res.deut || 0) + toc * 4 * h);
  n.res.food = Math.min(n.diem * 90, (n.res.food || 0) + toc * 6 * h);

  /* Xây lại phòng thủ đã mất: 1.5%/giờ so với cấu hình gốc */
  if (!n.bo && dt > 3600) {
    var r = G.rng(G.hash(n.key + '~' + Math.floor(st.now / 3600)));
    var goc = G.npcThu(n.diem * 0.35, Math.min(1, n.diem / 50000), r);
    for (var k in goc) {
      var thieu = goc[k] - (n.def[k] || 0);
      if (thieu > 0) n.def[k] = Math.min(goc[k], (n.def[k] || 0) + Math.max(1, Math.floor(goc[k] * 0.015 * h)));
    }
  }
};

/* --- Bãi phế liệu ------------------------------------------------------ */
G.pheLieu = function (st, key) {
  if (G.HOOK && G.HOOK.pheLieu) return G.HOOK.pheLieu(key);
  if (!st.debris[key]) st.debris[key] = { metal: 0, crystal: 0 };
  return st.debris[key];
};

/* --- Danh sách một hệ (cho màn Thiên Hà) ------------------------------ */
G.xemHe = function (st, g, h) {
  var out = [];
  for (var p = 1; p <= G.C.SO_HANH_TINH; p++) {
    var c = G.toaDo(g, h, p);
    var o = G.oHanhTinh(st, c);
    var d = st.debris[o.key];
    o.debris = (d && (d.metal > 0 || d.crystal > 0)) ? d : null;
    out.push(o);
  }
  out.push(G.oHanhTinh(st, G.toaDo(g, h, G.C.O_THAM_HIEM)));
  return out;
};

/* --- Loại, nhiệt độ & số ô đất của hành tinh -------------------------
 * Loại hành tinh phụ thuộc vị trí trong hệ: gần Mặt Trời thì Sa Mạc, xa thì
 * Băng Hà, khoảng giữa thì Ôn Hoà / Rừng Già / Nước – Đầm Lầy.            */
G.loaiTheoViTri = function (seed, c) {
  var r = G.rng(G.hash(seed + '%' + G.tdKey(c)));
  var v = r();
  if (c.p <= 3) return v < 0.72 ? 'samac' : (v < 0.9 ? 'onhoa' : 'nuoc');
  if (c.p >= 13) return v < 0.72 ? 'banghai' : (v < 0.9 ? 'nuoc' : 'onhoa');
  if (c.p <= 5 || c.p >= 11) return v < 0.35 ? (c.p <= 5 ? 'samac' : 'banghai')
    : (v < 0.6 ? 'onhoa' : (v < 0.82 ? 'nuoc' : 'runggia'));
  return v < 0.34 ? 'onhoa' : (v < 0.62 ? 'runggia' : (v < 0.84 ? 'nuoc' : (v < 0.93 ? 'samac' : 'banghai')));
};

G.dacTinh = function (st, c) {
  var r = G.rng(G.hash(st.seed + '$' + G.tdKey(c)));
  var loai = G.loaiTheoViTri(st.seed, c);
  var L = G.LHT(loai);
  var temp = Math.round(L.temp[0] + r() * (L.temp[1] - L.temp[0]));
  var giua = 8, lech = Math.abs(c.p - giua);
  var oDat = Math.round((90 + (giua - lech) * 14 + r() * 60) * L.oDat);
  return { loai: loai, temp: temp, oDat: oDat };
};

/* --- Bảng xếp hạng: sinh tất định, điểm tăng dần theo thời gian ------- */
G.xepHang = function (st, loai) {
  if (G.HOOK && G.HOOK.xepHang) return G.HOOK.xepHang(st, loai);
  var r = G.rng(G.hash(st.seed + '#rank'));
  var gio = Math.max(0, (st.now - st.t0) / 3600);
  var ds = [];
  for (var i = 0; i < 59; i++) {
    var nen = 220 * Math.pow(560, Math.pow(r(), 0.85));
    var tong = Math.round(nen * (1 + gio * 0.022));
    /* chia tổng điểm ra từng hạng mục theo tỷ lệ ngẫu nhiên nhưng tất định */
    var wCT = 0.3 + r() * 0.3, wNC = 0.1 + r() * 0.2, wHam = 0.15 + r() * 0.35;
    var tongW = wCT + wNC + wHam + 0.15;
    ds.push({
      ten: G.HO[Math.floor(r() * G.HO.length)] + ' ' + G.TEN[Math.floor(r() * G.TEN.length)],
      lm: G.LIEN_MINH[Math.floor(r() * G.LIEN_MINH.length)],
      diem: tong, tong: tong,
      ct: Math.round(tong * wCT / tongW), nc: Math.round(tong * wNC / tongW),
      ham: Math.round(tong * wHam / tongW), thu: Math.round(tong * 0.15 / tongW),
      ht: 1 + Math.floor(r() * 6)
    });
  }
  var d = G.diem(st);
  ds.push({
    ten: st.ten, lm: st.lm ? st.lm.ten : '', diem: Math.round(d.tong), tong: Math.round(d.tong),
    ct: Math.round(d.ct), nc: Math.round(d.nc), ham: Math.round(d.ham), thu: Math.round(d.thu),
    ht: st.planets.length, ta: true
  });
  var cot = { tong: 'tong', ct: 'ct', nc: 'nc', ham: 'ham', thu: 'thu' }[loai || 'tong'] || 'tong';
  ds.sort(function (a, b) { return (b[cot] || 0) - (a[cot] || 0); });
  for (var j = 0; j < ds.length; j++) { ds[j].hang = j + 1; ds[j].diem = ds[j][cot] || 0; }
  return ds;
};

/* ===== js/combat.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — bộ mô phỏng chiến đấu
 * 6 vòng, bắn nhanh (rapidfire), khiên hồi đầu mỗi vòng, bãi phế liệu 30%.
 * Đặc trưng bản gốc: PHÒNG THỦ HAI LỚP — lớp quỹ đạo giao chiến ngay từ
 * vòng 1, hạm đội chỉ xuống tới tầng khí quyển (gặp phòng thủ mặt đất) từ
 * vòng 3. [SUY LUẬN về số vòng và hệ số]                                  */
'use strict';
var G = window.G = window.G || {};

G.VONG_XUONG_DAT = 3;

function nhom(id, n, tech, ben, thuDat, nguon, diaHinh) {
  var u = G.UNIT(id);
  var w = 1 + 0.1 * (tech.weapon || 0), s = 1 + 0.1 * (tech.shield || 0), a = 1 + 0.1 * (tech.armor || 0);
  /* Loại hành tinh làm phòng thủ MẶT ĐẤT dày thêm (Băng Hà, Nước – Đầm Lầy) */
  if (u.lop === 'dat' && thuDat) { s *= thuDat; a *= thuDat; }
  /* [v7] Hệ số địa hình chỉ tác động đơn vị chạm mặt đất (công sự/bộ binh);
   * chiến tranh quỹ đạo trung hoá — xem bảng G.DIA_HINH trong data.js. */
  var dh = diaHinh === undefined ? 1 : diaHinh;
  return {
    id: id, ten: u.ten, n: n, n0: n, ben: ben,
    atk: u.atk * w * dh,
    shield: u.shield * s,
    hull: (u.hull) * a * 0.1 + u.hull * 0.9 * a * dh,   // vỏ thép cơ bản × giáp
    hongDu: 0,
    lop: u.lop || 'ham',
    cost: u.cost,
    nguon: nguon === undefined ? -1 : nguon
  };
}

function gomBen(ships, def, tech, ben, thuDat, bo, nguon, loaiHT) {
  var out = [];
  var id;
  /* Công sự và bộ binh luôn nhận hệ số địa hình. Tàu chỉ nhận khi `loaiHT`
   * được truyền vào — tức trận đổ bộ nơi tàu bay đã chạm khí quyển. */
  if (ships) for (id in ships) if (ships[id] > 0 && G.S(id))
    out.push(nhom(id, ships[id], tech, ben, 1, nguon, loaiHT ? G.hsDiaHinh(id, loaiHT) : 1));
  if (def) for (id in def) if (def[id] > 0 && G.D(id)) out.push(nhom(id, def[id], tech, ben, thuDat, -1, G.hsDiaHinh(id, loaiHT)));
  if (bo) for (id in bo) if (bo[id] > 0 && G.BB(id)) out.push(nhom(id, bo[id], tech, ben, thuDat, -1, G.hsDiaHinh(id, loaiHT)));
  return out;
}

function conSong(g) { return g.n > 0; }

function heSoBanNhanh(g, dich) {
  var rf = G.RAPIDFIRE[g.id];
  if (!rf) return 1;
  var tong = 0, i;
  for (i = 0; i < dich.length; i++) tong += dich[i].n;
  if (!tong) return 1;
  var q = 0;
  for (i = 0; i < dich.length; i++) {
    var r = rf[dich[i].id];
    if (r && r > 1) q += (dich[i].n / tong) * (r - 1) / r;
  }
  if (q >= 0.999) q = 0.999;
  return 1 / (1 - q);
}

/* Một bên bắn vào bên kia (mô hình gộp nhóm) */
function banLoat(banh, dich, rnd) {
  var i, j;
  var tongDich = 0;
  for (j = 0; j < dich.length; j++) tongDich += dich[j].n;
  if (!tongDich) return;

  /* tổng số phát bắn phân về từng nhóm địch theo tỷ lệ số lượng */
  var vao = [];
  for (j = 0; j < dich.length; j++) vao.push({ phat: 0, dmg: 0 });

  for (i = 0; i < banh.length; i++) {
    var g = banh[i];
    if (g.n <= 0 || g.atk <= 0) continue;
    var phat = g.n * heSoBanNhanh(g, dich);
    for (j = 0; j < dich.length; j++) {
      var p = phat * (dich[j].n / tongDich);
      vao[j].phat += p;
      /* quy tắc dội: sát thương < 1% khiên thì không xuyên nổi */
      if (g.atk >= dich[j].shield * 0.01) vao[j].dmg += p * g.atk;
    }
  }

  for (j = 0; j < dich.length; j++) {
    var d = dich[j];
    if (d.n <= 0) continue;
    var hutKhien = Math.min(vao[j].dmg, d.n * d.shield * (0.9 + rnd() * 0.2));
    var vaoVo = Math.max(0, vao[j].dmg - hutKhien) + d.hongDu;
    var chet = Math.floor(vaoVo / d.hull);
    if (chet > d.n) chet = d.n;
    d.hongDu = vaoVo - chet * d.hull;
    /* tàu hư nặng có thể nổ dây */
    if (chet < d.n && d.hongDu > d.hull * 0.7 && rnd() < (d.hongDu / d.hull)) { chet++; d.hongDu = 0; }
    d.n -= chet;
    if (d.n < 0) d.n = 0;
  }
}

function tinhLuc(gs) {
  var t = 0;
  for (var i = 0; i < gs.length; i++) t += gs[i].n * (gs[i].atk + gs[i].hull * 0.02 + gs[i].shield);
  return t;
}

/* -----------------------------------------------------------------------
 * G.danhTran(A, D) — A/D: { ten, tech, ships, def }. D có thể truyền
 * `nhomTau:[{ships,tech}, ...]`; nhóm 0 luôn là hạm đậu của hành tinh, các
 * nhóm sau là hạm giữ quỹ đạo. Output giữ đúng chỉ số nguồn trong conNhomD.
 * --------------------------------------------------------------------- */
G.danhTran = function (A, D, seed) {
  var rnd = G.rng(seed || (Date.now() >>> 0));
  var doBo = !!A.doBo;                 /* trận đổ bộ: không chia lớp, đánh hết từ vòng 1 */
  /* [v7] Trận ĐỔ BỘ: tàu của bên công hạ độ cao chạm khí quyển/mặt đất nên
   * máy bay & hoả tiễn mang theo chịu hệ số địa hình (tư liệu: "máy bay dễ
   * bị tiêu diệt ở Băng", "bom yếu đi ở Rừng"). Trận quỹ đạo thuần túy thì không. */
  var atk = gomBen(A.ships, null, A.tech || {}, 'A', 1, A.bo, -1,
    doBo ? (D.loaiHT || null) : null);
  var loaiHT = D.loaiHT || null;
  var nhomTau = Array.isArray(D.nhomTau) && D.nhomTau.length
    ? D.nhomTau
    : [{ ships: D.ships || {}, tech: D.tech || {} }];
  var defAll = [], ng, them;
  for (ng = 0; ng < nhomTau.length; ng++) {
    them = gomBen(nhomTau[ng].ships || {}, null, nhomTau[ng].tech || D.tech || {}, 'D', 1, null, ng);
    for (var ig = 0; ig < them.length; ig++) defAll.push(them[ig]);
  }
  /* Công sự và bộ binh luôn thuộc hành tinh, không thuộc một nhóm tàu. */
  them = gomBen(null, D.def, D.tech || {}, 'D', D.thuDat || 1, D.bo, -1, loaiHT);
  for (var idf = 0; idf < them.length; idf++) defAll.push(them[idf]);

  var quyDao = [], mDat = [];
  for (var i = 0; i < defAll.length; i++) {
    if (!doBo && defAll[i].lop === 'dat') mDat.push(defAll[i]); else quyDao.push(defAll[i]);
  }

  var nhatKy = [];
  var vong;
  for (vong = 1; vong <= G.C.VONG_DANH; vong++) {
    var ta = atk.filter(conSong);
    if (!ta.length) break;
    var conQuyDao = quyDao.filter(conSong);
    var conDat = mDat.filter(conSong);
    /* Hai lớp đánh nối tiếp, không đánh đồng thời: chỉ sau khi quỹ đạo bị
       triệt phá và hạm đội đã hạ độ cao từ vòng quy định mới chạm mặt đất. */
    var matDat = !conQuyDao.length && vong >= G.VONG_XUONG_DAT && conDat.length > 0;
    var phe = matDat ? conDat : conQuyDao;
    if (!phe.length) {
      /* Đã dẹp xong lớp quỹ đạo nhưng chưa tới vòng hạ độ cao: vòng trống,
         hạm đội hạ dần xuống tầng khí quyển. */
      if (vong < G.VONG_XUONG_DAT && conDat.length) {
        nhatKy.push({ vong: vong, lucA: Math.round(tinhLuc(ta)), lucD: 0,
          conA: ta.reduce(function (s2, g2) { return s2 + g2.n; }, 0), conD: 0, matDat: false, haDoCao: true });
        continue;
      }
      break;
    }

    var lucA = tinhLuc(ta), lucD = tinhLuc(phe);
    /* hai bên bắn đồng thời: chụp lại số lượng trước khi trừ */
    var chupA = ta.map(function (g) { return { g: g, n: g.n }; });
    var chupD = phe.map(function (g) { return { g: g, n: g.n }; });
    banLoat(chupA.map(function (x) { return { id: x.g.id, n: x.n, atk: x.g.atk }; }), phe, rnd);
    banLoat(chupD.map(function (x) { return { id: x.g.id, n: x.n, atk: x.g.atk }; }), ta, rnd);

    nhatKy.push({
      vong: vong,
      lucA: Math.round(lucA), lucD: Math.round(lucD),
      conA: ta.reduce(function (s2, g2) { return s2 + g2.n; }, 0),
      conD: phe.reduce(function (s2, g2) { return s2 + g2.n; }, 0),
      matDat: matDat
    });
  }

  var conA = 0, conD = 0;
  var i2;
  for (i2 = 0; i2 < atk.length; i2++) conA += atk[i2].n;
  for (i2 = 0; i2 < defAll.length; i2++) conD += defAll[i2].n;

  var coA = false, coD = false;
  for (i2 = 0; i2 < atk.length; i2++) if (atk[i2].n0 > 0) coA = true;
  for (i2 = 0; i2 < defAll.length; i2++) if (defAll[i2].n0 > 0) coD = true;
  var kq;
  if (!coA && !coD) kq = 'hoa';                                  /* hai bên đều trống */
  else if (conA > 0 && conD <= 0) kq = 'thang';
  else if (conA <= 0 && conD > 0) kq = 'thua';
  else if (conA <= 0 && conD <= 0) kq = 'huyDiet';
  else kq = 'hoa';

  /* --- thiệt hại, phế liệu, phòng thủ tự sửa --- */
  var matA = {}, matD = {}, matDPha = {}, pl = { metal: 0, crystal: 0 };   /* matDPha: công sự bị phá TRƯỚC khi sửa lại */
  var conShipsA = {}, conShipsD = {}, conDefD = {}, conBoA = {}, conBoD = {};
  var conNhomD = [], matNhomD = [];
  for (i2 = 0; i2 < nhomTau.length; i2++) { conNhomD.push({}); matNhomD.push({}); }

  for (i2 = 0; i2 < atk.length; i2++) {
    var g = atk[i2], mat = g.n0 - g.n;
    if (mat > 0) {
      matA[g.id] = mat;
      if (!G.BB(g.id)) {          /* bộ binh chết trên mặt đất, không thành phế liệu quỹ đạo */
        pl.metal += (g.cost.metal || 0) * mat * G.C.PHE_LIEU;
        pl.crystal += (g.cost.crystal || 0) * mat * G.C.PHE_LIEU;
      }
    }
    if (g.n > 0) { if (G.BB(g.id)) conBoA[g.id] = g.n; else conShipsA[g.id] = g.n; }
  }
  for (i2 = 0; i2 < defAll.length; i2++) {
    var d = defAll[i2], m = d.n0 - d.n, con = d.n;
    if (m > 0) {
      if (G.BB(d.id)) {  /* bộ binh chết không thành phế liệu bay */ }
      else if (G.S(d.id)) {   /* tàu bị bắn hạ -> phế liệu */
        pl.metal += (d.cost.metal || 0) * m * G.C.PHE_LIEU;
        pl.crystal += (d.cost.crystal || 0) * m * G.C.PHE_LIEU;
      } else {           /* công sự: 70% được sửa lại sau trận [SUY LUẬN kiểu OGame] */
        matDPha[d.id] = m;
        var sua;
        if (m > 100) {
          /* xấp xỉ nhị thức B(m, 0.7): tránh vòng lặp O(m) khi m tới hàng triệu.
             Độ lệch chuẩn sqrt(m·p·(1-p)) ≈ sqrt(0.21m); sai số nhỏ hơn 1 đơn vị
             trên m lớn — không ảnh hưởng cân bằng game. */
          sua = Math.round(m * G.C.SUA_CONG_SU + (rnd() * 2 - 1) * Math.sqrt(m * G.C.SUA_CONG_SU * (1 - G.C.SUA_CONG_SU)));
          if (sua < 0) sua = 0; else if (sua > m) sua = m;
        } else {
          sua = 0;
          for (var k = 0; k < m; k++) if (rnd() < G.C.SUA_CONG_SU) sua++;
        }
        con += sua; m -= sua;
      }
      if (m > 0) {
        matD[d.id] = (matD[d.id] || 0) + m;
        if (G.S(d.id) && d.nguon >= 0)
          matNhomD[d.nguon][d.id] = (matNhomD[d.nguon][d.id] || 0) + m;
      }
    }
    if (con > 0) {
      if (G.BB(d.id)) conBoD[d.id] = con;
      else if (G.S(d.id)) {
        conShipsD[d.id] = (conShipsD[d.id] || 0) + con;
        if (d.nguon >= 0) conNhomD[d.nguon][d.id] = (conNhomD[d.nguon][d.id] || 0) + con;
      }
      else conDefD[d.id] = con;
    }
  }

  return {
    kq: kq, vongDanh: nhatKy, seed: seed,
    tenA: A.ten, tenD: D.ten, thuDat: D.thuDat || 1, loaiHT: D.loaiHT || null,
    conShipsA: conShipsA, conShipsD: conShipsD, conDefD: conDefD,
    conNhomD: conNhomD, matNhomD: matNhomD,
    conBoA: conBoA, conBoD: conBoD, doBo: doBo,
    matA: matA, matD: matD, matDPha: matDPha,
    pheLieu: { metal: Math.round(pl.metal), crystal: Math.round(pl.crystal) }
  };
};

/* Tổng khoang hàng của một hạm đội */
G.khoangHang = function (ships) {
  var t = 0;
  for (var id in ships) { var s = G.S(id); if (s) t += s.cargo * ships[id]; }
  return t;
};
G.thuyThu = function (ships) {
  var t = 0;
  for (var id in ships) { var s = G.S(id); if (s) t += (s.crew || 1) * ships[id]; }
  return t;
};

/* ===== js/migration.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — migration state (v3 → v7)
 * Tách khỏi js/engine.js theo review hội đồng: toàn bộ phép nâng cấp
 * save cũ + quy đổi vốn công trình (slTuCap/capTuSL) nằm ở đây để
 * engine.js chỉ còn luật mô phỏng thuần. Thứ tự nạp: sau combat, trước
 * engine (engine gọi G.nangCapState tại G.diem). */
'use strict';
var G = window.G = window.G || {};

/* =======================================================================
 * MIGRATION V3 -> V4: CẤP CÔNG TRÌNH -> SỐ LƯỢNG
 * -----------------------------------------------------------------------
 * Một level L cũ đã tiêu tốn xấp xỉ cost0 * (1 + f + ... + f^(L-1)).
 * V4 lấy cost0 là giá một công trình, nên quy đổi tổng vốn ấy
 * thành số lượng. Công thức kín giữ migration O(1) cho mỗi loại. */
G.slTuCap = function (def, lv) {
  lv = Math.max(0, Math.floor(Number(lv) || 0));
  if (!lv) return 0;
  var f = (def && def.factor) || 1;
  var n = f === 1 ? lv : (Math.pow(f, lv) - 1) / (f - 1);
  if (!isFinite(n) || n >= Number.MAX_SAFE_INTEGER) return Number.MAX_SAFE_INTEGER;
  return Math.max(1, Math.round(n));
};

/* Mốc level cũ cao nhất đã đầu tư không quá n công trình. Chỉ dùng
 * cho giao diện/API cũ "xây tiếp"; mô phỏng v4 không phụ thuộc level này. */
G.capTuSL = function (def, n) {
  n = Math.max(0, Math.floor(Number(n) || 0));
  if (!n) return 0;
  var f = (def && def.factor) || 1;
  if (f === 1) return n;
  var lv = Math.max(0, Math.floor(Math.log(1 + n * (f - 1)) / Math.log(f)));
  while (lv > 0 && G.slTuCap(def, lv) > n) lv--;
  while (G.slTuCap(def, lv + 1) <= n && lv < 1024) lv++;
  return lv;
};


function chuanHoaNen(st) {
  st.planets = Array.isArray(st.planets) ? st.planets : [];
  st.fleets = Array.isArray(st.fleets) ? st.fleets : [];
  st.toi = Array.isArray(st.toi) ? st.toi : [];
  st.tenLua = Array.isArray(st.tenLua) ? st.tenLua : [];
  st.msgs = Array.isArray(st.msgs) ? st.msgs : [];
  st.nk = Array.isArray(st.nk) ? st.nk : [];
  st.tech = st.tech && typeof st.tech === 'object' ? st.tech : {};
}

/* vectorChiPhi/vectorCong: bản sao cục bộ của helper ở js/engine.js
 * (file nạp sau) — migration phải tự chủ, không phụ thuộc thứ tự ngoài
 * việc G đã tồn tại. */
function vectorChiPhi(o) {
  var out = {};
  o = o && typeof o === 'object' ? o : {};
  for (var k in o) {
    var n = Number(o[k]);
    if (isFinite(n) && n > 0) out[k] = n;
  }
  return out;
}
function vectorCong(a, b) {
  var out = vectorChiPhi(a), k;
  b = vectorChiPhi(b);
  for (k in b) out[k] = (out[k] || 0) + b[k];
  return out;
}

function nangV3LenV4(st) {
  var ps = st.planets;
  for (var i = 0; i < ps.length; i++) {
    var p = ps[i], cu = p.b && typeof p.b === 'object' ? p.b : {}, moi = {}, k;
    for (k in cu) {
      var d = G.B(k), lv = Math.max(0, Math.floor(Number(cu[k]) || 0));
      if (lv) moi[k] = d ? G.slTuCap(d, lv) : lv;
    }
    p.b = moi;
    p.qB = Array.isArray(p.qB) ? p.qB : [];
    p.qS = Array.isArray(p.qS) ? p.qS : [];
    p.res = p.res && typeof p.res === 'object' ? p.res : {};
    p.ships = p.ships && typeof p.ships === 'object' ? p.ships : {};
    p.def = p.def && typeof p.def === 'object' ? p.def : {};
    p.mis = p.mis && typeof p.mis === 'object' ? p.mis : {};
    p.linh = p.linh && typeof p.linh === 'object' ? p.linh : {};
    var truoc = {};
    for (k in cu) truoc[k] = Math.max(0, Math.floor(Number(cu[k]) || 0));
    for (var q = 0; q < p.qB.length; q++) {
      var m = p.qB[q], bd = G.B(m.id);
      if (!bd) continue;
      if (m.n === undefined) {
        var lvTruoc = truoc[m.id] || 0;
        var lvDich = Math.max(lvTruoc + 1, Math.floor(Number(m.lv) || 0));
        m.n = Math.max(1, G.slTuCap(bd, lvDich) - G.slTuCap(bd, lvTruoc));
        truoc[m.id] = lvDich;
      } else {
        m.n = Math.max(1, Math.floor(Number(m.n) || 1));
      }
      delete m.lv;
    }
  }
  st.v = 4;
  st.moHinhCT = 'so-luong-v1';
}

function nangV4LenV5(st, activatedAt) {
  var mocState = Math.max(0, Math.floor(Number(st.lastTick || st.now) || 0));
  activatedAt = Math.max(mocState, Math.floor(Number(activatedAt) || 0));
  var btCu = Math.max(0, Number(st.noBaoTri) || 0);
  /* Giữ pha đồng hồ đế quốc neo từ lúc đăng ký. Bỏ qua các checkpoint cũ
   * trước biên kích hoạt, nhưng không đổi phút/giây kết toán quen thuộc. */
  var nextAt = Math.floor(Number(st.nextMaint) || 0);
  if (!(nextAt > 0)) nextAt = Math.floor(Number(st.t0) || 0) + G.NHIP_V1.cycleSeconds;
  if (!(nextAt > 0)) nextAt = activatedAt + G.NHIP_V1.cycleSeconds;
  if (nextAt <= activatedAt) nextAt +=
    (Math.floor((activatedAt - nextAt) / G.NHIP_V1.cycleSeconds) + 1) * G.NHIP_V1.cycleSeconds;
  st.moHinhNhip = G.NHIP_V1.marker;
  st.baoTri = {
    nextAt: nextAt,
    cycle: Math.max(0, Math.floor(Number(st.soChuKy) || 0)),
    missStreak: btCu > 0 ? 1 : 0,
    arrearsGalana: btCu,
    activatedAt: activatedAt,
    rules: G.NHIP_V1.maintenanceRules
  };

  for (var i = 0; i < st.planets.length; i++) {
    var p = st.planets[i];
    p.b = p.b && typeof p.b === 'object' ? p.b : {};
    p.qB = Array.isArray(p.qB) ? p.qB : [];
    p.qS = Array.isArray(p.qS) ? p.qS : [];
    p.res = p.res && typeof p.res === 'object' ? p.res : {};
    p.ships = p.ships && typeof p.ships === 'object' ? p.ships : {};
    p.def = p.def && typeof p.def === 'object' ? p.def : {};
    p.mis = p.mis && typeof p.mis === 'object' ? p.mis : {};
    p.linh = p.linh && typeof p.linh === 'object' ? p.linh : {};
    p.danSu = G.danSuMacDinh();
  }

  /* Queue v4 đã trừ toàn bộ cost ngay lúc xếp. Đánh dấu phần ấy là paidCost
   * để v5 không thu lần hai; vốn Galana còn lại tiếp tục chia theo checkpoint
   * mới, bắt đầu sau activatedAt — tuyệt đối không gây thất bại hồi tố. */
  if (st.ncQueue) {
    var cu = st.ncQueue;
    var tongTG = Math.max(1, Math.floor(Number(cu.tong) || Number(cu.conLai) || G.NHIP_V1.minResearchSeconds));
    var conTG = Math.max(0, Math.floor(Number(cu.conLai) || 0));
    var totalCost = vectorChiPhi(cu.cost);
    var von = Math.max(0, Number(cu.von) || 0);
    var vonCon = Math.max(0, Math.min(von, Number(cu.vonConLai) || 0));
    if (von > 0) totalCost.galana = (totalCost.galana || 0) + von;
    var paidCost = vectorChiPhi(cu.cost);
    if (von > vonCon) paidCost.galana = von - vonCon;
    var conVector = vectorCong({}, totalCost), k;
    for (k in paidCost) conVector[k] = Math.max(0, (conVector[k] || 0) - paidCost[k]);
    var coCon = false; for (k in conVector) if (conVector[k] > 0) { coCon = true; break; }
    var installmentsTotal = Math.max(2, Math.ceil(tongTG / G.NHIP_V1.cycleSeconds));
    var installmentsLeft = coCon ? Math.max(1, Math.min(installmentsTotal,
      Math.ceil(Math.max(1, conTG) / G.NHIP_V1.cycleSeconds))) : 0;
    var planet = st.planets[Math.max(0, Math.floor(Number(cu.pi) || 0))] || st.planets[0];
    st.ncQueue = {
      id: cu.id,
      lv: Math.max(1, Math.floor(Number(cu.lv) || ((st.tech[cu.id] || 0) + 1))),
      planetKey: planet && planet.c ? G.tdKey(planet.c) : (st.home ? G.tdKey(st.home) : ''),
      startedAt: activatedAt - Math.max(0, tongTG - conTG),
      finishAt: activatedAt + conTG,
      totalCost: totalCost,
      paidCost: paidCost,
      installmentsTotal: installmentsTotal,
      installmentsLeft: installmentsLeft,
      failures: cu.treo ? 1 : 0,
      status: cu.treo ? 'retry' : 'active',
      rules: G.NHIP_V1.researchRules,
      refundPolicy: G.NHIP_V1.legacyRefundPolicy
    };
  }

  st.v = 5;
  G.dongBoBaoTriCu(st);
}

/* STATE V6: `pha:'giu'` là một vị trí thật trên quỹ đạo, không còn mượn pha
 * bay đi với cờ `dangGiu`. Save v5 đang đậu được một đoạn ân hạn bắt đầu tại
 * activatedAt: không thu hồi tố quãng offline trước lúc luật này xuất hiện. */
function nangV5LenV6(st, activatedAt) {
  var mocState = Math.max(0, Math.floor(Number(st.lastTick || st.now) || 0));
  activatedAt = Math.max(mocState, Math.floor(Number(activatedAt) || 0));
  var qd = G.QUY_DAO_V1;
  for (var i = 0; i < st.fleets.length; i++) {
    var f = st.fleets[i];
    if (!f || f.mission !== 'hold') continue;
    if (f.pha === 'di' && f.dangGiu) {
      var hetCu = Math.floor(Number(f.den_t) || activatedAt);
      var giu = Math.max(1, Math.floor(Number(f.giu) || qd.segmentSeconds));
      f.pha = 'giu';
      /* V5 đã thay den_t bằng mốc hết lượt ngay lúc tới nơi, nên có thể suy
       * ngược thời điểm neo thật từ den_t - giu. Ân hạn nhiên liệu vẫn bắt
       * đầu riêng tại activatedAt, không được làm sai lịch sử giuLuc. */
      f.giuLuc = Math.min(activatedAt, Math.max(0, hetCu - giu));
      f.giuDen_t = Math.max(hetCu, activatedAt);
      f.tiepNL_t = Math.min(f.giuDen_t, activatedAt + qd.segmentSeconds);
      f.giuTaiTk = f.giuTaiTk === undefined ? null : f.giuTaiTk;
      f.giuRules = qd.legacyRules;
      f.dangGiu = true;                 // alias cho client v5 trong một vòng nâng cấp
    } else {
      /* Outbound/return không được biến thành đang đậu chỉ vì mission=hold. */
      f.dangGiu = false;
      delete f.giuLuc;
      delete f.giuDen_t;
      delete f.tiepNL_t;
      delete f.giuTaiTk;
      delete f.giuRules;
    }
  }
  st.v = 6;
  st.moHinhQuyDao = qd.marker;
}

/* STATE V7: KINH TẾ THẬT — thuần additive. Ngân hàng, đầu tư siêu thị, Uranium
 * và lương gián điệp chỉ được GẮN DEFAULT; tuyệt đối không đụng số liệu cũ.
 * LM/chính thể không nằm trong state đế quốc nên không thuộc bước này. */
function nangV6LenV7(st) {
  if (!st.nganHang) st.nganHang = { soDu: 0, laiLuc: 0 };
  else {
    if (!isFinite(Number(st.nganHang.soDu))) st.nganHang.soDu = 0;
    if (!isFinite(Number(st.nganHang.laiLuc))) st.nganHang.laiLuc = 0;
  }
  if (!st.dauTuST || !isFinite(Number(st.dauTuST.ketThucAt)))
    st.dauTuST = { von: 0, ketThucAt: 0 };
  if (!isFinite(Number(st.uranium))) st.uranium = 0;
  if (!st.luongGD) st.luongGD = { muc: 0, traLuc: 0, phanBoi: false };
  /* đơn chợ là projection: thiếu thì coi như không có đơn nào đang mở */
  if (!Array.isArray(st.choDon)) st.choDon = [];
  st.moHinhKT = G.KINH_TE_V1.marker;
  st.v = 7;
}

/* Nâng tuần tự, không nhảy thẳng: save v3 luôn đi qua đúng phép quy đổi vốn
 * công trình v4, schema nhịp v5 rồi schema quỹ đạo v6. `activatedAt` là
 * wall-clock do loader/server truyền vào; mặc định dùng giờ hiện tại. */
G.nangCapState = function (st, activatedAt) {
  if (!st) return st;
  var phienBan = Number(st.v) || 0;
  if (phienBan > G.STATE_VERSION)
    throw new Error('Save state v' + phienBan + ' mới hơn engine v' + G.STATE_VERSION + '; từ chối hạ cấp dữ liệu.');
  if (phienBan === G.STATE_VERSION) return st; // idempotent byte-for-byte
  if (phienBan === 4 && st.moHinhCT && st.moHinhCT !== 'so-luong-v1')
    throw new Error('Save state v4 không có marker mô hình số lượng hợp lệ.');
  chuanHoaNen(st);
  var moc = activatedAt === undefined || activatedAt === null ? G.giay() : Number(activatedAt);
  if (!isFinite(moc)) moc = G.giay();
  moc = Math.floor(moc);
  if (phienBan < 4) { nangV3LenV4(st); phienBan = 4; }
  if (phienBan === 4) {
    nangV4LenV5(st, moc);
    phienBan = 5;
  }
  if (phienBan === 5) { nangV5LenV6(st, moc); phienBan = 6; }
  if (phienBan === 6) nangV6LenV7(st);
  return st;
};

/* ===== js/engine.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — lõi mô phỏng
 * Toàn bộ game chạy theo mốc thời gian thực: state chỉ lưu các mốc, mỗi lần
 * tick (hoặc mở lại game sau nhiều giờ) engine tua lại từng sự kiện theo
 * đúng thứ tự thời gian — nên chơi offline vẫn ra kết quả đúng.            */
'use strict';
var G = window.G = window.G || {};
G.STATE_VERSION = 7;

/* Lệch giờ giữa máy người chơi và server (bản nhiều người sẽ gán). */
G.LECH_GIO = 0;
G.giay = function () { return Math.floor(Date.now() / 1000) + G.LECH_GIO; };

/* =======================================================================
 * KHỞI TẠO
 * ===================================================================== */
G.moiGame = function (ten, seedStr, home) {
  var now = G.giay();
  var seed = seedStr || ('THDC-' + Math.floor(Math.random() * 1e9));
  var r = G.rng(G.hash(seed));
  /* home do server chỉ định ở chế độ nhiều người (mỗi người một ô riêng) */
  if (!home) home = G.toaDo(1 + Math.floor(r() * G.C.SO_THIEN_HA), 1 + Math.floor(r() * 60), 4 + Math.floor(r() * 9));

  var st = {
    v: G.STATE_VERSION, moHinhCT: 'so-luong-v1', moHinhNhip: G.NHIP_V1.marker,
    moHinhQuyDao: G.QUY_DAO_V1.marker,
    seed: seed, now: now, t0: now, lastTick: now,
    ten: ten || 'Chỉ Huy',
    home: home,
    planets: [],
    tech: {}, ncQueue: null,
    galana: 3000, techPts: 0,
    fleets: [], toi: [], tenLua: [],   // toi = hạm đội địch đang bay tới; tenLua = tên lửa đang bay
    npc: {}, debris: {},
    msgs: [], nk: [],
    baoTri: {
      nextAt: now + G.NHIP_V1.cycleSeconds,
      cycle: 0,
      missStreak: 0,
      arrearsGalana: 0,
      activatedAt: now,
      rules: G.NHIP_V1.maintenanceRules
    },
    /* Alias state v4: chỉ giữ để client cũ đọc được trong một vòng nâng cấp. */
    nextMaint: now + G.NHIP_V1.cycleSeconds,
    nextRaid: now + 3600 * 3,
    soChuKy: 0, noBaoTri: 0,
    lm: null,
    /* Kinh tế thật v7 [XÁC NHẬN khung; hằng số trong G.KINH_TE_V1] */
    nganHang: { soDu: 0, laiLuc: 0 },
    dauTuST: { von: 0, ketThucAt: 0 },
    uranium: 0,
    luongGD: { muc: 0, traLuc: 0, phanBoi: false },
    choDon: [],
    moHinhKT: G.KINH_TE_V1.marker,
    stats: { thang: 0, thua: 0, cuop: 0, tauMat: 0, tauDietDich: 0, chuyenBay: 0 },
    fleetIdSeq: 1
  };
  var htMe = G.htMoi(st, home, 'Hành Tinh Mẹ', true);
  /* Hành tinh mẹ luôn là Ôn Hoà — nơi loài người khởi đầu được */
  htMe.loai = 'onhoa';
  var Lme = G.LHT('onhoa');
  htMe.temp = Math.round((Lme.temp[0] + Lme.temp[1]) / 2);
  htMe.oDat = Math.max(150, htMe.oDat);
  st.planets.push(htMe);
  G.tin(st, 'he', 'Chào mừng tới kỷ nguyên liên ngân hà',
    'Hạm đội thuộc địa đã hạ cánh tại ' + G.tdStr(home) + '. Bộ Chỉ Huy Liên Hành Tinh giao cho ' +
    st.ten + ' quyền toàn quyền phát triển hành tinh này. Bối cảnh: ' + G.BOI_CANH + '.\n\n' +
    'Nhắc lại quy định: mỗi 6 giờ hành tinh phải qua một CHU KỲ BẢO TRÌ. ' +
    'Không đủ Galana để trả phí bảo trì thì sản lượng sụt và nghiên cứu đứng bánh.\n\n' +
    'Chưa biết bắt đầu từ đâu thì mở màn HƯỚNG DẪN ở cuối menu bên trái.');
  return st;
};

G.htMoi = function (st, c, ten, thuDo) {
  var d = G.dacTinh(st, c);
  return {
    c: { g: c.g, h: c.h, p: c.p }, ten: ten || 'Thuộc Địa', thuDo: !!thuDo,
    loai: d.loai, temp: d.temp, oDat: d.oDat,
    b: {}, res: { metal: thuDo ? 1500 : 500, crystal: thuDo ? 800 : 300, deut: thuDo ? 200 : 100, food: thuDo ? 1200 : 400 },
    ships: {}, def: {}, mis: {}, linh: {},
    qB: [], qS: [],
    doi: 0,                    // alias cảnh báo đói của state cũ
    danSu: G.danSuMacDinh()
  };
};


/* =======================================================================
 * STATE V5: NHỊP BẢO TRÌ, DÂN SỐ VÀ NGHIÊN CỨU TRẢ GÓP
 * -----------------------------------------------------------------------
 * Tư liệu xác nhận nhịp toàn đế quốc 6 giờ, dân số sàn 250.000 và chi phí
 * nghiên cứu bị rút theo từng nhịp. Các tỷ lệ cụ thể nằm trong G.NHIP_V1
 * và đều được đánh dấu [TÁI DỰNG] tại data.js. */
G.danSuMacDinh = function () {
  return {
    population: G.NHIP_V1.populationStart,
    supportBp: G.NHIP_V1.defaultSupportBp,
    taxBp: G.NHIP_V1.defaultTaxBp,
    foodDemandCycle: 0,
    foodShortfallCycle: 0,
    decayRemainder: 0
  };
};

G.sucChuaDan = function (p) {
  var city = G.B('city');
  var moiTP = city && isFinite(city.housing) ? city.housing : G.NHIP_V1.cityHousing;
  return Math.max(G.NHIP_V1.populationFloor,
    Math.floor(G.NHIP_V1.baseHousing + Math.max(0, Number((p.b || {}).city) || 0) * moiTP));
};

G.nhuCauTPChuKy = function (st, p) {
  var ds = p && p.danSu;
  var population = Math.max(G.NHIP_V1.populationFloor, Math.floor(Number(ds && ds.population) || 0));
  var soCT = 0, soThu = 0, k;
  for (k in ((p && p.b) || {})) soCT += Math.max(0, Number(p.b[k]) || 0);
  for (k in ((p && p.def) || {})) soThu += Math.max(0, Number(p.def[k]) || 0);
  var thuyThu = G.thuyThu && p ? G.thuyThu(p.ships || {}) : 0;
  return population * G.NHIP_V1.foodPerPersonCycle +
    (0.05 * thuyThu + 0.5 * soCT + 0.01 * soThu) *
      (G.NHIP_V1.cycleSeconds / 3600) * G.C.TOC_DO_SERVER;
};

/* Civil v4 chỉ dùng khi tua phần thời gian nằm trước activatedAt. Đây là
 * compatibility bridge, không phải luật dân số mới. */
G.danSuV4Gio = function (st, p) {
  var soThu = 0, k;
  for (k in ((p && p.def) || {})) soThu += Math.max(0, Number(p.def[k]) || 0);
  var anUong = (0.05 * G.thuyThu((p && p.ships) || {}) +
    0.5 * G.tongSoCT(p) + 0.01 * soThu) * G.C.TOC_DO_SERVER;
  var thue = G.C.THUE_CO_BAN * G.tongSoCT(p) * G.C.TOC_DO_SERVER * (p.doi > 0 ? 0.5 : 1);
  return { anUong: anUong, thue: thue };
};

/* Thuế chạy liên tục để đổi thuế giữa chu kỳ được chia đúng theo thời gian. */
G.thueDanSuGio = function (st, p) {
  var ds = p && p.danSu;
  if (!ds) return 0;
  var population = Math.max(G.NHIP_V1.populationFloor, Math.floor(Number(ds.population) || 0));
  var tax = Math.max(G.NHIP_V1.minTaxBp, Math.min(G.NHIP_V1.maxTaxBp, Math.floor(Number(ds.taxBp) || 0)));
  var support = Math.max(0, Math.min(G.NHIP_V1.maxSupportBp, Math.floor(Number(ds.supportBp) || 0)));
  return population * G.NHIP_V1.taxGalanaPerPersonHour *
    G.C.TOC_DO_SERVER * tax / 10000 * support / 10000;
};
G.thueDanSuChuKy = function (st, p) {
  return G.thueDanSuGio(st, p) * (G.NHIP_V1.cycleSeconds / 3600);
};

G.timHanhTinh = function (st, planetKey) {
  var ps = st && Array.isArray(st.planets) ? st.planets : [];
  for (var i = 0; i < ps.length; i++) if (ps[i].c && G.tdKey(ps[i].c) === planetKey) return ps[i];
  return null;
};

G.dongBoBaoTriCu = function (st) {
  if (!st || !st.baoTri) return st;
  st.nextMaint = st.baoTri.nextAt;
  st.soChuKy = st.baoTri.cycle;
  st.noBaoTri = st.baoTri.arrearsGalana;
  return st;
};

function vectorChiPhi(o) {
  var out = {};
  o = o && typeof o === 'object' ? o : {};
  for (var k in o) {
    var n = Number(o[k]);
    if (isFinite(n) && n > 0) out[k] = n;
  }
  return out;
}
function vectorCong(a, b) {
  var out = vectorChiPhi(a), k;
  b = vectorChiPhi(b);
  for (k in b) out[k] = (out[k] || 0) + b[k];
  return out;
}

G.chiPhiConLai = function (q) {
  var out = {}, tong = vectorChiPhi(q && q.totalCost), da = vectorChiPhi(q && q.paidCost);
  for (var k in tong) {
    var con = Math.max(0, tong[k] - (da[k] || 0));
    if (con > 0) out[k] = con;
  }
  return out;
};

/* Mỗi kỳ lấy ceil(phần còn lại / số kỳ còn lại), nên kỳ cuối khép đúng
 * totalCost và không tích luỹ sai số ở các vector tài nguyên khác nhau. */
G.kyNghienCuu = function (q) {
  var out = {}, con = G.chiPhiConLai(q);
  var soKy = Math.max(0, Math.floor(Number(q && q.installmentsLeft) || 0));
  if (!soKy) return out;
  for (var k in con) out[k] = Math.ceil(con[k] / soKy);
  return out;
};

G.conLaiNghienCuu = function (st, q) {
  q = q || (st && st.ncQueue);
  return q ? Math.max(0, Math.floor(Number(q.finishAt) || 0) - Math.floor(Number(st && st.now) || 0)) : 0;
};

/* =======================================================================
 * CHI PHÍ & ĐIỀU KIỆN
 * ===================================================================== */
G.giaXay = function (def, lv) {
  var out = {}, f = Math.pow(def.factor || 2, Math.max(0, lv - 1));
  for (var k in def.cost) out[k] = Math.floor(def.cost[k] * f);
  return out;
};
/* Công trình v4 mua theo lô: giá đơn vị không phụ thuộc số đã có. */
G.giaCongTrinh = function (def, n) {
  n = Math.max(0, Math.floor(Number(n) || 0));
  var out = {};
  for (var k in def.cost) out[k] = def.cost[k] * n;
  return out;
};
G.giaDonVi = function (def, n) {
  var out = {};
  for (var k in def.cost) out[k] = def.cost[k] * (n || 1);
  return out;
};
G.duTien = function (st, p, cost) {
  for (var k in cost) {
    if (k === 'galana') { if (st.galana < cost[k]) return false; }
    else if (k === 'tech') { if (st.techPts < cost[k]) return false; }
    else if ((p.res[k] || 0) < cost[k]) return false;
  }
  return true;
};
G.truTien = function (st, p, cost) {
  for (var k in cost) {
    if (k === 'galana') st.galana -= cost[k];
    else if (k === 'tech') st.techPts -= cost[k];
    else p.res[k] = (p.res[k] || 0) - cost[k];
  }
};
G.hoanTien = function (st, p, cost, tyLe) {
  tyLe = (tyLe === undefined) ? 1 : tyLe;
  for (var k in cost) {
    if (k === 'galana') st.galana += cost[k] * tyLe;
    else if (k === 'tech') st.techPts += cost[k] * tyLe;
    else p.res[k] = (p.res[k] || 0) + cost[k] * tyLe;
  }
};
G.thoaDK = function (st, p, def) {
  if (!def.req) return true;
  var k;
  if (def.req.b) for (k in def.req.b) if ((p.b[k] || 0) < G.slYeuCau(k, def.req.b[k])) return false;
  if (def.req.r) for (k in def.req.r) if ((st.tech[k] || 0) < def.req.r[k]) return false;
  return true;
};
/* req.b trong data cũ là mốc level; chuyển một lần ở biên so sánh để
 * không phải viết lại hàng trăm điều kiện tàu/công sự/nghiên cứu. */
G.slYeuCau = function (id, mucCapCu) {
  var d = G.B(id);
  return d ? G.slTuCap(d, mucCapCu) : Math.max(0, Math.floor(mucCapCu || 0));
};
G.thieuDK = function (st, p, def) {
  var out = [], k;
  if (!def.req) return out;
  if (def.req.b) for (k in def.req.b) {
    var can = G.slYeuCau(k, def.req.b[k]);
    if ((p.b[k] || 0) < can) out.push(G.B(k).ten + ' × ' + can);
  }
  if (def.req.r) for (k in def.req.r) if ((st.tech[k] || 0) < def.req.r[k]) out.push(G.R(k).ten + ' cấp ' + def.req.r[k]);
  return out;
};

/* =======================================================================
 * SẢN LƯỢNG
 * ===================================================================== */
