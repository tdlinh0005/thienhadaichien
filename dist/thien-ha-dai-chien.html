<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#05070f">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiên Hà Đại Chiến</title>
<meta name="description" content="Bản phục dựng webgame chiến thuật vũ trụ Thiên Hà Đại Chiến của dev Việt (2004–2013).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23070b14%27/%3E%3Ccircle cx=%2732%27 cy=%2734%27 r=%2716%27 fill=%27%23ff7a18%27/%3E%3Cellipse cx=%2732%27 cy=%2734%27 rx=%2726%27 ry=%277%27 fill=%27none%27 stroke=%27%2357c8ff%27 stroke-width=%273%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%272%27 fill=%27%23fff%27/%3E%3Ccircle cx=%2752%27 cy=%2716%27 r=%271.6%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<style>
/* THIÊN HÀ ĐẠI CHIẾN — giao diện nhại webgame Việt 2009–2013:
   nền vũ trụ tối, viền kim loại, bảng biểu dày đặc số liệu. */
:root{
  --den:#05070f; --den2:#0a0e1b; --panel:#101627; --panel2:#0c1120;
  --vien:#243352; --vien2:#31456e;
  --chu:#c8d4ea; --mo:#7f8ca8; --sang:#eaf1ff;
  --cam:#ffa032; --cam2:#ff7a18; --lam:#57c8ff; --luc:#5fdc8b; --do:#ff5f5f; --tim:#c78cff; --vang:#ffd75e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -10%, #16224a 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #2a1338 0%, transparent 55%),
    var(--den);
  color:var(--chu);
  font:13px/1.5 "Segoe UI",Tahoma,Arial,sans-serif;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 20% 30%,#fff,transparent),
    radial-gradient(1px 1px at 70% 15%,#cfe4ff,transparent),
    radial-gradient(1px 1px at 40% 70%,#fff,transparent),
    radial-gradient(1px 1px at 85% 60%,#ffd9a8,transparent),
    radial-gradient(1px 1px at 10% 85%,#fff,transparent),
    radial-gradient(1px 1px at 55% 45%,#bcd4ff,transparent),
    radial-gradient(2px 2px at 92% 88%,#fff,transparent);
}
a{color:var(--lam)}
h1,h2,h3{margin:0 0 8px;font-weight:600;letter-spacing:.4px}
b{color:var(--sang)}
.mo{color:var(--mo)}
.sang{color:var(--sang)}
.cam{color:var(--cam)} .lam{color:var(--lam)} .luc{color:var(--luc)} .do{color:var(--do)} .vang{color:var(--vang)} .tim{color:var(--tim)}
.sz{font-variant-numeric:tabular-nums;font-family:"Consolas","DejaVu Sans Mono",monospace}

/* ---------- màn khởi động ---------- */
.khoidong{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.kd-hop{width:min(560px,100%);background:linear-gradient(180deg,#0d1425 0%,#080c17 100%);
  border:1px solid var(--vien2);border-radius:6px;padding:26px 24px;box-shadow:0 0 0 1px #000,0 18px 60px rgba(0,0,0,.7)}
.kd-logo{font-size:34px;font-weight:800;letter-spacing:3px;color:var(--sang);text-shadow:0 0 18px rgba(87,200,255,.45)}
.kd-logo span{display:block;font-size:34px;color:var(--cam);text-shadow:0 0 22px rgba(255,122,24,.5)}
.kd-sub{margin-top:6px;color:var(--mo);letter-spacing:.5px}
.kd-nam{margin:14px 0 18px;padding:8px 10px;border-left:3px solid var(--cam);background:#0b1120;color:var(--chu)}
.kd-form label{display:block;margin:10px 0 4px;color:var(--mo);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.kd-form input{width:100%}
.kd-ghi{margin-top:18px;padding-top:14px;border-top:1px solid var(--vien);color:var(--mo);font-size:12px}

input,select,textarea{
  background:#070b14;border:1px solid var(--vien2);color:var(--sang);padding:7px 9px;border-radius:3px;font:inherit;
}
input:focus,select:focus{outline:none;border-color:var(--cam);box-shadow:0 0 0 2px rgba(255,160,50,.15)}
input[type=number]{width:96px}
input[type=range]{padding:0}

.nut{
  background:linear-gradient(180deg,#1d2b48,#131c30);border:1px solid var(--vien2);color:var(--sang);
  padding:7px 12px;border-radius:3px;cursor:pointer;font:inherit;letter-spacing:.3px
}
.nut:hover{border-color:var(--cam);color:#fff}
.nut:focus-visible,#menu a:focus-visible,select:focus-visible{outline:2px solid var(--lam);outline-offset:1px}
#menu a:focus-visible{color:#fff}
.nut:active{transform:translateY(1px)}
.nut.lon{display:block;width:100%;margin-top:18px;padding:12px;font-weight:700;letter-spacing:1.5px;
  background:linear-gradient(180deg,var(--cam),var(--cam2));border-color:#a8500a;color:#160c02}
.nut.phu{display:block;width:100%;margin-top:8px}
.nut.nho{padding:4px 8px;font-size:12px}
.nut.oke{background:linear-gradient(180deg,#1d5c37,#123c25);border-color:#2c7a4a}
.nut.xoa{background:linear-gradient(180deg,#5c1d1d,#3c1212);border-color:#7a2c2c}
.nut:disabled{opacity:.45;cursor:not-allowed}

/* ---------- khung game ---------- */
#game{position:relative;z-index:2}
#thanh-tren{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 14px;background:linear-gradient(180deg,#111a2e,#0a0f1c);border-bottom:1px solid var(--vien2)
}
.tt-logo{font-weight:800;letter-spacing:2px;color:var(--cam);cursor:pointer;white-space:nowrap}
.tt-res{display:flex;gap:14px;flex-wrap:wrap;flex:1}
.tt-res .o{min-width:104px}
.tt-res .o .n{display:block;font-size:11px;letter-spacing:.6px;color:var(--mo);text-transform:uppercase}
.tt-res .o .v{font-size:14px;font-weight:600}
.tt-res .o .r{font-size:10.5px;color:var(--mo);margin-left:5px}
.tt-phu{display:flex;gap:6px;align-items:center}
#nut-menu{display:none}

#thanh-canh{padding:0 14px}
.canh{margin:8px 0 0;padding:7px 10px;border-left:3px solid var(--do);background:#26101a;color:#ffd9d9}
.canh.bt{border-color:var(--vang);background:#241f0f;color:#ffeeba}
.canh.ok{border-color:var(--luc);background:#0f2418;color:#c9f5d8}

.khung{display:flex;gap:14px;padding:12px 14px 40px;align-items:flex-start}
#menu{width:186px;flex:none;position:sticky;top:62px}
#menu a{
  display:flex;justify-content:space-between;gap:6px;padding:8px 10px;margin-bottom:3px;text-decoration:none;
  color:var(--chu);background:linear-gradient(180deg,#131c30,#0d1425);border:1px solid var(--vien);border-left:3px solid transparent;
  border-radius:2px;cursor:pointer;font-size:13px
}
#menu a:hover{border-left-color:var(--lam);color:#fff}
#menu a.on{border-left-color:var(--cam);background:linear-gradient(180deg,#1e2a44,#141d33);color:#fff;font-weight:600}
#menu a .dem-nho{background:var(--cam2);color:#180b02;border-radius:8px;padding:0 6px;font-size:11px;font-weight:700}
#noidung{flex:1;min-width:0;max-width:100%}

#chan{padding:10px 14px 26px;color:var(--mo);font-size:11px;border-top:1px solid var(--vien);margin-top:20px}

/* ---------- panel & bảng ---------- */
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--vien);border-radius:4px;margin-bottom:12px}
.panel>h3{margin:0;padding:8px 12px;background:linear-gradient(180deg,#1a2540,#131c30);border-bottom:1px solid var(--vien);
  font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cam)}
.panel>.noi{padding:12px}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:10px}
.luoi2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:10px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid #1a2440;text-align:left;vertical-align:top}
th{color:var(--mo);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px;background:#0d1424}
tr:hover>td{background:#121b30}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.bang-cuon{overflow-x:auto}

/* ---------- thẻ đơn vị ---------- */
.the{background:linear-gradient(180deg,#131c30,#0c1220);border:1px solid var(--vien);border-radius:4px;padding:10px}
.the.tat{opacity:.55}
.the h4{margin:0 0 2px;font-size:13px;color:var(--sang)}
.the .cap{float:right;font-size:11px;color:var(--cam);border:1px solid var(--vien2);border-radius:10px;padding:0 7px}
.the .mt{color:var(--mo);font-size:11.5px;margin:4px 0 8px;min-height:32px}
.the .gia{display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;margin-bottom:8px}
.the .gia span.thieu{color:var(--do)}
.the .ct{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.the .dk{color:var(--do);font-size:11px;margin-bottom:6px}
.thanh{height:5px;background:#0a1020;border:1px solid var(--vien);border-radius:3px;overflow:hidden;margin:6px 0}
.thanh>i{display:block;height:100%;background:linear-gradient(90deg,var(--cam2),var(--vang))}

/* ---------- thiên hà ---------- */
.gal-dh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
tr.trong td{color:#55617c}
tr.toi td{background:#0f2a1c}
tr.nguoi td{background:#241703}
tr.nguoi:hover>td{background:#2f1e05}
tr.npc-bo td{background:#231a0d}
.tag-lm{color:var(--tim);font-size:11px}
.pl{color:var(--vang);font-size:11px}

/* ---------- báo cáo ---------- */
.bc{font-size:12.5px}
.bc table{margin:6px 0 10px}
.bc .kq{padding:6px 10px;margin:6px 0;border-left:3px solid var(--vien2)}
.bc .kq.thang{border-color:var(--luc);background:#0f2418}
.bc .kq.thua{border-color:var(--do);background:#26101a}
.bc .kq.hoa{border-color:var(--vang);background:#241f0f}
pre.nd{white-space:pre-wrap;font:inherit;margin:0}

/* ---------- tin nhắn ---------- */
.tn{border:1px solid var(--vien);border-radius:3px;margin-bottom:6px;background:#0d1424}
.tn>.d{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;cursor:pointer;background:linear-gradient(180deg,#151f36,#0e1526)}
.tn>.d:hover{color:#fff}
.tn>.n{padding:10px;border-top:1px solid var(--vien)}
.tn.moi>.d{border-left:3px solid var(--cam)}
.hu{display:inline-block;min-width:56px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mo)}

/* ---------- hộp thoại ---------- */
.hop-thoai{position:fixed;inset:0;z-index:100;background:rgba(2,4,10,.78);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.ht-trong{width:min(760px,100%);background:var(--panel);border:1px solid var(--vien2);border-radius:5px;box-shadow:0 20px 70px #000}
.ht-dau{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#18223a;border-bottom:1px solid var(--vien);
  font-weight:700;letter-spacing:1px;color:var(--cam)}
#ht-noi{padding:14px;max-height:calc(100vh - 140px);overflow:auto}

/* ---------- toast ---------- */
#toast{position:fixed;right:14px;bottom:14px;z-index:200;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#toast .t{background:#111c31;border:1px solid var(--vien2);border-left:3px solid var(--cam);padding:8px 12px;border-radius:3px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:320px;animation:vao .18s ease-out}
#toast .t.loi{border-left-color:var(--do)}
#toast .t.ok{border-left-color:var(--luc)}
@keyframes vao{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- form hạm đội ---------- */
.hd-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:8px}
.hd-tau{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#0c1220;border:1px solid var(--vien);padding:6px 8px;border-radius:3px}
.hd-tau input{width:84px}
.hd-td{display:flex;gap:4px;align-items:center}
.hd-td input{width:56px;text-align:center}

@media (max-width:860px){
  /* màn nhỏ: mọi bảng tự cuộn ngang trong khung của nó, cả trang không bao giờ cuộn ngang */
  .panel>.noi>table,.bc>table{display:block;overflow-x:auto;max-width:100%}
  .the .cap{float:none;display:inline-block;margin-left:6px}
  .gal-dh input{width:64px}
  .khung{flex-direction:column;padding:10px}
  #menu{width:100%;position:static;display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
  #menu.mo-ra{display:grid}
  #nut-menu{display:inline-block}
  /* thanh tài nguyên: lưới gọn, xuống hàng riêng thay vì mỗi thứ một dòng */
  #thanh-tren{padding:6px 10px;gap:8px}
  .tt-logo{font-size:12px;letter-spacing:1px}
  .tt-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:4px 8px;flex-basis:100%;order:3}
  .tt-res .o{min-width:0}
  .tt-res .o .n{font-size:10px;letter-spacing:.3px}
  .tt-res .o .v{font-size:12.5px}
  .tt-res .o .r{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-res .o .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .tt-phu{margin-left:auto}
  #chon-ht{max-width:150px}
  .kd-logo,.kd-logo span{font-size:26px}
}

</style>
</head>
<body>
<div id="man-khoidong" class="khoidong">
  <div class="kd-hop">
    <div class="kd-logo">THIÊN HÀ<span>ĐẠI CHIẾN</span></div>
    <div class="kd-sub">Webgame chiến thuật vũ trụ &middot; bản phục dựng <span id="kd-ver"></span></div>
    <div class="kd-nam">Năm <b>2184</b> &middot; Liên Bang Địa Cầu &middot; Vùng biên Ngân Hà</div>
    <div class="kd-form">
      <label>Tên chỉ huy</label>
      <input id="kd-ten" maxlength="18" placeholder="VD: Quốc Bình" autocomplete="off">
      <label>Hạt giống vũ trụ <span class="mo">(để trống = ngẫu nhiên)</span></label>
      <input id="kd-seed" maxlength="24" placeholder="THDC-2184" autocomplete="off">
      <button id="kd-batdau" class="nut lon">BẮT ĐẦU CHIẾN DỊCH</button>
      <button id="kd-tieptuc" class="nut phu" style="display:none">TIẾP TỤC BÀN CŨ</button>
    </div>
    <div class="kd-ghi">
      Bản gốc do <b>Trần Châu Quốc Bình</b> và nhóm 3 người phát triển từ 2004, đoạt giải VietGames 2006.
      Đây là bản dựng lại từ tư liệu còn sót — xem <a href="https://github.com/tdlinh0005/thienhadaichien/blob/main/docs/NGHIEN-CUU.md" target="_blank" rel="noreferrer">phần nghiên cứu</a>.
    </div>
  </div>
</div>

<div id="game" style="display:none">
  <header id="thanh-tren">
    <div class="tt-logo" data-act="man" data-man="tongquan">THIÊN HÀ ĐẠI CHIẾN</div>
    <div id="tt-res" class="tt-res"></div>
    <div class="tt-phu">
      <select id="chon-ht" title="Chọn hành tinh"></select>
      <button class="nut nho" data-act="luu">Lưu</button>
      <button class="nut nho" id="nut-menu">☰</button>
    </div>
  </header>

  <div id="thanh-canh"></div>

  <div class="khung">
    <nav id="menu"></nav>
    <main id="noidung"></main>
  </div>

  <footer id="chan">
    <span id="chan-tt"></span>
  </footer>
</div>

<div id="hop-thoai" class="hop-thoai" style="display:none">
  <div class="ht-trong">
    <div class="ht-dau"><span id="ht-td"></span><button class="nut nho" data-act="dong-ht">✕</button></div>
    <div id="ht-noi"></div>
  </div>
</div>
<div id="toast"></div>
<script>
/* ===== js/data.js ===== */
/* =========================================================================
 * THIÊN HÀ ĐẠI CHIẾN — Bảng dữ liệu game
 * -------------------------------------------------------------------------
 * Tên tài nguyên, chu kỳ bảo trì 6h, nghiên cứu trả góp, phòng thủ 2 lớp,
 * hạm đội đổi mục tiêu giữa đường  => lấy từ tư liệu về game gốc.
 * Toàn bộ CON SỐ cân bằng là [SUY LUẬN] theo khung OGame (xem docs/NGHIEN-CUU.md)
 * ========================================================================= */
'use strict';

var G = window.G = window.G || {};

G.VERSION = '1.33f-r';           // nhại phiên bản 1.33f của bản gốc
G.NAM_BOI_CANH = 2184;

/* --- Tài nguyên ------------------------------------------------------- */
G.RES = [
  { id: 'metal',   ten: 'Kim Loại',   ky: 'KL', mau: '#c9a06a' },
  { id: 'crystal', ten: 'Tinh Thể',   ky: 'TT', mau: '#7fd4f5' },
  { id: 'deut',    ten: 'Deuterium',  ky: 'DT', mau: '#9be59b' },
  { id: 'food',    ten: 'Lương Thực', ky: 'LT', mau: '#e5c76b' },
  { id: 'galana',  ten: 'Galana',     ky: 'GL', mau: '#f0b3ff' },
  { id: 'tech',    ten: 'Công Nghệ',  ky: 'CN', mau: '#8fa8ff' }
];
G.RES_HANH_TINH = ['metal', 'crystal', 'deut', 'food'];  // chứa ở kho hành tinh
G.RES_DE_QUOC   = ['galana', 'tech'];                    // chung toàn đế quốc

/* --- 5 loại hành tinh (tư liệu gốc: thread GVN của người chơi Nazgul) ----
 * Nguyên văn mô tả từng loại nằm trong docs/NGHIEN-CUU.md; các HỆ SỐ dưới đây
 * là [SUY LUẬN] dịch mô tả chữ thành con số.                               */
G.LOAI_HT = [
  { id: 'onhoa', ten: 'Ôn Hoà', mau: '#7fe0a0',
    mota: 'Hành tinh hoàn hảo với các điều kiện như Trái Đất. Không mạnh mặt nào nhưng cũng không yếu mặt nào.',
    oDat: 1.00, kl: 1.00, tt: 1.00, dt: 1.00, lt: 1.15, dien: 1.00, thuDat: 1.00, temp: [20, 60] },
  { id: 'runggia', ten: 'Rừng Già', mau: '#8fd14f',
    mota: 'Hành tinh cổ vài tỉ năm, không một nền văn minh nào, chỉ có rừng cây và muông thú. Lương thực dồi dào, đất rộng.',
    oDat: 1.12, kl: 0.90, tt: 0.95, dt: 0.90, lt: 1.55, dien: 0.95, thuDat: 1.00, temp: [10, 45] },
  { id: 'nuoc', ten: 'Nước – Đầm Lầy', mau: '#57c8ff',
    mota: '90% bề mặt là biển, còn lại là đầm lầy. Khó kiến thiết (ít ô đất) nhưng KHÓ TẤN CÔNG và rất nhiều nhiên liệu.',
    oDat: 0.75, kl: 0.85, tt: 0.90, dt: 1.60, lt: 1.10, dien: 0.90, thuDat: 1.25, temp: [5, 40] },
  { id: 'samac', ten: 'Sa Mạc', mau: '#ffb45e',
    mota: 'Gần Mặt Trời, nóng khủng khiếp, nghèo nàn về sự sống nhưng tài nguyên phong phú và dễ khai thác.',
    oDat: 1.00, kl: 1.35, tt: 1.25, dt: 0.60, lt: 0.55, dien: 1.35, thuDat: 0.90, temp: [80, 140] },
  { id: 'banghai', ten: 'Băng Hà', mau: '#bcd9ff',
    mota: 'Xa Mặt Trời, ánh sáng hạn chế, khắc nghiệt hơn Nam Cực. Được chọn vì PHÒNG THỦ MẶT ĐẤT MẠNH và nhiều nhiên liệu.',
    oDat: 0.90, kl: 0.90, tt: 1.00, dt: 1.45, lt: 0.70, dien: 0.60, thuDat: 1.50, temp: [-130, -40] }
];

/* THIÊN HÀ ĐẠI CHIẾN — tiện ích chung */
'use strict';
var G = window.G = window.G || {};

/* --- Số ---------------------------------------------------------------- */
G.so = function (n) {
  n = Math.floor(n || 0);
  var am = n < 0; n = Math.abs(n);
  var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (am ? '-' : '') + s;
};
G.soNgan = function (n) {
  n = Math.floor(n || 0);
  var a = Math.abs(n), s;
  if (a >= 1e12) s = (n / 1e12).toFixed(2) + ' NTy';     // nghìn tỷ
  else if (a >= 1e9) s = (n / 1e9).toFixed(2) + ' Ty';   // tỷ
  else if (a >= 1e6) s = (n / 1e6).toFixed(2) + ' Tr';   // triệu
  else if (a >= 1e4) s = (n / 1e3).toFixed(1) + ' N';    // nghìn
  else s = G.so(n);
  return s;
};
G.tocDoText = function (n) { return G.so(Math.round(n)); };

/* --- Thời gian --------------------------------------------------------- */
G.tg = function (giay) {
  giay = Math.max(0, Math.round(giay));
  var ng = Math.floor(giay / 86400); giay -= ng * 86400;
  var h = Math.floor(giay / 3600); giay -= h * 3600;
  var p = Math.floor(giay / 60); var s = giay - p * 60;
  var out = [];
  if (ng) out.push(ng + 'n');
  if (ng || h) out.push(h + 'h');
  if (ng || h || p) out.push(p + 'p');
  out.push(s + 's');
  return out.join(' ');
};
G.gio = function (ts) {
  var d = new Date(ts);
  var p = function (x) { return (x < 10 ? '0' : '') + x; };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
};

/* --- Đối tượng --------------------------------------------------------- */
G.clone = function (o) { return JSON.parse(JSON.stringify(o)); };
G.cong = function (a, b, k) {
  k = (k === undefined) ? 1 : k;
  for (var p in b) if (b[p]) a[p] = (a[p] || 0) + b[p] * k;
  return a;
};
G.tongRes = function (r) {
  var t = 0;
  for (var i = 0; i < G.RES_HANH_TINH.length; i++) t += (r[G.RES_HANH_TINH[i]] || 0);
  return t;
};
G.trong = function (o) { for (var k in o) if (o[k] > 0) return false; return true; };

/* --- PRNG tất định (mulberry32) --------------------------------------- */
G.rng = function (seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
G.hash = function (str) {
  var h = 2166136261 >>> 0;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
};

/* --- Toạ độ ------------------------------------------------------------ */
G.toaDo = function (g, h, p) { return { g: g, h: h, p: p }; };
G.tdStr = function (c) { return '[' + c.g + ':' + c.h + ':' + c.p + ']'; };
G.tdKey = function (c) { return c.g + ':' + c.h + ':' + c.p; };
G.tdParse = function (s) {
  var m = String(s).replace(/[\[\]]/g, '').split(':');
  if (m.length !== 3) return null;
  var c = G.toaDo(parseInt(m[0], 10), parseInt(m[1], 10), parseInt(m[2], 10));
  if (!(c.g >= 1 && c.g <= G.C.SO_THIEN_HA)) return null;
  if (!(c.h >= 1 && c.h <= G.C.SO_HE)) return null;
  /* ô 16 là vùng không gian sâu — hợp lệ để thám hiểm, không phải hành tinh */
  if (!(c.p >= 1 && c.p <= G.C.O_THAM_HIEM)) return null;
  return c;
};
G.bang = function (a, b) { return a && b && a.g === b.g && a.h === b.h && a.p === b.p; };

/* Khoảng cách kiểu OGame [SUY LUẬN] */
G.khoangCach = function (a, b) {
  if (a.g !== b.g) return 20000 * Math.abs(a.g - b.g);
  if (a.h !== b.h) return 2700 + 95 * Math.abs(a.h - b.h);
  if (a.p !== b.p) return 1000 + 5 * Math.abs(a.p - b.p);
  return 5;
};

/* --- Móc nối cho chế độ nhiều người ------------------------------------
 * Ở bản một người G.HOOK = null: vũ trụ nằm gọn trong state của người chơi.
 * Ở bản nhiều người, server gán G.HOOK để chuyển quyền sở hữu hành tinh,
 * trạng thái NPC và bãi phế liệu sang database dùng chung.               */
G.HOOK = null;

/* --- Thông tin một ô hành tinh ---------------------------------------- */
G.oHanhTinh = function (st, c) {
  var key = G.tdKey(c);
  if (c.p === G.C.O_THAM_HIEM) return { loai: 'sau', key: key, c: c };
  for (var i = 0; i < st.planets.length; i++)
    if (G.tdKey(st.planets[i].c) === key) return { loai: 'toi', pi: i, p: st.planets[i], key: key, c: c };

  if (G.HOOK && G.HOOK.oNguoi) {
    var ng = G.HOOK.oNguoi(st, c);
    if (ng) return ng;                    // hành tinh của người chơi khác
  }

  if (!G.coNPC(st.seed, c)) return { loai: 'trong', key: key, c: c };
  return { loai: 'npc', key: key, c: c, npc: G.npc(st, c) };
};

/* Ô này có NPC hay không — hoàn toàn tất định theo hạt giống vũ trụ */
G.coNPC = function (seed, c) {
  var r = G.rng(G.hash(seed + '#' + G.tdKey(c)));
  var mat = (c.p >= 4 && c.p <= 12) ? 0.34 : 0.14;
  return r() <= mat;
};

/* --- Sinh & lưu trạng thái một NPC ------------------------------------ */
G.npc = function (st, c) {
  var key = G.tdKey(c);
  if (G.HOOK && G.HOOK.npc) { var chung = G.HOOK.npc(st, c, key); if (chung) { G.npcHoiPhuc(st, chung); return chung; } }
  if (st.npc[key]) { G.npcHoiPhuc(st, st.npc[key]); return st.npc[key]; }

  var r = G.rng(G.hash(st.seed + '@' + key));
  r(); // bỏ số đầu (đã dùng cho mật độ)
  var xa = G.khoangCach(c, st.home) / 20000;                    // càng xa càng mạnh
  var manh = Math.min(1, 0.25 + r() * 0.55 + xa * 0.25);
  var diem = Math.round(140 * Math.pow(420, manh));
  var bo = r() < 0.16;                                           // "nông trại": bỏ hoang
  var hang = bo ? 0 : (manh < 0.45 ? 1 : (manh < 0.78 ? 2 : 3));

  var n = {
    key: key, c: { g: c.g, h: c.h, p: c.p },
    ten: G.HO[Math.floor(r() * G.HO.length)] + ' ' + G.TEN[Math.floor(r() * G.TEN.length)],
    htTen: G.TEN_HT[Math.floor(r() * G.TEN_HT.length)],
    lm: G.LIEN_MINH[Math.floor(r() * G.LIEN_MINH.length)],
    bo: bo, hang: hang, diem: diem,
    tech: {}, ships: {}, def: {}, res: {},
    t: st.now, cuopLuc: 0
  };

  var tl = Math.max(1, Math.round(Math.log(diem / 100) / Math.log(3)));
  n.tech = { weapon: tl, shield: tl, armor: tl, spy: Math.max(1, tl - 2), energy: tl };

  /* Hạm đội & phòng thủ quy từ điểm [SUY LUẬN] */
  var dFleet = bo ? 0 : diem * (0.28 + r() * 0.2);
  var dDef = diem * (bo ? 0.06 : 0.3 + r() * 0.2);
  n.ships = G.npcHam(dFleet, manh, r);
  n.def = G.npcThu(dDef, manh, r);
  n.res = { metal: Math.round(diem * 220), crystal: Math.round(diem * 110), deut: Math.round(diem * 45), food: Math.round(diem * 60) };
  if (bo) { n.res.metal *= 3; n.res.crystal *= 3; n.res.deut *= 2; }

  if (G.HOOK && G.HOOK.npcMoi) G.HOOK.npcMoi(n); else st.npc[key] = n;
  return n;
};

/* điểm = tổng tài nguyên đầu tư / 1000 */
G.giaTriDiem = function (cost, n) {
  return ((cost.metal || 0) + (cost.crystal || 0) + (cost.deut || 0)) * (n || 1) / 1000;
};

G.npcHam = function (diem, manh, r) {
  if (diem <= 0) return {};
  var bang;
  if (manh < 0.4) bang = [['fighterL', 0.5], ['cargoS', 0.3], ['fighterH', 0.2]];
  else if (manh < 0.7) bang = [['fighterL', 0.3], ['fighterH', 0.3], ['cruiser', 0.25], ['cargoL', 0.15]];
  else bang = [['fighterH', 0.2], ['cruiser', 0.2], ['battleship', 0.25], ['battlecruiser', 0.2], ['destroyer', 0.15]];
  var out = {};
  for (var i = 0; i < bang.length; i++) {
    var s = G.S(bang[i][0]);
    var v = G.giaTriDiem(s.cost);
    var n = Math.floor(diem * bang[i][1] * (0.7 + r() * 0.6) / v);
    if (n > 0) out[bang[i][0]] = n;
  }
  return out;
};

G.npcThu = function (diem, manh, r) {
  if (diem <= 0) return {};
  var bang;
  if (manh < 0.4) bang = [['missileLauncher', 0.6], ['laserS', 0.4]];
  else if (manh < 0.7) bang = [['missileLauncher', 0.3], ['laserS', 0.25], ['laserL', 0.2], ['ion', 0.15], ['satellite', 0.1]];
  else bang = [['laserL', 0.2], ['gauss', 0.25], ['ion', 0.12], ['plasma', 0.23], ['satellite', 0.1], ['orbitalStation', 0.1]];
  var out = {};
  for (var i = 0; i < bang.length; i++) {
    var d = G.D(bang[i][0]);
    var v = G.giaTriDiem(d.cost);
    var n = Math.floor(diem * bang[i][1] * (0.7 + r() * 0.6) / v);
    if (n > 0) out[bang[i][0]] = n;
  }
  if (manh > 0.55) out.shieldS = 1;
  if (manh > 0.85) out.shieldL = 1;
  return out;
};

/* Tài nguyên NPC tự mọc lại theo thời gian; hạm đội/phòng thủ xây lại chậm */
G.npcHoiPhuc = function (st, n) {
  var dt = st.now - (n.t || st.now);
  if (dt <= 0) { n.t = st.now; return; }
  n.t = st.now;
  var h = dt / 3600;
  var toc = n.diem * (n.bo ? 1.4 : 1) * 0.02;
  n.res.metal = Math.min(n.diem * (n.bo ? 900 : 300), (n.res.metal || 0) + toc * 22 * h);
  n.res.crystal = Math.min(n.diem * (n.bo ? 450 : 150), (n.res.crystal || 0) + toc * 11 * h);
  n.res.deut = Math.min(n.diem * (n.bo ? 180 : 60), (n.res.deut || 0) + toc * 4 * h);
  n.res.food = Math.min(n.diem * 90, (n.res.food || 0) + toc * 6 * h);

  /* Xây lại phòng thủ đã mất: 1.5%/giờ so với cấu hình gốc */
  if (!n.bo && dt > 3600) {
    var r = G.rng(G.hash(n.key + '~' + Math.floor(st.now / 3600)));
    var goc = G.npcThu(n.diem * 0.35, Math.min(1, n.diem / 50000), r);
    for (var k in goc) {
      var thieu = goc[k] - (n.def[k] || 0);
      if (thieu > 0) n.def[k] = Math.min(goc[k], (n.def[k] || 0) + Math.max(1, Math.floor(goc[k] * 0.015 * h)));
    }
  }
};

/* --- Bãi phế liệu ------------------------------------------------------ */
G.pheLieu = function (st, key) {
  if (G.HOOK && G.HOOK.pheLieu) return G.HOOK.pheLieu(key);
  if (!st.debris[key]) st.debris[key] = { metal: 0, crystal: 0 };
  return st.debris[key];
};

/* --- Danh sách một hệ (cho màn Thiên Hà) ------------------------------ */
G.xemHe = function (st, g, h) {
  var out = [];
  for (var p = 1; p <= G.C.SO_HANH_TINH; p++) {
    var c = G.toaDo(g, h, p);
    var o = G.oHanhTinh(st, c);
    var d = st.debris[o.key];
    o.debris = (d && (d.metal > 0 || d.crystal > 0)) ? d : null;
    out.push(o);
  }
  out.push(G.oHanhTinh(st, G.toaDo(g, h, G.C.O_THAM_HIEM)));
  return out;
};

/* --- Loại, nhiệt độ & số ô đất của hành tinh -------------------------
 * Loại hành tinh phụ thuộc vị trí trong hệ: gần Mặt Trời thì Sa Mạc, xa thì
 * Băng Hà, khoảng giữa thì Ôn Hoà / Rừng Già / Nước – Đầm Lầy.            */
G.loaiTheoViTri = function (seed, c) {
  var r = G.rng(G.hash(seed + '%' + G.tdKey(c)));
  var v = r();
  if (c.p <= 3) return v < 0.72 ? 'samac' : (v < 0.9 ? 'onhoa' : 'nuoc');
  if (c.p >= 13) return v < 0.72 ? 'banghai' : (v < 0.9 ? 'nuoc' : 'onhoa');
  if (c.p <= 5 || c.p >= 11) return v < 0.35 ? (c.p <= 5 ? 'samac' : 'banghai')
    : (v < 0.6 ? 'onhoa' : (v < 0.82 ? 'nuoc' : 'runggia'));
  return v < 0.34 ? 'onhoa' : (v < 0.62 ? 'runggia' : (v < 0.84 ? 'nuoc' : (v < 0.93 ? 'samac' : 'banghai')));
};

G.dacTinh = function (st, c) {
  var r = G.rng(G.hash(st.seed + '$' + G.tdKey(c)));
  var loai = G.loaiTheoViTri(st.seed, c);
  var L = G.LHT(loai);
  var temp = Math.round(L.temp[0] + r() * (L.temp[1] - L.temp[0]));
  var giua = 8, lech = Math.abs(c.p - giua);
  var oDat = Math.round((90 + (giua - lech) * 14 + r() * 60) * L.oDat);
  return { loai: loai, temp: temp, oDat: oDat };
};

/* --- Bảng xếp hạng: sinh tất định, điểm tăng dần theo thời gian ------- */
G.xepHang = function (st, loai) {
  if (G.HOOK && G.HOOK.xepHang) return G.HOOK.xepHang(st, loai);
  var r = G.rng(G.hash(st.seed + '#rank'));
  var gio = Math.max(0, (st.now - st.t0) / 3600);
  var ds = [];
  for (var i = 0; i < 59; i++) {
    var nen = 220 * Math.pow(560, Math.pow(r(), 0.85));
    var tong = Math.round(nen * (1 + gio * 0.022));
    /* chia tổng điểm ra từng hạng mục theo tỷ lệ ngẫu nhiên nhưng tất định */
    var wCT = 0.3 + r() * 0.3, wNC = 0.1 + r() * 0.2, wHam = 0.15 + r() * 0.35;
    var tongW = wCT + wNC + wHam + 0.15;
    ds.push({
      ten: G.HO[Math.floor(r() * G.HO.length)] + ' ' + G.TEN[Math.floor(r() * G.TEN.length)],
      lm: G.LIEN_MINH[Math.floor(r() * G.LIEN_MINH.length)],
      diem: tong, tong: tong,
      ct: Math.round(tong * wCT / tongW), nc: Math.round(tong * wNC / tongW),
      ham: Math.round(tong * wHam / tongW), thu: Math.round(tong * 0.15 / tongW),
      ht: 1 + Math.floor(r() * 6)
    });
  }
  var d = G.diem(st);
  ds.push({
    ten: st.ten, lm: st.lm ? st.lm.ten : '', diem: Math.round(d.tong), tong: Math.round(d.tong),
    ct: Math.round(d.ct), nc: Math.round(d.nc), ham: Math.round(d.ham), thu: Math.round(d.thu),
    ht: st.planets.length, ta: true
  });
  var cot = { tong: 'tong', ct: 'ct', nc: 'nc', ham: 'ham', thu: 'thu' }[loai || 'tong'] || 'tong';
  ds.sort(function (a, b) { return (b[cot] || 0) - (a[cot] || 0); });
  for (var j = 0; j < ds.length; j++) { ds[j].hang = j + 1; ds[j].diem = ds[j][cot] || 0; }
  return ds;
};

/* ===== js/combat.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — bộ mô phỏng chiến đấu
 * 6 vòng, bắn nhanh (rapidfire), khiên hồi đầu mỗi vòng, bãi phế liệu 30%.
 * Đặc trưng bản gốc: PHÒNG THỦ HAI LỚP — lớp quỹ đạo giao chiến ngay từ
 * vòng 1, hạm đội chỉ xuống tới tầng khí quyển (gặp phòng thủ mặt đất) từ
 * vòng 3. [SUY LUẬN về số vòng và hệ số]                                  */
'use strict';
var G = window.G = window.G || {};

G.VONG_XUONG_DAT = 3;

function nhom(id, n, tech, ben, thuDat) {
  var u = G.UNIT(id);
  var w = 1 + 0.1 * (tech.weapon || 0), s = 1 + 0.1 * (tech.shield || 0), a = 1 + 0.1 * (tech.armor || 0);
  /* Loại hành tinh làm phòng thủ MẶT ĐẤT dày thêm (Băng Hà, Nước – Đầm Lầy) */
  if (u.lop === 'dat' && thuDat) { s *= thuDat; a *= thuDat; }
  return {
    id: id, ten: u.ten, n: n, n0: n, ben: ben,
    atk: u.atk * w,
    shield: u.shield * s,
    hull: (u.hull) * a * 0.1 + u.hull * 0.9 * a,   // vỏ thép cơ bản × giáp
    hongDu: 0,
    lop: u.lop || 'ham',
    cost: u.cost
  };
}

function gomBen(ships, def, tech, ben, thuDat, bo) {
  var out = [];
  var id;
  if (ships) for (id in ships) if (ships[id] > 0 && G.S(id)) out.push(nhom(id, ships[id], tech, ben));
  if (def) for (id in def) if (def[id] > 0 && G.D(id)) out.push(nhom(id, def[id], tech, ben, thuDat));
  if (bo) for (id in bo) if (bo[id] > 0 && G.BB(id)) out.push(nhom(id, bo[id], tech, ben, thuDat));
  return out;
}

function conSong(g) { return g.n > 0; }

function heSoBanNhanh(g, dich) {
  var rf = G.RAPIDFIRE[g.id];
  if (!rf) return 1;
  var tong = 0, i;
  for (i = 0; i < dich.length; i++) tong += dich[i].n;
  if (!tong) return 1;
  var q = 0;
  for (i = 0; i < dich.length; i++) {
    var r = rf[dich[i].id];
    if (r && r > 1) q += (dich[i].n / tong) * (r - 1) / r;
  }
  if (q >= 0.999) q = 0.999;
  return 1 / (1 - q);
}

/* Một bên bắn vào bên kia (mô hình gộp nhóm) */
function banLoat(banh, dich, rnd) {
  var i, j;
  var tongDich = 0;
  for (j = 0; j < dich.length; j++) tongDich += dich[j].n;
  if (!tongDich) return;

  /* tổng số phát bắn phân về từng nhóm địch theo tỷ lệ số lượng */
  var vao = [];
  for (j = 0; j < dich.length; j++) vao.push({ phat: 0, dmg: 0 });

  for (i = 0; i < banh.length; i++) {
    var g = banh[i];
    if (g.n <= 0 || g.atk <= 0) continue;
    var phat = g.n * heSoBanNhanh(g, dich);
    for (j = 0; j < dich.length; j++) {
      var p = phat * (dich[j].n / tongDich);
      vao[j].phat += p;
      /* quy tắc dội: sát thương < 1% khiên thì không xuyên nổi */
      if (g.atk >= dich[j].shield * 0.01) vao[j].dmg += p * g.atk;
    }
  }

  for (j = 0; j < dich.length; j++) {
    var d = dich[j];
    if (d.n <= 0) continue;
    var hutKhien = Math.min(vao[j].dmg, d.n * d.shield * (0.9 + rnd() * 0.2));
    var vaoVo = Math.max(0, vao[j].dmg - hutKhien) + d.hongDu;
    var chet = Math.floor(vaoVo / d.hull);
    if (chet > d.n) chet = d.n;
    d.hongDu = vaoVo - chet * d.hull;
    /* tàu hư nặng có thể nổ dây */
    if (chet < d.n && d.hongDu > d.hull * 0.7 && rnd() < (d.hongDu / d.hull)) { chet++; d.hongDu = 0; }
    d.n -= chet;
    if (d.n < 0) d.n = 0;
  }
}

function tinhLuc(gs) {
  var t = 0;
  for (var i = 0; i < gs.length; i++) t += gs[i].n * (gs[i].atk + gs[i].hull * 0.02 + gs[i].shield);
  return t;
}

/* -----------------------------------------------------------------------
 * G.danhTran(A, D) — A/D: { ten, tech, ships, def }
 * --------------------------------------------------------------------- */
G.danhTran = function (A, D, seed) {
  var rnd = G.rng(seed || (Date.now() >>> 0));
  var doBo = !!A.doBo;                 /* trận đổ bộ: không chia lớp, đánh hết từ vòng 1 */
  var atk = gomBen(A.ships, null, A.tech || {}, 'A', 1, A.bo);
  var defAll = gomBen(D.ships, D.def, D.tech || {}, 'D', D.thuDat || 1, D.bo);

  var quyDao = [], mDat = [];
  for (var i = 0; i < defAll.length; i++) {
    if (!doBo && defAll[i].lop === 'dat') mDat.push(defAll[i]); else quyDao.push(defAll[i]);
  }

  var nhatKy = [];
  var vong;
  for (vong = 1; vong <= G.C.VONG_DANH; vong++) {
    var ta = atk.filter(conSong);
    if (!ta.length) break;
    var phe = quyDao.filter(conSong);
    var conDat = mDat.filter(conSong);
    if (vong >= G.VONG_XUONG_DAT) phe = phe.concat(conDat);
    if (!phe.length) {
      /* Đã dẹp xong lớp quỹ đạo nhưng chưa tới vòng hạ độ cao: vòng trống,
         hạm đội hạ dần xuống tầng khí quyển. */
      if (vong < G.VONG_XUONG_DAT && conDat.length) {
        nhatKy.push({ vong: vong, lucA: Math.round(tinhLuc(ta)), lucD: 0,
          conA: ta.reduce(function (s2, g2) { return s2 + g2.n; }, 0), conD: 0, matDat: false, haDoCao: true });
        continue;
      }
      break;
    }

    var lucA = tinhLuc(ta), lucD = tinhLuc(phe);
    /* hai bên bắn đồng thời: chụp lại số lượng trước khi trừ */
    var chupA = ta.map(function (g) { return { g: g, n: g.n }; });
    var chupD = phe.map(function (g) { return { g: g, n: g.n }; });
    banLoat(chupA.map(function (x) { return { id: x.g.id, n: x.n, atk: x.g.atk }; }), phe, rnd);
    banLoat(chupD.map(function (x) { return { id: x.g.id, n: x.n, atk: x.g.atk }; }), ta, rnd);

    nhatKy.push({
      vong: vong,
      lucA: Math.round(lucA), lucD: Math.round(lucD),
      conA: ta.reduce(function (s2, g2) { return s2 + g2.n; }, 0),
      conD: phe.reduce(function (s2, g2) { return s2 + g2.n; }, 0),
      matDat: vong >= G.VONG_XUONG_DAT
    });
  }

  var conA = 0, conD = 0;
  var i2;
  for (i2 = 0; i2 < atk.length; i2++) conA += atk[i2].n;
  for (i2 = 0; i2 < defAll.length; i2++) conD += defAll[i2].n;

  var coA = false, coD = false;
  for (i2 = 0; i2 < atk.length; i2++) if (atk[i2].n0 > 0) coA = true;
  for (i2 = 0; i2 < defAll.length; i2++) if (defAll[i2].n0 > 0) coD = true;
  var kq;
  if (!coA && !coD) kq = 'hoa';                                  /* hai bên đều trống */
  else if (conA > 0 && conD <= 0) kq = 'thang';
  else if (conA <= 0 && conD > 0) kq = 'thua';
  else if (conA <= 0 && conD <= 0) kq = 'huyDiet';
  else kq = 'hoa';

  /* --- thiệt hại, phế liệu, phòng thủ tự sửa --- */
  var matA = {}, matD = {}, matDPha = {}, pl = { metal: 0, crystal: 0 };   /* matDPha: công sự bị phá TRƯỚC khi sửa lại */
  var conShipsA = {}, conShipsD = {}, conDefD = {}, conBoA = {}, conBoD = {};

  for (i2 = 0; i2 < atk.length; i2++) {
    var g = atk[i2], mat = g.n0 - g.n;
    if (mat > 0) {
      matA[g.id] = mat;
      if (!G.BB(g.id)) {          /* bộ binh chết trên mặt đất, không thành phế liệu quỹ đạo */
        pl.metal += (g.cost.metal || 0) * mat * G.C.PHE_LIEU;
        pl.crystal += (g.cost.crystal || 0) * mat * G.C.PHE_LIEU;
      }
    }
    if (g.n > 0) { if (G.BB(g.id)) conBoA[g.id] = g.n; else conShipsA[g.id] = g.n; }
  }
  for (i2 = 0; i2 < defAll.length; i2++) {
    var d = defAll[i2], m = d.n0 - d.n, con = d.n;
    if (m > 0) {
      if (G.BB(d.id)) {  /* bộ binh chết không thành phế liệu bay */ }
      else if (G.S(d.id)) {   /* tàu bị bắn hạ -> phế liệu */
        pl.metal += (d.cost.metal || 0) * m * G.C.PHE_LIEU;
        pl.crystal += (d.cost.crystal || 0) * m * G.C.PHE_LIEU;
      } else {           /* công sự: 70% được sửa lại sau trận [SUY LUẬN kiểu OGame] */
        matDPha[d.id] = m;
        var sua = 0;
        for (var k = 0; k < m; k++) if (rnd() < G.C.SUA_CONG_SU) sua++;
        con += sua; m -= sua;
      }
      if (m > 0) matD[d.id] = m;
    }
    if (con > 0) {
      if (G.BB(d.id)) conBoD[d.id] = con;
      else if (G.S(d.id)) conShipsD[d.id] = con;
      else conDefD[d.id] = con;
    }
  }

  return {
    kq: kq, vongDanh: nhatKy, seed: seed,
    tenA: A.ten, tenD: D.ten, thuDat: D.thuDat || 1, loaiHT: D.loaiHT || null,
    conShipsA: conShipsA, conShipsD: conShipsD, conDefD: conDefD,
    conBoA: conBoA, conBoD: conBoD, doBo: doBo,
    matA: matA, matD: matD, matDPha: matDPha,
    pheLieu: { metal: Math.round(pl.metal), crystal: Math.round(pl.crystal) }
  };
};

/* Tổng khoang hàng của một hạm đội */
G.khoangHang = function (ships) {
  var t = 0;
  for (var id in ships) { var s = G.S(id); if (s) t += s.cargo * ships[id]; }
  return t;
};
G.thuyThu = function (ships) {
  var t = 0;
  for (var id in ships) { var s = G.S(id); if (s) t += (s.crew || 1) * ships[id]; }
  return t;
};

/* ===== js/engine.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — lõi mô phỏng
 * Toàn bộ game chạy theo mốc thời gian thực: state chỉ lưu các mốc, mỗi lần
 * tick (hoặc mở lại game sau nhiều giờ) engine tua lại từng sự kiện theo
 * đúng thứ tự thời gian — nên chơi offline vẫn ra kết quả đúng.            */
'use strict';
var G = window.G = window.G || {};

/* Lệch giờ giữa máy người chơi và server (bản nhiều người sẽ gán). */
G.LECH_GIO = 0;
G.giay = function () { return Math.floor(Date.now() / 1000) + G.LECH_GIO; };

/* =======================================================================
 * KHỞI TẠO
 * ===================================================================== */
G.moiGame = function (ten, seedStr, home) {
  var now = G.giay();
  var seed = seedStr || ('THDC-' + Math.floor(Math.random() * 1e9));
  var r = G.rng(G.hash(seed));
  /* home do server chỉ định ở chế độ nhiều người (mỗi người một ô riêng) */
  if (!home) home = G.toaDo(1 + Math.floor(r() * G.C.SO_THIEN_HA), 1 + Math.floor(r() * 60), 4 + Math.floor(r() * 9));

  var st = {
    v: 3, seed: seed, now: now, t0: now, lastTick: now,
    ten: ten || 'Chỉ Huy',
    home: home,
    planets: [],
    tech: {}, ncQueue: null,
    galana: 3000, techPts: 0,
    fleets: [], toi: [], tenLua: [],   // toi = hạm đội địch đang bay tới; tenLua = tên lửa đang bay
    npc: {}, debris: {},
    msgs: [], nk: [],
    nextMaint: now + G.C.CHU_KY_BAO_TRI,
    nextRaid: now + 3600 * 3,
    soChuKy: 0, noBaoTri: 0,
    lm: null,
    stats: { thang: 0, thua: 0, cuop: 0, tauMat: 0, tauDietDich: 0, chuyenBay: 0 },
    fleetIdSeq: 1
  };
  var htMe = G.htMoi(st, home, 'Hành Tinh Mẹ', true);
  /* Hành tinh mẹ luôn là Ôn Hoà — nơi loài người khởi đầu được */
  htMe.loai = 'onhoa';
  var Lme = G.LHT('onhoa');
  htMe.temp = Math.round((Lme.temp[0] + Lme.temp[1]) / 2);
  htMe.oDat = Math.max(150, htMe.oDat);
  st.planets.push(htMe);
  G.tin(st, 'he', 'Chào mừng tới năm ' + G.NAM_BOI_CANH,
    'Hạm đội thuộc địa đã hạ cánh tại ' + G.tdStr(home) + '. Bộ Chỉ Huy Liên Hành Tinh giao cho ' +
    st.ten + ' quyền toàn quyền phát triển hành tinh này.\n\n' +
    'Nhắc lại quy định: mỗi 6 giờ hành tinh phải qua một CHU KỲ BẢO TRÌ. ' +
    'Không đủ Galana để trả phí bảo trì thì sản lượng sụt và nghiên cứu đứng bánh.\n\n' +
    'Chưa biết bắt đầu từ đâu thì mở màn HƯỚNG DẪN ở cuối menu bên trái.');
  return st;
};

G.htMoi = function (st, c, ten, thuDo) {
  var d = G.dacTinh(st, c);
  return {
    c: { g: c.g, h: c.h, p: c.p }, ten: ten || 'Thuộc Địa', thuDo: !!thuDo,
    loai: d.loai, temp: d.temp, oDat: d.oDat,
    b: {}, res: { metal: thuDo ? 1500 : 500, crystal: thuDo ? 800 : 300, deut: thuDo ? 200 : 100, food: thuDo ? 1200 : 400 },
    ships: {}, def: {}, mis: {}, linh: {},
    qB: [], qS: [],
    doi: 0                     // số giờ bị bỏ đói cộng dồn
  };
};

/* =======================================================================
 * CHI PHÍ & ĐIỀU KIỆN
 * ===================================================================== */
G.giaXay = function (def, lv) {
  var out = {}, f = Math.pow(def.factor || 2, Math.max(0, lv - 1));
  for (var k in def.cost) out[k] = Math.floor(def.cost[k] * f);
  return out;
};
G.giaDonVi = function (def, n) {
  var out = {};
  for (var k in def.cost) out[k] = def.cost[k] * (n || 1);
  return out;
};
G.duTien = function (st, p, cost) {
  for (var k in cost) {
    if (k === 'galana') { if (st.galana < cost[k]) return false; }
    else if (k === 'tech') { if (st.techPts < cost[k]) return false; }
    else if ((p.res[k] || 0) < cost[k]) return false;
  }
  return true;
};
G.truTien = function (st, p, cost) {
  for (var k in cost) {
    if (k === 'galana') st.galana -= cost[k];
    else if (k === 'tech') st.techPts -= cost[k];
    else p.res[k] = (p.res[k] || 0) - cost[k];
  }
};
G.hoanTien = function (st, p, cost, tyLe) {
  tyLe = (tyLe === undefined) ? 1 : tyLe;
  for (var k in cost) {
    if (k === 'galana') st.galana += cost[k] * tyLe;
    else if (k === 'tech') st.techPts += cost[k] * tyLe;
    else p.res[k] = (p.res[k] || 0) + cost[k] * tyLe;
  }
};
G.thoaDK = function (st, p, def) {
  if (!def.req) return true;
  var k;
  if (def.req.b) for (k in def.req.b) if ((p.b[k] || 0) < def.req.b[k]) return false;
  if (def.req.r) for (k in def.req.r) if ((st.tech[k] || 0) < def.req.r[k]) return false;
  return true;
};
G.thieuDK = function (st, p, def) {
  var out = [], k;
  if (!def.req) return out;
  if (def.req.b) for (k in def.req.b) if ((p.b[k] || 0) < def.req.b[k]) out.push(G.B(k).ten + ' cấp ' + def.req.b[k]);
  if (def.req.r) for (k in def.req.r) if ((st.tech[k] || 0) < def.req.r[k]) out.push(G.R(k).ten + ' cấp ' + def.req.r[k]);
  return out;
};

/* =======================================================================
 * SẢN LƯỢNG
 * ===================================================================== */
G.tongCapCT = function (p) { var t = 0; for (var k in p.b) t += p.b[k]; return t; };

G.dungTich = function (p) {
  return {
    metal: G.B('metalStore').cap(p.b.metalStore || 0),
    crystal: G.B('crystalStore').cap(p.b.crystalStore || 0),
    deut: G.B('deutStore').cap(p.b.deutStore || 0),
    food: G.B('silo').cap(p.b.silo || 0)
  };
};

/* Trả về sản lượng/giờ đã tính hiệu suất điện, đói ăn, thuế... */
G.loaiHT = function (st, p) {
  if (!p.loai) p.loai = G.loaiTheoViTri(st.seed, p.c);   /* bàn chơi cũ chưa có loại */
  return G.LHT(p.loai);
};

G.sanLuong = function (st, p) {
  var sp = G.C.TOC_DO_SERVER;
  var L = G.loaiHT(st, p);
  var ctx = { temp: p.temp, tech: st.tech };
  var dienCo = 0, dienDung = 0, i, b, lv;

  for (i = 0; i < G.BUILDINGS.length; i++) {
    b = G.BUILDINGS[i]; lv = p.b[b.id] || 0;
    if (!lv) continue;
    if (b.prod) { var pr = b.prod(lv, ctx); if (pr.energy) dienCo += pr.energy * (b.id === 'solar' ? L.dien : 1); }
    if (b.use) dienDung += b.use(lv);
  }
  /* vệ tinh phòng thủ vừa bắn vừa phát điện [SUY LUẬN] */
  var vt = p.def.satellite || 0;
  if (vt) dienCo += vt * Math.max(6, Math.floor((p.temp + 160) / 5));

  var hs = dienDung > 0 ? Math.min(1, dienCo / dienDung) : 1;
  /* Hệ số ảnh hưởng: nợ bảo trì -30%, liên minh +5%. Riêng cái đói phạt -50%
     nhưng KHÔNG phạt lên chính lương thực, nếu không hành tinh sẽ không bao giờ
     tự thoát ra được khỏi cảnh đói. */
  var chung = (st.noBaoTri > 0 ? 0.7 : 1) * (st.lm ? 1.05 : 1);
  var doi = chung * (p.doi > 0 ? 0.5 : 1);

  var r = { metal: 30 * sp, crystal: 15 * sp, deut: 0, food: 10 * sp, tech: 0, galana: 0 };
  for (i = 0; i < G.BUILDINGS.length; i++) {
    b = G.BUILDINGS[i]; lv = p.b[b.id] || 0;
    if (!lv || !b.prod) continue;
    var o = b.prod(lv, ctx);
    if (o.metal) r.metal += o.metal * hs * sp * doi * L.kl;
    if (o.crystal) r.crystal += o.crystal * hs * sp * doi * L.tt;
    if (o.deut) r.deut += o.deut * hs * sp * doi * L.dt;
    if (o.food) r.food += o.food * hs * sp * chung * L.lt;
    if (o.tech) r.tech += o.tech * hs * sp * doi;
  }
  /* lò nhiệt hạch đốt deuterium */
  var fu = p.b.fusion || 0;
  var dotDT = fu ? G.B('fusion').deutUse(fu) * sp : 0;
  r.deut -= dotDT;

  /* Lương thực bị tiêu thụ: thủy thủ đoàn + dân cư + công sự */
  var soThu = 0; for (var k in p.def) soThu += p.def[k];
  var anUong = (0.05 * G.thuyThu(p.ships) + 0.5 * G.tongCapCT(p) + 0.01 * soThu) * sp;
  r.food -= anUong;

  /* Thuế: Galana chảy về từ dân cư trên hành tinh */
  r.galana = G.C.THUE_CO_BAN * G.tongCapCT(p) * sp * (p.doi > 0 ? 0.5 : 1);

  return { r: r, dienCo: dienCo, dienDung: dienDung, hs: hs, dotDT: dotDT, anUong: anUong, doi: p.doi > 0, loai: L };
};

/* Cộng tài nguyên trong dt giây */
G.sanXuat = function (st, p, dt) {
  var s = G.sanLuong(st, p), cap = G.dungTich(p), h = dt / 3600, k;
  for (k = 0; k < G.RES_HANH_TINH.length; k++) {
    var id = G.RES_HANH_TINH[k];
    var v = (p.res[id] || 0) + s.r[id] * h;
    if (v < 0) v = 0;
    /* vượt kho thì tràn ra ngoài, chỉ chặn phần sản xuất chứ không xoá hàng có sẵn */
    if (v > cap[id] && v > (p.res[id] || 0)) v = Math.max(p.res[id] || 0, cap[id]);
    p.res[id] = v;
  }
  st.galana += s.r.galana * h;
  st.techPts += s.r.tech * h;

  /* Đói: khi hết lương thực mà nhu cầu vẫn âm */
  if (p.res.food <= 0 && s.r.food < 0) p.doi = Math.min(48, (p.doi || 0) + h);
  else if (p.doi > 0) p.doi = Math.max(0, p.doi - h * 2);
};

/* =======================================================================
 * THỜI GIAN SẢN XUẤT
 * ===================================================================== */
G.tgXay = function (st, p, cost) {
  var mc = (cost.metal || 0) + (cost.crystal || 0);
  var h = mc / 2500 / (1 + (p.b.robot || 0)) * Math.pow(0.5, p.b.nanite || 0) / G.C.TOC_DO_SERVER;
  return Math.max(1, Math.round(h * 3600));
};
G.tgTau = function (st, p, cost) {
  var mc = (cost.metal || 0) + (cost.crystal || 0);
  var h = mc / 2500 / (1 + (p.b.shipyard || 0)) * Math.pow(0.5, p.b.nanite || 0) / G.C.TOC_DO_SERVER;
  return Math.max(1, Math.round(h * 3600));
};
G.tgNC = function (st, p, cost) {
  var mc = (cost.metal || 0) + (cost.crystal || 0) + (cost.tech || 0) * 0.5;
  var h = mc / 1000 / (1 + (p.b.lab || 0)) / G.C.TOC_DO_SERVER;
  return Math.max(1, Math.round(h * 3600));
};

/* =======================================================================
 * HÀNG ĐỢI
 * ===================================================================== */
G.capDangXay = function (p, id) {
  var n = 0;
  for (var i = 0; i < p.qB.length; i++) if (p.qB[i].id === id) n++;
  return n;
};
G.xepXay = function (st, p, id) {
  var d = G.B(id);
  if (!d) return 'Không có công trình này.';
  if (p.qB.length >= 5) return 'Hàng đợi xây dựng đã đầy (5 mục).';
  if (!G.thoaDK(st, p, d)) return 'Chưa đủ điều kiện: ' + G.thieuDK(st, p, d).join(', ') + '.';
  var lv = (p.b[id] || 0) + G.capDangXay(p, id) + 1;
  var oDung = G.oDaDung(p);
  if (d.nhom !== undefined || true) {
    if (!p.b[id] && oDung >= G.oToiDa(p)) return 'Hành tinh đã hết ô đất. Xây Cải Tạo Hành Tinh để mở thêm.';
  }
  var cost = G.giaXay(d, lv);
  if (!G.duTien(st, p, cost)) return 'Không đủ tài nguyên.';
  G.truTien(st, p, cost);
  var tg = G.tgXay(st, p, cost);
  var m = { id: id, lv: lv, cost: cost, tg: tg, xong: null };
  p.qB.push(m);
  if (p.qB.length === 1) m.xong = st.now + tg;
  return null;
};
G.huyXay = function (st, p, i) {
  if (i < 0 || i >= p.qB.length) return;
  var m = p.qB.splice(i, 1)[0];
  G.hoanTien(st, p, m.cost, 1);
  if (i === 0 && p.qB.length) p.qB[0].xong = st.now + p.qB[0].tg;
};

G.oToiDa = function (p) { return p.oDat + 6 * (p.b.terraform || 0); };
G.oDaDung = function (p) { var n = 0; for (var k in p.b) if (p.b[k] > 0) n++; return n; };

G.xepTau = function (st, p, id, n) {
  n = Math.max(1, Math.floor(n));
  var d = G.S(id) || G.D(id) || G.M(id) || G.BB(id);
  if (!d) return 'Không có đơn vị này.';
  if (!p.b.shipyard && !G.M(id)) return 'Cần Xưởng Đóng Tàu.';
  if (!G.thoaDK(st, p, d)) return 'Chưa đủ điều kiện: ' + G.thieuDK(st, p, d).join(', ') + '.';
  if (d.max) {
    var dang = (p.def[id] || 0) + G.dangDong(p, id);
    if (dang + n > d.max) return 'Chỉ được có tối đa ' + d.max + ' công trình loại này.';
  }
  if (G.M(id)) {
    var chua = (p.b.missileSilo || 0) * 10;
    var dungRoi = (p.mis.interceptor || 0) + (p.mis.icbm || 0) * 2 + G.dangDong(p, id) * G.M(id).o;
    if (dungRoi + n * G.M(id).o > chua) return 'Hầm tên lửa không đủ chỗ.';
  }
  var cost = G.giaDonVi(d, n);
  if (!G.duTien(st, p, cost)) return 'Không đủ tài nguyên.';
  G.truTien(st, p, cost);
  var tEach = G.tgTau(st, p, G.giaDonVi(d, 1));
  p.qS.push({ id: id, n: n, tEach: tEach, tLeft: p.qS.length === 0 ? tEach : tEach, cost1: G.giaDonVi(d, 1) });
  return null;
};
G.dangDong = function (p, id) {
  var n = 0;
  for (var i = 0; i < p.qS.length; i++) if (p.qS[i].id === id) n += p.qS[i].n;
  return n;
};
G.huyDong = function (st, p, i) {
  if (i < 0 || i >= p.qS.length) return;
  var m = p.qS.splice(i, 1)[0];
  G.hoanTien(st, p, G.giaDonVi(G.UNIT(m.id) || G.M(m.id), m.n), 1);
};

/* --- Nghiên cứu: chi phí trả ngay + VỐN ĐẦU TƯ trừ dần mỗi chu kỳ ----- */
G.xepNC = function (st, p, id) {
  if (st.ncQueue) return 'Phòng nghiên cứu đang làm việc khác.';
  var d = G.R(id);
  if (!d) return 'Không có đề tài này.';
  if (!p.b.lab) return 'Cần Phòng Nghiên Cứu.';
  if (!G.thoaDK(st, p, d)) return 'Chưa đủ điều kiện: ' + G.thieuDK(st, p, d).join(', ') + '.';
  var lv = (st.tech[id] || 0) + 1;
  var cost = G.giaXay(d, lv);
  if (!G.duTien(st, p, cost)) return 'Không đủ tài nguyên.';
  G.truTien(st, p, cost);
  var tg = G.tgNC(st, p, cost);
  var von = Math.round(((cost.metal || 0) + (cost.crystal || 0) + (cost.deut || 0)) * 0.15 + (cost.tech || 0) * 0.05);
  var soKy = Math.max(1, Math.ceil(tg / G.C.CHU_KY_BAO_TRI));
  st.ncQueue = {
    id: id, lv: lv, cost: cost, tong: tg, conLai: tg,
    von: von, vonConLai: von, vonMoiKy: Math.ceil(von / soKy),
    treo: false, pi: st.planets.indexOf(p)
  };
  return null;
};
G.huyNC = function (st) {
  if (!st.ncQueue) return;
  var q = st.ncQueue, p = st.planets[q.pi] || st.planets[0];
  G.hoanTien(st, p, q.cost, 1);
  st.galana += (q.von - q.vonConLai);
  st.ncQueue = null;
};

/* Bỏ hoang một thuộc địa. Xoá hành tinh khỏi danh sách thì mọi chỉ số hành
 * tinh (hạm đội, nghiên cứu, đợt tấn công đang tới) phải được dời theo. */
G.boHoang = function (st, pi) {
  pi = Math.floor(pi);
  var p = st.planets[pi];
  if (!p) return 'Hành tinh không tồn tại.';
  if (p.thuDo || pi === 0) return 'Không bỏ được hành tinh mẹ.';
  if (st.planets.length <= 1) return 'Đây là hành tinh cuối cùng.';
  var i;
  for (i = 0; i < st.fleets.length; i++)
    if (st.fleets[i].pi === pi) return 'Còn hạm đội xuất phát từ hành tinh này đang bay — gọi về đã.';
  for (i = 0; i < (st.tenLua || []).length; i++)
    if (st.tenLua[i].pi === pi) return 'Còn tên lửa phóng từ hành tinh này đang bay.';
  for (i = 0; i < st.toi.length; i++)
    if (st.toi[i].pi === pi) return 'Đang có hạm đội địch bay tới hành tinh này — không bỏ chạy giữa chừng được.';

  var ten = p.ten;
  st.planets.splice(pi, 1);
  var doi = function (o) { if (o && o.pi > pi) o.pi--; };
  for (i = 0; i < st.fleets.length; i++) doi(st.fleets[i]);
  for (i = 0; i < (st.tenLua || []).length; i++) doi(st.tenLua[i]);
  for (i = 0; i < st.toi.length; i++) doi(st.toi[i]);
  if (st.ncQueue) { if (st.ncQueue.pi > pi) st.ncQueue.pi--; else if (st.ncQueue.pi === pi) st.ncQueue.pi = 0; }
  G.tin(st, 'he', 'Đã bỏ hoang ' + ten,
    'Toàn bộ công trình, tàu và tài nguyên trên ' + ten + ' ' + G.tdStr(p.c) + ' bị bỏ lại. ' +
    'Ô toạ độ này giờ trống, ai cũng có thể tới chiếm.');
  return null;
};

/* =======================================================================
 * ĐIỂM & XẾP HẠNG
 * ===================================================================== */
G.diem = function (st) {
  var d = { ct: 0, nc: 0, ham: 0, thu: 0 }, i, j, k;
  for (i = 0; i < st.planets.length; i++) {
    var p = st.planets[i];
    for (k in p.b) for (j = 1; j <= p.b[k]; j++) d.ct += G.giaTriDiem(G.giaXay(G.B(k), j));
    for (k in p.ships) d.ham += G.giaTriDiem(G.S(k).cost, p.ships[k]);
    for (k in p.def) d.thu += G.giaTriDiem(G.D(k).cost, p.def[k]);
  }
  for (i = 0; i < st.fleets.length; i++) for (k in st.fleets[i].ships) d.ham += G.giaTriDiem(G.S(k).cost, st.fleets[i].ships[k]);
  for (k in st.tech) for (j = 1; j <= st.tech[k]; j++) d.nc += G.giaTriDiem(G.giaXay(G.R(k), j));
  d.tong = d.ct + d.nc + d.ham + d.thu;
  return d;
};

G.khe = function (st) { return 1 + (st.tech.computer || 0) + G.tongB(st, 'fleetHQ'); };
G.tongB = function (st, id) { var n = 0; for (var i = 0; i < st.planets.length; i++) n += (st.planets[i].b[id] || 0); return n; };
G.maxThuocDia = function (st) { return 1 + Math.floor((st.tech.astro || 0) / 2) + 1; };

/* =======================================================================
 * TIN NHẮN & NHẬT KÝ
 * ===================================================================== */
G.tin = function (st, loai, tieuDe, noiDung, data) {
  st.msgs.unshift({ t: st.now, loai: loai, td: tieuDe, nd: noiDung, data: data || null, doc: false });
  if (st.msgs.length > 150) st.msgs.length = 150;
};
G.ghi = function (st, s) {
  st.nk.unshift({ t: st.now, s: s });
  if (st.nk.length > 120) st.nk.length = 120;
};

/* ===== js/fleet.js ===== */
/* THIÊN HÀ ĐẠI CHIẾN — hạm đội, nhiệm vụ, bảo trì, dòng thời gian
 * Hai cơ chế lấy nguyên từ bản gốc:
 *   1) Hạm đội được ĐỔI MỤC TIÊU NGAY KHI ĐANG BAY (trả phí Galana).
 *   2) Mỗi 6 giờ có một CHU KỲ BẢO TRÌ: trừ phí Galana + trả góp vốn
 *      nghiên cứu. Không trả nổi thì nợ, sản lượng sụt, nghiên cứu treo. */
'use strict';
var G = window.G = window.G || {};

/* --- Tốc độ & nhiên liệu ---------------------------------------------- */
G.bonusDC = function (st, dc) {
  if (dc === 'combustion') return 1 + 0.1 * (st.tech.combustion || 0);
  if (dc === 'impulse') return 1 + 0.2 * (st.tech.impulse || 0);
  return 1 + 0.3 * (st.tech.hyperdrive || 0);
};
G.tocDoHam = function (st, ships) {
  var min = Infinity;
  for (var id in ships) {
    if (!ships[id]) continue;
    var s = G.S(id); if (!s) continue;
    var v = s.speed * G.bonusDC(st, s.dc);
    if (v < min) min = v;
  }
  return min === Infinity ? 0 : min;
};
G.tgBay = function (st, ships, kc, pct) {
  pct = pct || 100;
  var v = G.tocDoHam(st, ships);
  if (!v) return 0;
  var t = (35000 / pct * Math.sqrt(kc * 10 / v) + 10) / G.C.TOC_DO_BAY;
  return Math.max(2, Math.round(t));
};
/* [SUY LUẬN] nhiên liệu: tỷ lệ khoảng cách, bay càng nhanh càng tốn */
G.nhienLieu = function (st, ships, kc, pct) {
  pct = pct || 100;
  var base = 0;
  for (var id in ships) { var s = G.S(id); if (s) base += s.fuel * ships[id]; }
  var m = 1 + Math.pow(pct / 100, 2);
  var can = Math.ceil(base * kc / 35000 * m) + 1;
  /* Tàu Dầu tiếp nhiên liệu giữa đường — giảm tối đa 60% tiêu hao */
  var bu = (ships.tauDau || 0) * G.C.TAU_DAU_BU;
  return Math.max(Math.ceil(can * 0.4), can - bu);
};

/* --- Gửi hạm đội ------------------------------------------------------- */
G.guiHam = function (st, pi, ships, den, mission, cargo, pct, giuGio, linh) {
  var p = st.planets[pi];
  if (!p) return 'Hành tinh không tồn tại.';
  if (G.trong(ships)) return 'Chưa chọn tàu nào.';
  if (st.fleets.length >= G.khe(st)) return 'Hết khe hạm đội (' + G.khe(st) + '). Nâng Công Nghệ Máy Tính hoặc Đài Chỉ Huy.';
  if (p.doi > 0) return 'Hành tinh đang bị bỏ đói — không đủ lương thực cho thủy thủ đoàn xuất phát.';
  if (st.noBaoTri > 0 && mission === 'attack') return 'Đang nợ phí bảo trì: hạm đội bị niêm phong, không được xuất kích tấn công.';
  if (G.bang(den, p.c) ) return 'Mục tiêu trùng với hành tinh xuất phát.';
  var id, sach = {};
  for (id in ships) {
    var n = Math.floor(ships[id] || 0);
    if (n <= 0 || !G.S(id)) continue;
    if ((p.ships[id] || 0) < n) return 'Không đủ ' + G.S(id).ten + '.';
    sach[id] = n;
  }
  ships = sach;
  if (G.trong(ships)) return 'Chưa chọn tàu nào.';
  if (mission === 'spy' && !ships.probe) return 'Nhiệm vụ do thám cần Tàu Do Thám.';
  if (mission === 'thamhiem') {
    if (den.p !== G.C.O_THAM_HIEM) return 'Thám hiểm chỉ bay tới ô ' + G.C.O_THAM_HIEM + ' — vùng không gian sâu ở rìa hệ.';
    if (G.dangThamHiem(st) >= G.kheThamHiem(st))
      return 'Chỉ điều được ' + G.kheThamHiem(st) + ' đoàn thám hiểm cùng lúc (nâng Công Nghệ Liên Hành Tinh để thêm).';
  } else if (den.p === G.C.O_THAM_HIEM) {
    return 'Ô ' + G.C.O_THAM_HIEM + ' là vùng không gian sâu, chỉ nhận nhiệm vụ Thám Hiểm.';
  }
  if (mission === 'colonize' && !ships.colony) return 'Nhiệm vụ thực dân cần Tàu Thực Dân.';
  if (mission === 'recycle' && !ships.recycler) return 'Nhiệm vụ thu hồi cần Tàu Thu Hồi.';

  var kc = G.khoangCach(p.c, den);
  var tg = G.tgBay(st, ships, kc, pct);
  var nl = G.nhienLieu(st, ships, kc, pct);
  if ((p.res.deut || 0) < nl) return 'Không đủ deuterium (cần ' + G.so(nl) + ').';

  /* quân đổ bộ: chỉ theo nhiệm vụ Tấn Công / Triển Khai / Vận Chuyển, cần chỗ chở */
  linh = linh || {};
  var sachLinh = {}, idL;
  for (idL in linh) {
    var nL = Math.max(0, Math.floor(linh[idL] || 0));
    if (!nL || !G.BB(idL)) continue;
    if ((p.linh && p.linh[idL] ? p.linh[idL] : 0) < nL) return 'Không đủ ' + G.BB(idL).ten + '.';
    sachLinh[idL] = nL;
  }
  linh = sachLinh;
  if (!G.trong(linh)) {
    if (['attack', 'deploy', 'transport'].indexOf(mission) < 0)
      return 'Chỉ nhiệm vụ Tấn Công, Triển Khai hoặc Vận Chuyển mới chở được quân đổ bộ.';
    var canCho = G.choLinhCan(linh), coCho = G.sucChoLinh(ships);
    if (canCho > coCho)
      return 'Không đủ chỗ chở quân: cần ' + G.so(canCho) + ', hạm đội chở được ' + G.so(coCho) +
        ' (Đại Chiến Hạm chở được nhiều nhất).';
  }

  cargo = cargo || {};
  var suc = G.khoangHang(ships);
  var tongHang = 0;
  for (id in cargo) { cargo[id] = Math.max(0, Math.floor(cargo[id] || 0)); tongHang += cargo[id]; }
  if (tongHang > suc - (mission === 'attack' ? 0 : 0)) return 'Khoang hàng chỉ chứa được ' + G.so(suc) + '.';
  for (id in cargo) if ((p.res[id] || 0) < cargo[id] + (id === 'deut' ? nl : 0)) return 'Không đủ ' + G.byId(G.RES, id).ten + ' để xếp hàng.';

  /* trừ tàu, quân, hàng, nhiên liệu */
  for (id in ships) p.ships[id] -= ships[id];
  if (!p.linh) p.linh = {};
  for (idL in linh) { p.linh[idL] -= linh[idL]; if (!p.linh[idL]) delete p.linh[idL]; }
  p.res.deut -= nl;
  for (id in cargo) if (cargo[id] > 0) p.res[id] -= cargo[id];

  var f = {
    id: st.fleetIdSeq++, pi: pi, tu: { g: p.c.g, h: p.c.h, p: p.c.p }, den: { g: den.g, h: den.h, p: den.p },
    mission: mission, ships: ships, linh: linh, cargo: cargo, pct: pct || 100,
    diLuc: st.now, den_t: st.now + tg, ve_t: null, pha: 'di',
    giu: (mission === 'hold') ? (giuGio || 1) * 3600 : 0,
    nl: nl, kc: kc, doiHuong: 0
  };
  st.fleets.push(f);
  st.stats.chuyenBay++;
  G.ghi(st, 'Hạm đội #' + f.id + ' rời ' + G.tdStr(p.c) + ' → ' + G.tdStr(den) + ' (' + G.byId(G.MISSIONS, mission).ten + '), tới sau ' + G.tg(tg) + '.');
  return null;
};

/* --- ĐỔI MỤC TIÊU GIỮA ĐƯỜNG (đặc trưng của bản gốc) ------------------ */
G.doiMucTieu = function (st, fid, den) {
  var f = null, i;
  for (i = 0; i < st.fleets.length; i++) if (st.fleets[i].id === fid) f = st.fleets[i];
  if (!f) return 'Không tìm thấy hạm đội.';
  if (f.pha !== 'di') return 'Hạm đội đang trên đường về, không đổi được mục tiêu.';
  if (st.galana < G.C.DOI_MUC_TIEU_GALANA) return 'Cần ' + G.C.DOI_MUC_TIEU_GALANA + ' Galana để phát lệnh đổi hướng.';
  if (G.bang(den, f.den)) return 'Đã đang bay tới đó rồi.';

  var tong = f.den_t - f.diLuc;
  var fr = tong > 0 ? Math.min(1, Math.max(0, (st.now - f.diLuc) / tong)) : 1;
  /* vị trí hiện tại nội suy trên đường bay -> khoảng cách tới mục tiêu mới */
  var kcMoi = (1 - fr) * G.khoangCach(f.tu, den) + fr * G.khoangCach(f.den, den);
  kcMoi = Math.max(5, Math.round(kcMoi));
  var tg = G.tgBay(st, f.ships, kcMoi, f.pct);
  var nlThem = G.nhienLieu(st, f.ships, kcMoi, f.pct);
  var dt = f.cargo.deut || 0;
  /* nhiên liệu phụ trội lấy từ khoang hàng nếu có, thiếu thì trả bằng Galana */
  var traGalana = G.C.DOI_MUC_TIEU_GALANA;
  if (dt >= nlThem) f.cargo.deut = dt - nlThem;
  else { traGalana += Math.ceil((nlThem - dt) * 3); f.cargo.deut = 0; }
  if (st.galana < traGalana) return 'Cần ' + G.so(traGalana) + ' Galana (gồm phí nhiên liệu phụ trội).';
  st.galana -= traGalana;

  f.den = { g: den.g, h: den.h, p: den.p };
  f.diLuc = st.now; f.den_t = st.now + tg; f.kc = kcMoi; f.doiHuong++;
  G.ghi(st, 'Hạm đội #' + f.id + ' đổi hướng giữa đường → ' + G.tdStr(den) + ' (phí ' + G.so(traGalana) + ' Galana).');
  return null;
};

G.goiVe = function (st, fid) {
  for (var i = 0; i < st.fleets.length; i++) {
    var f = st.fleets[i];
    if (f.id !== fid) continue;
    if (f.pha === 've') return 'Hạm đội đã đang về.';
    var daBay = st.now - f.diLuc;
    f.pha = 've'; f.ve_t = st.now + Math.max(2, daBay);
    G.ghi(st, 'Hạm đội #' + f.id + ' được gọi về, tới sau ' + G.tg(f.ve_t - st.now) + '.');
    return null;
  }
  return 'Không tìm thấy hạm đội.';
};

/* --- Xử lý hạm đội tới đích ------------------------------------------- */
G.hamToiDich = function (st, f) {
  var o = G.oHanhTinh(st, f.den);
  var veNha = function (ghi) {
    f.pha = 've';
    f.ve_t = st.now + G.tgBay(st, f.ships, G.khoangCach(f.den, f.tu), f.pct);
    if (ghi) G.ghi(st, ghi);
  };

  if (f.mission === 'thamhiem') {
    if (!f.dangGiu) {                     /* dừng lại lùng sục một lúc rồi mới có kết quả */
      f.dangGiu = true;
      f.den_t = st.now + Math.max(60, Math.round(1800 / G.C.TOC_DO_BAY));
      return;
    }
    f.dangGiu = false;
    G.thamHiem(st, f);
    return;
  }

  if (f.mission === 'hold') {
    if (!f.dangGiu) { f.dangGiu = true; f.den_t = st.now + f.giu; return; }
    f.dangGiu = false; veNha('Hạm đội #' + f.id + ' hết giờ giữ chỗ, quay về.'); return;
  }

  if (f.mission === 'deploy' || f.mission === 'transport') {
    /* Tiếp tế cho người chơi khác: chỉ nhiệm vụ Vận Chuyển, và chỉ ở bản nhiều người */
    if (f.mission === 'transport' && o.loai === 'nguoi' && G.HOOK && G.HOOK.tangNguoi) {
      G.HOOK.tangNguoi(st, f, o, veNha); return;
    }
    if (o.loai !== 'toi') { veNha('Hạm đội #' + f.id + ': ' + G.tdStr(f.den) + ' không phải hành tinh của ta, hàng được mang về.'); return; }
    var pt = o.p, k;
    for (k in f.cargo) if (f.cargo[k] > 0) pt.res[k] = (pt.res[k] || 0) + f.cargo[k];
    if (f.linh && !G.trong(f.linh)) {
      if (!pt.linh) pt.linh = {};
      for (k in f.linh) pt.linh[k] = (pt.linh[k] || 0) + f.linh[k];
      f.linh = {};
    }
    if (f.mission === 'deploy') {
      for (k in f.ships) pt.ships[k] = (pt.ships[k] || 0) + f.ships[k];
      G.tin(st, 'ham', 'Triển khai xong', 'Hạm đội #' + f.id + ' đã nhập biên chế tại ' + pt.ten + ' ' + G.tdStr(pt.c) + '.');
      G.xoaHam(st, f); return;
    }
    G.tin(st, 'ham', 'Giao hàng xong', 'Hạm đội #' + f.id + ' đã giao hàng tại ' + pt.ten + ' ' + G.tdStr(pt.c) + '.');
    f.cargo = {}; veNha(null); return;
  }

  if (f.mission === 'spy') {
    if (o.loai === 'nguoi' && G.HOOK && G.HOOK.doThamNguoi) { G.HOOK.doThamNguoi(st, f, o); veNha(null); return; }
    if (o.loai === 'npc') G.doThamNPC(st, f, o.npc);
    else if (o.loai === 'trong') G.tin(st, 'tt', 'Báo cáo do thám ' + G.tdStr(f.den), 'Ô toạ độ trống, không có hành tinh nào ở đây.');
    else G.tin(st, 'tt', 'Báo cáo do thám', 'Đây là hành tinh của chính ta.');
    veNha(null); return;
  }

  if (f.mission === 'recycle') {
    var pl = G.pheLieu(st, o.key);
    var suc = G.khoangHang(f.ships), lay = { metal: 0, crystal: 0 };
    var conCho = suc;
    lay.metal = Math.min(pl.metal, conCho); conCho -= lay.metal;
    lay.crystal = Math.min(pl.crystal, conCho);
    pl.metal -= lay.metal; pl.crystal -= lay.crystal;
    f.cargo.metal = (f.cargo.metal || 0) + Math.floor(lay.metal);
    f.cargo.crystal = (f.cargo.crystal || 0) + Math.floor(lay.crystal);
    G.tin(st, 'ham', 'Thu hồi phế liệu ' + G.tdStr(f.den),
      'Đã vét được ' + G.so(lay.metal) + ' Kim Loại và ' + G.so(lay.crystal) + ' Tinh Thể từ bãi phế liệu.');
    veNha(null); return;
  }

  if (f.mission === 'colonize') {
    if (o.loai !== 'trong') { veNha('Hạm đội #' + f.id + ': ' + G.tdStr(f.den) + ' đã có chủ, tàu thực dân quay về.'); return; }
    if (st.planets.length >= G.maxThuocDia(st)) {
      veNha(null);
      G.tin(st, 'he', 'Không thể thực dân hoá', 'Đã đạt giới hạn ' + G.maxThuocDia(st) + ' hành tinh. Nâng Công Nghệ Liên Hành Tinh để mở thêm.');
      return;
    }
    var np = G.htMoi(st, f.den, 'Thuộc Địa ' + st.planets.length, false);
    for (var kk in f.cargo) if (f.cargo[kk] > 0) np.res[kk] = (np.res[kk] || 0) + f.cargo[kk];
    f.ships.colony--; if (!f.ships.colony) delete f.ships.colony;
    st.planets.push(np);
    G.tin(st, 'he', 'Thuộc địa mới!', 'Đã dựng thuộc địa tại ' + G.tdStr(f.den) + ' — nhiệt độ ' + np.temp + '°C, ' + np.oDat + ' ô đất.');
    if (G.trong(f.ships)) { G.xoaHam(st, f); return; }
    veNha(null); return;
  }

  /* --- TẤN CÔNG --- */
  if (f.mission === 'attack') {
    if (o.loai === 'trong') { veNha(null); G.tin(st, 'tt', 'Không tìm thấy mục tiêu', G.tdStr(f.den) + ' là ô trống — hạm đội quay về.'); return; }
    if (o.loai === 'toi') { veNha(null); return; }
    if (o.loai === 'nguoi') {
      /* Đánh người chơi khác: server xử lý (cần state của đối phương) */
      if (G.HOOK && G.HOOK.danhNguoi) { G.HOOK.danhNguoi(st, f, o, veNha); return; }
      veNha(null); return;
    }
    var n = o.npc;
    var diemTa = G.diem(st).tong;
    if (diemTa < G.C.BAO_VE_MOI_DIEM && n.diem > diemTa * G.C.BAO_VE_MOI_TY_LE) {
      veNha(null);
      G.tin(st, 'he', 'Bảo vệ người chơi mới', 'Mục tiêu mạnh hơn ta quá ' + G.C.BAO_VE_MOI_TY_LE + ' lần, hệ thống chặn cuộc tấn công. Hạm đội quay về.');
      return;
    }
    var Lmuc = G.LHT(G.loaiTheoViTri(st.seed, f.den));
    var kq = G.danhTran(
      { ten: st.ten, tech: st.tech, ships: f.ships },
      { ten: n.ten + ' — ' + n.htTen, tech: n.tech, ships: n.ships, def: n.def,
        thuDat: Lmuc.thuDat, loaiHT: Lmuc.ten },
      G.hash(f.id + ':' + st.now + ':' + o.key));

    f.ships = kq.conShipsA;
    n.ships = kq.conShipsD; n.def = kq.conDefD;

    var cuop = { metal: 0, crystal: 0, deut: 0, food: 0 };
    if (kq.kq === 'thang') {
      cuop = G.chiaHang(n.res, G.khoangHang(f.ships) - G.tongRes(f.cargo), G.C.CUOP_TOI_DA);
      for (var rk in cuop) {
        n.res[rk] -= cuop[rk];
        f.cargo[rk] = (f.cargo[rk] || 0) + cuop[rk];
      }
      st.stats.thang++; st.stats.cuop += G.tongRes(cuop);
    } else if (kq.kq === 'thua' || kq.kq === 'huyDiet') st.stats.thua++;

    /* --- ĐỔ BỘ: quỹ đạo vỡ rồi mới thả quân xuống --- */
    var doBo = null;
    if (kq.kq === 'thang' && f.linh && !G.trong(f.linh)) {
      if (!n.linh) n.linh = { robot: Math.round(n.diem * (n.bo ? 0.6 : 3)), tank: Math.round(n.diem * (n.bo ? 0.08 : 0.4)) };
      var thuDat0 = G.thuMatDat(n.def);
      doBo = G.doBoXuong(st, f, { ten: n.ten, tech: n.tech, linh: n.linh, def: thuDat0, thuDat: Lmuc.thuDat });
      G.gopThuMatDat(n.def, thuDat0);
      if (doBo.thang) {
        /* vét thêm phần kho mà đánh từ quỹ đạo không với tới — CỘNG THÊM vào
           chỗ đã cướp được, không ghi đè */
        var themCuop = G.chiaHang(n.res, G.khoangHang(f.ships) - G.tongRes(f.cargo), G.C.CUOP_DO_BO);
        for (var rk2 in themCuop) {
          if (!themCuop[rk2]) continue;
          n.res[rk2] -= themCuop[rk2];
          f.cargo[rk2] = (f.cargo[rk2] || 0) + themCuop[rk2];
          cuop[rk2] = (cuop[rk2] || 0) + themCuop[rk2];
          st.stats.cuop += themCuop[rk2];
        }
      }
      st.stats.doBo = (st.stats.doBo || 0) + 1;
    }

    var pl = G.pheLieu(st, o.key);
    pl.metal += kq.pheLieu.metal; pl.crystal += kq.pheLieu.crystal;
    for (var kx in kq.matA) st.stats.tauMat += kq.matA[kx];
    for (var ky in kq.matD) st.stats.tauDietDich += kq.matD[ky];

    G.tin(st, 'tran', 'Báo cáo chiến đấu ' + G.tdStr(f.den), null,
      { kq: kq, cuop: cuop, pl: kq.pheLieu, td: f.den, ben: 'ta', doBo: doBo });
    n.cuopLuc = st.now;
    if (!st.hanThu) st.hanThu = [];
    if (st.hanThu.indexOf(o.key) < 0) st.hanThu.push(o.key);
    if (st.hanThu.length > 8) st.hanThu.shift();

    if (G.trong(f.ships)) { G.ghi(st, 'Hạm đội #' + f.id + ' bị xoá sổ hoàn toàn tại ' + G.tdStr(f.den) + '.'); G.xoaHam(st, f); return; }
    veNha(null); return;
  }

  veNha(null);
};

G.hamVeNha = function (st, f) {
  var p = st.planets[f.pi] || st.planets[0];
  var k;
  for (k in f.ships) p.ships[k] = (p.ships[k] || 0) + f.ships[k];
  if (f.linh) { if (!p.linh) p.linh = {}; for (k in f.linh) p.linh[k] = (p.linh[k] || 0) + f.linh[k]; }
  /* Hàng trên tàu luôn được dỡ HẾT, kể cả khi vượt dung tích kho: dung tích chỉ
     chặn phần SẢN XUẤT (xem G.sanXuat), không được ăn mất chiến lợi phẩm. */
  for (k in f.cargo) if (f.cargo[k] > 0) p.res[k] = (p.res[k] || 0) + f.cargo[k];
  G.ghi(st, 'Hạm đội #' + f.id + ' đã về ' + p.ten + ' ' + G.tdStr(p.c) + '.');
  G.xoaHam(st, f);
};
G.xoaHam = function (st, f) {
  var i = st.fleets.indexOf(f);
  if (i >= 0) st.fleets.splice(i, 1);
};

/* --- Do thám ----------------------------------------------------------- */
G.doThamNPC = function (st, f, n) {
  var soTau = f.ships.probe || 1;
  var chenh = (st.tech.spy || 0) - (n.tech.spy || 0);
  var mucDo = Math.max(1, Math.min(5, 1 + Math.floor(chenh / 2) + Math.floor(Math.log(soTau + 1) / Math.log(3))));
  var banHa = Math.max(0, Math.min(0.85, 0.06 * Math.max(0, (n.tech.spy || 0) - (st.tech.spy || 0)) + (n.bo ? 0 : 0.04)));
  var mat = 0;
  var r = G.rng(G.hash('spy' + f.id + st.now));
  for (var i = 0; i < soTau; i++) if (r() < banHa) mat++;
  if (mat > 0) {
    f.ships.probe -= mat;
    if (!f.ships.probe) delete f.ships.probe;
  }
  var bc = {
    td: f.den, ten: n.ten, ht: n.htTen, lm: n.lm, diem: n.diem, bo: n.bo, mucDo: mucDo, mat: mat,
    res: { metal: Math.floor(n.res.metal), crystal: Math.floor(n.res.crystal), deut: Math.floor(n.res.deut), food: Math.floor(n.res.food) },
    ships: mucDo >= 2 ? G.clone(n.ships) : null,
    def: mucDo >= 3 ? G.clone(n.def) : null,
    tech: mucDo >= 4 ? G.clone(n.tech) : null,
    t: st.now
  };
  /* xác suất thắng nếu đánh bằng hạm đội đang có ở hành tinh gốc */
  G.tin(st, 'tt', 'Báo cáo do thám ' + G.tdStr(f.den), null, { bc: bc });
  if (!st.spy) st.spy = {};
  st.spy[G.tdKey(f.den)] = bc;
};

/* --- Chu kỳ bảo trì 6 giờ --------------------------------------------- */
G.baoTri = function (st) {
  st.soChuKy++;
  var d = G.diem(st);
  var tho = 0.015 * (d.ham + d.thu) + 0.008 * d.ct;
  var giam = Math.min(0.6, 0.06 * G.tongB(st, 'maintDepot'));
  var phi = Math.round((tho * (1 - giam)) * 10) / 10;
  var vonNC = 0, ncTen = null;

  if (st.ncQueue && st.ncQueue.vonConLai > 0) {
    vonNC = Math.min(st.ncQueue.vonConLai, st.ncQueue.vonMoiKy);
    ncTen = G.R(st.ncQueue.id).ten;
  }
  var can = phi + vonNC + st.noBaoTri;
  var tra = Math.min(st.galana, can);
  st.galana -= tra;
  var thieu = can - tra;

  var dong = [];
  dong.push('Chu kỳ bảo trì #' + st.soChuKy + ' — ' + G.gio(st.now * 1000));
  dong.push('Phí bảo trì hạ tầng & hạm đội: ' + G.so(phi) + ' Galana' + (giam > 0 ? ' (đã giảm ' + Math.round(giam * 100) + '% nhờ Trung Tâm Bảo Trì)' : ''));
  if (st.noBaoTri > 0) dong.push('Nợ kỳ trước: ' + G.so(st.noBaoTri) + ' Galana');

  /* ưu tiên trả phí bảo trì trước, còn lại mới rót vào nghiên cứu */
  var conTra = tra;
  var traNo = Math.min(conTra, st.noBaoTri); conTra -= traNo; st.noBaoTri -= traNo;
  var traPhi = Math.min(conTra, phi); conTra -= traPhi;
  var traVon = Math.min(conTra, vonNC);

  if (vonNC > 0) {
    if (traVon >= vonNC) {
      st.ncQueue.vonConLai -= vonNC;
      st.ncQueue.treo = false;
      dong.push('Rót vốn nghiên cứu "' + ncTen + '": ' + G.so(vonNC) + ' Galana (còn lại ' + G.so(st.ncQueue.vonConLai) + ')');
    } else {
      st.ncQueue.vonConLai -= traVon;
      st.ncQueue.treo = true;
      dong.push('THIẾU VỐN nghiên cứu "' + ncTen + '" — đề tài BỊ TREO cho tới khi có đủ Galana.');
    }
  }
  if (thieu > 0) {
    st.noBaoTri = thieu;
    dong.push('KHÔNG ĐỦ GALANA: nợ lại ' + G.so(thieu) + '. Sản lượng toàn đế quốc giảm 30% và hạm đội bị niêm phong (không tấn công được) cho tới khi trả xong.');
  } else {
    dong.push('Đã thanh toán đủ. Hành tinh hoạt động bình thường.');
  }

  /* đói ăn: cảnh báo */
  for (var i = 0; i < st.planets.length; i++) {
    var p = st.planets[i];
    if (p.doi > 0) dong.push('CẢNH BÁO: ' + p.ten + ' ' + G.tdStr(p.c) + ' đang thiếu Lương Thực — sản lượng còn một nửa.');
  }
  G.tin(st, 'bt', 'Bảo trì hành tinh (chu kỳ #' + st.soChuKy + ')', dong.join('\n'));
  st.nextMaint = st.now + G.C.CHU_KY_BAO_TRI;
};

/* --- NPC tấn công người chơi ----------------------------------------- */
G.hepRaid = function (st) {
  var d = G.diem(st);
  st.nextRaid = st.now + Math.round((6 + Math.random() * 8) * 3600);
  if (d.tong < G.C.BAO_VE_MOI_DIEM) return;                    // bảo vệ người chơi mới
  if (st.toi.length >= 2) return;

  var key = null;
  if (st.hanThu && st.hanThu.length && Math.random() < 0.6) key = st.hanThu[Math.floor(Math.random() * st.hanThu.length)];
  var n;
  if (key) {
    var cKey = G.tdParse(key);
    if (cKey) { var oKey = G.oHanhTinh(st, cKey); if (oKey.loai === 'npc') n = oKey.npc; }
  }
  if (!n) {
    var home = st.planets[0].c;
    for (var t = 0; t < 40 && !n; t++) {
      var c = G.toaDo(home.g, Math.max(1, Math.min(G.C.SO_HE, home.h + Math.floor(Math.random() * 30) - 15)), 1 + Math.floor(Math.random() * G.C.SO_HANH_TINH));
      var o = G.oHanhTinh(st, c);
      if (o.loai === 'npc' && !o.npc.bo) n = o.npc;
    }
  }
  if (!n) return;

  /* Quy mô đợt đánh theo sức phòng thủ của người chơi để luôn có thể đỡ được */
  var pi = Math.floor(Math.random() * st.planets.length);
  var p = st.planets[pi];
  var sucThu = 0, k;
  for (k in p.def) sucThu += G.giaTriDiem(G.D(k).cost, p.def[k]);
  for (k in p.ships) sucThu += G.giaTriDiem(G.S(k).cost, p.ships[k]);
  var quyMo = Math.max(60, (sucThu * (0.3 + Math.random() * 0.45)));
  quyMo = Math.min(quyMo, n.diem * 0.7);
  if (quyMo < 40) return;

  var r = G.rng(G.hash('raid' + st.now + n.key));
  var ships = G.npcHam(quyMo, Math.min(1, n.diem / 50000), r);
  if (G.trong(ships)) return;

  var kc = G.khoangCach(n.c, p.c);
  var tg = Math.max(600, Math.round(kc * 1.2 / G.C.TOC_DO_SERVER)) + 600;
  st.toi.push({
    id: st.fleetIdSeq++, tu: n.c, npcKey: n.key, ten: n.ten, lm: n.lm,
    pi: pi, ships: ships, tech: n.tech, den_t: st.now + tg
  });
  G.tin(st, 'canh', 'BÁO ĐỘNG: hạm đội địch đang bay tới!',
    n.ten + (n.lm ? ' ' + n.lm : '') + ' từ ' + G.tdStr(n.c) + ' đang tiến về ' + p.ten + ' ' + G.tdStr(p.c) + '.\n' +
    'Dự kiến tới sau ' + G.tg(tg) + '. Hãy dựng thêm phòng thủ, hoặc cho hạm đội bay đi để tránh bị bắn hạ (hạm đội đang bay thì an toàn).');
};

G.dichToi = function (st, w) {
  var p = st.planets[w.pi] || st.planets[0];
  var Lp = G.loaiHT(st, p);
  var kq = G.danhTran(
    { ten: w.ten, tech: w.tech, ships: w.ships },
    { ten: st.ten + ' — ' + p.ten, tech: st.tech, ships: p.ships, def: p.def,
      thuDat: Lp.thuDat, loaiHT: Lp.ten },
    G.hash('def' + w.id + st.now));

  p.ships = kq.conShipsD; p.def = kq.conDefD;
  var cuop = { metal: 0, crystal: 0, deut: 0, food: 0 };
  if (kq.kq === 'thang') {      /* địch thắng */
    cuop = G.chiaHang(p.res, G.khoangHang(kq.conShipsA), G.C.CUOP_TOI_DA);
    for (var rk2 in cuop) p.res[rk2] -= cuop[rk2];
    st.stats.thua++;
  } else st.stats.thang++;

  var pl = G.pheLieu(st, G.tdKey(p.c));
  pl.metal += kq.pheLieu.metal; pl.crystal += kq.pheLieu.crystal;

  G.tin(st, 'tran', 'Bị tấn công tại ' + G.tdStr(p.c), null,
    { kq: kq, cuop: cuop, pl: kq.pheLieu, td: p.c, ben: 'dich' });
  var j = st.toi.indexOf(w);
  if (j >= 0) st.toi.splice(j, 1);
};

/* Xưởng đóng tàu chạy liên tục theo LÔ: bản gốc đếm quân bằng hàng triệu,
 * nếu cộng từng chiếc một thì vòng lặp sự kiện không kham nổi.            */
G.congDonVi = function (st, p, id, n) {
  if (n <= 0) return;
  if (G.M(id)) p.mis[id] = (p.mis[id] || 0) + n;
  else if (G.S(id)) p.ships[id] = (p.ships[id] || 0) + n;
  else if (G.BB(id)) { if (!p.linh) p.linh = {}; p.linh[id] = (p.linh[id] || 0) + n; }
  else p.def[id] = (p.def[id] || 0) + n;
};

G.chayXuong = function (st, p, dt) {
  var guard = 0;
  while (dt > 0 && p.qS.length && guard++ < 200) {
    var q = p.qS[0];
    if (dt < q.tLeft) { q.tLeft -= dt; return; }
    dt -= q.tLeft;                       /* chiếc kế tiếp xong */
    G.congDonVi(st, p, q.id, 1);
    q.n--;
    if (q.n > 0) {
      var them = Math.min(q.n, Math.floor(dt / q.tEach));
      if (them > 0) { G.congDonVi(st, p, q.id, them); q.n -= them; dt -= them * q.tEach; }
    }
    if (q.n > 0) { q.tLeft = q.tEach - dt; return; }
    G.ghi(st, p.ten + ': hoàn thành lô ' + (G.UNIT(q.id) || G.M(q.id)).ten + '.');
    p.qS.shift();
    if (p.qS.length) p.qS[0].tLeft = p.qS[0].tEach;
  }
};

/* =======================================================================
 * DÒNG THỜI GIAN — tua lại toàn bộ sự kiện theo đúng thứ tự
 * ===================================================================== */
G.sukienKe = function (st) {
  var t = Infinity, i;
  for (i = 0; i < st.planets.length; i++) {
    var p = st.planets[i];
    if (p.qB.length && p.qB[0].xong) t = Math.min(t, p.qB[0].xong);
    if (p.qS.length) t = Math.min(t, st.lastTick + p.qS[0].tLeft + (p.qS[0].n - 1) * p.qS[0].tEach);
  }
  if (st.ncQueue && !st.ncQueue.treo) t = Math.min(t, st.lastTick + st.ncQueue.conLai);
  for (i = 0; i < st.fleets.length; i++) {
    var f = st.fleets[i];
    t = Math.min(t, f.pha === 'di' ? f.den_t : f.ve_t);
  }
  for (i = 0; i < st.toi.length; i++) t = Math.min(t, st.toi[i].den_t);
  if (st.tenLua) for (i = 0; i < st.tenLua.length; i++) t = Math.min(t, st.tenLua[i].khi);
  t = Math.min(t, st.nextMaint, st.nextRaid);
  return t;
};

/* Ở client của bản nhiều người, server mới là bên xử lý sự kiện: client chỉ
 * chạy phần sản xuất cho các con số nhảy êm, không tự kết luận trận đánh. */
G.MO_PHONG_NHE = false;

G.tick = function (st, now) {
  now = now || G.giay();
  if (now <= st.lastTick) { st.now = st.lastTick; return; }
  if (G.MO_PHONG_NHE) {
    var dtn = now - st.lastTick;
    for (var i0 = 0; i0 < st.planets.length; i0++) {
      G.sanXuat(st, st.planets[i0], dtn);
      G.chayXuong(st, st.planets[i0], dtn);
    }
    if (st.ncQueue && !st.ncQueue.treo) st.ncQueue.conLai -= dtn;
    st.lastTick = now; st.now = now;
    return;
  }
  var guard = 0;
  while (st.lastTick < now && guard++ < 50000) {
    var ke = G.sukienKe(st);
